[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "azd-x-foundry"
version = "0.1.0"
description = "Declarative x-foundry extension for azure.yaml: parse, validate, normalise and plan Microsoft Foundry deployments."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13",
    "pyyaml>=6.0.3",
    "jsonschema>=4.26",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-cov>=7", "ruff>=0.16"]

[project.scripts]
xfoundry = "xfoundry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xfoundry = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["xfoundry"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Diagnostic messages are long prose; the formatter does not split strings.
ignore = ["E501"]


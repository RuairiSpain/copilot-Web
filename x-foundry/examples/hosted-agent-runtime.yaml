# A hosted agent plus a Container Apps runtime. No session pools: those are separate Foundry capabilities.
name: hosted-agent
x-foundry:
  topology:
    mode: standalone
  defaults:
    location: swedencentral
  security:
    network:
      mode: restricted
      allowedIps:
        - 203.0.113.0/24
    roles:
      admins:
        - Foundry-Admins
  models:
    default: gpt-5
    allowed:
      - gpt-5
  projects:
    - name: support
      agents:
        - name: support-agent
          kind: hosted
          source: ./agents/support
          protocols:
            - responses
            - a2a
          environment:
            LOG_LEVEL: info
            MAX_TOKENS: 4096
            SEARCH_API_KEY: "@Microsoft.KeyVault(SecretUri=https://kv-demo.vault.azure.net/secrets/search-key)"
  runtime:
    enabled: true
    project: support
    image: ghcr.io/contoso/runtime:1.0
    scale:
      minReplicas: 1
      maxReplicas: 10
    resources:
      cpu: 1
      memory: 2Gi
    ingress:
      external: true
      targetPort: 8000
    secrets:
      db-password: runtime-db-password
  redis:
    enabled: true
    service: azure-managed-redis

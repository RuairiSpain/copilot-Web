# The smallest valid configuration: one standalone Foundry project. With no network
# settings there is no VNet and endpoints are public (Entra ID authentication only).
name: finance-ai
x-foundry:
  topology:
    mode: standalone
  security:
    roles:
      admins:
        - Foundry-Admins
      developers:
        - Foundry-Devs
  projects:
    - name: finance

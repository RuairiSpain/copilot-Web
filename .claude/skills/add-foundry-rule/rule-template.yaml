# One file per rule: foundry-doctor/rules/catalog/<group>/<ID>.yaml. Loaded strictly: unknown fields are errors.
# Schema source of truth: foundry-doctor/internal/catalog/catalog.go (type Rule).
id: FND-XXX-000
version: 1
group: XXX                  # must equal the group in the id
title: ""
description: ""
status: proposed            # proposed | verified | product-opinion | implemented | deprecated | dropped
phases: ["1"]               # "0".."9", "later", "future"

inputs: []                  # azure.yaml | bicep-arm | azd-env | control-plane | data-plane | network | external-tool
basis: []                   # platform | security | waf | wara | opinion | reliability | cost | operations
category: must-have         # must-have | nice-to-have
pillar: ""                  # security | reliability | cost | operations | performance | ""

severity:                   # info | warning | error. Platform-basis rules must be error in every profile.
  dev: warning
  test: error
  prod: error

compatibility:
  azd: ""
  extensions: {}
  apiVersions: []

evidence:
  description: ""
  confidence: certain       # certain | likely | uncertain

recommendation: ""
fix: ""

sources:
  - url: ""                 # https URL of the public documentation page
    lastVerified: ""        # YYYY-MM-DD
    verifiedVia: ""         # file actually read, if different from url (e.g. docs source repo path)
    note: ""

overlap:
  decision: native          # reuse | wrap | adapt | native | drop
  coverage: none            # none | partial | full
  rationale: ""
  psrule: []
  azurePolicy: []
  defender: []
  advisor: []
  bicepLinter: []
  checkov: []

implementation:
  owner: native             # native for native and adapt; psrule | azure-policy | defender | advisor | bicep | checkov | adapter for reuse and wrap
  package: ""

testability: ""
tests:
  positive: []              # inputs that must produce a finding
  negative: []              # compliant inputs that must not
  skipped: []               # inputs where the check cannot run, with the reason
  uncertain: []             # inputs where the result is reported as uncertain
notes: ""

name: sample-agents-ci

# GitHub only reads workflows from the repository root, so this file lives here and
# points at the sample-agents/ folder.
on:
  pull_request:
    paths:
      - "sample-agents/**"
      - ".github/workflows/sample-agents-ci.yml"
  push:
    branches: [main]
    paths:
      - "sample-agents/**"
      - ".github/workflows/sample-agents-ci.yml"

permissions:
  contents: read

jobs:
  contract:
    name: azure.yaml contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sample-agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  agent:
    name: ${{ matrix.agent }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [prompt-kb, responses-agent, invocations-agent, dev-team]
    defaults:
      run:
        working-directory: sample-agents/agents/${{ matrix.agent }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      # Fails if pyproject.toml and uv.lock disagree, so deploys are reproducible.
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run --frozen ruff check --config ../../pyproject.toml .
      - run: uv run --frozen ruff format --check --config ../../pyproject.toml .
      - run: uv run --frozen mypy .
      - run: uv run --frozen pytest -q

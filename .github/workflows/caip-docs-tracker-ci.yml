name: caip-docs-tracker CI

# The docs tracker is a separate Python project, so it only runs when it changes.
on:
  push:
    branches: [main]
    paths: ["caip-docs-tracker/**", ".github/workflows/caip-docs-tracker-ci.yml"]
  pull_request:
    paths: ["caip-docs-tracker/**", ".github/workflows/caip-docs-tracker-ci.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: caip-docs-tracker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: caip-docs-tracker/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Check dashboard scripts
        run: for f in site/assets/*.js; do node --check "$f"; done
      - run: pytest -q
      - name: End-to-end smoke test on a fake docs repo
        run: bash tests/smoke_test.sh

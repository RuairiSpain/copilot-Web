name: foundry-doctor-release

# Release pipeline for Foundry Doctor. Triggered by tags `foundry-doctor-v*`
# (or manual dispatch for a rehearsal, which never publishes).
# Produces: cross-platform binaries, SHA-256 checksums, SBOM, keyless cosign
# signatures, build-provenance attestations and the azd extension manifest +
# registry entry. No long-lived secrets; signing and attestation use the
# workflow's OIDC identity.

on:
  push:
    tags:
      - "foundry-doctor-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Rehearsal version (semver, no prefix). Nothing is published.
        type: string
        required: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  prepare:
    name: Resolve version and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      has-extension: ${{ steps.ext.outputs.present }}
    defaults:
      run:
        working-directory: foundry-doctor
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Resolve version
        id: v
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            version="${REF_NAME#foundry-doctor-v}"; publish=true
          else
            version="$INPUT_VERSION"; publish=false
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid semver: $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Detect azd extension module
        id: ext
        shell: bash
        run: |
          if [ -f extension/go.mod ]; then echo present=true >> "$GITHUB_OUTPUT"; else echo present=false >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: foundry-doctor/go.mod
          cache-dependency-path: foundry-doctor/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Go tests (race)
        run: go test -race ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Release script tests
        run: python -m unittest discover -s scripts/release -p "test_*.py"
      - name: Licence inventory
        run: python scripts/dependency_audit.py --check-inventory

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    defaults:
      run:
        working-directory: foundry-doctor
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: foundry-doctor/go.mod
          cache-dependency-path: foundry-doctor/go.sum
      - name: Build standalone binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          mkdir -p "$GITHUB_WORKSPACE/dist/stage"
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
            -o "$GITHUB_WORKSPACE/dist/stage/foundry-doctor$ext" ./cmd/foundry-doctor
          cp LICENSE* "$GITHUB_WORKSPACE/dist/stage/" 2>/dev/null || true
          cd "$GITHUB_WORKSPACE/dist/stage"
          name="foundry-doctor_${VERSION}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = windows ]; then zip -q "../$name.zip" ./*; else tar -czf "../$name.tar.gz" ./*; fi
      - name: Build azd extension binary
        if: needs.prepare.outputs.has-extension == 'true'
        shell: bash
        working-directory: foundry-doctor/extension
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          GOTOOLCHAIN: auto
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          stage="$GITHUB_WORKSPACE/dist/ext-stage"; mkdir -p "$stage"
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$stage/foundry-doctor-azd$ext" .
          cd "$stage"
          name="foundry-doctor-azd-extension_${VERSION}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = windows ]; then zip -q "../$name.zip" ./*; else tar -czf "../$name.tar.gz" ./*; fi
          rm -rf "$stage"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Checksums, SBOM, signatures, provenance, publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Environment gates publishing behind required reviewers.
    environment: foundry-doctor-release
    permissions:
      contents: write        # create the GitHub release
      id-token: write        # keyless cosign + attestations (OIDC)
      attestations: write    # build provenance + SBOM attestations
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz *.zip | sort -k2 > checksums.txt && cat checksums.txt
      - name: ADR-003 namespace collision check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python foundry-doctor/scripts/release/check_namespace_collision.py --namespace foundry
      - name: Generate azd extension manifest and registry entry
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          python foundry-doctor/scripts/release/gen_extension_manifest.py \
            --version "$VERSION" \
            --checksums dist/checksums.txt \
            --base-url "https://github.com/$REPO/releases/download/${TAG:-foundry-doctor-v$VERSION}" \
            --out-dir dist
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: foundry-doctor
          format: spdx-json
          output-file: dist/foundry-doctor.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksums and SBOM (keyless)
        working-directory: dist
        run: |
          for f in checksums.txt foundry-doctor.spdx.json extension.yaml registry.json; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-checksums: dist/checksums.txt
          sbom-path: dist/foundry-doctor.spdx.json
      - name: Upload release bundle (rehearsal)
        if: needs.prepare.outputs.publish != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-rehearsal
          path: dist
          retention-days: 7
      - name: Publish GitHub release
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          pre=""; case "$VERSION" in *-*) pre="--prerelease";; esac
          gh release create "$TAG" dist/* --verify-tag --title "Foundry Doctor $VERSION" \
            --notes "Community/independent tool; not an official Microsoft product. Verify with: gh attestation verify <file> --repo $GITHUB_REPOSITORY; cosign verify-blob --bundle <file>.sigstore.json." $pre

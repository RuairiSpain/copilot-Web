name: foundry-doctor-release

# Release workflow for the standalone foundry-doctor binary (PRD section 18, ADR-005, ADR-011 decision 6).
# Trigger: a tag named foundry-doctor/vMAJOR.MINOR.PATCH[-prerelease]. Produces cross-platform binaries,
# SHA256SUMS, a CycloneDX SBOM, Sigstore keyless signatures (cosign) and a GitHub build-provenance attestation.
# Every third-party action is pinned to a full commit SHA (the tag is in the trailing comment).
#
# STATUS: authored but NEVER RUN. Nothing here is proven until a real tag build succeeds and the verification
# commands in foundry-doctor/docs/development/ci.md have been run against its output.
# NOT INCLUDED: the azd extension archives and their registry manifest. The extension module (foundry-doctor/extension/)
# and the publisher-owned extension id (ADR-003) do not exist yet; see ci.md.
on:
  push:
    tags:
      - "foundry-doctor/v*"

permissions:
  contents: read

concurrency:
  group: foundry-doctor-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify tag and run gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foundry-doctor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag name and that the commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^foundry-doctor/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$TAG' is not foundry-doctor/vMAJOR.MINOR.PATCH[-prerelease]"; exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::tagged commit $GITHUB_SHA is not reachable from origin/main"; exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: foundry-doctor/go.mod
          cache-dependency-path: foundry-doctor/go.sum
      - name: Install tools
        run: |
          bash scripts/install-dev-tools.sh
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Acceptance gates (strict, a skipped gate fails the release)
        run: bash scripts/claude/verify-phase.sh --strict
      - name: azd namespace check (ADR-003, re-run at each release)
        # No tolerance here: SKIPPED (exit 5) fails the release. Re-run the workflow when the network recovers.
        run: bash scripts/ci/check-azd-namespace.sh

  build:
    name: build matrix and checksums
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foundry-doctor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: foundry-doctor/go.mod
          cache-dependency-path: foundry-doctor/go.sum
      - name: Build linux, darwin, windows x amd64, arm64
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/ci/build-matrix.sh --out "$RUNNER_TEMP/dist" --version "${TAG#foundry-doctor/}"
      - name: Upload binaries and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 30

  sbom:
    name: SBOM (CycloneDX)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: dist
      - name: Generate the SBOM from the built binaries (Go build info lists the exact modules)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: cyclonedx-json
          output-file: sbom/foundry-doctor.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom
          path: sbom/foundry-doctor.cdx.json
          if-no-files-found: error
          retention-days: 30

  sign:
    name: sign (cosign keyless) and attest provenance
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # OIDC token for Sigstore Fulcio; held by this job only
      attestations: write   # store the build-provenance attestation
    steps:
      - name: Download binaries, checksums and SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Check the checksums before signing anything
        working-directory: release
        run: sha256sum -c SHA256SUMS
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign SHA256SUMS, the SBOM and every binary (keyless, one Sigstore bundle each)
        working-directory: release
        run: |
          mkdir -p ../bundles
          for f in SHA256SUMS foundry-doctor.cdx.json foundry-doctor_*; do
            cosign sign-blob --yes --bundle "../bundles/$f.sigstore.json" "$f"
          done
          ls -l ../bundles
      - name: Attest build provenance for every binary in SHA256SUMS
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      - name: Upload signature bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundles
          path: bundles/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish GitHub release
    needs: sign
    runs-on: ubuntu-latest
    # A protected environment can require a manual approval before the release is published. Create it in
    # repository settings (Settings > Environments > release); until then GitHub creates it without protection.
    environment: release
    permissions:
      contents: write   # create the release; held by this job only
    steps:
      - name: Download everything
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Re-check the checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS
      - name: Create the release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          prerelease=""; case "${TAG#foundry-doctor/}" in *-*) prerelease="--prerelease";; esac
          # shellcheck disable=SC2086
          gh release create "$TAG" --repo "$REPO" --verify-tag --title "Foundry Doctor ${TAG#foundry-doctor/}" \
            --notes "Standalone foundry-doctor binaries. Verify with the commands in foundry-doctor/docs/development/ci.md." \
            $prerelease ./*

name: caip-docs-tracker weekly scan

on:
  schedule:
    # Every Thursday 18:00 UTC = 20:00 Madrid in summer (CEST), 19:00 in winter (CET).
    - cron: "0 18 * * 4"
  workflow_dispatch:
    inputs:
      only:
        description: "Scan a single source id (blank = all)"
        required: false
        default: ""

# Shared with the discovery workflow: both commit to main, so they run one at a time.
concurrency:
  group: caip-docs-tracker-data
  cancel-in-progress: false

defaults:
  run:
    working-directory: caip-docs-tracker

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 11 repositories; azure-docs alone is large
    permissions:
      contents: write   # commit data/ and state/ back to the repo
      models: read      # GitHub Models for the weekly AI summary
    env:
      # Large edits (more changed lines than TRACKER_LARGE_EDIT_LINES) are summarised from the whole page;
      # set the repository variable TRACKER_LARGE_EDITS to "off" to summarise them from the diff instead.
      TRACKER_LARGE_EDITS: ${{ vars.TRACKER_LARGE_EDITS || 'summarise' }}
      TRACKER_LARGE_EDIT_LINES: ${{ vars.TRACKER_LARGE_EDIT_LINES || '200' }}
    outputs:
      failed: ${{ steps.feeds.outcome == 'failure' || steps.scan.outcome == 'failure' || steps.digest.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: caip-docs-tracker/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Steps that can fail for one source, feed or subscriber are allowed to fail so the rest is
      # still summarised, committed and published; the "report" job then marks the run as failed.
      - name: Collect announcements (Azure Updates, blogs)
        id: feeds
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m tracker.announcements

      - name: Collect documentation changes since last sync
        id: scan
        continue-on-error: true
        env:
          ONLY: ${{ inputs.only }}
        run: python -m tracker.scan ${ONLY:+--only "$ONLY"}

      - name: Summarise changes per product (AI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
        run: python -m tracker.summarise

      - name: Build dashboard data
        run: python -m tracker.build_site

      - name: Check a sample of page URLs
        continue-on-error: true
        run: python -m tracker.check_urls

      - name: Commit data and watermark
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state site/data site/feeds
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "caip-docs-tracker: weekly docs scan $(date -u +%Y-%m-%d)"
            # main may have moved during the scan; the commit only touches this project's data.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Digests go out only after the data is safely committed (this step does not run if the commit
      # above failed). Subscribers whose secrets are not set are archived under data/digests but not sent.
      - name: Send weekly digests
        id: digest
        continue-on-error: true
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          LOGIC_APP_URL: ${{ secrets.LOGIC_APP_URL }}
          DIGEST_PHASE0_TO: ${{ secrets.DIGEST_PHASE0_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python -m tracker.digest --send

      # The record of what was sent must reach main, or next week's digest repeats it: retry the push.
      - name: Commit the digest record
        if: ${{ always() && steps.digest.outcome != 'skipped' }}
        run: |
          git add state/digests.json data/digests
          if git diff --cached --quiet; then
            echo "No digest record to commit"
            exit 0
          fi
          git commit -m "caip-docs-tracker: weekly digests $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          echo "::error::Could not save state/digests.json; next week's digests will repeat this week's items."
          exit 1

      - name: Upload dashboard
        if: ${{ !cancelled() }}   # publish even if the digest record could not be pushed
        uses: actions/upload-pages-artifact@v3
        with:
          path: caip-docs-tracker/site

  deploy:
    needs: scan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  report:
    needs: [scan, deploy]
    if: ${{ always() && needs.scan.outputs.failed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::A feed, source or digest failed. See the announcements, scan and digest steps (and data/scans.csv)."
          exit 1

name: caip-docs-tracker weekly scan

on:
  schedule:
    # Every Thursday 18:00 UTC = 20:00 Madrid in summer (CEST), 19:00 in winter (CET).
    - cron: "0 18 * * 4"
  workflow_dispatch:
    inputs:
      only:
        description: "Scan a single source id (blank = all)"
        required: false
        default: ""

concurrency:
  group: caip-docs-tracker-weekly-scan
  cancel-in-progress: false

defaults:
  run:
    working-directory: caip-docs-tracker

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # commit data/ and state/ back to the repo
      models: read      # GitHub Models for the weekly AI summary
    outputs:
      scan_outcome: ${{ steps.scan.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: caip-docs-tracker/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # A failed source is recorded in data/scans.csv and the other sources still run. The step
      # is allowed to fail so their data is still summarised, committed and published; the
      # "Report scan failures" job then marks the run as failed.
      - name: Collect changes since last sync
        id: scan
        continue-on-error: true
        env:
          ONLY: ${{ inputs.only }}
        run: python -m tracker.scan ${ONLY:+--only "$ONLY"}

      - name: Summarise changes per product (AI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
        run: python -m tracker.summarise

      - name: Build dashboard data
        run: python -m tracker.build_site

      - name: Check a sample of page URLs
        continue-on-error: true
        run: python -m tracker.check_urls

      - name: Commit data and watermark
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state site/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "caip-docs-tracker: weekly docs scan $(date -u +%Y-%m-%d)"
            # main may have moved during the scan; the commit only touches this project's data.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: caip-docs-tracker/site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  report:
    needs: [scan, deploy]
    if: ${{ always() && needs.scan.outputs.scan_outcome == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::At least one source failed to scan. See the 'Collect changes since last sync' step and data/scans.csv."
          exit 1

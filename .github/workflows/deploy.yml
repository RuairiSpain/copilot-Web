name: Deploy to Azure Container Apps

# Manual by default — flip to `push: { branches: [main] }` for continuous
# deploy once you're happy with the setup. Requires the one-time OIDC
# federated-credential setup in infra/README.md's "CI/CD" section (no
# long-lived Azure secret is stored in this repo).
on:
  workflow_dispatch: {}

permissions:
  id-token: write # for Azure login via OIDC
  contents: read
  packages: write # for pushing to ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Azure login (OIDC — no stored client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App
        run: |
          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --image "${{ env.IMAGE }}:${{ github.sha }}"

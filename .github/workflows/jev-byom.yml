name: jev-byom

# The Python service is independent of the Next.js app, so it gets its own
# workflow and only runs when it changes.
on:
  push:
    branches: [main]
    paths: ["jev-byom/**", ".github/workflows/jev-byom.yml"]
  pull_request:
    paths: ["jev-byom/**", ".github/workflows/jev-byom.yml"]

defaults:
  run:
    working-directory: jev-byom

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The calibration fit uses torch's LBFGS when torch is importable and a
        # bounded golden-section search when it is not. Both paths ship, so both
        # are tested; the torch job also pulls the CPU wheel the image uses.
        torch: [without-torch, with-torch]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jev-byom/requirements*.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Install CPU torch
        if: matrix.torch == 'with-torch'
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0

      - run: ruff check .

      - run: pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build only — pushing to ACR happens in scripts/provision_azure.sh, which
      # holds the subscription context. This job just proves the image still builds.
      - name: Build the container image
        run: docker build -f docker/Dockerfile -t jev-byom:ci .

      - name: Boot it with the weight-free backend and smoke the endpoints
        run: |
          docker run -d --name jev -p 8000:8000 \
            -e JEV_MODEL_BACKEND=hash \
            -e JEV_MODEL_NUM_LABELS=3 \
            -e JEV_LOCAL_REGISTRY_DIR=/tmp/calibration \
            jev-byom:ci
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break || sleep 2
          done
          python scripts/smoke_test.py --base-url http://localhost:8000

      - name: Container logs
        if: ${{ !cancelled() }}
        run: docker logs jev || true

name: foundry-doctor-dependency-review

on:
  pull_request:
    paths:
      - "foundry-doctor/go.mod"
      - "foundry-doctor/go.sum"
      - "foundry-doctor/scripts/dependency_audit.py"
      - "foundry-doctor/scripts/install-dev-tools.sh"
      - "foundry-doctor/docs/licence-inventory.md"
      - "foundry-doctor/THIRD_PARTY_NOTICES.md"
      - ".github/workflows/foundry-doctor-ci.yml"
      - ".github/workflows/foundry-doctor-dependency-review.yml"

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Review dependency changes
        uses: actions/dependency-review-action@e58c696e52cac8e62d61cc21fda89565d71505d7 # v4.7.1
        with:
          fail-on-severity: moderate
          license-check: true
          deny-licenses: >-
            GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later,
            AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later,
            LGPL-2.0-only, LGPL-2.0-or-later, LGPL-2.1-only,
            LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later
          comment-summary-in-pr: never

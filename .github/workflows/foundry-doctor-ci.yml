name: foundry-doctor-ci

# All pull-request jobs use only public, pinned inputs and read-only repository
# access. They are therefore safe for pull requests from forks.
on:
  pull_request:
    paths:
      - "foundry-doctor/**"
      - ".github/workflows/foundry-doctor-ci.yml"
      - ".github/workflows/foundry-doctor-dependency-review.yml"
  push:
    branches: [main]
    tags: ["foundry-doctor-v*"]
    paths:
      - "foundry-doctor/**"
      - ".github/workflows/foundry-doctor-ci.yml"
      - ".github/workflows/foundry-doctor-dependency-review.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOVULNCHECK_VERSION: v1.7.0
  STATICCHECK_VERSION: v0.6.1

jobs:
  test:
    name: Go test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: foundry-doctor
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: foundry-doctor/go.mod
          cache-dependency-path: foundry-doctor/go.sum
      - name: Verify module content
        run: go mod verify
      - name: Test all normal packages
        run: go test ./...
      - name: Build all current packages
        run: go build ./...
      - name: Product build gate
        shell: pwsh
        run: |
          if (Test-Path cmd/foundry-doctor) {
            go build ./cmd/foundry-doctor
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "::notice::Phase 0 exemption: cmd/foundry-doctor does not exist. All package build and test gates still ran."
          }

  strict-security:
    name: Strict security and quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: foundry-doctor
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: foundry-doctor/go.mod
          cache-dependency-path: foundry-doctor/go.sum
      - name: Install pinned audit tools
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race ./...
      - name: Static analysis
        run: staticcheck ./...
      - name: Vulnerability audit (fail closed)
        # Deliberately no database-unavailable exception, continue-on-error, or skip.
        run: govulncheck ./...
      - name: Phase 0 rule catalogue gate
        run: bash scripts/claude/check-rule-catalog.sh
      - name: Secret scan
        run: bash scripts/claude/check-no-secrets.sh
      - name: Script unit tests
        run: |
          python3 -m unittest discover -s scripts -p "test_*.py"
          python3 -m unittest discover -s scripts/claude -p "test_*.py"

  licences:
    name: Transitive dependency and licence audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: foundry-doctor
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: foundry-doctor/go.mod
          cache-dependency-path: foundry-doctor/go.sum
      - name: Verify checksums and read-only module state
        run: |
          go mod verify
          go mod tidy -diff
      - name: Check the complete selected module graph and inventory
        run: python3 scripts/dependency_audit.py --check-inventory
      - name: Publish verified third-party notices
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: THIRD-PARTY-NOTICES
          path: foundry-doctor/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 30

  pinned-spikes:
    name: Tagged offline spikes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: foundry-doctor
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check out pinned azd schema source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Azure/azure-dev
          ref: afe4b2b4d262bab4c11f4937e7a7942557ab0ecd
          path: _deps/azure-dev
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: foundry-doctor/go.mod
          cache-dependency-path: foundry-doctor/go.sum
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install pinned schema dependencies
        run: >-
          python -m pip install
          PyYAML==6.0.3
          jsonschema==4.25.1
          referencing==0.36.2
          attrs==25.3.0
          jsonschema-specifications==2025.4.1
          rpds-py==0.27.1
      - name: Install pinned Bicep CLI
        run: az bicep install --version v0.48.1
      - name: Monitor pinned azd registry and core-command namespace
        env:
          AZURE_DEV_DIR: ${{ github.workspace }}/_deps/azure-dev
          REQUIRE_SPIKE_DEPS: "1"
        run: >-
          go test -tags spike ./test/spikes/azd
          -run "TestPinnedAzdHasNoFoundryNamespaceCollision|TestFoundryNamespaceCollisionDetector"
      - name: Run tagged spikes with network access disabled by the tests
        env:
          AZURE_DEV_DIR: ${{ github.workspace }}/_deps/azure-dev
          BICEP_PATH: /home/runner/.azure/bin/bicep
          REQUIRE_SPIKE_DEPS: "1"
        run: go test -tags spike ./test/spikes/azd ./test/spikes/bicep

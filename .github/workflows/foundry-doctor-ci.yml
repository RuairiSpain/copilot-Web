name: foundry-doctor-ci

# GitHub only reads workflows from the repository root, so this file lives here and
# points at the foundry-doctor/ folder. Offline checks only: no Azure credentials, no secrets,
# read-only token, so it is safe for pull requests from forks. Never use pull_request_target here.
# Details and the list of what has and has not been proven by a real run: foundry-doctor/docs/development/ci.md.
on:
  pull_request:
    paths:
      - "foundry-doctor/**"
      - ".github/workflows/foundry-doctor-*.yml"
  push:
    branches: [main]
    paths:
      - "foundry-doctor/**"
      - ".github/workflows/foundry-doctor-*.yml"

permissions:
  contents: read

# Windows runners default to PowerShell; every script here is bash (Git Bash is on windows-latest, bash is the Linux default).
defaults:
  run:
    shell: bash

concurrency:
  group: foundry-doctor-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Names stay "go test (linux)" and "go test (windows)" so a branch-protection rule can refer to them.
    name: go test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux }
          - { os: windows-latest, label: windows }
    defaults:
      run:
        shell: bash
        working-directory: foundry-doctor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: foundry-doctor/go.mod
          cache-dependency-path: foundry-doctor/go.sum
      - name: go test ./... (core module)
        run: go test ./...

  race-windows:
    name: go test -race (windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: foundry-doctor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: foundry-doctor/go.mod
          cache-dependency-path: foundry-doctor/go.sum
      - name: go test -race ./... (windows/amd64; the race detector needs cgo and the runner image has gcc)
        run: go test -race ./...

  quality:
    name: lint, vet, vulncheck, catalogue
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: foundry-doctor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: foundry-doctor/go.mod
          cache-dependency-path: foundry-doctor/go.sum
      - name: Install tools
        # Same pinned versions as local development (scripts/install-dev-tools.sh), never @latest.
        run: |
          bash scripts/install-dev-tools.sh
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Acceptance gates
        # Runs gofmt, go vet, go test, go test -race, staticcheck, govulncheck, the build, the rule-catalogue
        # check, the secret scan, the import-boundary check and the scripts/ci syntax check.
        # govulncheck runs here because the runner can reach vuln.go.dev; verify-phase.sh reports it as
        # skipped only where the database is unreachable.
        # --strict: every gate is available on ubuntu-latest (staticcheck and govulncheck are installed above,
        # cmd/foundry-doctor exists, the race detector supports linux/amd64 and the runner image has gcc), so a
        # SKIPPED gate fails CI (exit 3). The race detector on windows/amd64 is covered by the race-windows job.
        # Not covered by the strict flag: tests that skip themselves inside go test when BICEP_PATH is unset
        # (real-Bicep tests); the smoke job installs Bicep and exercises it.
        run: bash scripts/claude/verify-phase.sh --strict

  import-boundary:
    name: core builds with GOWORK=off, no azure-dev import (ADR-005)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: foundry-doctor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: foundry-doctor/go.mod
          cache-dependency-path: foundry-doctor/go.sum
      - name: Import-boundary check
        run: bash scripts/ci/check-import-boundary.sh

  azd-namespace:
    name: azd namespace is free (ADR-003)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: foundry-doctor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check azd registry and command reference
        # Exit 5 means the check could not run (network, jq). That is reported as a warning and a
        # summary line, never as a pass. Exit 1 (a collision) fails the job.
        run: |
          set +e
          bash scripts/ci/check-azd-namespace.sh
          rc=$?
          set -e
          if [ "$rc" -eq 5 ]; then
            echo "::warning title=azd namespace check SKIPPED::check-azd-namespace.sh could not run (exit 5). This is not a pass. See the log."
            echo "### azd namespace check: SKIPPED (not a pass)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$rc"

  build-matrix:
    name: cross-platform build and checksums
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: foundry-doctor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: foundry-doctor/go.mod
          cache-dependency-path: foundry-doctor/go.sum
      - name: Build linux, windows x amd64, arm64
        id: build
        run: |
          set +e
          bash scripts/ci/build-matrix.sh --out "$RUNNER_TEMP/dist" --version "ci-${GITHUB_SHA::12}"
          rc=$?
          set -e
          if [ "$rc" -eq 5 ]; then
            echo "::warning title=build-matrix SKIPPED::cmd/foundry-doctor does not exist yet; nothing was built. This is not a pass."
            echo "### build-matrix: SKIPPED (not a pass)" >> "$GITHUB_STEP_SUMMARY"
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          echo "built=true" >> "$GITHUB_OUTPUT"
      - name: Upload binaries and checksums
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundry-doctor-ci-binaries
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: smoke samples (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux }
          - { os: windows-latest, label: windows }
    defaults:
      run:
        shell: bash
        working-directory: foundry-doctor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: foundry-doctor/go.mod
          cache-dependency-path: foundry-doctor/go.sum
      - name: Install the pinned Bicep CLI
        # The doctor requires Bicep 0.48.1 (ContractVersion) for the prod profile; runner images carry other versions.
        run: |
          v=0.48.1
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) asset=bicep-linux-x64 ;;
            Linux-ARM64) asset=bicep-linux-arm64 ;;
            Windows-X64) asset=bicep-win-x64.exe ;;
            Windows-ARM64) asset=bicep-win-arm64.exe ;;
            *) echo "no Bicep asset for $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          dest="$RUNNER_TEMP/bicep-bin"; mkdir -p "$dest"
          exe="$dest/bicep"; [ "$RUNNER_OS" = Windows ] && exe="$dest/bicep.exe"
          curl -fsSL -o "$exe" "https://github.com/Azure/bicep/releases/download/v$v/$asset"
          chmod +x "$exe"
          "$exe" --version
          echo "BICEP_PATH=$exe" >> "$GITHUB_ENV"
      - name: Real-Bicep sample tests (-tags spike)
        # These compile the shipped samples with the pinned Bicep CLI. They are excluded from go test ./... by the
        # spike build tag, so without this step a regression in loadTextContent policy handling would pass CI.
        env:
          REQUIRE_SPIKE_DEPS: "1"
        run: go test -tags spike -count=1 -run 'TestIQGatewaySample' ./cmd/foundry-doctor
      - name: Build the binary and run it against samples/*
        # Skips with a visible warning while cmd/foundry-doctor or samples/ are absent; a skip is not a pass.
        run: |
          if [ ! -d cmd/foundry-doctor ]; then
            echo "::warning title=smoke SKIPPED on ${{ matrix.label }}::cmd/foundry-doctor does not exist yet. This is not a pass."
            echo "### smoke (${{ matrix.label }}): SKIPPED, cmd/foundry-doctor absent" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=".exe"
          mkdir -p "$RUNNER_TEMP/bin"
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/bin/foundry-doctor$exe" ./cmd/foundry-doctor
          set +e
          bash scripts/ci/smoke-samples.sh --binary "$RUNNER_TEMP/bin/foundry-doctor$exe" --out "$RUNNER_TEMP/smoke"
          rc=$?
          set -e
          if [ "$rc" -eq 5 ]; then
            echo "::warning title=smoke SKIPPED on ${{ matrix.label }}::no samples to run. This is not a pass."
            echo "### smoke (${{ matrix.label }}): SKIPPED, no samples" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$rc"
      - name: Upload smoke SARIF and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundry-doctor-smoke-${{ matrix.label }}
          path: ${{ runner.temp }}/smoke/*
          if-no-files-found: ignore
          retention-days: 7

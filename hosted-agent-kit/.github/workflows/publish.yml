name: publish

# Publishes to PyPI with trusted publishing (OpenID Connect): no API token is stored anywhere.
# One-time setup on pypi.org: Account -> Publishing -> add a pending publisher with
#   project name  hosted-agent-kit
#   owner/repo    <your GitHub owner>/<this repository>
#   workflow      publish.yml
#   environment   pypi
# Do the same on test.pypi.org with the environment `testpypi` to rehearse a release.
#
# Release steps: update __version__ in src/hosted_agent_kit/__init__.py and CHANGELOG.md, merge,
# then publish a GitHub release whose tag is v<version> (for example v0.1.0).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

env:
  UV_VERSION: "0.11.7"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.13
      - run: uv sync --frozen
      - name: The tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(uv run python -c "import hosted_agent_kit; print(hosted_agent_kit.__version__)")
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: uv run pytest tests/unit tests/samples tests/contract
      - run: uv build
      - run: uv run twine check --strict dist/*
      - run: uv run python scripts/check_distribution.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

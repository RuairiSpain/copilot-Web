$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
name: blue
endpoint_name: decision-router
environment:
  name: decision-router
  image: <registry>.azurecr.io/decision-router:<immutable-digest-or-release-tag>
  inference_config:
    liveness_route: {port: 5001, path: /health/live}
    readiness_route: {port: 5001, path: /health/ready}
    # A managed online endpoint exposes one scoring path; it is the Model-Router-compatible one.
    scoring_route: {port: 5001, path: /v1/chat/completions}
environment_variables:
  FOUNDRY_ENDPOINT: "https://<resource>.services.ai.azure.com"
  DECISION1_DEPLOYMENT: "microsoft-decision-1"
  ROUTER_DEFAULT_MODE: "balanced"
  ROUTER_COMPATIBILITY: "new"
  # The managed online endpoint authenticates callers itself (auth_mode: aad_token in endpoint.yml),
  # so the router's own inbound check is off here. Set ROUTER_API_KEYS / ROUTER_ENTRA_* instead to
  # have the router check credentials too.
  ROUTER_ALLOW_UNAUTHENTICATED: "true"
  # Keep the router's own budget below request_timeout_ms so it can return a clean error.
  ROUTER_TOTAL_TIMEOUT_SECONDS: "110"
instance_type: Standard_DS2_v2
instance_count: 2
request_settings:
  request_timeout_ms: 120000
  max_concurrent_requests_per_instance: 32
liveness_probe: {initial_delay: 10, period: 30, timeout: 3, failure_threshold: 3}
readiness_probe: {initial_delay: 10, period: 10, timeout: 3, failure_threshold: 3}

name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths: ["tracker/**", "site/**", "config/**", "tests/**", "requirements.txt"]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q tracker
      - name: Check dashboard scripts
        run: for f in site/assets/*.js; do node --check "$f"; done
      - name: End-to-end smoke test on a fake docs repo
        run: bash tests/smoke_test.sh

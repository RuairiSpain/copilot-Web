# FND-OPS-005 source: https://learn.microsoft.com/azure/azure-resource-manager/management/resource-name-rules (verified 2026-10-04)
apiVersion: github.com/microsoft/PSRule/v1
kind: Rule
metadata:
  name: FND-OPS-005
  tags:
    ruleSet: foundry-rules
    group: OPS
    evaluation: static-yaml
    status: evaluated-subset
    catalogueStatus: verified
spec:
  level: Error
  type:
  - Microsoft.CognitiveServices/accounts
  - Microsoft.ApiManagement/service
  - Microsoft.Storage/storageAccounts
  - Microsoft.DocumentDB/databaseAccounts
  - Microsoft.KeyVault/vaults
  - Microsoft.ContainerRegistry/registries
  - Microsoft.OperationalInsights/workspaces
  - Microsoft.Insights/components
  - Microsoft.App/containerApps
  - Microsoft.Search/searchServices
  where:
    not:
      field: name
      startsWith: '['
  condition:
    anyOf:
    - allOf:
      - field: type
        equals: Microsoft.CognitiveServices/accounts
      - field: name
        match: ^[A-Za-z0-9][A-Za-z0-9_.-]{1,63}$
    - allOf:
      - field: type
        equals: Microsoft.ApiManagement/service
      - field: name
        match: ^[A-Za-z]([A-Za-z0-9-]{0,48}[A-Za-z0-9])?$
    - allOf:
      - field: type
        equals: Microsoft.Storage/storageAccounts
      - field: name
        match: ^[a-z0-9]{3,24}$
    - allOf:
      - field: type
        equals: Microsoft.DocumentDB/databaseAccounts
      - field: name
        match: ^[a-z0-9][a-z0-9-]{2,43}$
    - allOf:
      - field: type
        equals: Microsoft.KeyVault/vaults
      - field: name
        match: ^(?!.*--)[A-Za-z][A-Za-z0-9-]{1,22}[A-Za-z0-9]$
    - allOf:
      - field: type
        equals: Microsoft.ContainerRegistry/registries
      - field: name
        match: ^[A-Za-z0-9]{5,50}$
    - allOf:
      - field: type
        equals: Microsoft.OperationalInsights/workspaces
      - field: name
        match: ^[A-Za-z0-9][A-Za-z0-9-]{2,61}[A-Za-z0-9]$
    - allOf:
      - field: type
        equals: Microsoft.Insights/components
      - field: name
        match: ^[^%&\\?/\x00-\x1F]{0,259}[^%&\\?/\x00-\x1F .]$
    - allOf:
      - field: type
        equals: Microsoft.App/containerApps
      - field: name
        match: ^[a-z][a-z0-9-]{0,30}[a-z0-9]$
    - allOf:
      - field: type
        equals: Microsoft.Search/searchServices
      - field: name
        match: ^(?!.*--)(?!-)(?!.-)[a-z0-9-]{2,60}(?<!-)$
---

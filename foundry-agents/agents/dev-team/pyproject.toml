[project]
name = "dev-team"
version = "0.1.0"
description = "Foundry hosted agent: a lead agent interviews the user, then a Magentic team builds and tests a Pydantic project."
requires-python = ">=3.13"
dependencies = [
    "agent-framework-foundry",
    "agent-framework-foundry-hosting>=1.0.0b261002",
    "agent-framework-orchestrations>=1.3.0",
    "azure-identity>=1.26.0",
    "pydantic>=2.11",
    "python-dotenv>=1.0",
    # The tester agent runs the generated project's tests inside the agent host, so
    # pytest is a runtime dependency here, not only a development one.
    "pytest>=9.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.0",
    "ruff>=0.15",
    "mypy>=1.18",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["^tests/"]
ignore_missing_imports = true

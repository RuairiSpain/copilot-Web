[project]
name = "teams-voice-meeting"
version = "0.2.0"
description = "CLI that sets up and operates an Azure AI Foundry voice agent on a Teams Phone resource account."
requires-python = ">=3.10"
dependencies = [
    "azure-ai-projects>=2.7.0",
    "azure-identity>=1.17.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
teams-voice = "teams_voice_meeting.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

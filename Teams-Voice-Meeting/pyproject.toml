[project]
name = "teams-voice-meeting"
version = "0.1.0"
description = "Python service that lets an Azure AI Foundry voice agent join Microsoft Teams meetings through Teams Phone extensibility and Azure Communication Services."
requires-python = ">=3.10"
dependencies = [
    "azure-ai-projects>=2.7.0",
    "azure-identity>=1.17.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

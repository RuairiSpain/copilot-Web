name: azure-dev
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: azd auth login --client-id "$CLIENT_ID" --federated-token "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" --tenant-id "$TENANT_ID"
      - run: azd ai agent eval run --no-prompt

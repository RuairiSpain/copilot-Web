# Sample caller for the foundry-doctor preflight reusable workflow. OIDC only, no secrets.
# Store AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID as variables (not secrets) on the protected
# environment named below. Never trigger this from pull_request or pull_request_target: the reusable workflow refuses.
name: preflight

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # the called workflow can only narrow this

jobs:
  preflight:
    # Pin to a tag or, better, a full 40-hex commit SHA in real use. A tag can be moved; a SHA cannot.
    uses: RuairiSpain/copilot-Web/.github/workflows/foundry-doctor-preflight.yml@main
    with:
      environment: <environment-name>
      profile: test
      project-path: .
      resource-group: <resource-group>
      location: <location>
      os: linux
      # Optional. Default false. true adds `preflight --what-if` (FND-DEP-008) and needs the separate what-if role,
      # see README.md in this directory. --strict is not used by the workflow (some checks are uncertain by design).
      what-if: false
      # Only when source-repository is set to a repository other than the caller: pass a tag (vX.Y.Z) or full 40-hex SHA.
      # In cross-repository use prefer the full SHA: it is the only form that cannot be re-pointed after review.
      # source-ref: <tag-or-40-hex-sha>

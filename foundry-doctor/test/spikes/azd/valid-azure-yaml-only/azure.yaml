# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# Spike fixture: valid azure.yaml-only Foundry project (no infra/ folder).
# Every field below is taken from the shape of
#   azure-dev/cli/azd/extensions/azure.ai.agents/schemas/examples/simple.azure.yaml
# and azure-dev/cli/azd/extensions/azure.ai.projects/README.md (infra.provider).
name: foundry-spike-valid

requiredVersions:
  azd: ">= 1.34.2"
  extensions:
    azure.ai.projects: "1.0.0-beta.13"

infra:
  provider: microsoft.foundry

services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-4o-mini
        model:
          format: OpenAI
          name: gpt-4o-mini
          version: "2024-07-18"
        sku:
          name: GlobalStandard
          capacity: 50

  assistant:
    host: azure.ai.agent
    project: ./agents/assistant
    uses:
      - ai-project
    kind: hosted
    name: assistant
    description: A simple assistant.
    env:
      LOG_LEVEL: info
      REGION: ${AZURE_LOCATION}

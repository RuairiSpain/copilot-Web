# Controls that need business or operational context. The prompts are project
# opinion. Only FND-REL-007 has a configuration key (ADR-007); FND-IDN-005,
# FND-OPS-002, FND-OPS-008 and FND-REL-009 have none, so they can only be
# answered by deterministic evidence or remain QUESTION/SKIPPED (ADR-026).
questions:
- rule: FND-IDN-005
  prompt: Has the team reviewed standing human admin access with current business and support context?
- rule: FND-OPS-002
  prompt: Is server-side tracing or hosted-agent telemetry a declared requirement for this project? (No configuration key exists yet; ADR-026.)
- rule: FND-OPS-008
  prompt: Is promotion gated by evaluations that reflect the project's release decision?
- rule: FND-REL-007
  key: disasterRecovery.declared
  referenceKey: disasterRecovery.reference
  prompt: Has the team recorded its disaster recovery strategy and a reference to the supporting plan?
- rule: FND-REL-009
  prompt: Which API Management SLA, zone-redundancy or multi-region objective does the workload need? (The rule reads reliability.apimSlaRequired, apimZoneRequired and apimRegionalRequired, which the configuration schema does not define yet; ADR-026.)
# Optional recommendations whose remediation adds Azure cost. Each entry needs a
# basis and a primary source. Mandatory (must-have) rules are never listed:
# they are not optional, even when they cost money. The cost pillar does not
# imply costly: budgets (FND-COST-001) are free in Cost Management and
# FND-COST-002 reduces spend.
costly:
- rule: FND-NET-010
  basis: An Azure Monitor Private Link Scope is reached through a private endpoint, and Azure Monitor refers its cost to Azure Private Link pricing.
  source: https://learn.microsoft.com/azure/azure-monitor/fundamentals/private-link-security
  lastVerified: '2026-10-18'
- rule: FND-NET-011
  basis: DDoS Network Protection and DDoS IP Protection are priced per protected IP or per 100 protected IPs; only DDoS infrastructure protection is at no additional cost.
  source: https://learn.microsoft.com/azure/ddos-protection/ddos-protection-sku-comparison
  lastVerified: '2026-10-18'
- rule: FND-OPS-002
  basis: Workspace-based Application Insights data is billed for ingestion and retention by the Log Analytics workspace that stores it.
  source: https://learn.microsoft.com/azure/azure-monitor/logs/cost-logs
  lastVerified: '2026-10-18'
- rule: FND-OPS-006
  basis: Log Analytics charges for data retention in addition to ingestion; longer retention adds cost.
  source: https://learn.microsoft.com/azure/azure-monitor/logs/cost-logs
  lastVerified: '2026-10-18'
- rule: FND-REL-001
  basis: Dedicated Azure AI Search bills per search unit (replicas x partitions); adding replicas raises cost.
  source: https://learn.microsoft.com/azure/search/search-sku-manage-costs
  lastVerified: '2026-10-18'
- rule: FND-REL-002
  basis: LRS is the lowest-cost redundancy option; ZRS and GZRS trade higher cost for availability.
  source: https://learn.microsoft.com/azure/storage/common/storage-redundancy
  lastVerified: '2026-10-18'
- rule: FND-REL-003
  basis: Continuous backup beyond the 7-day tier carries a monthly backup storage charge and every restore is charged; the 7-day tier has no backup storage charge. The cost of zone redundancy is not cited here.
  source: https://learn.microsoft.com/azure/cosmos-db/continuous-backup-restore-introduction
  lastVerified: '2026-10-18'
- rule: FND-SEC-008
  basis: Defender for Cloud plans beyond foundational CSPM are paid plans; charges begin after the 30-day trial or usage limit.
  source: https://learn.microsoft.com/azure/defender-for-cloud/connect-azure-subscription
  lastVerified: '2026-10-18'
- rule: FND-SEC-010
  basis: Customer-managed keys require a billable Azure Key Vault (stated for Azure AI Search; the same Key Vault dependency applies to each service listed).
  source: https://learn.microsoft.com/azure/search/search-sku-manage-costs
  lastVerified: '2026-10-18'
- rule: FND-SEC-011
  basis: FQDN outbound rules in Allow Only Approved Outbound mode create a managed Azure Firewall, which adds Azure Firewall charges.
  source: https://learn.microsoft.com/azure/foundry/how-to/managed-virtual-network
  lastVerified: '2026-10-18'

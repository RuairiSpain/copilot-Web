id: FND-SEC-002
version: 1
group: SEC
title: AI Search key authentication disabled or RBAC-only
description: >-
  An Azure AI Search service used by a Foundry project should not accept admin or query API keys. The rule passes when properties.disableLocalAuth
  is true. properties.authOptions.aadOrApiKey (keys and Entra both accepted) and authOptions.apiKeyOnly (keys only) are
  findings; the platform rejects setting disableLocalAuth true together with authOptions.
status: verified
phases:
- '1'
inputs:
- bicep-arm
- control-plane
basis:
- security
category: must-have
pillar: security
severity:
  dev: warning
  test: error
  prod: error
compatibility:
  azd: ''
  extensions: {}
  apiVersions:
  - Microsoft.Search/searchServices 2025-05-01
  - Microsoft.Search/searchServices 2026-09-01-preview
  preview: true
  notes: >-
    No azd dependency: reads compiled ARM JSON or ARM control plane Microsoft.Search/searchServices 2025-05-01 / 2025-05-01:
    stable) - search/resource-manager/Microsoft.Search/Search/stable//search.json. Microsoft.Search/searchServices 2026-09-01-preview
    / 2026-09-01-preview: preview, same property names confirmed) - search/resource-manager/Microsoft.Search/Search/preview//search.json.
evidence:
  description: >-
    Compiled ARM or live Microsoft.Search/searchServices: properties.disableLocalAuth is not true. Report which
    sub-state applies: authOptions.apiKeyOnly present, authOptions.aadOrApiKey present (aadAuthFailureMode value
    included as context), or neither present. The service is in scope when a Foundry connection (category
    CognitiveSearch, compared case-insensitively, or properties.metadata.ResourceId equal to the search service ID), a
    capability host vectorStoreConnections entry (which names a connection, resolved through that connection), the
    capabilitySettings.vectorStore ARM ID of an account or project (preview 2026-07-15-preview only) or an azure.yaml
    resource reference points at it, otherwise it is reported as out of Foundry scope.
  confidence: certain
recommendation: >-
  Set disableLocalAuth to true and remove authOptions, then assign Entra roles (for example index data roles) to the Foundry
  project identity. If a migration needs keys temporarily, use authOptions.aadOrApiKey with aadAuthFailureMode and track
  removal with a suppression expiry.
fix: |-
  resource search 'Microsoft.Search/searchServices@2025-05-01' = {
    name: searchName
    location: location
    sku: { name: 'standard' }
    properties: {
      disableLocalAuth: true
    }
  }
sources:
- url: >-
    https://github.com/Azure/azure-rest-api-specs/blob/main/specification/search/resource-manager/Microsoft.Search/Search/stable/2025-05-01/search.json
  lastVerified: '2026-10-04'
  verifiedVia: >-
    refs/rest-api-specs/specification/search/resource-manager/Microsoft.Search/Search/stable/2025-05-01/search.json
  note: >-
    SearchServiceProperties.disableLocalAuth, authOptions (DataPlaneAuthOptions: apiKeyOnly | aadOrApiKey.aadAuthFailureMode);
    descriptions state the two are mutually exclusive.
- url: >-
    https://github.com/Azure/azure-rest-api-specs/blob/main/specification/search/resource-manager/Microsoft.Search/Search/preview/2026-09-01-preview/search.json
  lastVerified: '2026-10-04'
  verifiedVia: >-
    refs/rest-api-specs/specification/search/resource-manager/Microsoft.Search/Search/preview/2026-09-01-preview/search.json
  note: Same property names present in 2026-09-01-preview.
- url: https://azure.github.io/PSRule.Rules.Azure/en/rules/Azure.AI.DisableLocalAuth/
  lastVerified: '2026-10-04'
  verifiedVia: refs/psrule/docs/en/rules/Azure.AI.DisableLocalAuth.md
  note: Overlap source (PSRule for Azure rule documentation).
- url: https://github.com/Azure/azure-rest-api-specs/blob/c415ef063cd4c1833ecceff7f856295115d80c0d/specification/cognitiveservices/resource-manager/Microsoft.CognitiveServices/CognitiveServices/stable/2026-09-01/cognitiveservices.json
  lastVerified: '2026-10-05'
  verifiedVia: >-
    refs/rest-api-specs @ c415ef063cd4c1833ecceff7f856295115d80c0d (2026-10-03) cognitiveservices stable/2026-09-01
    and preview/2026-07-15-preview cognitiveservices.json.
  note: >-
    ARM spec stable 2026-09-01: CapabilityHostProperties and ProjectCapabilityHostProperties carry
    aiServicesConnections, vectorStoreConnections, storageConnections, threadStorageConnections (string arrays of
    connection names), capabilityHostKind, customerSubnet, enablePublicHostingEnvironment; connections are
    Microsoft.CognitiveServices/accounts/connections and accounts/projects/connections with ConnectionPropertiesV2
    (authType, category, target "The connection URL to be used", metadata string map). capabilitySettings
    (documentStore, vectorStore, blobStore, ARM IDs) exist only in preview 2026-07-15-preview (account and project
    properties); the 2026-09-01 stable spec has no capabilitySettings.
- url: https://github.com/MicrosoftDocs/azure-ai-docs/blob/e8d0ac6f7ebd7fd000e287657ab9beda5bccc1fa/articles/foundry/agents/includes/concepts-capability-hosts-content.md
  lastVerified: '2026-10-05'
  verifiedVia: >-
    refs/azure-ai-docs @ e8d0ac6f7ebd7fd000e287657ab9beda5bccc1fa
    articles/foundry/agents/includes/concepts-capability-hosts-content.md (ms.date 08/21/2026), "Required connection
    properties"; foundry-samples @ d807d9a0b2e633040d896cd0ddd58c95e14ac6f1
    infrastructure-setup-bicep/41-standard-agent-setup/modules-standard/ai-project-identity.bicep and
    add-project-capability-host.bicep.
  note: >-
    Legacy (connection) flow, verified: a project or account capability host lists connection NAMES in
    threadStorageConnections (Cosmos DB), vectorStoreConnections (AI Search), storageConnections (Storage) and
    aiServicesConnections (Azure OpenAI). A connection ties to the Azure resource through
    properties.metadata.ResourceId (the full ARM ID, documented as required for Agent Service to resolve the
    resource); properties.target is the service endpoint URL, not the ID. Connection category strings differ between
    sources: CognitiveSearch, AzureStorageAccount, and for Cosmos DB the ARM spec enum has CosmosDb, Microsoft samples
    use CosmosDB (and once CosmosDb) and the Learn article writes AzureCosmosDb; the category is a free string
    (modelAsString), so compare it case-insensitively and prefer the resource type of metadata.ResourceId.
overlap:
  decision: adapt
  coverage: partial
  rationale: >-
    PSRule for Azure has no Azure Search local-auth rule in the reviewed clone (only IndexSLA, QuerySLA, SKU, ManagedIdentity,
    Name, Naming), so there is no tool-level duplicate in PSRule. Azure Policy 6300012e (audit/deny), 4eb216f2 (modify)
    and d45520cb (DINE) test only disableLocalAuth notEquals true. Foundry Doctor adds the authOptions sub-state (aadOrApiKey
    versus apiKeyOnly), Foundry-scoped applicability through connections and capability hosts, and per-profile severity.
    Hence adapt rather than reuse.
  psrule: []
  azurePolicy:
  - 6300012e-e9a4-4649-b41f-a85f5c43be91
  - 4eb216f2-9dba-4979-86e6-5d7e63ce3b75
  - d45520cb-31ca-44ba-8da2-fcf914608544
  defender: []
  advisor: []
  bicepLinter: []
  checkov: []
implementation:
  owner: native
  package: internal/rules/sec
tests:
  positive:
  - disableLocalAuth true passes
  - service not referenced by Foundry is reported out of scope, not failed
  negative:
  - disableLocalAuth absent and authOptions absent fails
  - authOptions.aadOrApiKey fails with sub-state aadOrApiKey
  - authOptions.apiKeyOnly fails with sub-state apiKeyOnly
  skipped:
  - disableLocalAuth from unresolved parameter is skipped
  - >-
    uncertain: service referenced only through a connection defined outside the scanned files is reported uncertain
testability: >-
  Deterministic on ARM JSON; Foundry scoping needs connection resources in the same compiled template or azd environment.
notes: >-
  Default behaviour when disableLocalAuth is absent was not read as a primary-source statement; treat absent as
  not-disabled, matching the built-in policy which flags notEquals true. The waf basis was removed after the Phase 0
  Azure black belt review because no WAF pillar tag or WARA recommendation is cited here; the WAF mapping is added in
  Phase 4 when the guidance is verified. Phase 1 fact check (2026-10-05): the Search-to-Foundry tie is
  connection.properties.metadata.ResourceId (connection flow) or capabilitySettings.vectorStore (preview), both read
  from the cited specs and Foundry documentation; the connection target is only the endpoint URL.

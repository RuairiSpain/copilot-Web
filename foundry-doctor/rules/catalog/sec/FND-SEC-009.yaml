id: FND-SEC-009
version: 3
group: SEC
title: Policy coverage and compliance evidence
description: Evidence report on whether Azure Policy assignments at the subscription or resource group scope cover
  the built-in definitions that Foundry Doctor maps in SEC-001 to SEC-006 and SEC-010, whether any assignment is
  in DoNotEnforce mode, and what the current compliance state is. Informational in dev, warning in prod. The expectation
  that an environment assigns these policies is a product opinion. The static leg reads Microsoft.Authorization/policyAssignments in the
  compiled template, and the list of mapped definition IDs can be replaced with the policy key azurePolicy.mappedDefinitionIds.
status: product-opinion
phases:
- '2'
- '4'
inputs:
- control-plane
- bicep-arm
basis:
- opinion
- security
category: nice-to-have
pillar: security
severity:
  dev: info
  test: info
  prod: warning
compatibility:
  azd: ""
  extensions: {}
  apiVersions:
    - { plane: management, provider: Microsoft.Authorization, resourceType: policyAssignments, version: "2025-01-01" }
    - { plane: management, provider: Microsoft.PolicyInsights, resourceType: policyStates, version: "2024-10-01" }
  preview: false
  notes: "No azd dependency: ARM control plane read Microsoft.Authorization/policyAssignments 2025-01-01 / 2025-01-01: stable, properties.enforcementMode Default|DoNotEnforce|Enroll) - resources/resource-manager/Microsoft.Authorization/policy/stable//policyAssignments.json. Microsoft.PolicyInsights policyStates 2024-10-01 / 2024-10-01: stable, queryResults / summarize; fetched from main branch openapi.json) - specification/policyinsights/resource-manager/Microsoft.PolicyInsights/PolicyInsights/stable//openapi.json."
evidence:
  description: List policyAssignments effective at the subscription and resource-group scopes; match policyDefinitionId
    against the mapped built-in policy IDs; report unmatched mapped IDs as not covered, enforcementMode DoNotEnforce
    as not enforced, and non-compliant resource counts from PolicyInsights policyStates summarize for matched assignments.
    Initiative (policySetDefinition) membership is resolved by reading the set.
    The static leg (Bicep/ARM) matches policyAssignments in the template to the mapped definition GUIDs listed in the sources
    below (the last path segment of policyDefinitionId). enforcementMode DoNotEnforce is a finding; absent or Default (the
    spec default) counts as enforced; Enroll, an expression value, a conditional assignment or an initiative assignment
    (membership not in the template) is uncertain. The rule passes only when every mapped definition has an enforced
    assignment in the template; a mapped definition with no assignment is uncertain, not a gap, because the assignment may be
    at a parent scope outside the template. No assignments at all in the template skips with input-unavailable naming the
    missing capability (Policy Reader, live check). The mapped list is the five definitions below (all read in the
    azure-policy repository); it can be replaced by the policy key azurePolicy.mappedDefinitionIds (list of GUIDs), a key that
    is not yet in ADR-007 and the configuration schema (UNVERIFIED as a supported key until added).
  confidence: likely
recommendation: Assign the built-in policies that correspond to the Foundry Doctor security rules (for example local-auth,
  public network access, CMK) at subscription or management-group scope, in Default enforcement mode once existing
  resources are compliant.
fix: "resource assign 'Microsoft.Authorization/policyAssignments@2025-01-01' = {\n  name: 'foundry-no-local-auth'\n\
  \  properties: {\n    policyDefinitionId: tenantResourceId('Microsoft.Authorization/policyDefinitions', '71ef260a-8f18-47b7-abcb-62d0673d94dc')\n\
  \    enforcementMode: 'Default'\n  }\n}"

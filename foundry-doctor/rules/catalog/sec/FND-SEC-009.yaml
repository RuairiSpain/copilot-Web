overlap:
  decision: native
  provisional: true
  coverage: none
  rationale: PSRule Azure.Policy.* rules lint policy assignment descriptors and waiver expiry (not coverage of mapped
    definitions), and Defender regulatory compliance is a different data set. No tool correlates 'which Foundry
    Doctor security rules have a backing policy assignment'. Native is the evidence assembly over ARM APIs; whether
    an environment should be covered is product opinion, so status is product-opinion.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/sec
tests:
  positive:
  - DoNotEnforce is a finding
  - policy list override DoNotEnforce is a finding
  negative:
  - all mapped policies enforced passes
  - absent enforcementMode is Default per spec
  - policy list override replaces the default list
  - empty override falls back to the catalogue list
  skipped:
  - no assignments is input-unavailable
  - no Policy Reader permission is skipped
  uncertain:
  - missing mapped policy is uncertain
  - Enroll mode is uncertain
  - initiative assignment cannot be expanded
  - expression definition id is uncertain
  - unmapped assignment only is uncertain
testability: Deterministic given the ARM reads; Skipped without Policy Reader.
notes: PolicyState.complianceState values were not enumerated in the spec definition; do not hard-code them without
  reading the API response schema or docs.
  Version 3 (2026-10-19) - the pass path now exists for Bicep/ARM input; the mapped definition IDs, previously unsourced in code,
  were checked against the azure-policy repository (name and displayName read 2026-10-19). Coverage is not proven by an
  absent assignment because assignments may live at a parent scope, so a gap is uncertain, never a finding. The
  policy key azurePolicy.mappedDefinitionIds is read by the rule but is not defined in ADR-007 or the configuration schema yet.
id: FND-SEC-014
version: 2
group: SEC
title: Secrets not emitted as Bicep outputs
description: >-
  Bicep outputs must not carry secrets, because deployment outputs are stored in deployment history and, for azd, are copied
  into the azd environment values. The rule detects outputs derived from secure parameters, list*() functions such as listKeys,
  and outputs named like password.
status: verified
phases:
- '1'
inputs:
- bicep-arm
basis:
- security
category: must-have
pillar: security
severity:
  dev: warning
  test: error
  prod: error
compatibility:
  azd: '>=1.36.0-beta.1 <=1.36.0'
  extensions: {}
  apiVersions: []
  preview: true
  notes: >-
    azd: the lower bound 1.36.0-beta.1 is the first version read (clone); the upper bound is azd 1.36.0 (tag azure-dev-cli_1.36.0, acebba1e388b489a91ab8e2487a676359ab516a1, released 2026-10-14), read by tag diff on 2026-10-16. Azd stores entry-point outputs as environment values per azd docs Bicep
    linter rule outputs-should-not-contain-secrets (Learn ms.date 10/30/2025) -
    https://github.com/MicrosoftDocs/azure-docs/blob/main/articles/azure-resource-manager/bicep/linter-rule-outputs-should-not-contain-secrets.md
    (branch URL, not commit-pinned) Window widened 2026-10-16: azd to 1.36.0 (tag azure-dev-cli_1.36.0, acebba1,
    released 2026-10-14). The azd and extension changelogs and the schema and source diffs from the previously
    verified versions were read; none touches this rule's verified facts for the widened fields (see
    docs/tool-compatibility.md section 6).
evidence:
  description: >-
    Analysis of the compiled ARM JSON root outputs (no Bicep parser). Per output, not declared securestring/secureObject:
    (a) the value expression calls parameters('<name>') for a parameter declared securestring or secureObject, directly or
    through variables(...) (followed up to 8 levels); (b) the value expression calls a list*() function (listKeys,
    listAccountSas, listConnectionStrings, listSecrets and others, case-insensitive, at a function-call boundary, never
    inside a string literal); (c) the output name, split into whole tokens on case, underscore, hyphen and digit
    boundaries, contains password, passwd or pwd. (a) and (b) and a password-family name are findings with
    Finding.Key = <output name>:<secure-param|list-function|name>. A name that only contains the token secret, token or key
    (key as the last token, or after api, access, primary, secondary or shared) or the pair connection string is uncertain and
    is reported as a per-output skip, not a finding. keyVaultUri, monkey and tokenizerName do not match. Outputs declared
    securestring/secureObject (Bicep @secure()) are exempt, as in the linter. Evidence names the output and the
    secure parameter or function, never a value. Not detected: secrets reached only through reference(...).<property>
    (for example reference(...).primaryKey), through module outputs, or through a user-defined function; a
    Bicep-build diagnostic wrap (bicep build output) is not implemented in Phase 1.
  confidence: certain
recommendation: >-
  Output the resourceId of the resource that holds the secret, or store the secret in Key Vault, and read it at the consuming
  resource. Do not output keys, connection strings or passwords.
fix: >-
  output storageId string = stg.id // consumer calls listKeys(storageId, ...) when it needs the key; do not output keys
sources:

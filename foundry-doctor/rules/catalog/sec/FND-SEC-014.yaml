overlap:
  decision: wrap
  provisional: true
  coverage: full
  rationale: >-
    The Bicep linter rule outputs-should-not-contain-secrets already gives equivalent evidence (and it is a compile-time
    diagnostic, so no Bicep parser is needed). Foundry Doctor wraps it: run bicep build, normalise the diagnostic into FND-SEC-014
    with a stable fingerprint, source location and per-profile severity (the linter default is warning and can be silenced
    with a disable comment, which Foundry Doctor should report as a suppression needing reason and expiry). Checkov has
    no output-secret check in the reviewed clone (only secure-parameter default checks).
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: searched-match
      matches:
      - outputs-should-not-contain-secrets
    checkov:
      state: unresearched
implementation:
  owner: bicep
  package: internal/bicep
tests:
  positive:
  - output using listKeys fails
  - output of secure parameter fails
  - output named accountPassword fails
  - output reaching a secure parameter through a variable fails
  negative:
  - output of resource id passes
  - output keyVaultUri of a vault property passes (name token key is not the last token)
  - '@secure() output of a secure parameter passes (exempt, as in the Bicep linter)'
  - a string literal that contains the text listKeys( passes
  skipped:
  - output named apiKeyName with a literal value is an uncertain per-output skip, not a finding
  - model that exposes only output names skips with input-unavailable when no name matches
  - Bicep CLI not installed is skipped with the missing capability named
  - '#disable-next-line outputs-should-not-contain-secrets is surfaced as a suppression needing reason and expiry'
testability: Deterministic given the Bicep CLI; Skipped when the Bicep CLI is missing.
notes: >-
  Version 2 (2026-10-16): the overlap decision stays wrap (Phase 0), so implementation.owner stays bicep; the Phase 1
  fallback analysis of the ARM outputs lives in internal/rules/sec/sec014.go with accessors in internal/armmodel. The Go rule no longer matches name substrings. It analyses the compiled ARM outputs for secure
  parameter use, list*() calls and whole-token password names (see evidence). A name-only match on secret, token or key
  words is an uncertain skip because the Bicep linter documentation lists only password names. Bicep linter configuration (bicepconfig.json) can change or disable the level; the wrapper must read the effective level,
  not assume warning. The waf basis was removed after the Phase 0 Azure black belt review because no WAF pillar tag or WARA
  recommendation is cited here; the WAF mapping is added in Phase 4 when the guidance is verified.

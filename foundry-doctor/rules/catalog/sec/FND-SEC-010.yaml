overlap:
  decision: adapt
  provisional: true
  coverage: partial
  rationale: Azure Policy has per-service CMK audits (67121cc7 AI Services, 76a56461 and 356da939 Search, 1f905d99
    Cosmos DB, 6fac406b Storage) and Checkov has CKV_AZURE_100 for Cosmos DB; PSRule has no CMK rule in the reviewed
    clone. They are per-resource compliance checks. Foundry Doctor adapts the idea into one informational cross-resource
    view, informational only (never above Info) and reporting violations only, so it is not a duplicate of the Policy enforcement path.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: searched-match
      matches:
      - 67121cc7-ff39-4ab8-b7e3-95b84dab487d
      - 76a56461-9dc0-40f0-82f5-2453283afa2f
      - 356da939-f20a-4bb9-86f8-5db445b0e354
      - 1f905d99-2ab7-462c-a6b0-f709acca6c8f
      - 6fac406b-40ca-413b-bf8e-0bf964659c25
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: searched-match
      matches:
      - CKV_AZURE_100
implementation:
  owner: native
  package: internal/rules/sec
tests:
  positive:
  - platform-managed with policy-key requirement is a finding
  - enforced CMK policy assignment declares the requirement
  - search Unspecified is a violation when required
  - cosmos without key uri is a violation when required
  - storage Microsoft.Storage is a violation when required
  - registry without encryption is a violation when required
  negative:
  - compliant account passes
  - search enforcement Enabled passes
  - cosmos key uri passes
  - storage Keyvault source passes
  - registry CMK passes
  - DoNotEnforce CMK policy assignment declares nothing
  - unlinked storage is out of scope
  skipped:
  - no resources is not applicable
  - Storage encryption not present in Bicep skipped for template mode
  uncertain:
  - expression keySource is uncertain
  - account KeyVault source without key properties is uncertain
  - platform-managed without requirement is a note
testability: Deterministic on ARM JSON; the Storage encryption property is read-only in responses so live mode is
  preferred for Storage.
notes: Basis is security guidance, not a platform constraint; the rule is Info-only in every profile.
  Version 3 (2026-10-19) - findings now report violations only (version 2 reported a finding for every state, including the
  compliant cmk state; that state is now a pass). The existing tests that asserted a finding per state were adapted, not
  removed (see the commit message). The policy key encryption.requireCustomerManagedKeys is read by the rule but is not defined
  in ADR-007 or the configuration schema yet (UNVERIFIED as a supported key until added). The Cosmos keyVaultKeyUri check
  treats any non-empty value as customer-managed.
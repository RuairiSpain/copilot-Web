overlap:
  decision: adapt
  coverage: partial
  rationale: PSRule has four separate rules (LocalAuth, BlobPublicAccess, MinTLS, SecureTransfer), Azure Policy
    has audit/modify built-ins for each and Checkov covers HTTPS, TLS and public access, so each property check
    is a duplicate. The Foundry rule groups them as one posture finding for Foundry-attached storage accounts, scopes
    by Foundry usage, and applies per-profile severity. Checkov has no allowSharedKeyAccess check in the reviewed
    clone. Treat the sub-checks as reuse candidates if the grouping is not wanted.
  psrule:
  - Azure.Storage.LocalAuth
  - Azure.Storage.BlobPublicAccess
  - Azure.Storage.MinTLS
  - Azure.Storage.SecureTransfer
  azurePolicy:
  - 8c6a50c6-9ffd-4ae7-986f-5fa6111f9a54
  - 4fa4b6c0-31ca-4c0d-b10d-24b96f62a751
  - 13502221-8df0-4414-9937-de9c5c4e396b
  - fe83a0eb-a853-422d-aac2-1bffd182c5d0
  - 404c3081-a854-4457-ae30-26a93ef643f9
  - f81e3117-0093-4b17-8a60-82363134f0eb
  defender: []
  advisor: []
  bicepLinter: []
  checkov:
  - CKV_AZURE_59
  - CKV_AZURE_34
  - CKV_AZURE_44
  - CKV_AZURE_3
implementation:
  owner: native
  package: internal/rules/sec
tests:
  positive:
  - all four properties compliant passes
  negative:
  - allowSharedKeyAccess absent fails
  - allowBlobPublicAccess true fails
  - minimumTlsVersion TLS1_0 fails
  - minimumTlsVersion absent fails
  - supportsHttpsTrafficOnly false fails
  skipped:
  - properties driven by unresolved parameters are skipped per sub-check
  - 'uncertain: supportsHttpsTrafficOnly absent in a template using an API version older than 2019-04-01 is uncertain'
testability: Deterministic on ARM JSON. Defaults depend on the API version in the template; evidence records the
  apiVersion.
notes: Checkov CKV_AZURE_34 targets blob container publicAccess and CKV_AZURE_59 the account-level flag; both listed
  because they cover the anonymous-access sub-check.

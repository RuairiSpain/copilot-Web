id: FND-SEC-004
version: 1
group: SEC
title: Storage shared key/anonymous access disabled; HTTPS/TLS required
description: >-
  A Storage account used by Foundry should block Shared Key authorization (properties.allowSharedKeyAccess false), block
  anonymous blob access (properties.allowBlobPublicAccess false), require HTTPS (properties.supportsHttpsTrafficOnly true)
  and set properties.minimumTlsVersion to TLS1_2 or TLS1_3. Each sub-check reports separately.
status: verified
phases:
- '1'
inputs:
- bicep-arm
- control-plane
basis:
- security
category: must-have
pillar: security
severity:
  dev: warning
  test: error
  prod: error
compatibility:
  azd: ''
  extensions: {}
  apiVersions:
  - { plane: management, provider: Microsoft.Storage, resourceType: storageAccounts, version: '2026-06-01' }
  preview: false
  notes: >-
    No azd dependency: reads compiled ARM JSON or ARM control plane Microsoft.Storage/storageAccounts 2026-06-01 / 2026-06-01:
    stable) - storage/resource-manager/Microsoft.Storage/stable//openapi.json.
evidence:
  description: >-
    Compiled ARM or live Microsoft.Storage/storageAccounts in Foundry scope. Four independent findings: allowSharedKeyAccess
    is not false (spec: null is equivalent to true); allowBlobPublicAccess is true (spec: default interpretation is false,
    so only an explicit true fails); supportsHttpsTrafficOnly is false (spec: default true since API version 2019-04-01
    on create); minimumTlsVersion is TLS1_0 or TLS1_1 (spec: default interpretation TLS1_0, so an absent value fails). Blob
    container publicAccess is out of scope.
  confidence: certain
recommendation: >-
  Set allowSharedKeyAccess false, allowBlobPublicAccess false, supportsHttpsTrafficOnly true and minimumTlsVersion TLS1_2
  on the account, and give the Foundry identity Storage data roles. Verify no client still uses account keys or SAS signed
  with the account key before disabling Shared Key.
fix: |-
  resource st 'Microsoft.Storage/storageAccounts@2026-06-01' = {
    name: storageName
    location: location
    sku: { name: 'Standard_LRS' }
    kind: 'StorageV2'
    properties: {
      allowSharedKeyAccess: false
      allowBlobPublicAccess: false
      supportsHttpsTrafficOnly: true
      minimumTlsVersion: 'TLS1_2'
    }
  }
sources:
- url: >-
    https://github.com/Azure/azure-rest-api-specs/blob/main/specification/storage/resource-manager/Microsoft.Storage/stable/2026-06-01/openapi.json
  lastVerified: '2026-10-04'
  verifiedVia: refs/rest-api-specs/specification/storage/resource-manager/Microsoft.Storage/stable/2026-06-01/openapi.json
  note: >-
    StorageAccountProperties / StorageAccountPropertiesCreateParameters: allowSharedKeyAccess, allowBlobPublicAccess, supportsHttpsTrafficOnly,
    minimumTlsVersion (enum TLS1_0..TLS1_3) with the default text quoted in evidence.
- url: https://azure.github.io/PSRule.Rules.Azure/en/rules/Azure.Storage.LocalAuth/
  lastVerified: '2026-10-04'
  verifiedVia: refs/psrule/docs/en/rules/Azure.Storage.LocalAuth.md
  note: Overlap source (PSRule for Azure rule documentation).
- url: https://azure.github.io/PSRule.Rules.Azure/en/rules/Azure.Storage.BlobPublicAccess/
  lastVerified: '2026-10-04'
  verifiedVia: refs/psrule/docs/en/rules/Azure.Storage.BlobPublicAccess.md
  note: Overlap source (PSRule for Azure rule documentation).
- url: https://azure.github.io/PSRule.Rules.Azure/en/rules/Azure.Storage.MinTLS/
  lastVerified: '2026-10-04'
  verifiedVia: refs/psrule/docs/en/rules/Azure.Storage.MinTLS.md
  note: Overlap source (PSRule for Azure rule documentation).
- url: https://azure.github.io/PSRule.Rules.Azure/en/rules/Azure.Storage.SecureTransfer/
  lastVerified: '2026-10-04'
  verifiedVia: refs/psrule/docs/en/rules/Azure.Storage.SecureTransfer.md
  note: Overlap source (PSRule for Azure rule documentation).
overlap:
  decision: adapt
  provisional: true
  coverage: partial
  rationale: >-
    PSRule has four separate rules (LocalAuth, BlobPublicAccess, MinTLS, SecureTransfer), Azure Policy has audit/modify
    built-ins for each and Checkov covers HTTPS, TLS and public access, so each property check is a duplicate. The Foundry
    rule groups them as one posture finding for Foundry-attached storage accounts, scopes by Foundry usage, and applies
    per-profile severity. Checkov has no allowSharedKeyAccess check in the reviewed clone. Treat the sub-checks as reuse
    candidates if the grouping is not wanted.
  research:
    psrule:
      state: searched-match
      matches:
      - Azure.Storage.LocalAuth
      - Azure.Storage.BlobPublicAccess
      - Azure.Storage.MinTLS
      - Azure.Storage.SecureTransfer
    azurePolicy:
      state: searched-match
      matches:
      - 8c6a50c6-9ffd-4ae7-986f-5fa6111f9a54
      - 4fa4b6c0-31ca-4c0d-b10d-24b96f62a751
      - 13502221-8df0-4414-9937-de9c5c4e396b
      - fe83a0eb-a853-422d-aac2-1bffd182c5d0
      - 404c3081-a854-4457-ae30-26a93ef643f9
      - f81e3117-0093-4b17-8a60-82363134f0eb
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: searched-match
      matches:
      - CKV_AZURE_59
      - CKV_AZURE_34
      - CKV_AZURE_44
      - CKV_AZURE_3
implementation:
  owner: native
  package: internal/rules/sec
tests:
  positive:
  - allowSharedKeyAccess absent fails
  - allowBlobPublicAccess true fails
  - minimumTlsVersion TLS1_0 fails
  - minimumTlsVersion absent fails
  - supportsHttpsTrafficOnly false fails
  negative:
  - all four properties compliant passes
  skipped:
  - properties driven by unresolved parameters are skipped per sub-check
  uncertain:
  - supportsHttpsTrafficOnly absent in a template using an API version older than 2019-04-01
testability: >-
  Deterministic on ARM JSON. Defaults depend on the API version in the template; evidence records the apiVersion.
notes: >-
  Checkov CKV_AZURE_34 targets blob container publicAccess and CKV_AZURE_59 the account-level flag; both listed because
  they cover the anonymous-access sub-check. The waf basis was removed after the Phase 0 Azure black belt review because
  no WAF pillar tag or WARA recommendation is cited here; the WAF mapping is added in Phase 4 when the guidance is verified.

id: FND-SEC-004
version: 1
group: SEC
title: Storage shared key/anonymous access disabled; HTTPS/TLS required
description: A Storage account used by Foundry should block Shared Key authorization (properties.allowSharedKeyAccess
  false), block anonymous blob access (properties.allowBlobPublicAccess false), require HTTPS (properties.supportsHttpsTrafficOnly
  true) and set properties.minimumTlsVersion to TLS1_2 or TLS1_3. Each sub-check reports separately.
status: verified
phases:
- '1'
inputs:
- bicep-arm
- control-plane
basis:
- security
- waf
category: must-have
pillar: security
severity:
  dev: warning
  test: error
  prod: error
compatibility:
  azd: n/a (reads compiled ARM JSON or ARM control plane)
  extensions: {}
  apiVersions:
  - Microsoft.Storage/storageAccounts 2026-06-01 (stable) - storage/resource-manager/Microsoft.Storage/stable/2026-06-01/openapi.json
evidence:
  description: 'Compiled ARM or live Microsoft.Storage/storageAccounts in Foundry scope. Four independent findings:
    allowSharedKeyAccess is not false (spec: null is equivalent to true); allowBlobPublicAccess is true (spec: default
    interpretation is false, so only an explicit true fails); supportsHttpsTrafficOnly is false (spec: default true
    since API version 2019-04-01 on create); minimumTlsVersion is TLS1_0 or TLS1_1 (spec: default interpretation
    TLS1_0, so an absent value fails). Blob container publicAccess is out of scope.'
  confidence: certain
recommendation: Set allowSharedKeyAccess false, allowBlobPublicAccess false, supportsHttpsTrafficOnly true and minimumTlsVersion
  TLS1_2 on the account, and give the Foundry identity Storage data roles. Verify no client still uses account keys
  or SAS signed with the account key before disabling Shared Key.
fix: "resource st 'Microsoft.Storage/storageAccounts@2026-06-01' = {\n  name: storageName\n  location: location\n\
  \  sku: { name: 'Standard_LRS' }\n  kind: 'StorageV2'\n  properties: {\n    allowSharedKeyAccess: false\n    allowBlobPublicAccess:\
  \ false\n    supportsHttpsTrafficOnly: true\n    minimumTlsVersion: 'TLS1_2'\n  }\n}"
sources:
- url: https://github.com/Azure/azure-rest-api-specs/blob/main/specification/storage/resource-manager/Microsoft.Storage/stable/2026-06-01/openapi.json
  lastVerified: '2026-10-04'
  verifiedVia: refs/rest-api-specs/specification/storage/resource-manager/Microsoft.Storage/stable/2026-06-01/openapi.json
  note: 'StorageAccountProperties / StorageAccountPropertiesCreateParameters: allowSharedKeyAccess, allowBlobPublicAccess,
    supportsHttpsTrafficOnly, minimumTlsVersion (enum TLS1_0..TLS1_3) with the default text quoted in evidence.'
- url: https://azure.github.io/PSRule.Rules.Azure/en/rules/Azure.Storage.LocalAuth/
  lastVerified: '2026-10-04'
  verifiedVia: refs/psrule/docs/en/rules/Azure.Storage.LocalAuth.md
  note: Overlap source (PSRule for Azure rule documentation).
- url: https://azure.github.io/PSRule.Rules.Azure/en/rules/Azure.Storage.BlobPublicAccess/
  lastVerified: '2026-10-04'
  verifiedVia: refs/psrule/docs/en/rules/Azure.Storage.BlobPublicAccess.md
  note: Overlap source (PSRule for Azure rule documentation).
- url: https://azure.github.io/PSRule.Rules.Azure/en/rules/Azure.Storage.MinTLS/
  lastVerified: '2026-10-04'
  verifiedVia: refs/psrule/docs/en/rules/Azure.Storage.MinTLS.md
  note: Overlap source (PSRule for Azure rule documentation).
- url: https://azure.github.io/PSRule.Rules.Azure/en/rules/Azure.Storage.SecureTransfer/

overlap:
  decision: native
  provisional: true
  coverage: partial
  rationale: >-
    No PSRule, Checkov or Bicep linter rule covers guardrail binding. Azure Policy has [Preview] built-ins (for example
    af253d37, f3a9c2e0, c1ad46c6, 930f48f9, 595f98a5, 9224c1cc) on the Microsoft.CognitiveServices.Data deployments/agents
    data-plane alias that audit content-filter settings of a policy, not whether a deployment or agent is bound to one.
    Foundry Doctor adds cross-file correlation (azure.yaml hosted agent policy to the raiPolicies resource in Bicep), which
    no existing tool does. The azd azure.ai.agents extension validates ARM ID shape and existence only at deploy time (it
    has an rai_policy_not_found error code); the doctor catches this in preflight.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: searched-match
      matches:
      - af253d37-136a-42f8-a1fc-30010c083d41
      - f3a9c2e0-7b4d-4d8f-9c3a-2e1f6b9a8d4e
      - c1ad46c6-37f8-4af0-9c71-c208375c87dd
      - 930f48f9-f07e-427c-9494-52603581c6a9
      - 595f98a5-b562-4ab6-b9c8-2ff9f39a3f7c
      - 9224c1cc-34fc-44f1-ad08-5c4b079c9ce6
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/sec
tests:
  positive:
  - hosted agent with no policies entry fails
  - raiPolicyName is a bare name fails
  - raiPolicyName references an undeclared policy fails
  negative:
  - deployment without raiPolicyName passes because Microsoft.DefaultV2 applies
  - hosted agent with rai_policy full ARM ID matching a declared raiPolicies resource passes
  skipped:
  - policy defined outside scanned files and no control-plane access is skipped
  uncertain:
  - raiPolicyName-references-existing-live-policy-not-in-template
  - Microsoft-managed policy name other than Microsoft.DefaultV2 or Microsoft.Default is not enumerated
testability: Deterministic for azure.yaml and Bicep; existence in the live account needs control-plane read.
notes: >-
  Whether an omitted raiPolicyName means Microsoft.DefaultV2 versus Microsoft.Default on model deployments is documented
  only for 'models are assigned Microsoft.DefaultV2' (guardrails-overview). The agent default is documented as inheritance
  from the model deployment. Preview data-plane Policy definitions use alias Microsoft.CognitiveServices.Data/accounts/deployments/raiPolicy.*.
  The waf basis was removed after the Phase 0 Azure black belt review because no WAF pillar tag or WARA recommendation is
  cited here; the WAF mapping is added in Phase 4 when the guidance is verified.

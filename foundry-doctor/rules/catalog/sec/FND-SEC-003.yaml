id: FND-SEC-003
version: 1
group: SEC
title: Cosmos DB local authentication disabled
description: A Cosmos DB account used by Foundry (for example agent thread storage reached through a capability
  host) should disable key-based authentication. The rule reads properties.disableLocalAuth on Microsoft.DocumentDB/databaseAccounts.
  PSRule applies its equivalent only to the NoSQL API; this rule applies the same scope.
status: verified
phases:
- '1'
inputs:
- bicep-arm
- control-plane
basis:
- security
- waf
category: must-have
pillar: security
severity:
  dev: warning
  test: error
  prod: error
compatibility:
  azd: n/a (reads compiled ARM JSON or ARM control plane)
  extensions: {}
  apiVersions:
  - Microsoft.DocumentDB/databaseAccounts 2026-03-15 (stable) - cosmos-db/resource-manager/Microsoft.DocumentDB/DocumentDB/stable/2026-03-15/openapi.json
evidence:
  description: 'Compiled ARM or live Microsoft.DocumentDB/databaseAccounts: properties.disableLocalAuth is not true.
    In scope when the account is referenced by a Foundry connection, or by threadStorageConnections / vectorStoreConnections
    / storageConnections of a capability host on the Foundry account or project. Connection authType is reported
    as context only (no breakage is inferred).'
  confidence: certain
recommendation: Set properties.disableLocalAuth to true and grant the Foundry project managed identity a Cosmos
  DB data-plane role assignment. Check that clients use Entra ID before enforcing in an existing environment.
fix: "resource cosmos 'Microsoft.DocumentDB/databaseAccounts@2026-03-15' = {\n  name: cosmosName\n  location: location\n\
  \  kind: 'GlobalDocumentDB'\n  properties: {\n    databaseAccountOfferType: 'Standard'\n    locations: [ { locationName:\
  \ location, failoverPriority: 0 } ]\n    disableLocalAuth: true\n  }\n}"
sources:
- url: https://github.com/Azure/azure-rest-api-specs/blob/main/specification/cosmos-db/resource-manager/Microsoft.DocumentDB/DocumentDB/stable/2026-03-15/openapi.json
  lastVerified: '2026-10-04'
  verifiedVia: refs/rest-api-specs/specification/cosmos-db/resource-manager/Microsoft.DocumentDB/DocumentDB/stable/2026-03-15/openapi.json
  note: 'DatabaseAccountCreateUpdateProperties/GetProperties.disableLocalAuth: ''only MSI and AAD can be used exclusively
    for authentication''.'
- url: https://github.com/Azure/azure-rest-api-specs/blob/main/specification/cognitiveservices/resource-manager/Microsoft.CognitiveServices/CognitiveServices/stable/2026-09-01/cognitiveservices.json
  lastVerified: '2026-10-04'
  verifiedVia: refs/rest-api-specs/specification/cognitiveservices/resource-manager/Microsoft.CognitiveServices/CognitiveServices/stable/2026-09-01/cognitiveservices.json
  note: CapabilityHostProperties.threadStorageConnections / vectorStoreConnections (description names CosmosDB)
    used for Foundry correlation.
- url: https://azure.github.io/PSRule.Rules.Azure/en/rules/Azure.Cosmos.NoSQLLocalAuth/
  lastVerified: '2026-10-04'
  verifiedVia: refs/psrule/docs/en/rules/Azure.Cosmos.NoSQLLocalAuth.md
  note: Overlap source (PSRule for Azure rule documentation).
overlap:
  decision: adapt
  coverage: partial
  rationale: 'PSRule Azure.Cosmos.NoSQLLocalAuth, Azure Policy 5450f5bd (audit/deny) and dc2d41d1 (modify) and Checkov
    CKV_AZURE_140 test the same property. The Foundry value is cross-resource correlation: only Cosmos accounts
    that a Foundry capability host or connection actually uses are in scope, and the finding carries the referencing
    project. Plus per-profile severity. If that correlation is not implemented in a phase, downgrade to reuse of
    the PSRule mapping.'
  psrule:
  - Azure.Cosmos.NoSQLLocalAuth
  azurePolicy:
  - 5450f5bd-9c72-4390-a9c4-a7aba4edfdd2
  - dc2d41d1-4ab1-4666-a3e1-3d51c43e0049
  defender: []
  advisor: []
  bicepLinter: []
  checkov:
  - CKV_AZURE_140
implementation:
  owner: native
  package: internal/rules/sec
tests:
  positive:
  - Cosmos referenced by capability host with disableLocalAuth true passes
  negative:
  - Cosmos referenced by capability host with disableLocalAuth false or absent fails
  - not-NoSQL API account is out of scope
  skipped:
  - Cosmos account not referenced by any Foundry resource is skipped with reason out-of-scope
  - unresolved disableLocalAuth parameter is skipped
testability: Deterministic on ARM JSON; correlation requires capability host and connection resources in scope.
notes: PSRule limits the rule to the NoSQL API because enforcing RBAC-only is documented there as supported only
  for NoSQL; the API-kind detection (capabilities / kind) was not independently verified here.

id: FND-SEC-003
version: 1
group: SEC
title: Cosmos DB local authentication disabled
description: >-
  A Cosmos DB account used by Foundry (for example agent thread storage reached through a capability host) should disable
  key-based authentication. The rule reads properties.disableLocalAuth on Microsoft.DocumentDB/databaseAccounts. PSRule
  applies its equivalent only to the NoSQL API; this rule applies the same scope.
status: verified
phases:
- '1'
inputs:
- bicep-arm
- control-plane
basis:
- security
category: must-have
pillar: security
severity:
  dev: warning
  test: error
  prod: error
compatibility:
  azd: ''
  extensions: {}
  apiVersions:
  - { plane: management, provider: Microsoft.DocumentDB, resourceType: databaseAccounts, version: '2026-03-15' }
  preview: false
  notes: >-
    No azd dependency: reads compiled ARM JSON or ARM control plane Microsoft.DocumentDB/databaseAccounts 2026-03-15 / 2026-03-15:
    stable) - cosmos-db/resource-manager/Microsoft.DocumentDB/DocumentDB/stable//openapi.json.
evidence:
  description: >-
    Compiled ARM or live Microsoft.DocumentDB/databaseAccounts: properties.disableLocalAuth is not true. In scope when
    the account is referenced by a Foundry connection (category compared case-insensitively against CosmosDb, CosmosDB
    and AzureCosmosDb, or properties.metadata.ResourceId whose resource type is
    Microsoft.DocumentDB/databaseAccounts), or by threadStorageConnections / vectorStoreConnections /
    storageConnections of a capability host on the Foundry account or project (those arrays hold connection names,
    resolved through the connection), or by capabilitySettings.documentStore of an account or project (preview
    2026-07-15-preview only). Connection authType is reported as context only (no breakage is inferred).
  confidence: certain
recommendation: >-
  Set properties.disableLocalAuth to true and grant the Foundry project managed identity a Cosmos DB data-plane role assignment.
  Check that clients use Entra ID before enforcing in an existing environment.
fix: |-
  resource cosmos 'Microsoft.DocumentDB/databaseAccounts@2026-03-15' = {
    name: cosmosName
    location: location
    kind: 'GlobalDocumentDB'
    properties: {
      databaseAccountOfferType: 'Standard'
      locations: [ { locationName: location, failoverPriority: 0 } ]
      disableLocalAuth: true
    }
  }
sources:
- url: >-
    https://github.com/Azure/azure-rest-api-specs/blob/main/specification/cosmos-db/resource-manager/Microsoft.DocumentDB/DocumentDB/stable/2026-03-15/openapi.json
  lastVerified: '2026-10-04'
  verifiedVia: >-
    refs/rest-api-specs/specification/cosmos-db/resource-manager/Microsoft.DocumentDB/DocumentDB/stable/2026-03-15/openapi.json
  note: >-
    DatabaseAccountCreateUpdateProperties/GetProperties.disableLocalAuth: 'only MSI and AAD can be used exclusively for
    authentication'.
- url: >-
    https://github.com/Azure/azure-rest-api-specs/blob/main/specification/cognitiveservices/resource-manager/Microsoft.CognitiveServices/CognitiveServices/stable/2026-09-01/cognitiveservices.json
  lastVerified: '2026-10-04'
  verifiedVia: >-
    refs/rest-api-specs/specification/cognitiveservices/resource-manager/Microsoft.CognitiveServices/CognitiveServices/stable/2026-09-01/cognitiveservices.json
  note: >-
    CapabilityHostProperties.threadStorageConnections / vectorStoreConnections (description names CosmosDB) used for Foundry
    correlation.
- url: https://azure.github.io/PSRule.Rules.Azure/en/rules/Azure.Cosmos.NoSQLLocalAuth/
  lastVerified: '2026-10-04'
  verifiedVia: refs/psrule/docs/en/rules/Azure.Cosmos.NoSQLLocalAuth.md
  note: Overlap source (PSRule for Azure rule documentation).
- url: https://github.com/MicrosoftDocs/azure-ai-docs/blob/e8d0ac6f7ebd7fd000e287657ab9beda5bccc1fa/articles/foundry/agents/includes/concepts-capability-hosts-content.md
  lastVerified: '2026-10-05'
  verifiedVia: >-
    refs/azure-ai-docs @ e8d0ac6f7ebd7fd000e287657ab9beda5bccc1fa
    articles/foundry/agents/includes/concepts-capability-hosts-content.md (ms.date 08/21/2026), "Required connection
    properties"; foundry-samples @ d807d9a0b2e633040d896cd0ddd58c95e14ac6f1
    infrastructure-setup-bicep/41-standard-agent-setup/modules-standard/ai-project-identity.bicep and
    add-project-capability-host.bicep.
  note: >-
    Legacy (connection) flow, verified: a project or account capability host lists connection NAMES in
    threadStorageConnections (Cosmos DB), vectorStoreConnections (AI Search), storageConnections (Storage) and
    aiServicesConnections (Azure OpenAI). A connection ties to the Azure resource through
    properties.metadata.ResourceId (the full ARM ID, documented as required for Agent Service to resolve the
    resource); properties.target is the service endpoint URL, not the ID. Connection category strings differ between
    sources: CognitiveSearch, AzureStorageAccount, and for Cosmos DB the ARM spec enum has CosmosDb, Microsoft samples
    use CosmosDB (and once CosmosDb) and the Learn article writes AzureCosmosDb; the category is a free string
    (modelAsString), so compare it case-insensitively and prefer the resource type of metadata.ResourceId.
overlap:
  decision: adapt
  provisional: true
  coverage: partial
  rationale: >-
    PSRule Azure.Cosmos.NoSQLLocalAuth, Azure Policy 5450f5bd (audit/deny) and dc2d41d1 (modify) and Checkov CKV_AZURE_140
    test the same property. The Foundry value is cross-resource correlation: only Cosmos accounts that a Foundry capability
    host or connection actually uses are in scope, and the finding carries the referencing project. Plus per-profile severity.
    If that correlation is not implemented in a phase, downgrade to reuse of the PSRule mapping.
  research:
    psrule:
      state: searched-match
      matches:
      - Azure.Cosmos.NoSQLLocalAuth
    azurePolicy:
      state: searched-match
      matches:
      - 5450f5bd-9c72-4390-a9c4-a7aba4edfdd2
      - dc2d41d1-4ab1-4666-a3e1-3d51c43e0049
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: searched-match
      matches:
      - CKV_AZURE_140
implementation:
  owner: native
  package: internal/rules/sec
tests:
  positive:
  - Cosmos referenced by capability host with disableLocalAuth false or absent fails
  negative:
  - Cosmos referenced by capability host with disableLocalAuth true passes
  skipped:
  - not-NoSQL API account is out of scope
  - Cosmos account not referenced by any Foundry resource is skipped with reason out-of-scope
  - unresolved disableLocalAuth parameter is skipped
testability: Deterministic on ARM JSON; correlation requires capability host and connection resources in scope.
notes: >-
  PSRule limits the rule to the NoSQL API because enforcing RBAC-only is documented there as supported only for NoSQL;
  the API-kind detection (capabilities / kind) was not independently verified here. The waf basis was removed after
  the Phase 0 Azure black belt review because no WAF pillar tag or WARA recommendation is cited here; the WAF mapping
  is added in Phase 4 when the guidance is verified. Phase 1 fact check (2026-10-05): the Cosmos-to-Foundry tie is
  connection.properties.metadata.ResourceId or capabilitySettings.documentStore (preview). Documentation conflict: the
  capability settings article lists Azure Cosmos DB for NoSQL or Azure AI Search as vectorStore, while the
  2026-07-15-preview specification restricts vectorStore to Microsoft.Search/searchServices; the rule follows the
  specification for capabilitySettings and the connection ResourceId otherwise.

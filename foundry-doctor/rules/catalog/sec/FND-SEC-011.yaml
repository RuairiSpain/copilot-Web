id: FND-SEC-011
version: 2
group: SEC
title: Controlled outbound egress informational
description: 'Informational report on the outbound network posture of a Foundry deployment: the managed network child resource
  Microsoft.CognitiveServices/accounts/managedNetworks (properties.managedNetwork.isolationMode: Disabled | AllowInternetOutbound
  | AllowOnlyApprovedOutbound), account restrictOutboundNetworkAccess with allowedFqdnList, and azure.yaml network.isolationMode
  on the azure.ai.project service. It surfaces whether outbound egress is controlled; findings are Info only.'
status: verified
phases:
- '4'
inputs:
- bicep-arm
- azure.yaml
- control-plane
basis:
- security
category: nice-to-have
pillar: security
severity:
  dev: info
  test: info
  prod: info
compatibility:
  azd: '>=1.34.2'
  extensions:
    azure.ai.agents: ">=1.0.0-beta.18 <=1.0.0-beta.20"
  apiVersions:
    - { plane: management, provider: Microsoft.CognitiveServices, resourceType: accounts, version: "2026-09-01" }
  preview: true
  notes: >-
    azd: >=1.34.2, open-ended (ADR-029); verified through azd 1.36.0 (tag azure-dev-cli_1.36.0, acebba1e388b489a91ab8e2487a676359ab516a1, read by tag diff on 2026-10-16). The azure.yaml network.isolationMode leg is the only azd-dependent input; the ARM leg has no azd dependency. Extension ranges are exactly the versions whose schemas or source were
    read; widen them in Phase 1 by reading older tags. Microsoft.CognitiveServices/accounts 2026-09-01 / 2026-09-01:
    stable) -
    cognitiveservices/resource-manager/Microsoft.CognitiveServices/CognitiveServices/stable//cognitiveservices.json
    (AccountProperties.restrictOutboundNetworkAccess, allowedFqdnList, publicNetworkAccess, networkInjections; the managed network is the child resource accounts/managedNetworks (ManagedNetworkSettingsPropertiesBasicResource.properties.managedNetwork.isolationMode), not an account property. Window
    widened 2026-10-16: azd to 1.36.0 (tag azure-dev-cli_1.36.0, acebba1, released 2026-10-14); azure.ai.agents to
    1.0.0-beta.20. The azd and extension changelogs and the schema and source diffs from the previously verified
    versions were read; none touches this rule's verified facts for the widened fields (see docs/tool-compatibility.md
    section 6).
evidence:
  description: 'Compiled ARM or live account: the child resource Microsoft.CognitiveServices/accounts/managedNetworks (name
    default) properties.managedNetwork.isolationMode value (AllowOnlyApprovedOutbound is approved-only; Disabled and
    AllowInternetOutbound are findings); account properties.restrictOutboundNetworkAccess (boolean) with properties.allowedFqdnList
    (true with a non-empty list is shown as controlled; true with an empty list is an uncertain note because the effect is not
    documented); publicNetworkAccess (Enabled | Disabled) and networkInjections. A public account (publicNetworkAccess not
    Disabled, no networkInjections) with neither a managedNetworks isolationMode nor restrictOutboundNetworkAccess true is one
    Info finding per account; a private or network-injected account is an uncertain note instead, because outbound control
    then lives in the virtual network. An account-level managedNetworkSettings.isolationMode property does not exist in the
    2026-09-01 spec and is ignored. azure.yaml services of host azure.ai.project: network.isolationMode (docs: valid only when
    agentSubnet is omitted; AllowInternetOutbound or AllowOnlyApprovedOutbound) and network.agentSubnet. Findings are Info only.'
  confidence: likely
recommendation: If you need to control data exfiltration, set the managed network to AllowOnlyApprovedOutbound or
  restrict outbound access with an allowed FQDN list, and confirm required dependencies are reachable. Otherwise
  record the decision.
fix: "# azure.yaml (azure.ai.project service)\nnetwork:\n  peSubnet:\n    vnet: ${VNET_RESOURCE_ID}\n    name: private-endpoint-subnet\n\
  \  isolationMode: AllowOnlyApprovedOutbound"
sources:
- url: https://github.com/Azure/azure-rest-api-specs/blob/main/specification/cognitiveservices/resource-manager/Microsoft.CognitiveServices/CognitiveServices/stable/2026-09-01/cognitiveservices.json
  lastVerified: '2026-10-04'
  verifiedVia: >-
    https://github.com/Azure/azure-rest-api-specs/blob/main/specification/cognitiveservices/resource-manager/Microsoft.CognitiveServices/CognitiveServices/stable/2026-09-01/cognitiveservices.json
  note: >-
    AccountProperties.restrictOutboundNetworkAccess, allowedFqdnList; definitions IsolationMode and
    ManagedNetworkSettings. Branch URL, not commit-pinned.
- url: https://learn.microsoft.com/azure/foundry/agents/concepts/azure-yaml-reference
  lastVerified: '2026-10-04'
  verifiedVia: >-
    https://learn.microsoft.com/azure/foundry/agents/concepts/azure-yaml-reference; source file
    MicrosoftDocs/azure-ai-docs: articles/foundry/agents/concepts/azure-yaml-reference.md; retrieved
    2026-10-04
  note: '''network'' section: isolationMode values and peSubnet/agentSubnet.'
overlap:
  decision: native
  provisional: true
  coverage: none
  rationale: No PSRule, Checkov, Bicep linter or Defender rule evaluates Foundry account outbound restriction or
    managed-network isolation, and the reviewed Azure Policy built-ins mention outbound restriction only for SQL
    (SqlEnableOutboundNetworkingRestrictions). Correlating the azure.yaml network block with the ARM properties
    is Foundry-specific, hence native.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/sec
tests:
  positive:
  - public account without egress setting is one info finding
  - managed network AllowInternetOutbound is a finding
  - managed network Disabled is a finding
  - restrictOutboundNetworkAccess false on public account is a finding
  - unverified account-level managedNetworkSettings is ignored
  negative:
  - managed network AllowOnlyApprovedOutbound passes
  - restrictOutboundNetworkAccess with allowed list passes
  - private account without egress setting yields a note not a finding
  - network injection yields a note not a finding
  skipped:
  - no account is not applicable
  uncertain:
  - restrictOutboundNetworkAccess with empty list is a note
  - managed network expression is uncertain
  - expression publicNetworkAccess is uncertain
testability: Deterministic on azure.yaml and ARM JSON; always informational.
notes: Whether restrictOutboundNetworkAccess is honoured for Foundry accounts is not stated in the spec description
  (property has no description); treat as configuration evidence only.
  Version 2 (2026-10-19) - managedNetworkSettings.isolationMode on the account was UNVERIFIED and is not an account property in the
  2026-09-01 spec; the managed network is read from the accounts/managedNetworks child resource. A public account with no
  egress setting is one Info finding per account (version 1 emitted the same finding but read the unverified property).
id: FND-SEC-008
version: 3
group: SEC
title: Relevant Defender plans enabled
description: >-
  Microsoft Defender for Cloud plans that match the resource types in the Foundry solution should be on the Standard tier
  on the subscription: AI and Arm (when Foundry accounts exist), StorageAccounts, KeyVaults, CosmosDbs and AppServices (when
  a web app exists in the template). The set of relevant plans is derived from the resources found. Plans absent from the
  template are never passed: the rule skips with input-unavailable and names the missing capability (the live Defender state).
status: verified
phases:
- '2'
- '4'
inputs:
- control-plane
- bicep-arm
basis:
- security
category: nice-to-have
pillar: security
severity:
  dev: info
  test: warning
  prod: warning
compatibility:
  azd: ''
  extensions: {}
  apiVersions:
  - { plane: management, provider: Microsoft.Security, resourceType: pricings, version: '2026-07-01' }
  preview: false
  notes: >-
    No azd dependency: ARM control plane read Microsoft.Security/pricings 2026-07-01 / 2026-07-01: stable) - security/resource-manager/Microsoft.Security/Security/stable//pricings.json.
evidence:
  description: >-
    GET Microsoft.Security/pricings/{name} at subscription scope for each relevant name; pricingTier is not Standard (enum
    Free | Standard). Plan names: AI (from Azure Policy ASC_Azure_Defender_AI_* definitions), StorageAccounts, KeyVaults,
    CosmosDbs, Arm and AppServices (from the PSRule Azure.Defender.* rule conditions: where name equals StorageAccounts,
    KeyVaults, CosmosDbs, Arm, AppServices). The inherited flag from the same resource is included
    to show whether the setting comes from a parent scope. Needs Security Reader or equivalent. Bicep/ARM mode: a
    Microsoft.Security/pricings resource in the template with pricingTier Free (or any value but Standard) for a relevant plan
    is a finding; an expression tier or a conditional pricing resource is uncertain; a relevant plan with no pricings
    resource in the template is reported as "input-unavailable: subscription-scope Defender state not in template" naming the
    plans, with the missing capability "subscription-scope Microsoft.Security/pricings read (live Defender for Cloud check)",
    and is shown as a per-plan skip next to any finding. The rule passes only when every relevant plan is declared Standard.
  confidence: certain
recommendation: >-
  Enable the Defender plan for each resource type in use on the subscription (Standard tier), or confirm it is enforced
  at a parent scope. Enabling Defender plans has a cost; review pricing before enabling in non-production.
fix: |-
  resource defenderAi 'Microsoft.Security/pricings@2026-07-01' = {
    name: 'AI'
    properties: { pricingTier: 'Standard' }
  }
sources:
- url: >-
    https://github.com/Azure/azure-rest-api-specs/blob/main/specification/security/resource-manager/Microsoft.Security/Security/stable/2026-07-01/pricings.json
  lastVerified: '2026-10-04'
  verifiedVia: >-
    https://github.com/Azure/azure-rest-api-specs/blob/main/specification/security/resource-manager/Microsoft.Security/Security/stable/2026-07-01/pricings.json
  note: >-
    PricingProperties.pricingTier (Free|Standard), inherited, extensions (AIPromptEvidence 'Available for AI
    plan'). Branch URL, not commit-pinned.
- url: >-
    https://github.com/Azure/azure-policy/blob/master/built-in-policies/policyDefinitions/Security%20Center/ASC_Azure_Defender_AI_Full_Features_DINE.json
  lastVerified: '2026-10-04'
  verifiedVia: >-
    https://github.com/Azure/azure-policy/blob/master/built-in-policies/policyDefinitions/Security%20Center/ASC_Azure_Defender_AI_Full_Features_DINE.json
  note: Policy rule uses Microsoft.Security/pricings name AI. Branch URL, not commit-pinned.
- url: https://azure.github.io/PSRule.Rules.Azure/en/rules/Azure.Defender.Storage/
  lastVerified: '2026-10-04'
  verifiedVia: >-
    https://github.com/Azure/PSRule.Rules.Azure/blob/main/src/PSRule.Rules.Azure/rules/Azure.Defender.Rule.yaml
  note: >-
    Plan names StorageAccounts, KeyVaults, CosmosDbs, Arm (Azure.Defender.Arm) and AppServices
    (Azure.Defender.AppServices); read again 2026-10-19. Branch URL, not commit-pinned.
overlap:
  decision: adapt
  provisional: true
  coverage: partial
  rationale: >-
    PSRule has Azure.Defender.Storage, KeyVault, CosmosDb, Api, Cspm, Arm and others (no AI plan rule in the reviewed clone);
    Azure Policy has audit definitions for AI (c2c0c6d8), Key Vault (0e6763cc), Storage (640d2586) and Cosmos DB (adbe85b5);
    Checkov has CKV_AZURE_84 and 87. Each is a fixed per-plan check. Foundry Doctor adds relevance: it derives which plans
    matter from the resource types present (cross-resource correlation) and flags the AI plan that PSRule lacks, with cost-aware
    info severity in dev.
  research:
    psrule:
      state: searched-match
      matches:
      - Azure.Defender.Storage
      - Azure.Defender.KeyVault
      - Azure.Defender.CosmosDb
    azurePolicy:
      state: searched-match
      matches:
      - c2c0c6d8-007b-4a48-8d9b-3539bddd8e87
      - 7e92882a-2f8a-4991-9bc4-d3147d40abb0
      - 0e6763cc-5078-4e64-889d-ff4d9a839047
      - 640d2586-54d2-465f-877f-9ffc1d2109f4
      - adbe85b5-83e6-4350-ab58-bf3a4f736e5e
    defender:
      state: searched-match
      matches:
      - Microsoft.Security/pricings (AI, StorageAccounts, KeyVaults, CosmosDbs)
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: searched-match
      matches:
      - CKV_AZURE_84
      - CKV_AZURE_87
implementation:
  owner: native
  package: internal/rules/sec
tests:
  positive:
  - Arm Free with an account fails
  - KeyVaults Free with a vault fails
  - AppServices relevant when a web app exists
  negative:
  - AI and Arm Standard with an account passes
  skipped:
  - absent pricing for a present resource type is input-unavailable
  - no pricings at all is input-unavailable
  - no relevant resources is not applicable
  - no Security Reader permission is skipped
  uncertain:
  - expression tier is uncertain
  - conditional pricing is uncertain
  - pricing inherited from a management group scope that cannot be read
testability: >-
  Deterministic given a pricings read; Skipped without control-plane access. Bicep mode can only inspect pricings resources
  declared in the template.
notes: >-
  Defender recommendation IDs (assessment keys) and Advisor IDs were not available in local clones and are left empty; this
  is listed as unverified. The waf basis was removed after the Phase 0 Azure black belt review because no WAF pillar tag
  or WARA recommendation is cited here; the WAF mapping is added in Phase 4 when the guidance is verified.
  Version 3 (2026-10-19): Arm and AppServices were added to the relevant plans (plan names verified from the PSRule
  conditions; the Microsoft.Security pricings spec does not enumerate plan names beyond a StorageAccounts example). Whether
  a web app in the template is a Foundry workload is not provable, so AppServices is relevant for any Microsoft.Web/sites.
  Absent plans were a generic unresolved skip in version 2; they now name the missing capability.
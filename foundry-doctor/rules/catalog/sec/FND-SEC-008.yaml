id: FND-SEC-008
version: 1
group: SEC
title: Relevant Defender plans enabled
description: 'Microsoft Defender for Cloud plans that match the resource types in the Foundry solution should be
  on the Standard tier on the subscription: AI (when Foundry accounts exist), StorageAccounts, KeyVaults and CosmosDbs.
  The set of relevant plans is derived from the resources found.'
status: verified
phases:
- '2'
- '4'
inputs:
- control-plane
- bicep-arm
basis:
- security
- waf
category: nice-to-have
pillar: security
severity:
  dev: info
  test: warning
  prod: warning
compatibility:
  azd: n/a (ARM control plane read)
  extensions: {}
  apiVersions:
  - Microsoft.Security/pricings 2026-07-01 (stable) - security/resource-manager/Microsoft.Security/Security/stable/2026-07-01/pricings.json
evidence:
  description: 'GET Microsoft.Security/pricings/{name} at subscription scope for each relevant name; pricingTier
    is not Standard (enum Free | Standard). Plan names: AI (from Azure Policy ASC_Azure_Defender_AI_* definitions),
    StorageAccounts, KeyVaults, CosmosDbs (from the PSRule Azure.Defender.* rule conditions). The inherited flag
    from the same resource is included to show whether the setting comes from a parent scope. Needs Security Reader
    or equivalent.'
  confidence: certain
recommendation: Enable the Defender plan for each resource type in use on the subscription (Standard tier), or confirm
  it is enforced at a parent scope. Enabling Defender plans has a cost; review pricing before enabling in non-production.
fix: "resource defenderAi 'Microsoft.Security/pricings@2026-07-01' = {\n  name: 'AI'\n  properties: { pricingTier:\
  \ 'Standard' }\n}"
sources:
- url: https://github.com/Azure/azure-rest-api-specs/blob/main/specification/security/resource-manager/Microsoft.Security/Security/stable/2026-07-01/pricings.json
  lastVerified: '2026-10-04'
  verifiedVia: refs/rest-api-specs/specification/security/resource-manager/Microsoft.Security/Security/stable/2026-07-01/pricings.json
  note: PricingProperties.pricingTier (Free|Standard), inherited, extensions (AIPromptEvidence 'Available for AI
    plan').
- url: https://github.com/Azure/azure-policy/blob/master/built-in-policies/policyDefinitions/Security%20Center/ASC_Azure_Defender_AI_Full_Features_DINE.json
  lastVerified: '2026-10-04'
  verifiedVia: refs/azure-policy/built-in-policies/policyDefinitions/Security Center/ASC_Azure_Defender_AI_Full_Features_DINE.json
  note: Policy rule uses Microsoft.Security/pricings name AI.
- url: https://azure.github.io/PSRule.Rules.Azure/en/rules/Azure.Defender.Storage/
  lastVerified: '2026-10-04'
  verifiedVia: refs/psrule/src/PSRule.Rules.Azure/rules/Azure.Defender.Rule.yaml
  note: Plan names StorageAccounts, KeyVaults, CosmosDbs.
overlap:
  decision: adapt
  coverage: partial
  rationale: 'PSRule has Azure.Defender.Storage, KeyVault, CosmosDb, Api, Cspm, Arm and others (no AI plan rule
    in the reviewed clone); Azure Policy has audit definitions for AI (c2c0c6d8), Key Vault (0e6763cc), Storage
    (640d2586) and Cosmos DB (adbe85b5); Checkov has CKV_AZURE_84 and 87. Each is a fixed per-plan check. Foundry
    Doctor adds relevance: it derives which plans matter from the resource types present (cross-resource correlation)
    and flags the AI plan that PSRule lacks, with cost-aware info severity in dev.'
  psrule:
  - Azure.Defender.Storage
  - Azure.Defender.KeyVault
  - Azure.Defender.CosmosDb
  azurePolicy:
  - c2c0c6d8-007b-4a48-8d9b-3539bddd8e87
  - 7e92882a-2f8a-4991-9bc4-d3147d40abb0
  - 0e6763cc-5078-4e64-889d-ff4d9a839047
  - 640d2586-54d2-465f-877f-9ffc1d2109f4
  - adbe85b5-83e6-4350-ab58-bf3a4f736e5e
  defender:
  - Microsoft.Security/pricings (AI, StorageAccounts, KeyVaults, CosmosDbs)
  advisor: []
  bicepLinter: []
  checkov:
  - CKV_AZURE_84
  - CKV_AZURE_87
implementation:
  owner: native
  package: internal/rules/sec
tests:
  positive:
  - AI plan Standard with a Foundry account present passes
  negative:
  - AI plan Free with a Foundry account present fails
  - KeyVaults plan Free with a vault present fails
  skipped:
  - no Security Reader permission is skipped
  - Bicep-only mode with no pricings resource is skipped (subscription state unknown)
  - 'uncertain: pricing inherited from a management group scope that cannot be read is uncertain'
testability: Deterministic given a pricings read; Skipped without control-plane access. Bicep mode can only inspect
  pricings resources declared in the template.
notes: Defender recommendation IDs (assessment keys) and Advisor IDs were not available in local clones and are
  left empty; this is listed as unverified.

id: FND-CFG-003
version: 5
group: CFG
title: "All inter-service references resolve"
description: >-
  Every typed cross-service reference in azure.yaml must resolve inside the same file: agent
  toolboxes entries must be
  azure.ai.toolbox services that are also listed in the agent uses; toolbox tools[].connection
  and prompt-agent connections entries must name azure.ai.connection services; a voice
  conversationEngine.name must be a hosted azure.ai.agent service in the same project;
  and memory-store chatModel and embeddingModel must name model deployments. Every uses entry on any
  service must name a service key or a top-level resources key of the same file (azure.yaml.json: "List of
  service names and resource names"); an entry that names neither is reported.
status: verified
phases: ["1"]
inputs: ["azure.yaml"]
basis: ["platform"]
category: must-have
pillar: reliability
severity:
  dev: error
  test: error
  prod: error
compatibility:
  azd: ">=1.34.2 <=1.36.0"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.18 <=1.0.0-beta.18"
    azure.ai.projects: ">=1.0.0-beta.13 <=1.0.0-beta.14"
  apiVersions: []
  preview: true
  notes: >-
    azd range: the minimum is the lowest requiredAzdVersion among the Foundry extensions read (agents beta.18,
    projects beta.13 need >=1.34.2); the maximum is azd 1.36.0 (tag azure-dev-cli_1.36.0, acebba1e388b489a91ab8e2487a676359ab516a1, released 2026-10-14; the first clone read at 1.36.0-beta.1 is earlier evidence). The earlier >=1.27.1 lower
    bound came from a changelog and was not verified. Extension ranges are exactly the versions whose schemas or
    source were read; widen them in Phase 1 by reading older tags. Window widened 2026-10-16: azd to 1.36.0 (tag
    azure-dev-cli_1.36.0, acebba1, released 2026-10-14); azure.ai.projects to 1.0.0-beta.14. The azd and extension
    changelogs and the schema and source diffs from the previously verified versions were read; none touches this
    rule's verified facts for the widened fields (see docs/tool-compatibility.md section 6). azure.ai.agents stays at
    beta.18: memory model keys became chatModel and embeddingModel in beta.19 and prompt-agent Connection references
    resolve by service key or effective resource name since beta.20.
evidence:
  description: >-
    Build typed edges from toolboxes, connections, toolbox tools[].connection and
    conversationEngine.name, then report each edge whose target is not a service key of the
    documented host kind. Check a uses entry only where the typed reference also requires that
    service to occur in uses. Memory-store model names are checked against
    azure.ai.project deployments names and are skipped when the project sets endpoint (existing
    project, deployments not enumerable offline). Every uses entry of every service is looked up in the
    service keys and the top-level resources keys; an unknown name is a finding (key uses-unknown:<name>).
    An entry containing ${...} is not judged. When resources is present but is not a mapping the names
    it holds cannot be enumerated and an unknown entry is an uncertain note instead of a finding.
  confidence: certain
recommendation: >-
  Make each referenced name match a service key defined under services, and add toolbox and
  connection services to the consuming agent uses list as well as its toolboxes or connections list.
fix: |
  # Partial fragment: category, target and authentication fields for the
  # connection, plus toolbox-specific required fields, depend on the selected
  # documented tool. Merge this graph into a schema-valid manifest.
  services:
    ai-project:
      host: azure.ai.project
    github-conn:
      host: azure.ai.connection
      uses: [ai-project]
    agent-tools:
      host: azure.ai.toolbox
      uses: [ai-project, github-conn]
      tools:
        - type: mcp
          connection: github-conn
    my-agent:
      host: azure.ai.agent
      project: src/my-agent
      uses: [ai-project, github-conn, agent-tools]
      kind: hosted
      toolboxes: [agent-tools]
sources:
  - url: https://learn.microsoft.com/azure/foundry/agents/how-to/author-azure-yaml
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://learn.microsoft.com/azure/foundry/agents/how-to/author-azure-yaml; source file
      MicrosoftDocs/azure-ai-docs: articles/foundry/agents/how-to/author-azure-yaml.md; retrieved 2026-10-04
    note: "Troubleshooting: every entry in uses must match a service name; toolbox must be in both uses and toolboxes."
  - url: https://learn.microsoft.com/azure/foundry/agents/concepts/azure-yaml-reference
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://learn.microsoft.com/azure/foundry/agents/concepts/azure-yaml-reference (ms.date 09/17/2026);
      source file MicrosoftDocs/azure-ai-docs: articles/foundry/agents/concepts/azure-yaml-reference.md;
      retrieved 2026-10-04
    note: Dependencies with uses, toolbox connection field, conversationEngine.name, memoryStores chatModel/embeddingModel.
  - url: https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://raw.githubusercontent.com/Azure/azure-dev/170ebb858071da353cc9bf8657a377bff268ba36/schemas/v1.0/azure.yaml.json
    note: Generic uses description - "service names and resource names"; top-level resources map.
  - url: https://raw.githubusercontent.com/Azure/azure-dev/main/cli/azd/extensions/azure.ai.agents/schemas/azure.ai.agent.json
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://raw.githubusercontent.com/Azure/azure-dev/a64ca8fe04d0bc1b0375c32fed1b76573e2a91ef/cli/azd/extensions/azure.ai.agents/schemas/azure.ai.agent.json
      (commit of the azure.ai.agents 1.0.0-beta.18 release tag)
    note: Schema evidence for the required project and agent fields used by the fix.
overlap:
  decision: native
  provisional: true
  coverage: partial
  rationale: >-
    azd and the agents extension fail at provision or deploy time on some unresolved dependencies
    (for example "toolbox service is not declared in <agent> uses" in the extension source), but
    only for the resource being deployed and only after authentication. Foundry Doctor checks
    the whole graph offline before any deploy and names the file and line. No external lower-level
    rule reads azure.yaml.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/cfg
testability: Fully offline from azure.yaml and $ref includes. Existing-project deployments are skipped, not passed.
tests:
  positive:
    - toolbox-in-toolboxes-but-not-in-uses
    - toolbox-tool-names-missing-connection
    - voice-conversation-engine-unknown-target
    - uses-unknown-service-name-is-a-finding
    - uses-unknown-on-non-agent-service
    - uses-unknown-reported-per-entry
  negative:
    - full-example-from-reference
    - uses-names-resources-entry
    - uses-known-service-passes
    - uses-absent-passes
  skipped:
    - uses-reference-is-not-judged
    - memory-model-with-existing-project-endpoint
    - service-defined-in-missing-ref-file
  uncertain:
    - uses-with-resources-not-a-mapping-is-uncertain
    - routine-agent-use-relationship-not-documented
    - memory-model-with-project-deployments-absent
notes: >-
  Routine relationships remain uncertain and do not produce violations. Defender and Advisor overlap is unresearched.
  Version 5: an unknown uses entry is a finding. Basis: the Foundry troubleshooting article states every uses
  entry must match a service name, and the generic schema adds only the top-level resources map as the other
  valid target, which the rule reads from the same file. Not covered, UNVERIFIED: whether a uses entry may point at
  a service of a kind that cannot be used (for example a service naming itself, or a routine); no vendored schema
  or source defines invalid kinds, so no kind check is made. Resource names that azd resolves from infrastructure
  rather than from the top-level resources map are not known to the rule.
  Version 4: uncertain notes are no longer dropped when the rule also has findings. They are returned as uncertain skips next to the findings (one per distinct note), and the rule-level skip is kept only when there are no findings.

id: FND-CFG-008
version: 1
group: CFG
title: "MCP tools use allow lists"
description: >-
  For the direct inline MCP tool shape whose property is literally allowed_tools, remote MCP tools
  should restrict the tools the agent can call rather than expose every tool of the server. Foundry
  documents the allow-list recommendation and the all-tools default for its MCP tool definition, but
  no reviewed source confirms that azure.yaml accepts or forwards this spelling.
status: product-opinion
phases: ["later"]
inputs: ["azure.yaml"]
basis: ["security", "opinion"]
category: nice-to-have
pillar: security
severity:
  dev: info
  test: warning
  prod: warning
compatibility:
  azd: ">=1.34.2 <=1.36.0-beta.1"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.18 <=1.0.0-beta.18"
    azure.ai.toolboxes: ">=1.0.0-beta.9 <=1.0.0-beta.9"
  apiVersions: []
  preview: true
  notes: "azd range: the minimum is the lowest requiredAzdVersion among the Foundry extensions read (agents beta.18, projects beta.13 need >=1.34.2); the maximum is the azd clone read (1.36.0-beta.1). The earlier >=1.27.1 lower bound came from a changelog and was not verified. Extension ranges are exactly the versions whose schemas or source were read; widen them in Phase 1 by reading older tags."
evidence:
  description: >-
    Inspect only a direct inline tools[] entry with type mcp and a literal allowed_tools key. Report
    an empty literal list as a product-opinion finding. If allowed_tools is absent, report Uncertain:
    the documented MCP default is all tools, but the reviewed material does not prove that this
    azure.yaml shape maps to that service property. Skip toolbox endpoint-reuse mode, non-MCP tool
    types, unreadable references, and any alias or differently spelled property; never infer an
    undocumented azure.yaml spelling.
  confidence: uncertain
recommendation: >-
  Where the selected azure.yaml extension version documents support for it, add allowed_tools with
  the exact tool names the agent needs. Tool names are case-sensitive and must match what the MCP
  server returns from tools/list. Otherwise configure the allow list through a documented supported
  surface and do not guess the manifest property name.
fix: |
  # Partial MCP tool fragment. Use only after the selected azure.yaml extension
  # version documents this property spelling.
  tools:
    - type: mcp
      connection: github-conn
      allowed_tools: [search_issues, get_issue]
sources:
  - url: https://learn.microsoft.com/azure/foundry/agents/how-to/tools/model-context-protocol
    lastVerified: "2026-10-04"
    verifiedVia: refs/azure-ai-docs/articles/foundry/agents/how-to/tools/model-context-protocol.md
    note: "Best practices: use an allow list of tools by using allowed_tools; default includes all tools of the MCP server."
  - url: https://learn.microsoft.com/azure/foundry/agents/how-to/tools/toolbox
    lastVerified: "2026-10-04"
    verifiedVia: refs/azure-ai-docs/articles/foundry/agents/how-to/tools/toolbox.md
    note: Troubleshooting row - allowed_tools filter, case-sensitive tool names.
overlap:
  decision: native
  provisional: true
  coverage: none
  rationale: >-
    No PSRule, Policy, Defender, Advisor, Bicep or Checkov rule models Foundry MCP tool configuration.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/cfg
testability: Offline from azure.yaml. Allow-list accuracy against the live server is not checked (that would be a data-plane check).
tests:
  positive:
    - direct-inline-mcp-tool-with-literal-empty-allowed-tools-reports-opinion-finding
  negative:
    - direct-inline-mcp-tool-with-nonempty-literal-allowed-tools-produces-no-finding
    - non-mcp-tool
  skipped:
    - toolbox-endpoint-reuse-mode
    - tool-defined-in-unreadable-ref-file
    - mcp-tool-uses-an-unproven-allow-list-property-spelling
  uncertain:
    - direct-inline-mcp-tool-omits-allowed-tools-because-azure-yaml-mapping-is-unverified
notes: >-
  The allowed_tools best practice and service default are documented, but their mapping to
  azure.yaml is not. additionalProperties does not prove service acceptance or forwarding. The rule
  is therefore product-opinion, restricted to the literal direct-inline shape, and omission is
  Uncertain rather than a violation. The exact extension package versions reviewed are recorded in
  compatibility; immutable repository revisions were unavailable.

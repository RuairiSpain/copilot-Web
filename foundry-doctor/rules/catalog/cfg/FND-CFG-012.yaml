id: FND-CFG-012
version: 4
group: CFG
title: "Azure region values are valid"
description: >-
  Azure region values supplied to the project (AZURE_LOCATION in the azd environment, location parameters in
  parameter files, and location fields in Bicep/ARM) must be valid Azure location names available to the
  subscription. azure.yaml itself has no location field; the location comes from the azd environment and
  infrastructure parameters.
status: product-opinion
phases: ["1"]
inputs: ["azd-env", "bicep-arm", "control-plane"]
basis: ["operations", "opinion"]
category: nice-to-have
pillar: reliability
severity:
  dev: warning
  test: error
  prod: error
compatibility:
  azd: ">=1.34.2 <=1.36.0"
  extensions: {}
  apiVersions:
    - { plane: management, provider: Microsoft.Resources, resourceType: subscriptions, version: "2022-12-01" }
  preview: true
  notes: >-
    azd range: the minimum is the lowest requiredAzdVersion among the Foundry extensions read (agents beta.18,
    projects beta.13 need >=1.34.2); the maximum is azd 1.36.0 (tag azure-dev-cli_1.36.0, acebba1e388b489a91ab8e2487a676359ab516a1, released 2026-10-14; the first clone read at 1.36.0-beta.1 is earlier evidence). The earlier >=1.27.1 lower
    bound came from a changelog and was not verified. Window widened 2026-10-16: azd to 1.36.0 (tag
    azure-dev-cli_1.36.0, acebba1, released 2026-10-14). The azd and extension changelogs and the schema and source
    diffs from the previously verified versions were read; none touches this rule's verified facts for the widened
    fields (see docs/tool-compatibility.md section 6).
evidence:
  description: >-
    Offline, check that the value is non-empty (an empty value is a finding) and report a value that is not a lower-case,
    space-free location name in the form azd stores (for example eastus2) as uncertain, never as an error and that it is consistent across AZURE_LOCATION and parameter files. When a
    control-plane capability is available, compare it to the Subscriptions_ListLocations result (API
    2022-12-01) for the subscription and report values not in the list. Without that capability the
    list membership check is skipped, never passed. Values with ${VAR} are not evaluated.
  confidence: likely
recommendation: >-
  Use a location name returned by az account list-locations for your subscription (the name field, such as
  eastus2), and set it with azd env set AZURE_LOCATION. Check model and resource availability for the region
  before provisioning.
fix: |
  azd env set AZURE_LOCATION eastus2
sources:
  - url: https://github.com/Azure/azure-rest-api-specs/blob/main/specification/resources/resource-manager/Microsoft.Resources/subscriptions/stable/2022-12-01/subscriptions.json
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://github.com/Azure/azure-rest-api-specs/blob/main/specification/resources/resource-manager/Microsoft.Resources/subscriptions/stable/2022-12-01/subscriptions.json
    note: >-
      Subscriptions_ListLocations - all locations available for resource providers; each provider may support
      a subset. Branch URL, not commit-pinned.
  - url: https://learn.microsoft.com/azure/developer/azure-developer-cli/manage-environment-variables
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://github.com/MicrosoftDocs/azure-dev-docs/blob/main/articles/azure-developer-cli/manage-environment-variables.md
    note: >-
      AZURE_LOCATION is the Azure region where resources are deployed, set during first provisioning. Branch
      URL, not commit-pinned.
overlap:
  decision: adapt
  provisional: true
  coverage: partial
  rationale: >-
    Azure Policy Allowed locations (e56962a6-4747-49cd-b67b-bf8b01975c4c) and PSRule Azure.Resource.AllowedRegions
    enforce an organisational allow list, and Azure.Template.ResourceLocation/UseLocationParameter check how a
    template sets location; none validates that a value is a real location for the subscription, nor reads
    AZURE_LOCATION from the azd environment. Foundry Doctor reuses the allow-list idea only as a
    separate organisational control and adds validity and cross-file consistency.
  research:
    psrule:
      state: searched-match
      matches:
      - 'Azure.Resource.AllowedRegions'
      - 'Azure.Template.ResourceLocation'
      - 'Azure.Template.UseLocationParameter'
    azurePolicy:
      state: searched-match
      matches:
      - 'e56962a6-4747-49cd-b67b-bf8b01975c4c'
      - 'e765b5de-1225-4ba3-bd56-1ac6695af988'
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: searched-match
      matches:
      - 'no-hardcoded-location'
      - 'explicit-values-for-loc-params'
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/cfg
testability: >-
  Format and consistency checks are offline. List membership needs a control-plane capability and is skipped without it.
tests:
  positive:
    - empty-azure-location
    - location-not-in-subscription-list
    - azure-location-differs-from-parameter-file
  negative:
    - lowercase-region-in-subscription-list
  skipped:
    - control-plane-unavailable
    - location-is-env-reference
    - location-with-space-and-capitals-is-uncertain
notes: >-
  Product opinion: no source read states that a malformed or unlisted location fails deployment, so no platform basis
  is claimed. Unverified: that the azd environment stores the short name form (the docs example shows eastus); the
  rule does not treat display names such as East US as an error and reports them as uncertain.
  Region availability of specific models or Foundry features is not covered and is not inferred.
  Severity: no source says that a display name such as East US, or a mixed-case value, is rejected, so the rule reports
  it as uncertain in every profile (never an error). Only an empty AZURE_LOCATION is a finding. Without a usable
  environment the rule skips with input-unavailable and a named reason (no-environment-selected, env-file-missing,
  default-environment-not-found).
  Version 3: a value built by variable expansion in the .env file (for example AZURE_LOCATION=${X}) is uncertain, not
  empty: the .env parser (godotenv grammar) expands an undefined variable to an empty string, so the parsed value does not
  show the intent.
  Version 4: uncertain notes are no longer dropped when the rule also has findings. They are returned as uncertain skips next to the findings (one per distinct note), and the rule-level skip is kept only when there are no findings. An AZURE_LOCATION value that contains ${ (for example a single-quoted literal in the .env file) is uncertain, not input-unavailable: the value is set but it is not judged. A named environment that does not exist skips with input-unavailable: environment-not-found: <name>.

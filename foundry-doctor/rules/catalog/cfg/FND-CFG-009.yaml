id: FND-CFG-009
version: 3
group: CFG
title: "Cron expressions are valid"
description: >-
  In the reviewed azure.ai.routines 1.0.0-beta.8 schema shape, a trigger whose type is recurring and
  whose schedule key is cron_expression must carry a valid 5-field cron expression with an interval
  of at least five minutes. Other type/key spellings and time_zone requirements conflict across the
  reviewed sources and are not treated as equivalent.
status: verified
phases: ["later"]
inputs: ["azure.yaml"]
basis: ["platform"]
category: must-have
pillar: reliability
severity:
  dev: error
  test: error
  prod: error
compatibility:
  azd: ">=1.34.2 <=1.36.0"
  extensions:
    azure.ai.routines: ">=1.0.0-beta.8 <=1.0.0-beta.8"
  apiVersions: []
  preview: true
  notes: >-
    azd range: the minimum is the lowest requiredAzdVersion among the Foundry extensions read (agents beta.18,
    projects beta.13 need >=1.34.2); the maximum is the azd clone read (1.36.0-beta.1). The earlier >=1.27.1 lower
    bound came from a changelog and was not verified. Extension ranges are exactly the versions whose schemas or
    source were read; widen them in Phase 1 by reading older tags. Window widened 2026-10-16: azd to 1.36.0 (tag
    azure-dev-cli_1.36.0, acebba1, released 2026-10-14). The azd and extension changelogs and the schema and source
    diffs from the previously verified versions were read; none touches this rule's verified facts for the widened
    fields (see docs/tool-compatibility.md section 6). azure.ai.routines stays at beta.8: beta.9 renamed
    cron_expression, time_zone and agent_name to camelCase and the schema now describes type schedule.
evidence:
  description: >-
    Only for a trigger with literal type recurring and literal cron_expression, check exactly five
    fields with documented numeric ranges and evaluate the next firings over a fixed week to report
    an interval below five minutes. A ${VAR} expression is skipped. A schedule trigger, a cron key,
    missing time_zone, or an otherwise unknown preview shape is Uncertain rather than silently
    normalized. If time_zone is present on the proven shape, validate it against the bundled,
    versioned IANA and Windows identifier data; unknown identifiers are Uncertain because the
    reviewed azure.yaml schema does not constrain that field.
  confidence: likely
recommendation: >-
  Use a standard five-field cron expression that fires no more often than every five minutes and set
  time_zone to a valid identifier.
fix: |
  # Partial routine fragment using the azure.ai.routines 1.0.0-beta.8 schema spelling.
  services:
    daily-summary:
      host: azure.ai.routine
      uses: [summarizer]
      triggers:
        weekday-morning:
          type: recurring
          cron_expression: "0 7 * * 1-5"
          time_zone: UTC
      action:
        type: invoke_agent_responses_api
        agent_name: summarizer
sources:
  - url: https://learn.microsoft.com/azure/foundry/agents/how-to/use-routines
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://learn.microsoft.com/azure/foundry/agents/how-to/use-routines; source file
      MicrosoftDocs/azure-ai-docs: articles/foundry/agents/how-to/use-routines.md; retrieved 2026-10-04
    note: "Schedule trigger: 5-field cron expression, minimum interval five minutes, time_zone IANA or Windows identifier."
  - url: https://raw.githubusercontent.com/Azure/azure-dev/main/cli/azd/extensions/azure.ai.routines/schemas/azure.ai.routine.json
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://raw.githubusercontent.com/Azure/azure-dev/a64ca8fe04d0bc1b0375c32fed1b76573e2a91ef/cli/azd/extensions/azure.ai.routines/schemas/azure.ai.routine.json
      (commit of the azure.ai.routines 1.0.0-beta.8 release tag)
    note: >-
      Versioned schema evidence: trigger key cron_expression and type recurring/timer; cron is a string with no format
      constraint.
  - url: https://raw.githubusercontent.com/Azure/azure-dev/azd-ext-azure-ai-routines_1.0.0-beta.10/cli/azd/extensions/azure.ai.routines/schemas/azure.ai.routine.json
    lastVerified: "2026-10-16"
    verifiedVia: >-
      https://raw.githubusercontent.com/Azure/azure-dev/azd-ext-azure-ai-routines_1.0.0-beta.10/cli/azd/extensions/azure.ai.routines/schemas/azure.ai.routine.json;
      https://raw.githubusercontent.com/Azure/azure-dev/main/cli/azd/extensions/azure.ai.routines/CHANGELOG.md (1.0.0-beta.9
      breaking change: camelCase authoring keys; snake_case rejected)
    note: >-
      Evidence for the unsupported spelling: the beta.10 schema has trigger type schedule with cronExpression and
      timeZone and rejects cron_expression and time_zone. The rule does not evaluate this spelling (uncertain).
overlap:
  decision: native
  provisional: true
  coverage: none
  rationale: >-
    The azd schemas only type cron as a string. No external tool validates Foundry routine schedules.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/cfg
testability: Fully offline; deterministic cron evaluation with a fixed reference date in tests.
tests:
  positive:
    - recurring-cron-expression-with-six-fields-reports-a-violation
    - recurring-cron-expression-every-minute-reports-a-violation
    - recurring-cron-expression-field-out-of-range-reports-a-violation
  negative:
    - recurring-weekday-morning-five-field-expression-produces-no-finding
    - recurring-every-five-minutes-produces-no-finding
  skipped:
    - cron-from-env-reference
    - trigger-type-other-than-recurring-or-the-disputed-schedule-shape
  uncertain:
    - trigger-type-schedule-with-cron-expression
    - recurring-trigger-with-cron-key
    - missing-time-zone-under-conflicting-documentation
    - time-zone-not-in-bundled-versioned-identifier-data
notes: >-
  Unverified, preview inconsistencies: the Learn trigger table uses type schedule and cron_expression, the azd manifest
  example on the same page uses key cron, the azd routine schema lists type recurring (and the CLI example uses
  --trigger recurring), and agents/schemas/Routine.json uses cron under type schedule. Learn marks time_zone required
  in the REST field table but the azd example says omit it to interpret cron in UTC. Which spellings azd accepts in
  azure.yaml is not confirmed; the rule enforces only recurring plus cron_expression and reports the
  other spellings and missing time_zone as Uncertain.
  Cron dialect details beyond five fields (names such as MON, the L and # extensions) are not documented and are not
  assumed; expressions using them are reported uncertain.
  A project with nothing the rule applies to skips with the not-applicable reason head, not input-unavailable.
  Version 3: uncertain notes are no longer dropped when the rule also has findings. They are returned as uncertain skips next to the findings (one per distinct note), and the rule-level skip is kept only when there are no findings. The rule reads only the azure.ai.routines beta.8 spelling (type recurring, cron_expression, time_zone) and keeps the beta.8 compatibility window. Routines beta.9 renamed authored keys to camelCase and rejects the snake_case spellings (CHANGELOG 1.0.0-beta.9); the beta.10 schema names trigger type schedule with cronExpression and timeZone and rejects cron_expression and time_zone (read 2026-10-16). No source states that the beta.8 cadence facts carry over, so a camelCase key, type schedule, any other trigger type, a trigger without a type and a recurring trigger without a cron_expression key are all reported as uncertain, never as not-applicable. not-applicable is used only when no azure.ai.routine service declares triggers.

id: FND-CFG-006
version: 3
group: CFG
title: "Every variable has an environment or infrastructure producer"
description: >-
  Every ${VAR} reference in azure.yaml (service env, connection target and credentials, project network
  fields, policies and similar) must have a producer: a value in the selected azd environment
  (.azure/<env>/.env), an azd-set standard variable (AZURE_ENV_NAME, AZURE_LOCATION, AZURE_SUBSCRIPTION_ID,
  AZURE_RESOURCE_GROUP, AZURE_TENANT_ID, AZURE_PRINCIPAL_ID, AZURE_PRINCIPAL_TYPE; names defined in azd's environment.go), a Bicep output that provisioning writes to the environment, a value written by a
  previous deploy (AGENT_<SERVICE>_NAME, _VERSION, _ENDPOINT), or an inline default (${VAR:-default}).
  ${{...}} Foundry server-side expressions and escaped $${VAR} forms are not azd variables.
status: verified
phases: ["1"]
inputs: ["azure.yaml", "azd-env", "bicep-arm"]
basis: ["operations"]
category: must-have
pillar: operations
severity:
  dev: warning
  test: error
  prod: error
compatibility:
  azd: ">=1.34.2 <=1.36.0"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.18 <=1.0.0-beta.18"
    azure.ai.projects: ">=1.0.0-beta.13 <=1.0.0-beta.13"
  apiVersions: []
  preview: true
  notes: >-
    azd range: the minimum is the lowest requiredAzdVersion among the Foundry extensions read (agents beta.18,
    projects beta.13 need >=1.34.2); the maximum is the azd clone read (1.36.0-beta.1). The earlier >=1.27.1 lower
    bound came from a changelog and was not verified. Extension ranges are exactly the versions whose schemas or
    source were read; widen them in Phase 1 by reading older tags. Window widened 2026-10-16: azd to 1.36.0 (tag
    azure-dev-cli_1.36.0, acebba1, released 2026-10-14). The azd and extension changelogs and the schema and source
    diffs from the previously verified versions were read; none touches this rule's verified facts for the widened
    fields (see docs/tool-compatibility.md section 6). Extension windows stay: agents beta.20 adds the
    AGENT_<NAME>_PROMPT_ENDPOINT_VERSION environment key.
evidence:
  description: >-
    Extract ${VAR} references (excluding ${{...}}, $${VAR} escapes and references with a :- default) and
    match each name against: keys in the selected environment .env, the azd standard variables, outputs of
    the compiled Bicep/ARM main template (an output that is not in the environment yet is uncertain because provisioning
    has not written it; without a compiled template, an unresolved name is uncertain, not an error; azd-defined names that
    only exist when the infrastructure provides them, such as AZURE_CONTAINER_REGISTRY_ENDPOINT, AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN,
    AZURE_APP_SERVICE_DASHBOARD_URI, AZURE_AKS_CLUSTER_NAME and AZD_PLATFORM_TYPE, are uncertain when absent), and AGENT_<SERVICE>_* names derived from declared agent services.
    A name with no producer is reported. When no environment is selected or provisioning has not run, outputs
    that would only exist after provision are reported as uncertain rather than failed. Values are never read
    into findings.
  confidence: likely
recommendation: >-
  Set the variable in the active azd environment (azd env set), emit it from a Bicep output, give it an inline
  default, or remove the reference. Do not declare FOUNDRY_ or AGENT_ prefixed names in the azure.yaml service env (FND-CFG-011).
fix: |
  # Produce the value
  #   azd env set MICROSOFT_FOUNDRY_MODEL_DEPLOYMENT_NAME gpt-5.4-mini
  services:
    ai-project:
      host: azure.ai.project
    my-agent:
      host: azure.ai.agent
      project: src/my-agent
      uses: [ai-project]
      kind: hosted
      env:
        MICROSOFT_FOUNDRY_MODEL_DEPLOYMENT_NAME: ${MICROSOFT_FOUNDRY_MODEL_DEPLOYMENT_NAME}
        LOG_LEVEL: ${LOG_LEVEL:-info}
sources:
  - url: https://learn.microsoft.com/azure/foundry/agents/concepts/azure-yaml-reference
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://learn.microsoft.com/azure/foundry/agents/concepts/azure-yaml-reference (ms.date 09/17/2026);
      source file MicrosoftDocs/azure-ai-docs: articles/foundry/agents/concepts/azure-yaml-reference.md;
      retrieved 2026-10-04
    note: Variable substitution table; env section; AGENT_<SERVICE>_* values written after deployment; reserved FOUNDRY_ and AGENT_ prefixes.
  - url: https://learn.microsoft.com/azure/foundry/agents/how-to/author-azure-yaml
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://learn.microsoft.com/azure/foundry/agents/how-to/author-azure-yaml; source file
      MicrosoftDocs/azure-ai-docs: articles/foundry/agents/how-to/author-azure-yaml.md; retrieved 2026-10-04
    note: "Troubleshooting: a ${VAR} value is empty at runtime when it is not set in the active azd environment."
  - url: https://learn.microsoft.com/azure/developer/azure-developer-cli/manage-environment-variables
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://github.com/MicrosoftDocs/azure-dev-docs/blob/main/articles/azure-developer-cli/manage-environment-variables.md
    note: Standard azd environment variables and when they are set. Branch URL, not commit-pinned.
  - url: https://raw.githubusercontent.com/Azure/azure-dev/main/cli/azd/extensions/azure.ai.agents/internal/synthesis/synthesizer.go
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://github.com/Azure/azure-dev/blob/main/cli/azd/extensions/azure.ai.agents/internal/synthesis/synthesizer.go
    note: >-
      resolveVars - unresolved reference is an error naming the variable; ${VAR:-default} supported (extension
      source, not Learn). Branch URL, not commit-pinned.
  - url: https://raw.githubusercontent.com/Azure/azure-dev/main/cli/azd/extensions/azure.ai.agents/schemas/azure.ai.agent.json
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://raw.githubusercontent.com/Azure/azure-dev/a64ca8fe04d0bc1b0375c32fed1b76573e2a91ef/cli/azd/extensions/azure.ai.agents/schemas/azure.ai.agent.json
      (commit of the azure.ai.agents 1.0.0-beta.18 release tag)
    note: Schema evidence for the required project and agent fields used by the fix.
  - url: https://raw.githubusercontent.com/Azure/azure-dev/main/cli/azd/pkg/environment/environment.go
    lastVerified: "2026-10-15"
    verifiedVia: raw.githubusercontent.com/Azure/azure-dev/main/cli/azd/pkg/environment/environment.go fetched 2026-10-15; immutable revision unavailable
    note: "Constants naming the azd-defined environment keys (AZURE_ENV_NAME, AZURE_LOCATION, AZURE_SUBSCRIPTION_ID, AZURE_PRINCIPAL_ID, AZURE_PRINCIPAL_TYPE, AZURE_TENANT_ID, AZURE_CONTAINER_REGISTRY_ENDPOINT, AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN, AZURE_APP_SERVICE_DASHBOARD_URI, AZURE_AKS_CLUSTER_NAME, AZURE_RESOURCE_GROUP, AZD_PLATFORM_TYPE). The source defines the names; it does not state which are always set."
overlap:
  decision: native
  provisional: true
  coverage: partial
  rationale: >-
    The extension fails at provision/deploy on some unresolved references and the docs describe empty values
    for others. Correlating each reference with the selected environment and compiled Bicep outputs before
    deploy is Foundry-specific; no PSRule, Policy, Defender, Advisor or Bicep linter rule reads azure.yaml.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/cfg
testability: >-
  Offline when an environment .env and the compiled Bicep are available; otherwise producer lookup for outputs
  is skipped with the reason, not passed.
tests:
  positive:
    - reference-missing-from-env-and-outputs-with-compiled-template
    - agent-endpoint-reference-for-undeclared-service
  negative:
    - reference-with-inline-default
    - reference-produced-by-bicep-output-and-present-in-env
    - azd-tenant-and-principal-variables
    - agent-prefixed-keys-in-env-not-reported
    - foundry-server-side-expression-untouched
    - escaped-dollar-reference
  skipped:
    - no-environment-selected
  uncertain:
    - bicep-not-compiled
    - output-not-yet-provisioned
    - infra-dependent-azd-variable-absent
notes: >-
  Unverified: that every Bicep output is written to the azd environment (the azd environments overview
  shows service outputs in .env but the provisioning-output rule was not read in the clones; azd core source
  is not present). The producer rule for outputs is therefore a "likely" signal. ${VAR:-default} is verified
  only from extension source, not from Learn. Normalisation of the service name in AGENT_<SERVICE>_* is described
  as "normalized" without a specification.
  Producers: AZURE_ENV_NAME, AZURE_SUBSCRIPTION_ID and AZURE_RESOURCE_GROUP count as azd-set. AZURE_LOCATION,
  AZURE_TENANT_ID, AZURE_PRINCIPAL_ID and AZURE_PRINCIPAL_TYPE are azd-defined names the source does not say are always
  set, so a missing one is uncertain. AGENT_<SERVICE>_{NAME,VERSION,ENDPOINT,RESPONSES_ENDPOINT,INVOCATIONS_ENDPOINT,
  INVOCATIONS_WS_ENDPOINT} are producers for azure.ai.agent services only; any other AGENT_* name is uncertain. A key
  with an empty value is not a producer and is uncertain. Without a usable environment the rule skips with
  input-unavailable and a named reason: no-environment-selected, env-file-missing or default-environment-not-found.

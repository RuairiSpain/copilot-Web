id: FND-CFG-006
version: 1
group: CFG
title: "Every variable has an environment or infrastructure producer"
description: >-
  Every ${VAR} reference in azure.yaml (service env, connection target and credentials, project network fields,
  policies and similar) must have a producer: a value in the selected azd environment (.azure/<env>/.env), an azd-set
  standard variable (AZURE_ENV_NAME, AZURE_LOCATION, AZURE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP), a Bicep output that
  provisioning writes to the environment, a value written by a previous deploy (AGENT_<SERVICE>_NAME, _VERSION,
  _ENDPOINT), or an inline default (${VAR:-default}). ${{...}} Foundry server-side expressions, their core-escaped
  form $${{...}}, and escaped $${VAR} forms are not azd variables.
status: verified
phases: ["1"]
inputs: ["azure.yaml", "azd-env", "bicep-arm"]
basis: ["operations"]
category: must-have
pillar: operations
severity:
  dev: warning
  test: error
  prod: error
compatibility:
  azd: ">=1.34.2 <=1.36.0-beta.1"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.18 <=1.0.0-beta.18"
    azure.ai.projects: ">=1.0.0-beta.13 <=1.0.0-beta.13"
  apiVersions: []
  preview: true
  notes: "azd range: the minimum is the lowest requiredAzdVersion among the Foundry extensions read (agents beta.18, projects beta.13 need >=1.34.2); the maximum is the azd clone read (1.36.0-beta.1). The earlier >=1.27.1 lower bound came from a changelog and was not verified. Extension ranges are exactly the versions whose schemas or source were read; widen them in Phase 1 by reading older tags."
evidence:
  description: >-
    Extract ${VAR} references (excluding ${{...}} and its escaped form $${{...}}, $${VAR} escapes and references with
    a :- default; a bare $VAR is not a reference because only the braced form is expanded) and match each name
    against: keys in the selected environment .env, the azd standard variables, outputs of the compiled Bicep/ARM main
    template, and AGENT_<SERVICE>_* names derived from declared agent services. A name with no producer is reported.
    When no environment is selected or provisioning has not run, outputs that would only exist after provision are
    reported as uncertain rather than failed. Values are never read into findings.
  confidence: likely
recommendation: >-
  Set the variable in the active azd environment (azd env set), emit it from a Bicep output, give it an inline
  default, or remove the reference. Do not declare FOUNDRY_ or AGENT_ prefixed names in env.
fix: |
  # Produce the value
  #   azd env set MICROSOFT_FOUNDRY_MODEL_DEPLOYMENT_NAME gpt-5.4-mini
  services:
    my-agent:
      host: azure.ai.agent
      env:
        MICROSOFT_FOUNDRY_MODEL_DEPLOYMENT_NAME: ${MICROSOFT_FOUNDRY_MODEL_DEPLOYMENT_NAME}
        LOG_LEVEL: ${LOG_LEVEL:-info}
sources:
  - url: https://learn.microsoft.com/azure/foundry/agents/concepts/azure-yaml-reference
    lastVerified: "2026-10-04"
    verifiedVia: refs/azure-ai-docs/articles/foundry/agents/concepts/azure-yaml-reference.md
    note: Variable substitution table; env section; AGENT_<SERVICE>_* values written after deployment; reserved FOUNDRY_ and AGENT_ prefixes.
  - url: https://learn.microsoft.com/azure/foundry/agents/how-to/author-azure-yaml
    lastVerified: "2026-10-04"
    verifiedVia: refs/azure-ai-docs/articles/foundry/agents/how-to/author-azure-yaml.md
    note: "Troubleshooting: a ${VAR} value is empty at runtime when it is not set in the active azd environment."
  - url: https://learn.microsoft.com/azure/developer/azure-developer-cli/manage-environment-variables
    lastVerified: "2026-10-04"
    verifiedVia: refs/azd-docs/articles/azure-developer-cli/manage-environment-variables.md
    note: Standard azd environment variables and when they are set.
  - url: https://raw.githubusercontent.com/Azure/azure-dev/main/cli/azd/extensions/azure.ai.agents/internal/synthesis/synthesizer.go
    lastVerified: "2026-10-04"
    verifiedVia: refs/azure-dev/cli/azd/extensions/azure.ai.agents/internal/synthesis/synthesizer.go
    note: resolveVars - unresolved reference is an error naming the variable; ${VAR:-default} supported (extension source, not Learn).
  - url: https://github.com/Azure/azure-dev/blob/azure-dev-cli_1.35.0/cli/azd/pkg/foundry/templating.go
    lastVerified: '2026-10-05'
    verifiedVia: >-
      Azure/azure-dev azure-dev-cli_1.35.0 (170ebb8) cli/azd/pkg/foundry/templating.go (ExpandEnv; unchanged on main
      afe4b2b); cli/azd/pkg/osutil/expandable_string.go (core ExpandableString.Envsubst uses github.com/drone/envsubst
      v1.0.3); drone/envsubst v1.0.3 eval_test.go (Go proxy zip, MIT) cases `$${var01}` -> `${var01}`.
    note: >-
      Verified syntax. azd core expands only ${VAR} and ${VAR:-default} with drone/envsubst; `$$` is the escape and
      yields a literal `$`, so `$${{x}}` becomes `${{x}}` after core expansion and `$${VAR}` becomes the literal
      `${VAR}`. The Foundry extensions use foundry.ExpandEnv, which masks `${{...}}` spans before envsubst and
      restores them, so a bare `${{...}}` passes through untouched in Foundry fields. The generated example uses
      `$${{project.endpoint}}` in a service env value; the extension helper escapeFoundryTemplates writes `$${{...}}`
      for the same reason. A bare `$VAR` is not expanded.
  - url: https://github.com/Azure/azure-dev/blob/azure-dev-cli_1.35.0/cli/azd/extensions/azure.ai.agents/internal/synthesis/envrefs.go
    lastVerified: '2026-10-05'
    verifiedVia: >-
      Azure/azure-dev azure-dev-cli_1.35.0 and extension commit a64ca8f
      cli/azd/extensions/azure.ai.agents/internal/synthesis/envrefs.go (FindEnvReferences, unsupported-form error
      text).
    note: >-
      A reference nested inside a :- default is refused by the extension; references must match ${NAME} or
      ${NAME:-default} with NAME = [A-Za-z_][A-Za-z0-9_]*. A malformed `${...}` form is an error naming the supported
      forms.
  - url: https://github.com/Azure/azure-dev/blob/azure-dev-cli_1.35.0/cli/azd/pkg/infra/provisioning/manager.go
    lastVerified: '2026-10-05'
    verifiedVia: >-
      Azure/azure-dev azure-dev-cli_1.35.0 cli/azd/pkg/infra/provisioning/manager.go UpdateEnvironment (unchanged on
      main afe4b2b).
    note: >-
      Producer rule verified: after provisioning azd writes every deployment output into the environment with the
      output name as the key; array and object outputs are stored as JSON strings, other types with %v formatting.
  - url: https://github.com/Azure/azure-dev/blob/azure-dev-cli_1.35.0/cli/azd/pkg/environment/local_file_data_store.go
    lastVerified: '2026-10-05'
    verifiedVia: >-
      Azure/azure-dev azure-dev-cli_1.35.0 (170ebb8) cli/azd/pkg/environment/local_file_data_store.go (godotenv.Read
      of <env root>/.env, godotenv.Marshal on save), environment.go (marshallDotEnv, fixupUnquotedDotenv,
      AZURE_ENV_NAME and AZURE_RESOURCE_GROUP constants) and azdcontext/azdcontext.go (EnvironmentDirectoryName
      .azure, DotEnvFileName .env, ConfigFileName config.json, configFile.DefaultEnvironment); git diff to main
      afe4b2b is empty for pkg/environment. github.com/joho/godotenv v1.5.1 (Go proxy zip, tag commit 3fc4292, MIT)
      parser.go.
    note: >-
      Verified .env grammar (godotenv v1.5.1 as used by azd): KEY=VALUE or KEY: VALUE with an optional leading `export
      `; key characters letters, digits, `_` and `.` (anything else is a parse error); a line whose first non-space
      character is `#` is a comment; an unquoted value runs to end of line, is trimmed, and ends at a `#` that follows
      whitespace; single-quoted values are literal; double-quoted values may span lines, expand `\n` and `\r`,
      unescape other backslash pairs and expand $VAR and ${VAR} (uppercase names) from earlier keys of the same file
      (not the process environment); an unterminated quote is a parse error; a later duplicate key overwrites the
      earlier one; CRLF is normalised. azd writes every value double-quoted with escapes (numeric values unquoted,
      then re-quoted when a leading zero would be lost) and sorted by key. The default environment is the
      `defaultEnvironment` string in .azure/config.json (with `version` 1); each environment lives in
      .azure/<name>/.env and .azure/<name>/config.json.
overlap:
  decision: native
  coverage: partial
  rationale: >-
    The extension fails at provision/deploy on some unresolved references and the docs describe empty values
    for others. Correlating each reference with the selected environment and compiled Bicep outputs before
    deploy is Foundry-specific; no PSRule, Policy, Defender, Advisor or Bicep linter rule reads azure.yaml.
  psrule: []
  azurePolicy: []
  defender: []
  advisor: []
  bicepLinter: []
  checkov: []
implementation:
  owner: native
  package: internal/rules/cfg
testability: >-
  Offline when an environment .env and the compiled Bicep are available; otherwise producer lookup for outputs
  is skipped with the reason, not passed.
tests:
  positive:
    - reference-missing-from-env-and-outputs
    - env-declares-foundry-prefixed-variable
    - agent-endpoint-reference-for-undeclared-service
  negative:
    - reference-with-inline-default
    - reference-produced-by-bicep-output
    - foundry-server-side-expression-untouched
    - escaped-dollar-reference
  skipped:
    - no-environment-selected
    - bicep-not-compiled
notes: >-
  Phase 1 fact check (2026-10-05): every Bicep output is written to the azd environment by key (manager.go
  UpdateEnvironment), so a compiled-template output name is a valid producer; confidence stays likely because a
  provision that has not run yet leaves the value absent. ${VAR:-default} and the $$ escape are verified from
  drone/envsubst v1.0.3 and azd source (see sources), and ${{...}} / $${{...}} from foundry.ExpandEnv. Normalisation
  of the service name in AGENT_<SERVICE>_* is described as "normalized" without a specification. Phase 1 fact check
  (2026-10-05): the default environment is the defaultEnvironment value of .azure/config.json and .azure/<env>/.env is
  parsed with the grammar in the sources. Not verified: the precedence between the --environment flag, an
  AZURE_ENV_NAME process variable and the default (azd cmd/ source is not in the clone), so name the environment
  explicitly when several exist.

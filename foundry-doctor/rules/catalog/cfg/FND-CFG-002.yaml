id: FND-CFG-002
version: 1
group: CFG
title: "Unique service names by kind"
description: >-
  Within one azure.yaml, two azure.ai.agent services in the same project should not declare the
  same agent name unless creating a new version of that one logical agent is intentional. The
  Foundry reference documents only the agent consequence: reusing a name creates a new version.
  No overwrite/collision behaviour is asserted for connections, toolboxes, or routines.
status: verified
phases: ["1"]
inputs: ["azure.yaml"]
basis: ["operations"]
category: must-have
pillar: operations
severity:
  dev: warning
  test: error
  prod: error
compatibility:
  azd: ">=1.34.2 <=1.36.0-beta.1"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.18 <=1.0.0-beta.18"
    azure.ai.connections: ">=1.0.0-beta.9 <=1.0.0-beta.9"
    azure.ai.toolboxes: ">=1.0.0-beta.9 <=1.0.0-beta.9"
  apiVersions: []
  preview: true
  notes: "azd range: the minimum is the lowest requiredAzdVersion among the Foundry extensions read (agents beta.18, projects beta.13 need >=1.34.2); the maximum is the azd clone read (1.36.0-beta.1). The earlier >=1.27.1 lower bound came from a changelog and was not verified. Extension ranges are exactly the versions whose schemas or source were read; widen them in Phase 1 by reading older tags."
evidence:
  description: >-
    Group azure.ai.agent services by resolved project and the literal agent name field. Report a
    violation when two services have the same resolved project and name because deploying both
    creates versions of one agent rather than two distinct agents. If either project or name
    contains an unresolved expression, report uncertain; do not compare it textually. Other
    azure.ai.* service kinds are out of scope because their collision consequences were not
    documented in a primary source.
  confidence: likely
recommendation: >-
  Give separate logical agents distinct names. If the services intentionally represent versions
  of one agent, keep one service definition and deploy the intended version through that service.
fix: |
  services:
    ai-project:
      host: azure.ai.project
    triage:
      host: azure.ai.agent
      project: src/triage
      uses: [ai-project]
      kind: hosted
      name: triage-agent
    summarizer:
      host: azure.ai.agent
      project: src/summarizer
      uses: [ai-project]
      kind: hosted
      name: summarizer-agent
sources:
  - url: https://learn.microsoft.com/azure/foundry/agents/concepts/azure-yaml-reference
    lastVerified: "2026-10-04"
    verifiedVia: refs/azure-ai-docs/articles/foundry/agents/concepts/azure-yaml-reference.md (ms.date 09/17/2026)
    note: "Agent name: reusing a name creates a new version of the existing agent."
  - url: https://raw.githubusercontent.com/Azure/azure-dev/main/cli/azd/extensions/azure.ai.agents/schemas/azure.ai.agent.json
    lastVerified: "2026-10-04"
    verifiedVia: refs/azure-dev/cli/azd/extensions/azure.ai.agents/schemas/azure.ai.agent.json from azure.ai.agents 1.0.0-beta.18; immutable repository revision unavailable
    note: Schema evidence for required agent project and the host/kind/name fields used by the fix.
overlap:
  decision: native
  provisional: true
  coverage: none
  rationale: >-
    PSRule, Azure Policy and the Bicep linter do not read azure.yaml. This check models the
    documented agent-version behaviour. Defender and Advisor were not researched for this
    offline manifest concern; their empty arrays mean unresearched, not searched-no-match.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/cfg
testability: Fully offline from azure.yaml, including $ref file includes.
tests:
  positive:
    - two-agents-same-name-field
  negative:
    - distinct-agent-names
    - connection-and-agent-have-same-name-but-different-kinds
  skipped:
    - service-body-in-missing-ref-file
  uncertain:
    - name-is-unresolved-env-reference
    - project-reference-is-unresolved
notes: >-
  Product boundary: connection, toolbox and routine naming was removed because their collision
  consequences were inferred rather than documented. Overlap decision is provisional until the
  configured Defender and Advisor catalogues are searched.

id: FND-CFG-001
version: 5
group: CFG
title: Valid YAML, duplicate-key detection and compatible azure.ai.* schema
description: >-
  azure.yaml must parse as YAML with unique mapping keys and conform to the published azd schema (v1.0) for the azure.ai.*
  service hosts: azure.ai.project, azure.ai.agent, azure.ai.connection, azure.ai.toolbox, azure.ai.skill, azure.ai.routine
  (and azure.ai.eval). Constraints checked are those the schema states as required, const, enum, type or "not": top-level
  name (required, minimum length 2, pattern ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$), services (optional; at least one entry when present), host required on every service, project required on azure.ai.agent, prompt
  agents requiring model and instructions, azure.ai.project forbidding project/runtime/docker/image/config, and the unsupported
  voice authoring shapes (modelType hosted_agent, targetAgent). Unknown properties are not errors because the schema allows
  additional properties. requiredVersions.azd is parsed with the grammar of blang/semver/v4 ParseRange (operators < <= > >= = == ! !=,
  space-separated AND, || OR, lowercase x wildcards; comma, ~, ^, =>, =<, *, X, hyphen ranges, latest, the empty string and a
  leading or trailing || are not accepted): a value that is not a valid range is an error because azd fails to load the
  project, and so is a known azd version (flag, environment variable or probe) outside the range; a local dev build
  (0.0.0-dev.0) is exempt, as in azd, and an unknown azd version makes the result uncertain (azd-version-unknown).
  requiredVersions.extensions values are parsed with the grammar of Masterminds/semver/v3 NewConstraint (= != > < >= => <= =<
  ~ ~> ^, a bare version, space or comma as AND, || as OR, hyphen ranges, x X * wildcards, latest or empty for any). A
  value that is not valid is uncertain, never an error, because azd falls back to an exact tag match. A constraint that allows
  versions below the tested range, excludes the tested range, requires versions above it, or lacks a pre-release (so azd
  rejects the pre-release tested versions) makes the result uncertain or informational; it is never an error because the
  tested range is a verification window, not a platform requirement.
status: verified
phases:
- '1'
inputs:
- azure.yaml
basis:
- platform
category: must-have
pillar: operations
severity:
  dev: error
  test: error
  prod: error
compatibility:
  azd: '>=1.34.2 <=1.36.0-beta.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.18 <=1.0.0-beta.18'
    azure.ai.projects: '>=1.0.0-beta.13 <=1.0.0-beta.13'
  apiVersions: []
  preview: true
  notes: >-
    azd range: the minimum is the lowest requiredAzdVersion among the Foundry extensions read (agents beta.18, projects
    beta.13 need >=1.34.2); the maximum is the azd clone read (1.36.0-beta.1). The earlier >=1.27.1 lower bound came from
    a changelog and was not verified. Extension ranges are exactly the versions whose schemas or source were read; widen
    them in Phase 1 by reading older tags.
evidence:
  description: >-
    Parse azure.yaml with a YAML parser that surfaces duplicate keys (reports key and line of each duplicate), then validate
    the document against the vendored azd azure.yaml v1.0 JSON schema and the referenced azure.ai.* extension schemas vendored
    from a tagged release or commit (the upstream azure.yaml.json references the extension schemas at the main branch, which
    is unpinned). Each violation reports the JSON pointer, schema keyword and source line. No network access is needed once
    the schemas are vendored.
  confidence: likely
recommendation: >-
  Fix the YAML syntax or the reported schema violation. Add the yaml-language-server schema comment to azure.yaml so the
  editor flags the same errors, and install azure.ai.agents and azure.ai.projects at the versions declared in requiredVersions.
fix: |
  # yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
  name: my-agent-project
  services:
    ai-project:
      host: azure.ai.project
    my-agent:
      host: azure.ai.agent
      project: src/my-agent
      uses: [ai-project]
      kind: hosted
sources:
- url: https://learn.microsoft.com/azure/foundry/agents/concepts/azure-yaml-reference
  lastVerified: '2026-10-05'
  verifiedVia: refs/azure-ai-docs/articles/foundry/agents/concepts/azure-yaml-reference.md (ms.date 09/17/2026)
  note: Host list, extension compatibility, JSON schema validation section.
- url: https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
  lastVerified: '2026-10-04'
  verifiedVia: refs/azure-dev/schemas/v1.0/azure.yaml.json
  note: Per-host if/then constraints for azure.ai.agent, azure.ai.project and the other azure.ai.* hosts.
- url: >-
    https://raw.githubusercontent.com/Azure/azure-dev/main/cli/azd/extensions/azure.ai.agents/schemas/azure.ai.agent.json
  lastVerified: '2026-10-04'
  verifiedVia: refs/azure-dev/cli/azd/extensions/azure.ai.agents/schemas/azure.ai.agent.json
  note: Prompt-agent required fields, unsupported modelType hosted_agent and targetAgent.
- url: https://raw.githubusercontent.com/blang/semver/v4.0.0/v4/range.go
  lastVerified: '2026-10-16'
  verifiedVia: docs/spikes/azd-required-versions.md
  note: requiredVersions.azd range grammar (ParseRange), used by azd.
- url: https://raw.githubusercontent.com/Masterminds/semver/v3.4.0/constraints.go
  lastVerified: '2026-10-16'
  verifiedVia: docs/spikes/azd-required-versions.md
  note: requiredVersions.extensions constraint grammar (NewConstraint) and the pre-release rule.
- url: https://github.com/Azure/azure-dev/blob/1bd2ca4699c7b1f371db85dd867f18aa4fbc4730/cli/azd/pkg/project/project.go
  lastVerified: '2026-10-16'
  verifiedVia: docs/spikes/azd-required-versions.md (project.go:63-77)
  note: azd fails to load the project when the range is malformed or does not contain the azd version; skipped for a local dev build.
overlap:
  decision: adapt
  provisional: true
  coverage: partial
  rationale: >-
    azd publishes the JSON schema and editors validate against it, and the azd Foundry agents extension (azd ai agent doctor,
    check local.azure-yaml) only confirms azure.yaml is present and parseable. Foundry Doctor adds duplicate-key detection,
    offline validation of the nested azure.ai.* extension schemas in CI, and version-awareness against requiredVersions.
    The idea is taken from the schema; the evidence (pointer, keyword, line) is Foundry Doctor's own.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/cfg
testability: Fully offline. Golden fixtures for each schema constraint; schema files vendored per pinned extension version.
tests:
  positive:
  - duplicate-service-key
  - unknown-host-missing-host-field
  - agent-without-project
  - prompt-agent-missing-model-and-instructions
  - missing-or-invalid-name
  - empty-services-mapping
  - project-service-with-project-path
  - voice-modeltype-hosted-agent
  - requiredversions-azd-invalid-range
  - requiredversions-azd-out-of-range
  negative:
  - minimal-hosted-agent-project
  - full-example-from-reference
  - unknown-extra-property-allowed
  - services-absent
  - requiredversions-range-containing-tested-version
  - requiredversions-azd-in-range
  - requiredversions-azd-dev-build-exempt
  skipped:
  - schema-version-not-vendored-for-declared-extension
  - azure-yaml-uses-ref-file-missing
  uncertain:
  - required-version-floor-below-tested-range
  - required-version-ceiling-below-tested-range
  - required-version-constraint-unparseable
  - required-version-azd-version-unknown
  - required-version-extension-constraint-invalid-tag-fallback
notes: >-
  Unverified: how azd core handles duplicate YAML keys (azd core parser source is not in the local clone), so duplicate-key
  detection is a Foundry Doctor addition based on YAML mapping semantics, reported at the same severity. The azure.ai.*
  schemas are preview and change between extension betas (azure.ai.agents 1.0.0-beta.18, azure.ai.projects 1.0.0-beta.13
  in the clone).
  requiredVersions.extensions: comma- and space-separated constraints are accepted (Masterminds grammar). A floor above the
  highest tested version is reported as uncertain (not verified). A floor below the tested minimum is informational and
  does not make the rule inconclusive. Extension constraints are never decided offline: the installed extension versions
  live in azd's user config and registry and cannot be read, so only validity and the tested window are checked.
  Version 5: requiredVersions.azd is checked with the blang grammar (the previous parser accepted commas for both keys,
  which azd rejects for azd); extension constraints use the Masterminds grammar, including || and ^ and the rule that
  pre-release candidates are rejected unless the constraint has a pre-release. Finding keys: required-versions-azd-invalid,
  required-versions-azd-out-of-range. Not verified: azd and the libraries were not executed (comma rejection and the
  empty-string error are inferred from source), and range shapes the research note does not cover (an operator on a
  wildcard, a bare x, || without spaces) are reported as uncertain, not as errors. Older azd releases may use another range
  parser.
  Version 4: the Key of a duplicate-key finding includes the dotted path of the mapping, so a duplicate added under
  another mapping does not renumber existing ones. Multiple YAML documents: azd decodes only the first document
  (project.Parse calls yaml.Unmarshal from github.com/braydonk/yaml v0.9.0, whose unmarshal parses one document; source
  read 2026-10-16), so a second document is reported as an uncertain note, not as an input error. Unverified: whether
  azd warns about the ignored documents.

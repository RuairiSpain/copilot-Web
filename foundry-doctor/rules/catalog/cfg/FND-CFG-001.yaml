id: FND-CFG-001
version: 3
group: CFG
title: Valid YAML, duplicate-key detection and compatible azure.ai.* schema
description: >-
  azure.yaml must parse as YAML with unique mapping keys and conform to the published azd schema (v1.0) for the azure.ai.*
  service hosts: azure.ai.project, azure.ai.agent, azure.ai.connection, azure.ai.toolbox, azure.ai.skill, azure.ai.routine
  (and azure.ai.eval). Constraints checked are those the schema states as required, const, enum, type or "not": top-level
  name (required, minimum length 2, pattern ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$), services (optional; at least one entry when present), host required on every service, project required on azure.ai.agent, prompt
  agents requiring model and instructions, azure.ai.project forbidding project/runtime/docker/image/config, and the unsupported
  voice authoring shapes (modelType hosted_agent, targetAgent). Unknown properties are not errors because the schema allows
  additional properties. requiredVersions extension constraints are parsed (>=, >, <=, <, =, ~, a bare version, latest, and
  space-separated ranges as in the schema examples). A constraint that allows versions below the tested range, excludes the
  tested range, or cannot be parsed makes the result uncertain; it is never an error because the tested range is a
  verification window, not a platform requirement.
status: verified
phases:
- '1'
inputs:
- azure.yaml
basis:
- platform
category: must-have
pillar: operations
severity:
  dev: error
  test: error
  prod: error
compatibility:
  azd: '>=1.34.2 <=1.36.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.18 <=1.0.0-beta.18'
    azure.ai.projects: '>=1.0.0-beta.13 <=1.0.0-beta.14'
  apiVersions: []
  preview: true
  notes: >-
    azd range: the minimum is the lowest requiredAzdVersion among the Foundry extensions read (agents beta.18,
    projects beta.13 need >=1.34.2); the maximum is the azd clone read (1.36.0-beta.1). The earlier >=1.27.1 lower
    bound came from a changelog and was not verified. Extension ranges are exactly the versions whose schemas or
    source were read; widen them in Phase 1 by reading older tags. Window widened 2026-10-16: azd to 1.36.0 (tag
    azure-dev-cli_1.36.0, acebba1, released 2026-10-14); azure.ai.projects to 1.0.0-beta.14. The azd and extension
    changelogs and the schema and source diffs from the previously verified versions were read; none touches this
    rule's verified facts for the widened fields (see docs/tool-compatibility.md section 6). azure.ai.agents stays at
    beta.18: the agent schema changed (prompt-memory and GitHub Copilot toolset keys renamed to camelCase in beta.19,
    metadata.tags, selector patterns) and this rule validates against that schema.
evidence:
  description: >-
    Parse azure.yaml with a YAML parser that surfaces duplicate keys (reports key and line of each duplicate), then validate
    the document against the vendored azd azure.yaml v1.0 JSON schema and the referenced azure.ai.* extension schemas vendored
    from a tagged release or commit (the upstream azure.yaml.json references the extension schemas at the main branch, which
    is unpinned). Each violation reports the JSON pointer, schema keyword and source line. No network access is needed once
    the schemas are vendored.
  confidence: likely
recommendation: >-
  Fix the YAML syntax or the reported schema violation. Add the yaml-language-server schema comment to azure.yaml so the
  editor flags the same errors, and install azure.ai.agents and azure.ai.projects at the versions declared in requiredVersions.
fix: |
  # yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
  name: my-agent-project
  services:
    ai-project:
      host: azure.ai.project
    my-agent:
      host: azure.ai.agent
      project: src/my-agent
      uses: [ai-project]
      kind: hosted
sources:
- url: https://learn.microsoft.com/azure/foundry/agents/concepts/azure-yaml-reference
  lastVerified: '2026-10-05'
  verifiedVia: >-
    https://learn.microsoft.com/azure/foundry/agents/concepts/azure-yaml-reference (ms.date 09/17/2026);
    source file MicrosoftDocs/azure-ai-docs: articles/foundry/agents/concepts/azure-yaml-reference.md;
    retrieved 2026-10-05
  note: Host list, extension compatibility, JSON schema validation section.
- url: https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
  lastVerified: '2026-10-04'
  verifiedVia: >-
    https://raw.githubusercontent.com/Azure/azure-dev/170ebb858071da353cc9bf8657a377bff268ba36/schemas/v1.0/azure.yaml.json
  note: Per-host if/then constraints for azure.ai.agent, azure.ai.project and the other azure.ai.* hosts.
- url: >-
    https://raw.githubusercontent.com/Azure/azure-dev/main/cli/azd/extensions/azure.ai.agents/schemas/azure.ai.agent.json
  lastVerified: '2026-10-04'
  verifiedVia: >-
    https://raw.githubusercontent.com/Azure/azure-dev/a64ca8fe04d0bc1b0375c32fed1b76573e2a91ef/cli/azd/extensions/azure.ai.agents/schemas/azure.ai.agent.json
  note: Prompt-agent required fields, unsupported modelType hosted_agent and targetAgent.
overlap:
  decision: adapt
  provisional: true
  coverage: partial
  rationale: >-
    azd publishes the JSON schema and editors validate against it, and the azd Foundry agents extension (azd ai agent doctor,
    check local.azure-yaml) only confirms azure.yaml is present and parseable. Foundry Doctor adds duplicate-key detection,
    offline validation of the nested azure.ai.* extension schemas in CI, and version-awareness against requiredVersions.
    The idea is taken from the schema; the evidence (pointer, keyword, line) is Foundry Doctor's own.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/cfg
testability: Fully offline. Golden fixtures for each schema constraint; schema files vendored per pinned extension version.
tests:
  positive:
  - duplicate-service-key
  - unknown-host-missing-host-field
  - agent-without-project
  - prompt-agent-missing-model-and-instructions
  - missing-or-invalid-name
  - empty-services-mapping
  - project-service-with-project-path
  - voice-modeltype-hosted-agent
  negative:
  - minimal-hosted-agent-project
  - full-example-from-reference
  - unknown-extra-property-allowed
  - services-absent
  - requiredversions-range-containing-tested-version
  skipped:
  - schema-version-not-vendored-for-declared-extension
  - azure-yaml-uses-ref-file-missing
  uncertain:
  - required-version-floor-below-tested-range
  - required-version-ceiling-below-tested-range
  - required-version-constraint-unparseable
notes: >-
  Unverified: how azd core handles duplicate YAML keys (azd core parser source is not in the local clone), so duplicate-key
  detection is a Foundry Doctor addition based on YAML mapping semantics, reported at the same severity. The azure.ai.*
  schemas are preview and change between extension betas (azure.ai.agents 1.0.0-beta.18, azure.ai.projects 1.0.0-beta.13
  in the clone).
  requiredVersions.extensions: comma- and space-separated constraints are accepted. A floor above the highest tested
  version is reported as uncertain (not verified). A floor below the tested minimum is informational and does not make
  the rule inconclusive.

id: FND-CFG-001
version: 6
group: CFG
title: Valid YAML, duplicate-key detection and compatible azure.ai.* schema
description: >-
  azure.yaml must parse as YAML with unique mapping keys and conform to the published azd schema (v1.0) for the azure.ai.*
  service hosts: azure.ai.project, azure.ai.agent, azure.ai.connection, azure.ai.toolbox, azure.ai.skill, azure.ai.routine
  (and azure.ai.eval). Constraints checked are those the schema states as required, const, enum, type or "not": top-level
  name (required, minimum length 2, pattern ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$), services (optional; at least one entry when present), host required on every service, project required on azure.ai.agent, prompt
  agents requiring model and instructions, azure.ai.project forbidding project/runtime/docker/image/config, and the unsupported
  voice authoring shapes (modelType hosted_agent, targetAgent). Unknown properties are not errors because the schema allows
  additional properties. requiredVersions.azd is parsed with the grammar of blang/semver/v4 ParseRange (operators < <= > >= = == ! !=,
  space-separated AND, || OR, lowercase x wildcards; comma, ~, ^, =>, =<, X, latest, the empty string and a
  leading or trailing || are not accepted; one-character tokens, x outside the exact N.x and N.M.x forms and "!" followed by
  a space behave unexpectedly in the library and are reported as uncertain, not as errors): a value that is not a valid range is an error because azd fails to load the
  project, and so is a known azd version (flag, environment variable or probe) outside the range; a local dev build
  (0.0.0-dev.0) is exempt from the range comparison, as in azd, but not from range validity: azd parses the range
  (project.go:64) before it skips a dev build (:70), so an invalid range is reported for a dev build too. The exemption is
  unit-level only: outside the CFG-001 azd window the whole rule is skipped (unsupported-version). An unknown azd version makes
  the result uncertain (azd-version-unknown).
  requiredVersions.extensions values are parsed with the grammar of Masterminds/semver/v3 NewConstraint (= != > < >= => <= =<
  ~ ~> ^, a bare version, space or comma as AND, || as OR, hyphen ranges, x X * wildcards, latest or empty for any). A
  value that is not valid is uncertain, never an error, because azd falls back to an exact tag match. A constraint that allows
  versions below the tested range, excludes the tested range, requires versions above it, or lacks a pre-release (so azd
  rejects the pre-release tested versions) makes the result uncertain or informational; it is never an error because the
  tested range is a verification window, not a platform requirement.
status: verified
phases:
- '1'
inputs:
- azure.yaml
basis:
- platform
category: must-have
pillar: operations
severity:
  dev: error
  test: error
  prod: error
compatibility:
  azd: '>=1.34.2 <=1.36.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.18 <=1.0.0-beta.18'
    azure.ai.projects: '>=1.0.0-beta.13 <=1.0.0-beta.14'
  apiVersions: []
  preview: true
  notes: >-
    azd range: the minimum is the lowest requiredAzdVersion among the Foundry extensions read (agents beta.18,
    projects beta.13 need >=1.34.2); the maximum is azd 1.36.0 (tag azure-dev-cli_1.36.0; the first clone read was 1.36.0-beta.1). The earlier >=1.27.1 lower
    bound came from a changelog and was not verified. Extension ranges are exactly the versions whose schemas or
    source were read; widen them in Phase 1 by reading older tags. Window widened 2026-10-16: azd to 1.36.0 (tag
    azure-dev-cli_1.36.0, acebba1, released 2026-10-14); azure.ai.projects to 1.0.0-beta.14. The azd and extension
    changelogs and the schema and source diffs from the previously verified versions were read; none touches this
    rule's verified facts for the widened fields (see docs/tool-compatibility.md section 6). azure.ai.agents stays at
    beta.18: the agent schema changed (prompt-memory and GitHub Copilot toolset keys renamed to camelCase in beta.19,
    metadata.tags, selector patterns) and this rule validates against that schema.
evidence:
  description: >-
    Parse azure.yaml with a YAML parser that surfaces duplicate keys (reports key and line of each duplicate), then validate
    the document against the vendored azd azure.yaml v1.0 JSON schema and the referenced azure.ai.* extension schemas vendored
    from a tagged release or commit (the upstream azure.yaml.json references the extension schemas at the main branch, which
    is unpinned). Each violation reports the JSON pointer, schema keyword and source line. No network access is needed once
    the schemas are vendored.
  confidence: likely
recommendation: >-
  Fix the YAML syntax or the reported schema violation. Add the yaml-language-server schema comment to azure.yaml so the
  editor flags the same errors, and install azure.ai.agents and azure.ai.projects at the versions declared in requiredVersions.
fix: |
  # yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
  name: my-agent-project
  services:
    ai-project:
      host: azure.ai.project
    my-agent:
      host: azure.ai.agent
      project: src/my-agent
      uses: [ai-project]
      kind: hosted

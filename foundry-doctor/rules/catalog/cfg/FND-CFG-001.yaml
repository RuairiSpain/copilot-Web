id: FND-CFG-001
version: 1
group: CFG
title: Valid YAML, duplicate-key detection and compatible azure.ai.* schema
description: >-
  azure.yaml must parse as YAML with unique mapping keys and conform to the published azd schema (v1.0) for the azure.ai.*
  service hosts: azure.ai.project, azure.ai.agent, azure.ai.connection, azure.ai.toolbox, azure.ai.skill, azure.ai.routine
  (and azure.ai.eval). Constraints checked are those the schema states as required, const, enum, type or "not": top-level
  name pattern, services with at least one entry, host required on every service, project required on azure.ai.agent, prompt
  agents requiring model and instructions, azure.ai.project forbidding project/runtime/docker/image/config, and the unsupported
  voice authoring shapes (modelType hosted_agent, targetAgent). Unknown properties are not errors because the schema allows
  additional properties. Also reports when the declared requiredVersions are older than the extension versions the schema
  was verified against.
status: verified
phases:
- '1'
inputs:
- azure.yaml
basis:
- platform
category: must-have
pillar: operations
severity:
  dev: error
  test: error
  prod: error
compatibility:
  azd: '>=1.34.2 <=1.36.0-beta.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.18 <=1.0.0-beta.18'
    azure.ai.projects: '>=1.0.0-beta.13 <=1.0.0-beta.13'
  apiVersions: []
  preview: true
  notes: >-
    azd range: the minimum is the lowest requiredAzdVersion among the Foundry extensions read (agents beta.18, projects
    beta.13 need >=1.34.2); the maximum is the azd clone read (1.36.0-beta.1). The earlier >=1.27.1 lower bound came from
    a changelog and was not verified. Extension ranges are exactly the versions whose schemas or source were read; widen
    them in Phase 1 by reading older tags.
evidence:
  description: >-
    Parse azure.yaml with a YAML parser that surfaces duplicate keys (reports key and line of each duplicate), then
    validate the document against the vendored azd azure.yaml v1.0 JSON schema (azd tag azure-dev-cli_1.35.0, commit
    170ebb858071da353cc9bf8657a377bff268ba36) and the referenced azure.ai.* extension schemas vendored from the
    extension release commit a64ca8fe04d0bc1b0375c32fed1b76573e2a91ef (tags azd-ext-azure-ai-agents_1.0.0-beta.18,
    -connections_1.0.0-beta.9, -toolboxes_1.0.0-beta.9, -projects_1.0.0-beta.13). The upstream azure.yaml.json and its
    $id reference every extension schema at the unpinned raw.githubusercontent.com main URL, so the vendoring step
    must rewrite those $ref and $id values to the pinned local copies. Each violation reports the JSON pointer, schema
    keyword and source line. No network access is needed once the schemas are vendored.
  confidence: certain
recommendation: >-
  Fix the YAML syntax or the reported schema violation. Add the yaml-language-server schema comment to azure.yaml so the
  editor flags the same errors, and install azure.ai.agents and azure.ai.projects at the versions declared in requiredVersions.
fix: |
  # yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
  name: my-agent-project
  services:
    ai-project:
      host: azure.ai.project
    my-agent:
      host: azure.ai.agent
      project: src/my-agent
      uses: [ai-project]
      kind: hosted
sources:
- url: https://learn.microsoft.com/azure/foundry/agents/concepts/azure-yaml-reference
  lastVerified: '2026-10-04'
  verifiedVia: refs/azure-ai-docs/articles/foundry/agents/concepts/azure-yaml-reference.md (ms.date 09/17/2026)
  note: Host list, extension compatibility, JSON schema validation section.
- url: https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
  lastVerified: '2026-10-04'
  verifiedVia: refs/azure-dev/schemas/v1.0/azure.yaml.json
  note: Per-host if/then constraints for azure.ai.agent, azure.ai.project and the other azure.ai.* hosts.
- url: >-
    https://raw.githubusercontent.com/Azure/azure-dev/main/cli/azd/extensions/azure.ai.agents/schemas/azure.ai.agent.json
  lastVerified: '2026-10-04'
  verifiedVia: refs/azure-dev/cli/azd/extensions/azure.ai.agents/schemas/azure.ai.agent.json
  note: Prompt-agent required fields, unsupported modelType hosted_agent and targetAgent.
- url: https://github.com/Azure/azure-dev/blob/azure-dev-cli_1.35.0/schemas/v1.0/azure.yaml.json
  lastVerified: '2026-10-05'
  verifiedVia: >-
    Azure/azure-dev tag azure-dev-cli_1.35.0 = commit 170ebb858071da353cc9bf8657a377bff268ba36 (2026-09-30), read with
    git show in refs/azure-dev; git diff 170ebb8 afe4b2b (main, 2026-10-04) is empty for schemas/ and for the
    azure.ai.agents schemas. Licence: repository LICENSE is MIT, Copyright 2022 Microsoft Corporation; the schema
    files carry no per-file header.
  note: >-
    Release tag to vendor the root schema from. Hosts with a per-host $ref: azure.ai.agent, azure.ai.project,
    azure.ai.connection, azure.ai.toolbox, azure.ai.skill, azure.ai.routine, azure.ai.eval and microsoft.foundry; the
    `config` property is deprecated for azure.ai.agent. schemas/alpha/azure.yaml.json also exists and is not the v1.0
    contract.
- url: https://github.com/Azure/azure-dev/blob/a64ca8fe04d0bc1b0375c32fed1b76573e2a91ef/cli/azd/extensions/azure.ai.agents/schemas/azure.ai.agent.json
  lastVerified: '2026-10-05'
  verifiedVia: >-
    Azure/azure-dev commit a64ca8fe04d0bc1b0375c32fed1b76573e2a91ef (2026-09-30), the single commit carried by tags
    azd-ext-azure-ai-agents_1.0.0-beta.18, azd-ext-azure-ai-connections_1.0.0-beta.9,
    azd-ext-azure-ai-projects_1.0.0-beta.13 and azd-ext-azure-ai-toolboxes_1.0.0-beta.9 (git ls-remote --tags);
    azure.ai.skills and azure.ai.routines beta.8 tags point at the same commit.
  note: >-
    Extension schemas exist in the repo:
    cli/azd/extensions/azure.ai.agents/schemas/{azure.ai.agent,microsoft.foundry,Agent,Connection,Deployment,FileRef,Routine,Skill,Toolbox}.json,
    azure.ai.connections/schemas/azure.ai.connection.json, azure.ai.toolboxes/schemas/azure.ai.toolbox.json,
    azure.ai.projects/schemas/azure.ai.project.json, plus azure.ai.skills, azure.ai.routines and azure.ai.evaluations
    schemas. azure.ai.evaluations has no release at this commit (its only tag
    azd-ext-azure-ai-evaluations_1.0.0-beta.1 is commit c77aa335, 2026-09-18, and azure.ai.eval.json differs by 47
    lines), so vendor the file from a64ca8f and record that it is unreleased.
- url: https://github.com/Azure/azure-dev/blob/azure-dev-cli_1.35.0/cli/azd/pkg/project/project.go
  lastVerified: '2026-10-05'
  verifiedVia: >-
    Azure/azure-dev azure-dev-cli_1.35.0 cli/azd/pkg/project/project.go (Parse imports github.com/braydonk/yaml);
    github.com/braydonk/yaml v0.9.0 (Go proxy zip, commit d2c6b14, 2025-02-10) decode.go: newDecoder sets uniqueKeys
    true and reports `mapping key ... already defined at line N`.
  note: >-
    azd core already rejects duplicate mapping keys in azure.yaml at load, so duplicate-key detection is not only a
    Foundry Doctor addition; the error text and line come from the YAML library.
overlap:
  decision: adapt
  coverage: partial
  rationale: >-
    azd publishes the JSON schema and editors validate against it, and the azd Foundry agents extension (azd ai agent doctor,
    check local.azure-yaml) only confirms azure.yaml is present and parseable. Foundry Doctor adds duplicate-key detection,
    offline validation of the nested azure.ai.* extension schemas in CI, and version-awareness against requiredVersions.
    The idea is taken from the schema; the evidence (pointer, keyword, line) is Foundry Doctor's own.
  psrule: []
  azurePolicy: []
  defender: []
  advisor: []
  bicepLinter: []
  checkov: []
implementation:
  owner: native
  package: internal/rules/cfg
testability: Fully offline. Golden fixtures for each schema constraint; schema files vendored per pinned extension version.
tests:
  positive:
  - duplicate-service-key
  - unknown-host-missing-host-field
  - agent-without-project
  - prompt-agent-missing-model-and-instructions
  - project-service-with-project-path
  - voice-modeltype-hosted-agent
  negative:
  - minimal-hosted-agent-project
  - full-example-from-reference
  - unknown-extra-property-allowed
  skipped:
  - schema-version-not-vendored-for-declared-extension
  - azure-yaml-uses-ref-file-missing
notes: >-
  Phase 1 fact check (2026-10-05): azd core parses azure.yaml with github.com/braydonk/yaml v0.9.0, whose decoder
  enables unique-key checking, so a duplicate mapping key fails `azd` itself; Foundry Doctor reports it earlier and
  with the key and both lines. Vendoring: root schema from azure-dev-cli_1.35.0, extension schemas from commit a64ca8f
  (see sources); rewrite the main-branch $ref/$id URLs. The azure.ai.evaluations schema is not released at that
  commit. The azure.ai.* schemas are preview and change between extension betas (azure.ai.agents 1.0.0-beta.18,
  azure.ai.projects 1.0.0-beta.13 in the clone).

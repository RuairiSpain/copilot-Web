  note: azd fails to load the project when the range is malformed or does not contain the azd version; skipped for a local dev build.
overlap:
  decision: adapt
  provisional: true
  coverage: partial
  rationale: >-
    azd publishes the JSON schema and editors validate against it, and the azd Foundry agents extension (azd ai agent doctor,
    check local.azure-yaml) only confirms azure.yaml is present and parseable. Foundry Doctor adds duplicate-key detection,
    offline validation of the nested azure.ai.* extension schemas in CI, and version-awareness against requiredVersions.
    The idea is taken from the schema; the evidence (pointer, keyword, line) is Foundry Doctor's own.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/cfg
testability: Fully offline. Golden fixtures for each schema constraint; schema files vendored per pinned extension version.
tests:
  positive:
  - duplicate-service-key
  - unknown-host-missing-host-field
  - agent-without-project
  - prompt-agent-missing-model-and-instructions
  - missing-or-invalid-name
  - empty-services-mapping
  - project-service-with-project-path
  - voice-modeltype-hosted-agent
  - requiredversions-azd-invalid-range
  - requiredversions-azd-invalid-range-dev-build
  - finding-with-multi-document-note
  - requiredversions-azd-out-of-range
  negative:
  - minimal-hosted-agent-project
  - full-example-from-reference
  - unknown-extra-property-allowed
  - services-absent
  - requiredversions-range-containing-tested-version
  - requiredversions-azd-in-range
  - requiredversions-azd-dev-build-exempt
  skipped:
  - schema-version-not-vendored-for-declared-extension
  - azure-yaml-uses-ref-file-missing
  uncertain:
  - required-version-floor-below-tested-range
  - required-version-ceiling-below-tested-range
  - required-version-constraint-unparseable
  - required-version-azd-version-unknown
  - required-version-extension-constraint-invalid-tag-fallback
notes: >-
  Unverified: how azd core handles duplicate YAML keys (azd core parser source is not in the local clone), so duplicate-key
  detection is a Foundry Doctor addition based on YAML mapping semantics, reported at the same severity. The azure.ai.*
  schemas are preview and change between extension betas (azure.ai.agents 1.0.0-beta.18, azure.ai.projects 1.0.0-beta.13
  in the clone).
  requiredVersions.extensions: comma- and space-separated constraints are accepted (Masterminds grammar). A floor above the
  highest tested version is reported as uncertain (not verified). A floor below the tested minimum is informational and
  does not make the rule inconclusive. Extension constraints are never decided offline: the installed extension versions
  live in azd's user config and registry and cannot be read, so only validity and the tested window are checked.
  Version 5: requiredVersions.azd is checked with the blang grammar (the previous parser accepted commas for both keys,
  which azd rejects for azd); extension constraints use the Masterminds grammar, including || and ^ and the rule that
  pre-release candidates are rejected unless the constraint has a pre-release. Finding keys: required-versions-azd-invalid,
  required-versions-azd-out-of-range. Not verified: azd and the libraries were not executed (comma rejection and the
  empty-string error are inferred from source), and range shapes the research note does not cover (an operator on a
  wildcard, a bare x, || without spaces) are reported as uncertain, not as errors. Older azd releases may use another range
  parser.
  Version 4: the Key of a duplicate-key finding includes the dotted path of the mapping, so a duplicate added under
  another mapping does not renumber existing ones. Multiple YAML documents: azd decodes only the first document
  (project.Parse calls yaml.Unmarshal from github.com/braydonk/yaml v0.9.0, whose unmarshal parses one document; source
  read 2026-10-16), so a second document is reported as an uncertain note, not as an input error. Unverified: whether
  azd warns about the ignored documents.
  Version 6: uncertain notes are returned as uncertain skips next to findings, not dropped. The dev-build exemption is
  unit-level only (the rule is skipped outside the azd window) and covers the range comparison, not validity: azd runs
  ParseRange (project.go:64) before the IsDevVersion skip (:70), so an invalid range errors for a dev build and is reported.
  The two parsers are held to the real libraries (blang/semver/v4 v4.0.0 ParseRange, Masterminds/semver/v3 v3.4.0
  NewConstraint) by a differential test over a committed fixture generated from a one-off run of both; forms where the
  differential run disagreed (one-character tokens such as "*" and the hyphen of "1.0.0 - 2.0.0", which blang accepts;
  x outside N.x and N.M.x; "! " with a space; wildcard with pre-release; "<x", "^*"; "~0.0.0") are reported as uncertain. The
  required-versions-azd-* findings cite the azd project.go source (the Learn page documents the azure.yaml schema, not
  requiredVersions).

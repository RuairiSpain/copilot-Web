id: FND-CFG-005
version: 5
group: CFG
title: "No raw secrets in YAML/Bicep/environment blocks"
description: >-
  Secret values must not appear as literals in azure.yaml (azure.ai.connection credentials, service env
  maps, target URLs with embedded credentials or SAS tokens), in Bicep or ARM templates and parameter
  files (non-secure parameters, hard-coded defaults on secure parameters, secrets in outputs), or in
  azd environment .env files committed to source control. A value that is a ${VAR} or ${{...}} reference
  is not a raw secret.
status: verified
phases: ["1"]
inputs: ["azure.yaml", "bicep-arm", "azd-env"]
basis: ["security"]
category: must-have
pillar: security
severity:
  dev: warning
  test: error
  prod: error
compatibility:
  azd: ">=1.34.2 <=1.36.0"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.18 <=1.0.0-beta.20"
    azure.ai.connections: ">=1.0.0-beta.9 <=1.0.0-beta.10"
  apiVersions: []
  preview: true
  notes: >-
    azd range: the minimum is the lowest requiredAzdVersion among the Foundry extensions read (agents beta.18,
    projects beta.13 need >=1.34.2); the maximum is azd 1.36.0 (tag azure-dev-cli_1.36.0, acebba1e388b489a91ab8e2487a676359ab516a1, released 2026-10-14; the first clone read at 1.36.0-beta.1 is earlier evidence). The earlier >=1.27.1 lower
    bound came from a changelog and was not verified. Extension ranges are exactly the versions whose schemas or
    source were read; widen them in Phase 1 by reading older tags. Window widened 2026-10-16: azd to 1.36.0 (tag
    azure-dev-cli_1.36.0, acebba1, released 2026-10-14); azure.ai.agents to 1.0.0-beta.20; azure.ai.connections to
    1.0.0-beta.10. The azd and extension changelogs and the schema and source diffs from the previously verified
    versions were read; none touches this rule's verified facts for the widened fields (see docs/tool-compatibility.md
    section 6).
evidence:
  description: >-
    Structural check, not entropy only: for azure.ai.connection with authType in the secret-bearing set
    (ApiKey, CustomKeys, PAT, AccessKey, AccountKey, SAS, UsernamePassword, OAuth2 client secrets), every
    credentials value must be a ${VAR} or ${{...}} reference; env values whose key name matches secret naming
    (key, secret, token, password, pwd, connection string) must be references; target URLs must not contain
    userinfo or sig/sv/token query parameters; .env files must not be tracked by git. A literal that
    matches a known secret pattern raises confidence to certain; name-only matches (a secret-like name with a non-reference value and no secret-shaped literal) are uncertain, not
    findings. Names that describe a quantity, rotation or file (limit, count, rotation, size, file) are not treated as
    secret names. In ${VAR:-default} the default part is inspected like a literal; a value that mixes literal text with a
    reference is uncertain. A SAS query string is a credential only with sig; sv alone is a version selector.
    Bicep and ARM findings are mapped from the Bicep linter, PSRule and Checkov results rather than
    re-derived. Findings never include the value.
    Version 5 additions. (1) An env key whose last name token (or last two, as in API_KEY or CONNECTION_STRING) is
    PASSWORD, PASSWD, PWD, SECRET, TOKEN, APIKEY, ACCESSKEY, ACCOUNTKEY or SHAREDKEY, or KEY after API, ACCESS,
    ACCOUNT, SHARED, PRIMARY or SECONDARY, with a literal (or ${VAR:-literal} default) of at least eight characters
    that has no whitespace, is not a placeholder (changeme, your-, <...>, example, todo and similar), is not a URL
    without userinfo, and has a letter with a digit or three character classes, is a finding (key
    env-secret-name-literal:<KEY>) with confidence lowered to medium. Every other name-only match stays uncertain.
    (2) Literal string properties of compiled ARM resources (in.ARM) are scanned: a value with the shape of a
    credential, or a plausible literal under a property whose name ends in a credential word, is a finding (key
    arm-literal-credential:<type>/<name>:<property path>). Template expressions and ${...} values are skipped. (3) A
    credential-like value in the selected azd environment (EnvView) is an uncertain note naming only the key, because
    whether the .env file is tracked in source control is not known to the rule. (4) The URL-typed keys of FND-CFG-007
    are also checked for embedded credentials.
  confidence: likely
recommendation: >-
  Store the secret in the azd environment as a secret (azd env set-secret) or in Key Vault, and reference it
  with ${VAR} in azure.yaml. In Bicep, mark secret parameters @secure() with no default and never output them.
  Prefer Entra ID or managed identity authentication where the target supports it.
fix: |
  services:
    github-conn:
      host: azure.ai.connection
      uses: [ai-project]
      category: RemoteTool
      target: https://api.githubcopilot.com/mcp
      authType: CustomKeys
      credentials:
        Authorization: ${GITHUB_PAT}   # set with: azd env set-secret GITHUB_PAT
sources:
  - url: https://learn.microsoft.com/azure/foundry/agents/concepts/azure-yaml-reference
    lastVerified: "2026-10-05"
    verifiedVia: >-
      https://learn.microsoft.com/azure/foundry/agents/concepts/azure-yaml-reference; source file
      MicrosoftDocs/azure-ai-docs: articles/foundry/agents/concepts/azure-yaml-reference.md; retrieved
      2026-10-05
    note: "Connection changes apply during azd provision. Store credential values in your azd environment and reference them with ${VAR} instead of putting secrets in azure.yaml."
  - url: https://learn.microsoft.com/azure/developer/azure-developer-cli/manage-environment-variables
    lastVerified: "2026-10-05"
    verifiedVia: >-
      https://github.com/MicrosoftDocs/azure-dev-docs/blob/main/articles/azure-developer-cli/manage-environment-variables.md
    note: Never store secrets in an azd .env file. Branch URL, not commit-pinned.
  - url: https://learn.microsoft.com/azure/developer/azure-developer-cli/environment-secrets
    lastVerified: "2026-10-05"
    verifiedVia: >-
      https://github.com/MicrosoftDocs/azure-dev-docs/blob/main/articles/azure-developer-cli/environment-secrets.md
    note: azd env set-secret and Key Vault references. Branch URL, not commit-pinned.
  - url: https://learn.microsoft.com/azure/azure-resource-manager/bicep/linter-rule-secure-secrets-in-parameters
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://github.com/MicrosoftDocs/azure-docs/blob/main/articles/azure-resource-manager/bicep/linter-rule-secure-secrets-in-parameters.md
    note: Bicep linter rule code secure-secrets-in-params. Branch URL, not commit-pinned.
overlap:
  decision: adapt
  provisional: true
  coverage: partial
  rationale: >-
    Bicep/ARM secrets handling is covered by the Bicep linter (secure-secrets-in-params, secure-parameter-default,
    outputs-should-not-contain-secrets, use-secure-value-for-secure-inputs), PSRule for Azure
    (Azure.Deployment.SecureParameter, SecureValue, SecretLeak, OutputSecretValue) and Checkov CKV_AZURE_131;
    Foundry Doctor maps those results and does not re-implement them. None of them read azure.yaml, where
    azure.ai.connection credentials and service env live; that part is native Foundry-specific evidence.
  research:
    psrule:
      state: searched-match
      matches:
      - 'Azure.Deployment.SecureParameter'
      - 'Azure.Deployment.SecureValue'
      - 'Azure.Deployment.SecretLeak'
      - 'Azure.Deployment.OutputSecretValue'
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: searched-match
      matches:
      - 'secure-secrets-in-params'
      - 'secure-parameter-default'
      - 'outputs-should-not-contain-secrets'
      - 'use-secure-value-for-secure-inputs'
    checkov:
      state: searched-match
      matches:
      - 'CKV_AZURE_131'
      - 'CKV_SECRET_6'
implementation:
  owner: native
  package: internal/rules/cfg
testability: >-
  Offline for azure.yaml and .env tracking; Bicep and ARM findings require the Bicep CLI and external tools
  and are skipped (not passed) when those are absent.
tests:
  positive:
    - connection-credentials-literal-api-key
    - service-env-literal-secret-shaped-value
    - credentials-default-literal
    - target-url-with-sas-signature
    - target-url-with-userinfo
    - dotenv-tracked-in-git
    - password-name-with-strong-literal-is-finding
    - client-secret-with-literal-is-finding
    - api-key-pair-with-literal-is-finding
    - default-literal-is-finding
    - credential-shaped-literal
    - credential-named-property-literal
    - nested-array-literal
    - tokenUrl-with-userinfo
  negative:
    - credentials-use-env-reference
    - token-limit-and-key-rotation-names
    - sas-version-without-signature
    - foundry-server-side-expression-passthrough
    - managed-identity-connection-no-credentials
    - reference-passes
    - empty-passes
    - placeholder-is-not-a-finding
    - partition-key-is-not-credential-named
    - secret-name-suffix-is-not-credential-named
    - url-value-is-not-a-literal-secret
    - expression-is-not-literal
    - reference-is-not-literal
    - non-credential-property
    - key-vault-uri-is-not-credential
    - authorizationUrl-clean-passes
    - env-ordinary-values-pass
  skipped:
    - no-inputs-still-skips
    - unselected-environment-is-not-read
    - no-environment-provider-passes
    - bicep-cli-missing
    - checkov-not-configured
  uncertain:
    - env-secret-like-name-with-plain-value
    - credentials-mix-literal-and-reference
    - short-plain-word-stays-uncertain
    - long-lowercase-word-stays-uncertain
    - env-credential-shape-is-uncertain-not-finding
    - env-credential-name-literal-is-uncertain
notes: >-
  The Learn guidance conflicts in emphasis: the Foundry reference stores connection secrets in the azd
  environment via ${VAR} (azd env set), while the azd docs say never to keep secrets in a .env file and
  recommend azd env set-secret (Key Vault reference). The fix example follows the azd secret guidance.
  The "secret-bearing authType" set is derived from the authType enum in the connection schema; whether
  each type carries a secret in credentials is not documented and the set is a product decision.
  CKV_SECRET_6 is mentioned in the Checkov README only as an example of the secrets framework; its exact
  semantics were not verified.
  Secret-name exclusions (limit, count, size, file, rotation, tokens) match whole underscore-delimited tokens, never
  substrings, so STORAGE_ACCOUNT_KEY and PROFILE_PASSWORD are not excluded. A literal under a secret-looking name that
  has no credential shape is reported as uncertain (name only).
  Version 4: uncertain notes are no longer dropped when the rule also has findings. They are returned as uncertain skips next to the findings (one per distinct note), and the rule-level skip is kept only when there are no findings.
  Version 5: broadened as above. Not implemented, because the rule input does not carry them: Bicep and ARM
  parameter files (for example main.parameters.json), secure-typed template parameters and their defaults (the
  compiled model deliberately excludes secure defaults), and whether a .env file is tracked by git. Those parts of the
  description stay deferred. UNVERIFIED: that every Azure property whose name ends in a credential word is a
  credential; the property-name check therefore requires a plausible literal and is not applied to expressions.

id: FND-CFG-004
version: 3
group: CFG
title: "Prompt model or hosted source/image is valid"
description: >-
  A prompt agent (kind prompt) must carry a non-blank model (a model deployment name) and non-blank
  instructions, and that deployment name should be one the project declares. A hosted agent (kind
  hosted) must have an agent source (project path that exists, with a Dockerfile for container
  builds) or a prebuilt image, must not combine codeConfiguration with image-based container
  configuration, must give codeConfiguration both runtime and entryPoint, and must keep container
  resources (container.resources.cpu and container.resources.memory) inside the documented range (cpu 0.25 to 4.0
  cores, memory 0.5Gi to 8.0Gi; the schema allows cpu such as 500m and memory with Ki, Mi, Gi and decimal suffixes, which are normalised). Voice agents
  require a model unless they use conversationEngine.
status: verified
phases: ["1"]
inputs: ["azure.yaml"]
basis: ["platform"]
category: must-have
pillar: reliability
severity:
  dev: error
  test: error
  prod: error
compatibility:
  azd: ">=1.34.2 <=1.36.0"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.18 <=1.0.0-beta.20"
    azure.ai.projects: ">=1.0.0-beta.13 <=1.0.0-beta.14"
  apiVersions: []
  preview: true
  notes: >-
    azd range: the minimum is the lowest requiredAzdVersion among the Foundry extensions read (agents beta.18,
    projects beta.13 need >=1.34.2); the maximum is the azd clone read (1.36.0-beta.1). The earlier >=1.27.1 lower
    bound came from a changelog and was not verified. Extension ranges are exactly the versions whose schemas or
    source were read; widen them in Phase 1 by reading older tags. Window widened 2026-10-16: azd to 1.36.0 (tag
    azure-dev-cli_1.36.0, acebba1, released 2026-10-14); azure.ai.agents to 1.0.0-beta.20; azure.ai.projects to
    1.0.0-beta.14. The azd and extension changelogs and the schema and source diffs from the previously verified
    versions were read; none touches this rule's verified facts for the widened fields (see docs/tool-compatibility.md
    section 6).
evidence:
  description: >-
    For kind prompt: model and instructions are non-blank strings and model equals the name of a
    deployment in an azure.ai.project the agent uses (skipped when that project sets endpoint or
    the deployment comes from a $ref file that cannot be read). For kind hosted: project is present
    and the directory exists; when no image is set and codeConfiguration is absent, a Dockerfile exists
    under project; codeConfiguration and image are not both set; codeConfiguration has runtime and
    entryPoint; container.resources.cpu and container.resources.memory parse and fall within the documented bounds. When the project
    declares no deployments key, the model-to-deployment match is unknown and the result is uncertain. A hosted agent with no
    Dockerfile, image or codeConfiguration but with runtime, startupCommand or skill is accepted; with none of them the
    source is unclear and the result is uncertain.
  confidence: likely
recommendation: >-
  Set model to the name of a deployment declared on the project, provide instructions for prompt agents,
  and for hosted agents provide either source with a Dockerfile, a codeConfiguration, or a prebuilt image.
fix: |
  services:
    ai-project:
      host: azure.ai.project
      deployments:
        - name: gpt-5.4-mini
          model: {format: OpenAI, name: gpt-5.4-mini, version: "2026-03-17"}
          sku: {name: GlobalStandard, capacity: 10}
    helper:
      host: azure.ai.agent
      project: src/helper
      uses: [ai-project]
      kind: prompt
      name: helper
      model: gpt-5.4-mini
      instructions: Answer briefly.
sources:
  - url: https://learn.microsoft.com/azure/foundry/agents/concepts/azure-yaml-reference
    lastVerified: "2026-10-05"
    verifiedVia: >-
      https://learn.microsoft.com/azure/foundry/agents/concepts/azure-yaml-reference (ms.date 09/17/2026);
      source file MicrosoftDocs/azure-ai-docs: articles/foundry/agents/concepts/azure-yaml-reference.md;
      retrieved 2026-10-05
    note: Agent fields, container resource bounds, codeConfiguration vs image, voice model fields.
  - url: https://raw.githubusercontent.com/Azure/azure-dev/main/cli/azd/extensions/azure.ai.agents/schemas/azure.ai.agent.json
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://raw.githubusercontent.com/Azure/azure-dev/a64ca8fe04d0bc1b0375c32fed1b76573e2a91ef/cli/azd/extensions/azure.ai.agents/schemas/azure.ai.agent.json
      (commit of the azure.ai.agents 1.0.0-beta.18 release tag)
    note: "Versioned schema evidence: prompt agent requires project, model and instructions; CodeConfiguration requires runtime and entryPoint; registryConnectionId requires hosted and no codeConfiguration."
  - url: https://learn.microsoft.com/azure/foundry/agents/how-to/author-azure-yaml
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://learn.microsoft.com/azure/foundry/agents/how-to/author-azure-yaml; source file
      MicrosoftDocs/azure-ai-docs: articles/foundry/agents/how-to/author-azure-yaml.md; retrieved 2026-10-04
    note: Deploy modes (code vs container), prebuilt image.
  - url: https://raw.githubusercontent.com/Azure/azure-dev/main/cli/azd/extensions/azure.ai.agents/schemas/azure.ai.agent.json
    lastVerified: "2026-10-15"
    verifiedVia: raw.githubusercontent.com/Azure/azure-dev/main/cli/azd/extensions/azure.ai.agents/schemas/azure.ai.agent.json fetched 2026-10-15; immutable revision unavailable
    note: "ContainerSettings.resources (ResourceSettings): cpu pattern ^[0-9]+(\\.[0-9]+)?m?$ and memory pattern with Ki|Mi|Gi|Ti|Pi|Ei|k|M|G|T|P|E suffixes; startupCommand is a service property. Numeric bounds still come from the Learn reference above."
overlap:
  decision: native
  provisional: true
  coverage: none
  rationale: >-
    Correlating a prompt agent model to a deployment declared on its project and checking the hosted
    source/image combination is Foundry-specific and spans services. PSRule for Azure checks deployed
    resource properties, not azure.yaml; the JSON schema (FND-CFG-001) only covers per-field shape, not
    the model-to-deployment link or filesystem checks.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/cfg
testability: >-
  Offline against azure.yaml and the repository file tree. Existing-project and external-ref cases are skipped.
tests:
  positive:
    - prompt-agent-model-not-in-project-deployments
    - prompt-agent-blank-instructions
    - hosted-agent-project-dir-missing
    - hosted-agent-code-configuration-and-image
    - hosted-agent-cpu-above-4
    - container-resources-memory-above-8Gi
    - code-configuration-missing-entrypoint
  negative:
    - prompt-agent-model-matches-deployment
    - hosted-agent-prebuilt-image
    - hosted-agent-code-deploy
    - hosted-agent-runtime-and-startup-command
    - container-resources-512Mi-and-500m
  skipped:
    - project-uses-existing-endpoint
    - deployments-in-ref-file-unreadable
  uncertain:
    - project-declares-no-deployments
    - hosted-agent-no-dockerfile-image-or-runtime
notes: >-
  Unverified: whether project is still required when image is set. The v1.0 schema requires project for
  host azure.ai.agent, while the reference describes image as skipping the Dockerfile build; the rule follows
  the schema and flags it only when project is absent in both. The generic "project and image together are invalid"
  statement in the schema applies to host containerapp only and is not applied here. The image reference
  format is not documented beyond an example and is not validated (no tag-pinning claim is made).
  Quantity forms: only cpu as a plain decimal and memory with Ki, Mi, Gi or Ti suffixes are range-checked. The schema
  patterns also accept cpu with an m suffix, memory with decimal suffixes (k, M, G, T, P, E), Pi/Ei and bare numbers; how
  the service reads those is not verified, so they are reported as uncertain, never as out of range.

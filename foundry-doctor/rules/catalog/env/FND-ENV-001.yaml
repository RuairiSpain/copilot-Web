id: FND-ENV-001
version: 1
group: ENV
title: "Environments do not unintentionally share resource groups"
description: >-
  Two azd environments of the same project (for example dev and prod) should not resolve to the same resource
  group. azd documents one resource group per environment for isolation; azure.yaml resourceGroup overrides the
  name used for provisioning, and a value without an environment-specific component makes every environment
  target the same group, so tearing down or redeploying one environment affects the other.
status: verified
phases: ["1"]
inputs: ["azure.yaml", "azd-env"]
basis: ["operations"]
category: must-have
pillar: operations
severity:
  dev: info
  test: warning
  prod: error
compatibility:
  azd: ">=1.34.2 <=1.36.0-beta.1"
  extensions: {}
  apiVersions: []
  preview: true
  notes: "azd range: the minimum is the lowest requiredAzdVersion among the Foundry extensions read (agents beta.18, projects beta.13 need >=1.34.2); the maximum is the azd clone read (1.36.0-beta.1). The earlier >=1.27.1 lower bound came from a changelog and was not verified."
evidence:
  description: >-
    Collect AZURE_RESOURCE_GROUP (and AZURE_SUBSCRIPTION_ID) from every .azure/<env>/.env visible in the workspace,
    plus the azure.yaml top-level resourceGroup (and per-service resourceGroup) after substituting each environment's
    values. The effective group of an environment follows azd's order: service resourceGroup, then project
    resourceGroup (each used only when non-blank after substitution), then AZURE_RESOURCE_GROUP; both candidates are
    still compared because the provisioning scope reads AZURE_RESOURCE_GROUP. Report two environments whose
    subscription and resource group names are equal (case-insensitive), and report a resourceGroup literal that
    contains no variable reference when more than one environment exists. Environments that are not locally present
    are not guessed; the rule is skipped for them.
  confidence: likely
recommendation: >-
  Give each environment its own resource group, for example by including the environment name in the group name
  (resourceGroup: rg-${AZURE_ENV_NAME}), or record an explicit suppression with a reason and expiry when sharing is
  intentional.
fix: |
  name: my-agent-project
  resourceGroup: rg-${AZURE_ENV_NAME}
sources:
  - url: https://learn.microsoft.com/azure/developer/azure-developer-cli/environments-overview
    lastVerified: "2026-10-04"
    verifiedVia: refs/azd-docs/articles/azure-developer-cli/environments-overview.md
    note: Each environment has its own Azure resource group and configuration; .azure/<env>/.env stores AZURE_RESOURCE_GROUP.
  - url: https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
    lastVerified: "2026-10-04"
    verifiedVia: refs/azure-dev/schemas/v1.0/azure.yaml.json
    note: Top-level and service resourceGroup override; supports environment variable substitution.
  - url: https://learn.microsoft.com/azure/foundry/agents/concepts/azure-yaml-reference
    lastVerified: "2026-10-04"
    verifiedVia: refs/azure-ai-docs/articles/foundry/agents/concepts/azure-yaml-reference.md
    note: Tearing down an environment deletes the resource group when the current environment created the Foundry project.
  - url: https://github.com/Azure/azure-dev/blob/azure-dev-cli_1.35.0/cli/azd/pkg/environment/local_file_data_store.go
    lastVerified: '2026-10-05'
    verifiedVia: >-
      Azure/azure-dev azure-dev-cli_1.35.0 (170ebb8) cli/azd/pkg/environment/local_file_data_store.go (godotenv.Read
      of <env root>/.env, godotenv.Marshal on save), environment.go (marshallDotEnv, fixupUnquotedDotenv,
      AZURE_ENV_NAME and AZURE_RESOURCE_GROUP constants) and azdcontext/azdcontext.go (EnvironmentDirectoryName
      .azure, DotEnvFileName .env, ConfigFileName config.json, configFile.DefaultEnvironment); git diff to main
      afe4b2b is empty for pkg/environment. github.com/joho/godotenv v1.5.1 (Go proxy zip, tag commit 3fc4292, MIT)
      parser.go.
    note: >-
      Verified .env grammar (godotenv v1.5.1 as used by azd): KEY=VALUE or KEY: VALUE with an optional leading `export
      `; key characters letters, digits, `_` and `.` (anything else is a parse error); a line whose first non-space
      character is `#` is a comment; an unquoted value runs to end of line, is trimmed, and ends at a `#` that follows
      whitespace; single-quoted values are literal; double-quoted values may span lines, expand `\n` and `\r`,
      unescape other backslash pairs and expand $VAR and ${VAR} (uppercase names) from earlier keys of the same file
      (not the process environment); an unterminated quote is a parse error; a later duplicate key overwrites the
      earlier one; CRLF is normalised. azd writes every value double-quoted with escapes (numeric values unquoted,
      then re-quoted when a leading zero would be lost) and sorted by key. The default environment is the
      `defaultEnvironment` string in .azure/config.json (with `version` 1); each environment lives in
      .azure/<name>/.env and .azure/<name>/config.json.
  - url: https://github.com/Azure/azure-dev/blob/azure-dev-cli_1.35.0/cli/azd/pkg/project/resource_manager.go
    lastVerified: '2026-10-05'
    verifiedVia: >-
      Azure/azure-dev azure-dev-cli_1.35.0 (170ebb8) cli/azd/pkg/project/resource_manager.go GetResourceGroupName and
      GetTargetResource, service_manager.go (service then project template), project_config.go and service_config.go
      (`resourceGroup` fields are osutil.ExpandableString), infra/provisioning/bicep/bicep_provider.go
      (ensureResourceGroup, inferScopeFromEnv); unchanged on main afe4b2b (git diff empty).
    note: >-
      Verified precedence for resolving a service target group: service-level resourceGroup, then project-level
      resourceGroup, each after ${VAR} substitution and used only when non-blank; otherwise AZURE_RESOURCE_GROUP from
      the environment; otherwise discovery of a group tagged for the environment. So the azure.yaml value overrides
      the environment value, not the other way round. The Bicep provider reads AZURE_RESOURCE_GROUP only
      (ensureResourceGroup, inferScopeFromEnv); no use of the azure.yaml resourceGroup was found in the provisioning
      code read, although the schema text says it overrides the group used for infrastructure provisioning.
overlap:
  decision: native
  coverage: none
  rationale: >-
    Cross-environment comparison of azd environments is azd-specific. PSRule, Policy, Defender and Advisor evaluate one
    deployed resource or template at a time and have no concept of sibling azd environments.
  psrule: []
  azurePolicy: []
  defender: []
  advisor: []
  bicepLinter: []
  checkov: []
implementation:
  owner: native
  package: internal/rules/env
testability: >-
  Offline when the environments' .env files are present (they are normally git-ignored, so CI may see none; then skipped).
tests:
  positive:
    - dev-and-prod-same-resource-group
    - literal-resourcegroup-with-two-environments
  negative:
    - env-name-in-resourcegroup
    - distinct-subscriptions-same-group-name
  skipped:
    - single-environment-visible
    - env-files-not-in-workspace
notes: >-
  Intended sharing (for example a shared model-hosting group) is legitimate, hence the suppression path. Phase 1 fact
  check (2026-10-05): azd source shows the azure.yaml resourceGroup (service, then project) wins over
  AZURE_RESOURCE_GROUP when resolving a service target, and AZURE_RESOURCE_GROUP is the fallback; the Bicep
  provisioning scope reads AZURE_RESOURCE_GROUP. Both sources are therefore evaluated and the report states which one
  wins for service targets.

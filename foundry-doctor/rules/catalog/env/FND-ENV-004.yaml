id: FND-ENV-004
version: 4
group: ENV
title: "Informational difference summary"
description: >-
  Summarise how two or more azd environments of the project differ so that reviewers can see intended and accidental
  differences before promotion: keys present in only some environments, keys whose values differ, and which differing
  keys are environment-bound. Informational only; never fails a run.
status: product-opinion
phases: ["1"]
inputs: ["azd-env", "azure.yaml"]
basis: ["opinion"]
category: nice-to-have
pillar: operations
severity:
  dev: info
  test: info
  prod: info
compatibility:
  azd: ">=1.34.2 <=1.36.0"
  extensions: {}
  apiVersions: []
  preview: true
  notes: "azd range: the minimum is the lowest requiredAzdVersion among the Foundry extensions read (agents beta.18, projects beta.13 need >=1.34.2); the maximum is azd 1.36.0 (tag azure-dev-cli_1.36.0, acebba1e388b489a91ab8e2487a676359ab516a1, released 2026-10-14; the first clone read at 1.36.0-beta.1 is earlier evidence). The earlier >=1.27.1 lower bound came from a changelog and was not verified. Window widened 2026-10-16 (azd 1.36.0 = azure-dev-cli_1.36.0, acebba1e388b489a91ab8e2487a676359ab516a1, released 2026-10-14). Checked by git diff of the Azure/azure-dev tags azure-dev-cli_1.35.0 (170ebb858071da353cc9bf8657a377bff268ba36) and azure-dev-cli_1.36.0 (blobless clone https://github.com/Azure/azure-dev) over cli/azd/pkg/environment (azdcontext, local_file_data_store.go, environment.go), cli/azd/go.mod, cli/azd/pkg/project and cli/azd/pkg/infra/provisioning/bicep: unchanged are the godotenv version and .env read (godotenv.Read), the .azure/<env>/.env and .azure/config.json layout and constants, defaultEnvironment, the AZURE_* key constants, the environment name regexp ^[a-zA-Z0-9-\\(\\)_\\.]{1,64}$ and the resourceGroup resolution code. Tightened in 1.36.0 and recorded in docs/tool-compatibility.md section 6: dot-only names, trailing-dot names on Windows, symbolic-link state paths and an invalid defaultEnvironment now error. Example URL: https://github.com/Azure/azure-dev/compare/azure-dev-cli_1.35.0...azure-dev-cli_1.36.0"
evidence:
  description: >-
    Compute the key-level difference of two or more .azure/<env>/.env files. Output is at most one summary finding per
    pair of environments (key env-diff-summary:<a>,<b>, stable per pair): the number of keys only in each environment and
    of keys with different values, and the first 10 differing keys in name order, each with its kind (only in A, only in B,
    differs), followed by a count of the remaining keys. Values and value fingerprints are not printed, so a rotated
    value does not change the finding, and secret-bearing keys are shown by name only. Pairs with no difference give no
    finding. Environments that come from parameter files are not compared (their keys are parameter names, not .env
    keys). The rule stays info.
  confidence: certain
recommendation: >-
  Review the summary before promoting a release; use azd env get-values per environment for the details you are
  entitled to see.
fix: |
  foundry-doctor compare --env dev --env prod
sources:
  - url: https://learn.microsoft.com/azure/developer/azure-developer-cli/environments-overview
    lastVerified: "2026-10-05"
    verifiedVia: >-
      https://github.com/MicrosoftDocs/azure-dev-docs/blob/main/articles/azure-developer-cli/environments-overview.md
    note: Environment layout (.azure/<env>/.env) that the comparison reads. Branch URL, not commit-pinned.
  - url: https://github.com/Azure/azure-dev/blob/azure-dev-cli_1.35.0/cli/azd/pkg/environment/local_file_data_store.go
    lastVerified: '2026-10-05'
    verifiedVia: >-
      https://github.com/Azure/azure-dev/blob/azure-dev-cli_1.35.0/cli/azd/pkg/environment/local_file_data_store.go; Azure/azure-dev azure-dev-cli_1.35.0 (170ebb8) cli/azd/pkg/environment/local_file_data_store.go (godotenv.Read of <env root>/.env, godotenv.Marshal on save), environment.go (marshallDotEnv, fixupUnquotedDotenv, AZURE_ENV_NAME and AZURE_RESOURCE_GROUP constants) and azdcontext/azdcontext.go (EnvironmentDirectoryName .azure, DotEnvFileName .env, ConfigFileName config.json, configFile.DefaultEnvironment); git diff to main afe4b2b is empty for pkg/environment. github.com/joho/godotenv v1.5.1 (Go proxy zip, tag commit 3fc4292, MIT) parser.go.
    note: >-
      Verified .env grammar (godotenv v1.5.1 as used by azd): KEY=VALUE or KEY: VALUE with an optional leading `export
      `; key characters letters, digits, `_` and `.` (anything else is a parse error); a line whose first non-space
      character is `#` is a comment; an unquoted value runs to end of line, is trimmed, and ends at a `#` that follows
      whitespace; single-quoted values are literal; double-quoted values may span lines, expand `\n` and `\r`,
      unescape other backslash pairs and expand $VAR and ${VAR} (uppercase names) from earlier keys of the same file
      (not the process environment); an unterminated quote is a parse error; a later duplicate key overwrites the
      earlier one; CRLF is normalised. azd writes every value double-quoted with escapes (numeric values unquoted,
      then re-quoted when a leading zero would be lost) and sorted by key. The default environment is the
      `defaultEnvironment` string in .azure/config.json (with `version` 1); each environment lives in
      .azure/<name>/.env and .azure/<name>/config.json.
overlap:
  decision: native
  provisional: false
  coverage: none
  rationale: >-
    Environment comparison is the product's compare command; nothing in PSRule, Policy, Defender or Advisor does it.
  research:
    psrule:
      state: searched-none
    azurePolicy:
      state: searched-none
    defender:
      state: searched-none
    advisor:
      state: searched-none
    bicepLinter:
      state: searched-none
    checkov:
      state: searched-none
implementation:
  owner: native
  package: internal/rules/env
testability: Offline over local environment files; deterministic ordering and fingerprints keep golden output stable.
tests:
  positive:
    - key-only-in-one-environment
    - value-differs-between-environments
    - many-differences-give-one-summary-with-top-keys
    - three-environments-give-one-finding-per-pair
  negative:
    - identical-environments
    - rotated-value-keeps-the-same-key
  skipped:
    - single-environment-visible
    - env-file-missing-or-unparseable-uncertain
notes: >-
  Version 4 (2026-10-19): one summary finding per environment pair instead of one finding per differing key (the
  one-finding-per-key noise); the key is the pair, so the fingerprint is stable per pair and no longer changes with a
  rotated value. The top-N limit (10) is a product opinion.
  Product opinion; this rule emits a summary, not pass/fail findings. The "foundry-doctor compare" command name in the
  fix example is a placeholder for the product command and the public namespace is decided by ADR-003. Phase 1 fact
  check (2026-10-05): azd lists every subdirectory of .azure as an environment, sorted by name, whether or not it
  holds a .env file (LocalFileDataStore.List), and marks the one named by the defaultEnvironment value of
  .azure/config.json as default. Version 2 (2026-10-15): an environment whose .env is missing, unreadable, over-size,
  truncated or unparseable is named in an uncertain skip when no difference is found, so absent data never reads as
  "no differences"; project discovery reads defaultEnvironment (at most 100 environment directories) to select the
  environment for the FND-CFG rules. The compare view should mark the default environment but never treat it as the
  baseline.
  Version 3: uncertain notes (an unusable environment, an environment with a missing value) are returned as uncertain skips next to findings, not dropped. Findings carry a Key: the check kind, the variable name when there is one, and the sorted environment pair, never a value or a value fingerprint, so a rotated value does not resurface a baselined finding.

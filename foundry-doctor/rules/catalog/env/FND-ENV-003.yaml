id: FND-ENV-003
version: 5
group: ENV
title: "Prod does not reference non-prod resource IDs"
description: >-
  A production environment's configuration should not point at resources that belong to a non-production environment of
  the same project: resource IDs, endpoints or names that match another environment's resource group, project endpoint or
  provisioned resources (azure.ai.project endpoint, connection targets, ARM IDs in parameters).
status: product-opinion
phases: ["1"]
inputs: ["azd-env", "azure.yaml", "bicep-arm"]
basis: ["opinion"]
category: must-have
pillar: reliability
severity:
  dev: info
  test: warning
  prod: error
compatibility:
  azd: ">=1.34.2 <=1.36.0"
  extensions:
    azure.ai.projects: ">=1.0.0-beta.13 <=1.0.0-beta.14"
  apiVersions: []
  preview: true
  notes: >-
    azd range: the minimum is the lowest requiredAzdVersion among the Foundry extensions read (agents beta.18,
    projects beta.13 need >=1.34.2); the maximum is azd 1.36.0 (tag azure-dev-cli_1.36.0, acebba1e388b489a91ab8e2487a676359ab516a1, released 2026-10-14; the first clone read at 1.36.0-beta.1 is earlier evidence). The earlier >=1.27.1 lower
    bound came from a changelog and was not verified. Extension ranges are exactly the versions whose schemas or
    source were read; widen them in Phase 1 by reading older tags. Window widened 2026-10-16: azure.ai.projects to
    1.0.0-beta.14. The azd and extension changelogs and the schema and source diffs from the previously verified
    versions were read; none touches this rule's verified facts for the widened fields (see docs/tool-compatibility.md
    section 6). Window widened 2026-10-16 (azd 1.36.0 = azure-dev-cli_1.36.0, acebba1e388b489a91ab8e2487a676359ab516a1, released 2026-10-14). Checked by git diff of the Azure/azure-dev tags azure-dev-cli_1.35.0 (170ebb858071da353cc9bf8657a377bff268ba36) and azure-dev-cli_1.36.0 (blobless clone https://github.com/Azure/azure-dev) over cli/azd/pkg/environment (azdcontext, local_file_data_store.go, environment.go), cli/azd/go.mod, cli/azd/pkg/project and cli/azd/pkg/infra/provisioning/bicep: unchanged are the godotenv version and .env read (godotenv.Read), the .azure/<env>/.env and .azure/config.json layout and constants, defaultEnvironment, the AZURE_* key constants, the environment name regexp ^[a-zA-Z0-9-\(\)_\.]{1,64}$ and the resourceGroup resolution code. Tightened in 1.36.0 and recorded in docs/tool-compatibility.md section 6: dot-only names, trailing-dot names on Windows, symbolic-link state paths and an invalid defaultEnvironment now error. Example URL: https://github.com/Azure/azure-dev/compare/azure-dev-cli_1.35.0...azure-dev-cli_1.36.0
evidence:
  description: >-
    Take the environments marked prod. The tier of an environment is, in this order: its entry in the policy key
    environments.tiers (dev, test or prod), then the lists environments.production, environments.nonProduction and
    environments.development, then a derivation from the environment name (product opinion; azd treats the name as an
    opaque label). The derivation splits the lower-cased name at every character that is not a letter or digit and
    looks at each token: prod, production and prd are prod; dev, development, test, testing, stage, staging, uat and qa
    are non-prod; a prod token directly after pre or non (pre-prod, non-prod) is non-prod; a name with both kinds of
    token, or none, has no tier and is named in an uncertain skip. An explicit policy entry always wins over the
    derivation. When the derivation decided a tier and the rule reports a finding, the finding says so and an uncertain
    skip next to it lists the derived tiers and the policy key to override them with, so the classification is visible. Extract ARM resource IDs, endpoint host names and resource group names from its .env values, azure.yaml
    after substitution for that environment, and parameter files. Report any that reference the resource group, subscription
    and resource name, or endpoint host of an environment classified as non-prod. Environments that come from
    environment-named parameter files (infra/main.parameters.<env>.json, infra/main.<env>.parameters.json) take part
    only as notes: azd reads only main.parameters.json and main.bicepparam, so a file-name-to-environment mapping is an
    inference (UNVERIFIED) and a shared identifier found through it is an uncertain skip naming the parameter, never a
    finding. A main.<env>.bicepparam file is named in an uncertain skip and is not read (no Bicep parser). Matching is exact on normalised IDs;
    no naming heuristics are applied to matching (the name derivation above only decides tiers). Values under secret-looking key names (for example AZURE_KEYVAULT_ID) are digested
    before the rule runs; the value shape (resource ID or bare endpoint URL) is classified first and carried next to the
    digest, so a shared Key Vault resource ID is reported whatever the key is called. Actual secret shapes stay
    digested and never appear in evidence. With fewer than two environments the rule is not applicable.
  confidence: certain
recommendation: >-
  Point the production environment at production resources, or provision the dependency in production. Re-run provisioning
  for the production environment so its outputs are written to its own .env.
fix: |
  # .azure/prod/.env
  AZURE_AI_PROJECT_ENDPOINT=https://prod-account.services.ai.azure.com/api/projects/prod-project
sources:
  - url: https://learn.microsoft.com/azure/developer/azure-developer-cli/environments-overview
    lastVerified: "2026-10-05"
    verifiedVia: >-
      https://github.com/MicrosoftDocs/azure-dev-docs/blob/main/articles/azure-developer-cli/environments-overview.md
    note: >-
      Environments are isolated configurations for development, testing and production (context only). Branch
      URL, not commit-pinned.
  - url: https://raw.githubusercontent.com/Azure/azure-dev/main/cli/azd/extensions/azure.ai.projects/schemas/azure.ai.project.json
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://github.com/Azure/azure-dev/blob/main/cli/azd/extensions/azure.ai.projects/schemas/azure.ai.project.json
    note: >-
      azure.ai.project endpoint connects to an existing project; may contain ${VAR}. Branch URL, not
      commit-pinned.
  - url: https://github.com/Azure/azure-dev/blob/azure-dev-cli_1.35.0/cli/azd/pkg/environment/local_file_data_store.go
    lastVerified: '2026-10-05'
    verifiedVia: >-
      https://github.com/Azure/azure-dev/blob/azure-dev-cli_1.35.0/cli/azd/pkg/environment/local_file_data_store.go; Azure/azure-dev azure-dev-cli_1.35.0 (170ebb8) cli/azd/pkg/environment/local_file_data_store.go (godotenv.Read of <env root>/.env, godotenv.Marshal on save), environment.go (marshallDotEnv, fixupUnquotedDotenv, AZURE_ENV_NAME and AZURE_RESOURCE_GROUP constants) and azdcontext/azdcontext.go (EnvironmentDirectoryName .azure, DotEnvFileName .env, ConfigFileName config.json, configFile.DefaultEnvironment); git diff to main afe4b2b is empty for pkg/environment. github.com/joho/godotenv v1.5.1 (Go proxy zip, tag commit 3fc4292, MIT) parser.go.
    note: >-
      Verified .env grammar (godotenv v1.5.1 as used by azd): KEY=VALUE or KEY: VALUE with an optional leading `export
      `; key characters letters, digits, `_` and `.` (anything else is a parse error); a line whose first non-space
      character is `#` is a comment; an unquoted value runs to end of line, is trimmed, and ends at a `#` that follows
      whitespace; single-quoted values are literal; double-quoted values may span lines, expand `\n` and `\r`,
      unescape other backslash pairs and expand $VAR and ${VAR} (uppercase names) from earlier keys of the same file
      (not the process environment); an unterminated quote is a parse error; a later duplicate key overwrites the
      earlier one; CRLF is normalised. azd writes every value double-quoted with escapes (numeric values unquoted,
      then re-quoted when a leading zero would be lost) and sorted by key. The default environment is the
      `defaultEnvironment` string in .azure/config.json (with `version` 1); each environment lives in
      .azure/<name>/.env and .azure/<name>/config.json.
overlap:
  decision: native
  provisional: false
  coverage: none
  rationale: >-
    PSRule for Azure, Azure Policy and Defender judge a resource on its own; none can tell that a prod environment points at
    a sibling dev environment. The environment tier mapping and cross-file correlation is the value.
  research:
    psrule:
      state: searched-none
    azurePolicy:
      state: searched-none
    defender:
      state: searched-none
    advisor:
      state: searched-none
    bicepLinter:
      state: searched-none
    checkov:
      state: searched-none
implementation:
  owner: native
  package: internal/rules/env
testability: >-
  Offline when environment tiers are configured and the sibling environments' .env files are visible; otherwise skipped
  with the missing capability.
tests:
  positive:
    - prod-project-endpoint-is-dev-project
    - prod-parameter-references-dev-resource-group-id
    - tiers-derived-from-names-without-policy
    - explicit-tiers-win-over-names
    - environment-lists-classify-tiers
  negative:
    - prod-references-prod-resources
    - prod-references-shared-explicitly-allowed
    - distinct-targets-with-derived-tiers-pass
  skipped:
    - environment-tiers-not-configured-and-names-decide-nothing
    - sibling-environments-not-visible
    - env-file-unparseable-uncertain
    - environment-without-tier-or-targets-uncertain
    - ambiguous-names-uncertain
    - parameter-file-environment-shared-identifier-is-a-note
notes: >-
  Version 5 (2026-10-19): the rule no longer needs environments.tiers. Tiers come from environments.tiers, then the
  environments.production / nonProduction / development lists, then the documented name derivation, so the rule works by
  default in CI checkouts. Inputs widened to environments named by parameter files, as notes only (UNVERIFIED mapping).
  A not-applicable skip names policy-declared environments that have no visible values. UNVERIFIED: the token lists of the
  derivation are a product opinion, not an Azure or azd fact; the environment-named parameter file patterns are
  inferences (azd defines only main.parameters.json and main.bicepparam, bicep_provider.go).
  Product opinion: no source states a prohibition. Tier mapping is Foundry Doctor configuration (profiles), which does not
  exist in azd. Resources that a prod environment legitimately shares with non-prod (central registries, shared search)
  need an allow entry with a reason and expiry. Version 2 (2026-10-15): with no finding, an unusable .env, an
  environment with no tier, no visible prod or non-prod environment, or an environment with no resource group or
  resource identifier value gives an uncertain skip naming it, not a pass.
  Version 4: uncertain notes (an unusable environment, an environment with a missing value) are returned as uncertain skips next to findings, not dropped. Findings carry a Key: the check kind, the variable name when there is one, and the sorted environment pair, never a value or a value fingerprint, so a rotated value does not resurface a baselined finding.

  note: DNS zone group definition and limits (up to five zones, one zone per name, one zone group per endpoint).
- url: https://learn.microsoft.com/azure/foundry/agents/how-to/virtual-networks
  lastVerified: '2026-10-04'
  verifiedVia: refs/azure-ai-docs/articles/foundry/agents/includes/how-to-virtual-networks-content.md (ms.date 09/28/2026)
  note: DNS zone configurations summary; troubleshooting says verify each private DNS zone is linked to the VNet.
- url: https://learn.microsoft.com/azure/dns/private-dns-virtual-network-links
  lastVerified: '2026-10-04'

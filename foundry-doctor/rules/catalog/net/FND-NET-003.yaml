  note: A zone without a link to a VNet is not resolvable from it (resolution virtual network concept).
- url: >-
    https://github.com/Azure/azure-rest-api-specs/blob/main/specification/network/resource-manager/Microsoft.Network/Network/stable/2024-05-01/privateEndpoint.json
  lastVerified: '2026-10-04'
  verifiedVia: >-
    raw.githubusercontent.com/Azure/azure-rest-api-specs/main/.../Network/stable/2024-05-01/privateEndpoint.json (PrivateDnsZoneGroupPropertiesFormat.privateDnsZoneConfigs[].properties.privateDnsZoneId)
    and .../privatedns/.../PrivateDns/stable/2024-06-01/privatedns.json (VirtualNetworkLinkProperties)
  note: Property names for zone groups and VNet links.
overlap:
  decision: native
  coverage: partial
  rationale: >-
    The built-in "Configure ... to use private DNS zones" policies (Cognitive Services, Search, Cosmos DB, Key Vault, Container
    Registry, Storage per group ID) are deployIfNotExists remediation: they create zone groups but do not audit the VNet
    link, do not know the three-zone Foundry set and do not run before deployment. PSRule has only Azure.PrivateEndpoint.Name
    (naming). No Checkov or Bicep linter rule covers zone groups. Foundry-specific correlation (group ID to required zone
    set to VNet link) is the value, so the check is native and the policies are mapped for reference.
  psrule: []
  azurePolicy:
  - c4bc6f10-cb41-49eb-b000-d5ab82e2a091 (Configure Cognitive Services accounts to use private DNS zones)
  - fbc14a67-53e4-4932-abcc-2049c6706009 (Configure Azure AI Search services to use private DNS zones)
  - a63cc0bd-cda4-4178-b705-37dc439d3e0f (Configure CosmosDB accounts to use private DNS zones)
  - 75973700-529f-4de2-b794-fb9b6781b6b0 (Configure a private DNS Zone ID for blob groupID)
  - ac673a9a-f77d-4846-b2d8-a57f8e1c01d4 (Configure Azure Key Vaults to use private DNS zones)
  defender: []
  advisor: []
  bicepLinter: []
  checkov: []
implementation:
  owner: native
  package: internal/rules/net
testability: >-
  Offline with fixtures for each group ID. Link checks need the zone resource in the same template or live ARM access; otherwise
  skipped.
tests:
  positive:
  - foundry-endpoint-without-zone-group
  - foundry-endpoint-zone-group-with-only-cognitiveservices-zone
  - zone-without-vnet-link
  - search-endpoint-wrong-zone-name
  negative:
  - foundry-endpoint-three-zones-linked
  - storage-blob-endpoint-with-linked-zone
  - azure-government-zone-names
  skipped:
  - central-hub-dns-zone-in-other-subscription
  - custom-dns-server-declared-in-config
  - dine-policy-manages-dns-zone-group
notes: >-
  Unverified: DNS zone names for sovereign clouds were read from the Private Link table only for the services listed there
  (Foundry Government lists a single cognitiveservices zone); the docs' own statement that DNS zone groups are optional
  when custom DNS is used is why confidence is likely and basis is reliability, not platform. Zone names containing the
  Bicep linter hard-coded environment URL pattern are an incidental overlap with no-hardcoded-environment-urls and are not
  mapped.

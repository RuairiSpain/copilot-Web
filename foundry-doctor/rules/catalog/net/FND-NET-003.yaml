id: FND-NET-003
version: 1
group: NET
title: Private endpoint DNS zone groups and VNet links
description: >-
  Every private endpoint that serves a Foundry deployment must resolve to its private IP from the VNet that uses it. The
  rule checks that the endpoint has a privateDnsZoneGroup that references the documented privatelink zones for its group
  ID, and that each referenced Private DNS zone has a virtualNetworkLink to the VNet that hosts the clients and agents.
  For the Foundry account the expected set is three zones: privatelink.cognitiveservices.azure.com, privatelink.openai.azure.com
  and privatelink.services.ai.azure.com. Other expected zones: privatelink.search.windows.net (searchService), privatelink.documents.azure.com
  (Sql), privatelink.blob.core.windows.net (blob), privatelink.vaultcore.azure.net (vault), privatelink.azurecr.io (registry).
  Zone names are cloud specific (Azure Government and China use different suffixes), so the expected set is chosen per cloud.
  A missing zone group or link is the most common cause of private deployments that deploy but cannot connect.
status: verified
phases:
- '1'
inputs:
- bicep-arm
- control-plane
basis:
- reliability
category: must-have
pillar: reliability
severity:
  dev: warning
  test: error
  prod: error
compatibility:
  azd: ''
  extensions: {}
  apiVersions:
  - Microsoft.Network/privateEndpoints/privateDnsZoneGroups 2024-05-01
  - Microsoft.Network/privateDnsZones/virtualNetworkLinks 2024-06-01
  preview: false
  notes: Not version dependent; reads compiled ARM JSON and ARM state (azd 1.36.0-beta.1 clone checked)
evidence:
  description: >-
    For each Microsoft.Network/privateEndpoints whose privateLinkServiceConnections.groupIds and target type are known,
    find child privateDnsZoneGroups and read properties.privateDnsZoneConfigs[].properties.privateDnsZoneId. Finding 1:
    no zone group. Finding 2: zone group lacks one of the expected zone names for the group ID (account needs all three
    Foundry zones). Finding 3: a referenced Private DNS zone resource in scope has no virtualNetworkLinks entry whose properties.virtualNetwork.id
    is the endpoint VNet (or a VNet in the same hub-spoke set declared in config). Zones in another subscription or a custom
    DNS server or private resolver cannot be seen from the template; report those as skipped with the reason, not as passed.
    Zone group limits from the Private Link docs (at most five zones, one zone per name, one zone group per endpoint) are
    also checked. Report skipped, with the reason 'policy-managed', when the profile declares that this setting is created
    after deployment by an Azure Policy DeployIfNotExists assignment (common in landing zones); template-only evidence cannot
    see those resources.
  confidence: likely
recommendation: >-
  Add a privateDnsZoneGroup to each private endpoint with the documented zones (three for a Foundry account) and link every
  zone to the VNet that resolves the names. If DNS is centralised in a hub or a private resolver, declare that in the Foundry
  Doctor configuration so the check is skipped with a reason instead of failing.
fix: |
  resource zoneGroup 'Microsoft.Network/privateEndpoints/privateDnsZoneGroups@2024-05-01' = {
    parent: pe
    name: 'default'
    properties: {
      privateDnsZoneConfigs: [
        { name: 'cognitiveservices', properties: { privateDnsZoneId: zoneCognitive.id } }
        { name: 'openai',            properties: { privateDnsZoneId: zoneOpenAi.id } }
        { name: 'servicesai',        properties: { privateDnsZoneId: zoneServicesAi.id } }
      ]
    }
  }
  resource link 'Microsoft.Network/privateDnsZones/virtualNetworkLinks@2024-06-01' = {
    parent: zoneCognitive
    name: 'vnet-link'
    location: 'global'
    properties: { virtualNetwork: { id: vnetId }, registrationEnabled: false }
  }
sources:

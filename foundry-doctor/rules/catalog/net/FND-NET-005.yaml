id: FND-NET-005
version: 1
group: NET
title: "Private-mode VNet/region consistency"
description: >-
  In a private deployment the Foundry account must be in the same Azure region as the virtual
  network that hosts its agent subnet, and every private endpoint must be in the same region and
  subscription as the VNet that hosts it. The private-link target (the Foundry account, Storage,
  Cosmos DB, Search) may be in a different region than that VNet, and the dependent data resources
  may be in other regions than the Foundry account; those cases are not failures but carry
  cross-region cost and latency, which the rule reports as informational context.
status: verified
phases: ["1"]
inputs: ["bicep-arm", "control-plane"]
basis: ["platform"]
category: must-have
pillar: reliability
severity:
  dev: error
  test: error
  prod: error
compatibility:
  azd: ""
  extensions: {}
  apiVersions:
    - { plane: management, provider: Microsoft.CognitiveServices, resourceType: accounts, version: "2026-09-01" }
    - { plane: management, provider: Microsoft.Network, resourceType: privateEndpoints, version: "2024-05-01" }
    - { plane: management, provider: Microsoft.Network, resourceType: virtualNetworks, version: "2024-05-01" }
  preview: false
  notes: "Not version dependent; reads compiled ARM JSON and ARM state (azd 1.36.0-beta.1 clone checked)"
evidence:
  description: >-
    Resolve the VNet from the subnet in networkInjections[].subnetArmId and compare its location with
    the Foundry account location after normalising region names (display name versus canonical name).
    A mismatch fails. For each Microsoft.Network/privateEndpoints, resolve the VNet of
    properties.subnet.id and require the same location and the same subscription as the private
    endpoint; a mismatch fails. When the Foundry private endpoint sits in a different VNet than the
    agent subnet (peered VNets are supported), that is accepted and only the endpoint-to-own-VNet
    rule applies. Different regions for Storage, Cosmos DB and Search relative to the Foundry
    account are emitted as info findings, not failures. Skip when a location or subnet ID is an
    unresolved parameter.
  confidence: certain
recommendation: >-
  Create the VNet, agent subnet and Foundry account in the same region, and create each private
  endpoint in the region and subscription of the VNet that hosts it. Cross-region data resources are
  allowed but cost more in data transfer; keep them in the Foundry region unless you have a reason.
fix: |
  param location string = 'swedencentral'
  resource vnet 'Microsoft.Network/virtualNetworks@2024-05-01' = { name: vnetName, location: location, properties: { addressSpace: { addressPrefixes: ['10.0.0.0/16'] } } }
  resource account 'Microsoft.CognitiveServices/accounts@2026-09-01' = { name: accountName, location: location, kind: 'AIServices', sku: { name: 'S0' }, properties: { /* networkInjections -> subnet in vnet */ } }
  resource pe 'Microsoft.Network/privateEndpoints@2024-05-01' = { name: '${accountName}-pe', location: location /* same region as the VNet */, properties: { subnet: { id: peSubnetId } } }
sources:
  - url: https://learn.microsoft.com/azure/foundry/agents/how-to/virtual-networks
    lastVerified: "2026-10-04"
    verifiedVia: refs/azure-ai-docs/articles/foundry/agents/includes/how-to-virtual-networks-content.md (ms.date 09/28/2026)
    note: "The Foundry resource must be deployed in the same region as the virtual network; Cosmos DB, Search and Storage can be in different regions; VNet and Foundry may be in different resource groups; peered VNets supported."
  - url: https://learn.microsoft.com/azure/foundry/agents/concepts/networking-options
    lastVerified: "2026-10-04"
    verifiedVia: refs/azure-ai-docs/articles/foundry/agents/concepts/networking-options.md (ms.date 06/29/2026)
    note: Same region for the Foundry resource and the virtual network; other resources can be in different regions with cost implications.
  - url: https://learn.microsoft.com/azure/private-link/private-endpoint-overview
    lastVerified: "2026-10-04"
    verifiedVia: refs/azure-docs/articles/private-link/private-endpoint-overview.md (ms.date 08/11/2026)
    note: The private endpoint must be deployed in the same region and subscription as the virtual network; the private-link resource can be in a different region.
overlap:
  decision: native
  provisional: true
  coverage: none
  rationale: >-
    No PSRule rule, Azure Policy built-in, Checkov check or Bicep linter rule compares the location of
    the Foundry account, its agent VNet and its private endpoints. Azure.Resource.AllowedRegions only
    compares against a configured list. The comparison across the account, subnet and endpoint is
    Foundry specific.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/net
testability: >-
  Offline with fixtures; region normalisation table shared with other rules. Live mode reads
  locations from ARM.
tests:
  positive:
    - account-and-agent-vnet-in-different-regions
    - private-endpoint-region-differs-from-its-vnet
    - private-endpoint-subscription-differs-from-vnet
    - cosmos-in-other-region-reports-info-only
  negative:
    - all-resources-same-region
    - foundry-endpoint-in-peered-hub-vnet-same-region
  skipped:
    - location-is-unresolved-parameter
    - managed-virtual-network-mode
notes: >-
  The Private Link page states the endpoint-and-VNet constraint as a deployment requirement; whether
  ARM enforces it with a specific error was not read, so only the documented constraint is encoded.
  Unverified: the Foundry docs say the Foundry resource must match the VNet region but do not say
  whether a peered VNet in another region is acceptable for the endpoint VNet; the rule accepts only the
  documented same-region-as-own-VNet condition.

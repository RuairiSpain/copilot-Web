id: FND-NET-010
version: 1
group: NET
title: Azure Monitor private-link choice is explicit
description: >-
  In a private Foundry design, the telemetry path (Application Insights component and its Log Analytics workspace) must
  be a deliberate choice: either connected through an Azure Monitor Private Link Scope (AMPLS) with explicit ingestion and
  query access modes, or declared as public telemetry. The Foundry documentation states that Application Insights reaches
  a private Foundry setup through an AMPLS. The documentation also warns that a Private Only access mode blocks traffic
  to Azure Monitor resources outside the AMPLS for every network that shares the same DNS, and that several AMPLS objects
  on one DNS override each other. The platform does not require AMPLS, so the rule asks for an explicit decision and checks
  that the chosen option is internally consistent. It does not claim that public telemetry is a platform error.
status: product-opinion
phases:
- '4'
inputs:
- bicep-arm
- control-plane
basis:
- opinion
- security
category: nice-to-have
pillar: security
severity:
  dev: info
  test: warning
  prod: warning
compatibility:
  azd: ''
  extensions: {}
  apiVersions:
  - { plane: management, provider: Microsoft.Insights, resourceType: privateLinkScopes, version: '2021-09-01' }
  - { plane: management, provider: Microsoft.Insights, resourceType: privateLinkScopes, version: '2023-06-01-preview' }
  - { plane: management, provider: Microsoft.Insights, resourceType: components, version: '2020-02-02' }
  - { plane: management, provider: Microsoft.OperationalInsights, resourceType: workspaces, version: '2026-03-01' }
  preview: true
  notes: >-
    Not version dependent; reads compiled ARM JSON and ARM state (azd 1.36.0-beta.1 clone checked) Microsoft.Insights/privateLinkScopes
    2021-09-01: stable; accessModeSettings.queryAccessMode, ingestionAccessMode, exclusions. Microsoft.Insights/privateLinkScopes
    2023-06-01-preview: same properties; both modes required. Microsoft.Insights/privateLinkScopes/scopedResources (linkedResourceId)
    Microsoft.Insights/components 2020-02-02: publicNetworkAccessForIngestion, publicNetworkAccessForQuery; default Enabled.
    Microsoft.OperationalInsights/workspaces 2026-03-01: publicNetworkAccessForIngestion, publicNetworkAccessForQuery; Enabled,
    Disabled, SecuredByPerimeter.
evidence:
  description: >-
    Applies when the Foundry account is private by the FND-NET-001 test and an Application Insights component is connected
    to the account or project (Application Insights connection) or the template deploys one beside it. Classify the telemetry
    path as exactly one of: (a) AMPLS: a Microsoft.Insights/privateLinkScopes/scopedResources child whose properties.linkedResourceId
    is the component (and, for a workspace-based component, its Log Analytics workspace), plus a private endpoint whose
    privateLinkServiceConnections[].groupIds contains azuremonitor and whose privateLinkServiceId is the scope; (b) declared
    public: the design declares public telemetry in Foundry Doctor config and the component sets publicNetworkAccessForIngestion
    explicitly; (c) implicit: neither, which is the finding. For (a), also require accessModeSettings.ingestionAccessMode
    and queryAccessMode to be present and explicit (the 2021-09-01 schema defaults them to Open when omitted). Emit info
    when either is PrivateOnly, quoting the documented all-networks-on-the-same-DNS effect. Fail path (a) when the component
    or workspace sets a public access property to Disabled but is not in any scope in the template, because ingestion or
    query then has no path. Emit a warning when more than one scope in the template could be reached from the same private
    DNS zone (the documented override problem), and skip when a linkedResourceId, location or access mode is an unresolved
    parameter. Live mode lists scopedResources and privateEndpointConnections from ARM.
  confidence: likely
recommendation: >-
  Decide the telemetry path. For private telemetry, create one AMPLS per DNS boundary, add the Application Insights component
  and its workspace as scoped resources, create the private endpoint with group ID azuremonitor and link the Azure Monitor
  private DNS zones, and set both access modes explicitly. Use Open while resources are still being added and switch to
  Private Only only when all Azure Monitor resources are in the scope. If you accept public telemetry, record that decision
  in the Foundry Doctor config so the finding is suppressed with a reason.
fix: |
  resource ampls 'Microsoft.Insights/privateLinkScopes@2021-09-01' = {
    name: 'ampls-${name}'
    location: 'global'
    properties: {
      accessModeSettings: { ingestionAccessMode: 'Open', queryAccessMode: 'Open' } // explicit; move to PrivateOnly once every resource is scoped
    }
  }
  resource scoped 'Microsoft.Insights/privateLinkScopes/scopedResources@2021-09-01' = {
    parent: ampls
    name: 'appi'
    properties: { linkedResourceId: appInsights.id }
  }
  // private endpoint with groupIds: ['azuremonitor'] and privateLinkServiceId: ampls.id

overlap:
  decision: adapt
  provisional: true
  coverage: partial
  rationale: >-
    Built-in policies already audit pieces: the AMPLS should use private link (private endpoints exist), the AMPLS should
    block access to non private link resources (both access modes PrivateOnly), the DINE policies that create endpoints
    and DNS, and the deny policies for public ingestion and query on Application Insights and Log Analytics. All are per-resource
    and subscription scoped; the "block" policy would flag the Open mode that the documentation recommends during onboarding.
    PSRule for Azure, Checkov and the Bicep linter have no AMPLS rule in the local clones. Foundry Doctor adapts the idea:
    it asks for an explicit decision tied to the Foundry connection, checks that scope membership and public-access settings
    agree, and runs before deployment. Evidence is the correlation of connection, component, scope and endpoint, not one
    property.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: searched-match
      matches:
      - 0fc55270-f8bf-4feb-b7b8-5e7e7eacc6a6 (Azure Monitor Private Link Scope should use private link)
      - >-
        a499fed8-bcc8-4195-b154-641f14743757 (Azure Monitor Private Link Scope should block access to non private link resources)
      - >-
        bec5db8e-c4e3-40f9-a545-e0bd00065c82 (Configure Azure Monitor Private Link Scope to block access to non private link
        resources)
      - e8185402-357b-4768-8058-f620bc0ae6b5 (Configure Azure Monitor Private Link Scopes with private endpoints)
      - 437914ee-c176-4fff-8986-7e05eb971365 (Configure Azure Monitor Private Link Scope to use private DNS zones)
      - >-
        1bc02227-0cb6-4e11-8f53-eb0b22eab7e8 (Application Insights components should block log ingestion and querying from public
        networks)
      - >-
        6c53d030-cc64-46f0-906d-2bc061cd1334 (Log Analytics workspaces should block log ingestion and querying from public networks)
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/net
testability: >-
  Offline with compiled ARM fixtures (component, scope, scopedResources, private endpoint) and a declared-public config
  fixture. Live mode adds a scopedResources and endpoint listing.
tests:
  positive:
  - private-foundry-appinsights-no-ampls-no-declaration
  - ampls-access-modes-omitted
  - component-ingestion-disabled-not-in-scope
  - two-ampls-same-dns-zone
  negative:
  - appinsights-in-ampls-with-explicit-modes-and-endpoint
  - public-telemetry-declared-in-config
  - foundry-not-private
  skipped:
  - linked-resource-id-is-parameter
  - appinsights-referenced-by-existing-resource-id-only
  uncertain:
  - private-only-mode-with-other-networks-on-same-dns
notes: >-
  Product opinion: the platform documents AMPLS as the way to keep Application Insights private and documents the Private
  Only side effects, but it does not require a private telemetry path, so the rule is an explicit-choice check (severity
  warning in test and prod, info in dev). Unverified: the Foundry Doctor config key for declaring public telemetry (defined
  in Phase 4); the exact private endpoint DNS zone set required for the azuremonitor group ID (the Foundry article lists
  four zones; the Azure Monitor private-link-configure article was not reviewed); Defender for Cloud and Advisor equivalents
  were not available in any clone. Profile key: policy.monitoring.publicTelemetry (ADR-007).

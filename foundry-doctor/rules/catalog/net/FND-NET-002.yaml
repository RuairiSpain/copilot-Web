id: FND-NET-002
version: 1
group: NET
title: Dependent services public access/default-deny/private endpoints
description: >-
  When a Foundry account is deployed in a private mode (public access disabled, or agent network injection), the services
  that hold its data must be private too: the Storage, Azure Cosmos DB and Azure AI Search resources referenced by the agent
  capability settings (or capability host connections), plus a Key Vault, container registry or Application Insights/AMPLS
  the deployment connects. For each, the rule checks publicNetworkAccess, the firewall default action and that a private
  endpoint with the correct group ID exists. Foundry does not create these endpoints for you, so a private Foundry in front
  of public data stores is the usual mistake.
status: verified
phases:
- '1'
inputs:
- bicep-arm
- control-plane
basis:
- security
category: must-have
pillar: security
severity:
  dev: warning
  test: error
  prod: error
compatibility:
  azd: ''
  extensions: {}
  apiVersions:
  - Microsoft.CognitiveServices/accounts 2026-07-15-preview
  - Microsoft.Storage/storageAccounts 2026-09-01
  - Microsoft.DocumentDB/databaseAccounts 2026-03-15
  - Microsoft.Search/searchServices 2025-05-01
  - Microsoft.KeyVault/vaults 2026-05-15
  preview: true
  notes: >-
    Not version dependent; reads compiled ARM JSON and ARM state (azd 1.36.0-beta.1 clone checked) Microsoft.CognitiveServices/accounts
    2026-07-15-preview: capabilitySettings.
evidence:
  description: >-
    Applies only when FND-NET-001 shows the account is private (publicNetworkAccess Disabled) or networkInjections has
    scenario agent. Resolve the dependents from capabilitySettings (blobStore, documentStore, vectorStore ARM IDs on
    the account or project; preview 2026-07-15-preview only) or, for the legacy flow, from the capability host
    connection names (threadStorageConnections, vectorStoreConnections, storageConnections) resolved to connections
    whose properties.metadata.ResourceId is the dependent's ARM ID. Per dependent: Storage publicNetworkAccess
    Disabled or networkAcls.defaultAction Deny; Cosmos DB publicNetworkAccess Disabled, or ipRules and
    virtualNetworkRules with isVirtualNetworkFilterEnabled; Search publicNetworkAccess Disabled; Key Vault
    publicNetworkAccess Disabled or networkAcls.defaultAction Deny. Then require a Microsoft.Network/privateEndpoints
    resource with the group ID blob (Storage), Sql (Cosmos DB for NoSQL), searchService (Search) or vault (Key Vault).
    Report each dependent and the failed sub-check. Skip a dependent whose resource ID is a parameter that cannot be
    resolved.
  confidence: certain
recommendation: >-
  Disable public network access on the Storage, Cosmos DB and AI Search resources that back the agents and give each a private
  endpoint in the private endpoint subnet, with its private DNS zone (FND-NET-003). Do not rely on the Foundry template
  to create them; the Foundry documentation states it does not.
fix: |
  resource search 'Microsoft.Search/searchServices@2025-05-01' = {
    name: searchName
    location: location
    sku: { name: 'standard' }
    properties: { publicNetworkAccess: 'Disabled' }
  }
  resource searchPe 'Microsoft.Network/privateEndpoints@2024-05-01' = {
    name: '${searchName}-pe'
    location: location
    properties: {
      subnet: { id: peSubnetId }
      privateLinkServiceConnections: [{
        name: 'search'
        properties: { privateLinkServiceId: search.id, groupIds: ['searchService'] }
      }]
    }
  }

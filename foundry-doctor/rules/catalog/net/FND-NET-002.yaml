- url: https://github.com/Azure/azure-rest-api-specs/blob/c415ef063cd4c1833ecceff7f856295115d80c0d/specification/cognitiveservices/resource-manager/Microsoft.CognitiveServices/CognitiveServices/stable/2026-09-01/cognitiveservices.json
  lastVerified: '2026-10-05'
  verifiedVia: >-
    refs/rest-api-specs @ c415ef063cd4c1833ecceff7f856295115d80c0d (2026-10-03) cognitiveservices stable/2026-09-01
    and preview/2026-07-15-preview; cosmos-db DocumentDB/stable/2026-03-15/openapi.json, storage
    Microsoft.Storage/stable/2026-09-01/openapi.json and search stable/2025-05-01/search.json definitions
    PublicNetworkAccess.
  note: >-
    ARM spec stable 2026-09-01: CapabilityHostProperties and ProjectCapabilityHostProperties carry
    aiServicesConnections, vectorStoreConnections, storageConnections, threadStorageConnections (string arrays of
    connection names), capabilityHostKind, customerSubnet, enablePublicHostingEnvironment; connections are
    Microsoft.CognitiveServices/accounts/connections and accounts/projects/connections with ConnectionPropertiesV2
    (authType, category, target "The connection URL to be used", metadata string map). capabilitySettings
    (documentStore, vectorStore, blobStore, ARM IDs) exist only in preview 2026-07-15-preview (account and project
    properties); the 2026-09-01 stable spec has no capabilitySettings. publicNetworkAccess enum is Enabled, Disabled,
    SecuredByPerimeter in Cosmos DB 2026-03-15, Storage 2026-09-01 and Search 2025-05-01; Cosmos networkAclBypass enum
    is None, AzureServices.
- url: https://github.com/MicrosoftDocs/azure-ai-docs/blob/e8d0ac6f7ebd7fd000e287657ab9beda5bccc1fa/articles/foundry/agents/includes/concepts-capability-hosts-content.md
  lastVerified: '2026-10-05'
  verifiedVia: >-
    refs/azure-ai-docs @ e8d0ac6f7ebd7fd000e287657ab9beda5bccc1fa
    articles/foundry/agents/includes/concepts-capability-hosts-content.md (ms.date 08/21/2026), "Required connection
    properties"; foundry-samples @ d807d9a0b2e633040d896cd0ddd58c95e14ac6f1
    infrastructure-setup-bicep/41-standard-agent-setup/modules-standard/ai-project-identity.bicep and
    add-project-capability-host.bicep.
  note: >-
    Legacy (connection) flow, verified: a project or account capability host lists connection NAMES in
    threadStorageConnections (Cosmos DB), vectorStoreConnections (AI Search), storageConnections (Storage) and
    aiServicesConnections (Azure OpenAI). A connection ties to the Azure resource through
    properties.metadata.ResourceId (the full ARM ID, documented as required for Agent Service to resolve the
    resource); properties.target is the service endpoint URL, not the ID. Connection category strings differ between
    sources: CognitiveSearch, AzureStorageAccount, and for Cosmos DB the ARM spec enum has CosmosDb, Microsoft samples
    use CosmosDB (and once CosmosDb) and the Learn article writes AzureCosmosDb; the category is a free string
    (modelAsString), so compare it case-insensitively and prefer the resource type of metadata.ResourceId.
- url: https://github.com/MicrosoftDocs/azure-docs/blob/eb1e05deecc53c7a1a192453a3b8183e45f73c10/articles/private-link/private-endpoint-dns.md
  lastVerified: '2026-10-05'
  verifiedVia: >-
    MicrosoftDocs/azure-docs main @ eb1e05deecc53c7a1a192453a3b8183e45f73c10 (2026-10-04),
    articles/private-link/private-endpoint-dns.md (ms.date 08/11/2026), fetched from raw.githubusercontent.com on
    2026-10-05 (path absent from the sparse local clone).
  note: >-
    Private endpoint group IDs and zones: Cosmos DB Sql -> privatelink.documents.azure.com (SqlDedicated ->
    privatelink.sqlx.cosmos.azure.com, MongoDB, Cassandra, Gremlin and Table have their own zones); Storage blob and
    blob_secondary -> privatelink.blob.core.windows.net, table/table_secondary, queue/queue_secondary, file,
    web/web_secondary and dfs/dfs_secondary have their own privatelink.<service>.core.windows.net zones; Search
    searchService -> privatelink.search.windows.net; Key Vault vault -> privatelink.vaultcore.azure.net; Foundry Tools
    account -> privatelink.cognitiveservices.azure.com, privatelink.openai.azure.com,
    privatelink.services.ai.azure.com.
overlap:
  decision: adapt
  coverage: partial
  rationale: >-
    PSRule (Azure.Storage.Firewall, Azure.KeyVault.Firewall, Azure.Cosmos.PublicAccess, Azure.ACR.Firewall), the per-service
    built-in policies and Checkov already test each dependent in isolation. PSRule for Azure has no rule for Azure AI Search
    public access in the local clone. Foundry Doctor adds the correlation none of them can: which stores are the agent's
    dependents (from capabilitySettings), whether the Foundry side is private, and that the endpoint group ID is the right
    one. Evidence differs: those tools evaluate any resource; this rule evaluates only resources tied to a private Foundry
    account and fails on the pair.
  psrule:
  - Azure.Storage.Firewall
  - Azure.KeyVault.Firewall
  - Azure.Cosmos.PublicAccess
  - Azure.ACR.Firewall
  azurePolicy:
  - ee980b6d-0eca-4501-8d54-f6290fd512c3 (Azure AI Search services should disable public network access)
  - b2982f36-99f2-4db5-8eff-283140c09693 (Storage accounts should disable public network access)
  - 797b37f7-06b8-444c-b1ad-fc62867f335a (Azure Cosmos DB should disable public network access)
  - 405c5871-3e91-4644-8a63-58e19d68ff5b (Azure Key Vault should disable public network access)
  - 0fdf0491-d080-4575-b627-ad0e843cba0f (Public network access should be disabled for Container registries)
  defender: []
  advisor: []
  bicepLinter: []
  checkov:
  - CKV_AZURE_35
  - CKV_AZURE_101
  - CKV_AZURE_109
  - CKV_AZURE_189
implementation:
  owner: native
  package: internal/rules/net
testability: >-
  Offline with fixtures that contain account, dependents and endpoints in one template. Live mode reads each dependent by
  resource ID. Cross-template endpoints make the endpoint sub-check skipped.
tests:
  positive:
  - private-account-with-public-storage
  - private-account-with-search-public-and-no-endpoint
  - cosmos-endpoint-uses-wrong-group-id
  negative:
  - all-three-dependents-disabled-with-endpoints
  - storage-default-deny-with-blob-endpoint
  skipped:
  - foundry-account-is-public
  - managed-virtual-network-mode
  - dependent-resource-id-unresolvable-parameter
notes: >-
  Phase 1 fact check (2026-10-05): Cosmos DB publicNetworkAccess enum values are Enabled, Disabled, SecuredByPerimeter
  (2026-03-15); the Storage and Search enums are identical. Storage private endpoint group IDs beyond blob are blob,
  table, queue, file, web, dfs (plus *_secondary), so a Storage dependent needs the group ID for the service the
  agents use, and the Foundry document only requires blob; the rule keeps blob as the required group for Foundry file
  storage. Still unverified: Defender/Advisor IDs. The Foundry doc says the agent state stores are required for the
  standard setup; platform-managed data resources (networking-options) are an alternative, in which case there are no
  dependents and the rule is skipped. The waf basis was removed after the Phase 0 Azure black belt review because no
  WAF pillar tag or WARA recommendation is cited here; the WAF mapping is added in Phase 4 when the guidance is
  verified.

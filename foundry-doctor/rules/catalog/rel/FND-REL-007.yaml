overlap:
  decision: native
  provisional: true
  coverage: none
  rationale: >-
    PSRule has resource-level multi-region checks (for example Azure.APIM.MultiRegion) and WARA has per-resource multi-region
    recommendations, but none asks whether a DR strategy was chosen across the Foundry project. A deterministic check for
    'multi-region' would assert a business need that no source states, so this is a prompt recorded as product opinion.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/rel
tests:
  positive:
  - single-region everything fails for each stateful type
  - hot-hot strategy value also requires multi-region
  - hot-warm strategy value also requires multi-region
  - hot-cold strategy value also requires multi-region
  - strategy key form is accepted
  - ZRS storage is single-region
  - cosmos with two identical locations is one region
  - two accounts in one region are single-region
  - APIM without additional locations fails
  negative:
  - fully multi-region passes
  - declared single-region decision is a valid answer
  - RA-GRS storage is multi-region
  - GRS storage is multi-region
  - cosmos with two locations passes
  - two search services in two regions pass
  - APIM with additional locations passes
  - no stateful resources in template
  - literal false resource is ignored
  skipped:
  - 'no policy, empty policy, unrecognised value, non string value and the ADR-007 declared key skip with no-resilience-objective-declared and the evidence summary (TestREL007NoObjectiveSkipsWithSummary)'
  - missing compiled ARM model skips
  uncertain:
  - unknown storage sku is uncertain
  - empty storage sku is uncertain
  - cosmos locations missing is uncertain
  - cosmos location expression is uncertain
  - account region expression is uncertain
  - one literal and one expression region is uncertain
  - conditional resource is uncertain
testability: Unit tests on compiled ARM and policy fixtures (internal/rules/rel/rel_dr_test.go); no Azure access.
notes: >-
  Version 2: the rule was not implemented (not-implemented skip). Product opinion: the Foundry article documents DR options, but
  not that every project needs them, so findings exist only after the team declares a multi-region objective, and severity is info
  in every profile. The policy keys are product decisions and must be added to the configuration schema by its owner; ADR-007 keeps
  policy.disasterRecovery.declared for the attested question, which the assessment still uses. Hot/hot, hot/warm and hot/cold are
  the strategy names in the Foundry article; this rule does not distinguish them. Azure region pairing, paired-region failover
  and Cosmos failover priorities are not evaluated.

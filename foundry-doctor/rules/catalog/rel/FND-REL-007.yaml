id: FND-REL-007
version: 2
group: REL
title: Multi-region/DR plan question
description: >-
  A question with an offline evidence summary: has the team decided on a multi-region or disaster recovery strategy for the
  Foundry project and its stateful dependencies? Whether a region failover is needed is a business decision (RTO/RPO, cost) that
  cannot be derived from resource configuration. Without a declared objective the rule skips with
  no-resilience-objective-declared (the assessment shows it as a QUESTION) and carries the regions found in the template. With a
  multi-region objective declared in configuration it reports each stateful component that is provably single-region, at info
  severity. A declared single-region decision is a valid answer and produces nothing.
status: product-opinion
phases:
- '4'
inputs:
- bicep-arm
basis:
- opinion
- reliability
- waf
- wara
category: nice-to-have
pillar: reliability
severity:
  dev: info
  test: info
  prod: info
compatibility:
  azd: ''
  extensions: {}
  apiVersions: []
  preview: false
  notes: 'No azd dependency: reads Foundry Doctor configuration and compiled ARM JSON'
evidence:
  description: >-
    Policy keys, read through the policy interface and not yet in the configuration schema (the configuration owner must add
    them): reliability.disasterRecovery (or reliability.disasterRecovery.strategy), a string. required, multi-region, hot-hot,
    hot-warm or hot-cold declares a multi-region objective; single-region declares a single-region decision; absent or any other
    value is no objective. The boolean disasterRecovery.declared of ADR-007 is a different thing (an attested recorded decision,
    read by the assessment) and is not used as an objective. Compiled ARM only; no network. No objective - skip reason
    no-resilience-objective-declared with a summary of template evidence (foundry-regions, search-regions, storage, cosmos-regions,
    apim-multi-region, models-deployed-in-multiple-accounts). Multi-region objective - findings keyed per component:
    single-region-foundry-account (all Foundry accounts, kind AIServices or OpenAI, resolve to one literal region),
    single-region-search (all Search services in one region; no replication feature is read, so a second service in another region
    is the only multi-region shape), single-region-storage (sku.name LRS or ZRS; GRS, GZRS, RA-GRS and RA-GZRS are geo-redundant),
    single-region-cosmos (properties.locations[].locationName has one distinct value), single-region-apim (no Premium sku with
    properties.additionalLocations). Uncertain, never a finding: a region, location, storage SKU or additionalLocations value that
    is an expression or is not in the verified mapping, and conditional or looped resources. Cosmos automatic failover and
    multiple-write-locations are not evaluated (the property names are not verified for this rule, UNVERIFIED), and model
    deployment redundancy across accounts is reported only in the summary. Resources are never evaluated against actual region
    pairs or RTO/RPO.
  confidence: uncertain
recommendation: >-
  Decide and record the intended strategy: single region with backup and restore, or multi-region (hot/hot, hot/warm, hot/cold)
  with the RTO/RPO and cost it implies. For multi-region Foundry the article says you create separate Foundry resources
  and dependencies in each region, deploy to both from CI/CD, and replicate or rebuild state (Cosmos DB read regions with
  service-managed failover, a second AI Search service, storage redundancy).
fix: |-
  # foundry-doctor configuration (key name as in ADR-007; the schema is defined by the configuration spec)
  reliability:
    disasterRecovery:
      strategy: single-region   # or hot-hot | hot-warm | hot-cold
      recoveryRegion: northeurope
      notes: Recover from Cosmos point-in-time backup; rebuild Search index from source

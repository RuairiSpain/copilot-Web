  rationale: No PSRule for Azure rule, Azure Policy built-in, Checkov check or Advisor recommendation was found for spilloverDeploymentName.
    WARA 0c193899 is the matching recommendation but WARA is a query-based recommendation set, not a Foundry Doctor input.
    Foundry-specific correlation (deployment SKU, same-account standard deployment of the same model) is the value.
  research:

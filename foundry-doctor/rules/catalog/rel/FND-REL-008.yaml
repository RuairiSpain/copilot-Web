id: FND-REL-008
version: 2
group: REL
title: Provisioned throughput spillover recommendation
description: A provisioned-throughput model deployment (sku.name ProvisionedManaged, GlobalProvisionedManaged or DataZoneProvisionedManaged)
  should set spilloverDeploymentName to a standard deployment of the same model in the same account, or the application should
  send the x-ms-spillover-deployment header per request. Learn recommends spillover for global and data zone provisioned deployments.
  Spillover is optional and adds pay-as-you-go cost, so this is a recommendation.
status: verified
phases:
- '4'
inputs:
- bicep-arm
- control-plane
basis:
- reliability
- waf
- wara
category: nice-to-have
pillar: reliability
severity:
  dev: info
  test: info
  prod: warning
compatibility:
  azd: ""
  extensions: {}
  apiVersions:
    - { plane: management, provider: Microsoft.CognitiveServices, resourceType: accounts/deployments, version: "2026-05-01" }
    - { plane: management, provider: Microsoft.CognitiveServices, resourceType: accounts/deployments, version: "2024-10-01" }
  preview: false
  notes: "No azd dependency: reads compiled ARM JSON or ARM control plane Microsoft.CognitiveServices/accounts/deployments 2026-05-01 / 2024-10-01: stable) - properties.spilloverDeploymentName in cognitiveservices.json; Learn REST example uses."
evidence:
  description: >-
    Compiled ARM. In scope when sku.name is one of the provisioned names read in the Learn article (ProvisionedManaged,
    GlobalProvisionedManaged, DataZoneProvisionedManaged). Finding provisioned-deployment-spilloverdeploymentname-request-level-spillover:
    properties.spilloverDeploymentName is absent, null, empty or blank (a typed check - version 1 formatted a missing value
    as the text "<nil>", so it reported a failed lookup instead of the absent property). The finding states that request-level
    spillover (x-ms-spillover-deployment header) may be in use and is invisible offline; confidence is likely. When the property
    is set, the named deployment must resolve in the same account (a bare name resolves only for a deployment without a parent
    segment, never across accounts) - otherwise spilloverdeploymentname-resolve-deployment-same-account; it must not itself be
    a provisioned deployment - spilloverdeploymentname-must-refer-standard-deployment-another; and it must have the same model
    format, name and version - spilloverdeploymentname-target-same-model-version. A chain of provisioned deployments that
    returns to the starting deployment (including a deployment naming itself) is reported as spilloverdeploymentname-loop; a chain
    that passes through a non-provisioned deployment is not followed, because whether a standard deployment may itself set
    spillover is not documented (UNVERIFIED). Uncertain, never a finding: an expression or non-string spilloverDeploymentName,
    a conditional, looped or expression-named target, an expression model identity, and a target whose sku.name is unresolved
    (it cannot be shown to be standard). Live control-plane listing is not implemented by this rule.
  confidence: likely
recommendation: Create a standard (pay-as-you-go) deployment of the same model and version in the same account, then set spilloverDeploymentName
  on the provisioned deployment to its name. Spillover initiates on 429, 500 and 503 (and on 400 for long-context requests)
  and is billed at standard rates for the overflow; monitor with the IsSpillover split in Azure Monitor.
fix: "resource ptu 'Microsoft.CognitiveServices/accounts/deployments@2026-05-01' = {\n  parent: foundry\n  name: 'gpt-4o-mini-ptu'\n\
  \  sku: { name: 'GlobalProvisionedManaged', capacity: 100 }\n  properties: {\n    model: { format: 'OpenAI', name: 'gpt-4o-mini',\
  \ version: '2024-07-18' }\n    spilloverDeploymentName: 'gpt-4o-mini-standard'\n  }\n  dependsOn: [ standard ]\n}"

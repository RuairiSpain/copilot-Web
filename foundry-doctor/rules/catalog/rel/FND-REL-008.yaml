implementation:
  owner: native
  package: internal/rules/rel
tests:
  positive:
  - 'absent, null, empty and blank spilloverDeploymentName report the absent-property key and evidence (TestREL008AbsentSpilloverProperty)'
  - target does not exist
  - target exists only in another account
  - target is another PTU deployment
  - target is a different model
  - target is the same model, different version
  - self reference is a loop
  - two PTU deployments spilling to each other loop
  - PTU chain is flagged at the first hop
  - literal false target is absent
  negative:
  - standard sibling same model passes
  - global standard sibling passes
  - data zone standard sibling passes
  - non-provisioned deployment is out of scope
  skipped:
  - missing compiled ARM model skips
  uncertain:
  - spilloverDeploymentName is an unresolved expression
  - target without a literal sku is uncertain
  - target name resolved only through expressions is uncertain
  - conditional spillover target is uncertain
  - expression model identity is uncertain
testability: Unit tests on compiled ARM fixtures (internal/rules/rel/rel_spillover_test.go).
notes: >-
  Version 2 (behaviour change). The absent-property case now reports its own key and evidence; before, it fell through to
  the lookup branch (key spilloverdeploymentname-resolve-deployment-same-account), so baselined fingerprints for that case
  change. New: loop detection, cross-account bare-name resolution fixed, unresolved target SKU is uncertain. The Learn example
  payload shows spilloverDeploymentName at properties level with an API version of 2024-10-01; the stable spec 2026-05-01 was
  used for the property description. Whether spillover supports a given provisioned SKU or model beyond the global and data zone
  recommendation is not asserted. The same-model requirement is the documented precondition; broader model-family equivalence
  is not asserted (UNVERIFIED).

id: FND-REL-004
version: 3
group: REL
title: Delete locks on stateful services
description: The Foundry account and the customer-managed state stores it depends on (Cosmos DB, AI Search, Storage) should
  have a CanNotDelete management lock, directly or inherited from a parent scope. Foundry guidance recommends delete locks
  on these resources. Locks cover control-plane deletion only, not data-plane operations. WAF/WARA-style recommendation, not
  a platform constraint.
status: verified
phases:
- '4'
inputs:
- bicep-arm
- control-plane
basis:
- reliability
- waf
category: nice-to-have
pillar: reliability
severity:
  dev: info
  test: info
  prod: warning
compatibility:
  azd: ""
  extensions: {}
  apiVersions:
    - { plane: management, provider: Microsoft.Authorization, resourceType: locks, version: "2020-05-01" }
  preview: false
  notes: "No azd dependency: reads compiled ARM JSON or ARM control plane Microsoft.Authorization/locks 2020-05-01 / 2020-05-01: stable) - resources/resource-manager/Microsoft.Authorization/locks/stable//locks.json."
evidence:
  description: >-
    Compiled ARM, no network. Targets are the live Microsoft.CognitiveServices/accounts, Microsoft.DocumentDB/databaseAccounts,
    Microsoft.Search/searchServices and Microsoft.Storage/storageAccounts resources. A target is covered by a
    Microsoft.Authorization/locks resource with properties.level CanNotDelete whose scope is the resource (resourceId of the
    same type and name) or the deployment resource group (no scope, or resourceGroup().id, in the same template). The input
    carries no deployment resource-group name, so a lock on a literally named or otherwise computed resource group, a
    parameter-valued scope or level, or a conditional or looped lock is uncertain, never a finding. Findings, keyed per
    target - missing-delete-lock - no CanNotDelete lock covers the resource or the deployment group in the template;
    readonly-lock-instead-of-delete-lock - the resource is covered only by a ReadOnly lock, which blocks updates as well as
    deletes (ManagementLockProperties.level enumeration, locks.json 2020-05-01; the lock-resources article describes ReadOnly
    as read-only access) and so is not a delete lock. A ReadOnly lock never satisfies the check. Locks created outside the
    template (policy, a later pipeline stage, the portal) are invisible in compiled ARM; the policy key
    reliability.locksManagedOutsideTemplate (boolean, default false, product decision) turns a missing lock into an uncertain note
    "delete locks are declared as managed outside the template" instead of missing-delete-lock; a ReadOnly-only resource is
    still reported because that is in-template evidence. Live mode (list locks at resource, resource group and subscription,
    which needs Microsoft.Authorization/locks/read) is not implemented by this rule. Key Vault is deliberately not a target:
    the Foundry resiliency article read names the Foundry account and its state stores, and no verified source names Key Vault
    for this rule (UNVERIFIED).
  confidence: likely
recommendation: Add a CanNotDelete lock on the Foundry account and on each stateful dependency, or on the resource group that
  contains only that workload. Creating locks needs Microsoft.Authorization/locks/write (Owner or User Access Administrator,
  not Contributor). Locks do not protect data-plane content such as individual blobs, indexes or threads; combine with least-privilege
  RBAC and, optionally, the Azure Policy denyAction effect.
fix: "resource lock 'Microsoft.Authorization/locks@2020-05-01' = {\n  name: 'protect-foundry'\n  scope: foundryAccount\n \
  \ properties: {\n    level: 'CanNotDelete'\n    notes: 'Foundry account holds projects and connections'\n  }\n}"

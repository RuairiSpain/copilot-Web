overlap:
  decision: native
  provisional: true
  coverage: none
  rationale: No PSRule for Azure rule, Checkov check, Defender recommendation or Bicep linter rule for management locks was
    found in the clones (PSRule Azure.Resource.* covers tags and regions only). Azure Policy 78460a36 (Do not allow deletion
    of resource types) blocks deletes by resource type instead of requiring a lock, so it is a different control and is listed
    as related only. The Foundry-specific value is knowing which resources form the project's state (via connections and capability
    host) and checking inherited locks.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/rel
tests:
  positive:
  - every stateful dependency without a lock is a finding
  - only the locked resource passes, the rest are findings
  - ReadOnly resource group lock is reported for each uncovered target
  - NotSpecified level does not count
  - policy false behaves like absent
  - locks managed outside the template still reports a ReadOnly-only resource
  - lock on another resource type does not cover
  - no lock at all
  - literal false lock does not count
  - ReadOnly lock does not satisfy a delete lock requirement
  negative:
  - resource group CanNotDelete lock covers all
  - ReadOnly plus CanNotDelete on the same group passes
  - ReadOnly resource lock with CanNotDelete group lock passes
  - scope-less lock covers the deployment resource group
  - resourceGroup().id lock covers the deployment group
  - lock on the resource by identical expression
  - Key Vault is not a verified target
  - locks managed outside the template with a covering lock passes
  - literal false target is not deployed
  - no targets
  skipped:
  - missing ARM model skips
  uncertain:
  - locks managed outside the template are uncertain, not a finding
  - lock on a literal resource group is not provably the deployment group
  - lock on another resource group by expression is unknown
  - lock on a different expression name is unknown
  - parameter-driven lock is uncertain
  - lock level from a parameter is unknown
testability: Unit tests on compiled ARM fixtures (internal/rules/rel/rel_fixes_test.go and rel_locks_test.go); live mode is not implemented.
notes: >-
  Version 3 (behaviour change). Before, the rule could only pass or skip: a missing lock was always an uncertain skip and a
  ReadOnly lock counted as a delete lock. Now a missing CanNotDelete lock is a finding (severity per profile - info in dev and
  test, warning in prod), and a ReadOnly lock is its own finding. Teams that manage locks with Azure Policy or a later pipeline
  stage set reliability.locksManagedOutsideTemplate to true to get the uncertain note instead; the key is read through the
  policy interface and is not yet in the configuration schema (the configuration owner must add it, default false). The Foundry
  article names the protection each lock gives; the rule does not claim more than that. The dev profile is informational because
  locks complicate teardown (azd down) in dev environments.

id: FND-REL-009
version: 1
group: REL
title: APIM availability tier recommendation
description: 'An API Management instance used as the AI gateway in front of Foundry should use a tier that offers an SLA and
  the availability features the workload needs. Documented facts: the Developer tier is for non-production use and has no
  SLA; availability zones and multi-region deployment are Premium features (zones also on v2 tiers per the zones article);
  Consumption, Basic and Standard have neither. Choosing a tier is a cost-versus-resilience decision, so this is a recommendation.'
status: product-opinion
phases:
- '4'
- '8'
inputs:
- bicep-arm
- control-plane
basis:
- reliability
- waf
- wara
- opinion
category: nice-to-have
pillar: reliability
severity:
  dev: info
  test: info
  prod: warning
compatibility:
  azd: ""
  extensions: {}
  apiVersions:
    - { plane: management, provider: Microsoft.ApiManagement, resourceType: service, version: "2024-05-01" }
    - { plane: management, provider: Microsoft.ApiManagement, resourceType: service, version: "2025-09-01-preview" }
  preview: true
  notes: "properties.additionalLocations[] and top-level zones were read in apimdeployment.json 2024-05-01. No azd dependency: reads compiled ARM JSON or ARM control plane Microsoft.ApiManagement/service 2024-05-01 / 2025-09-01-preview: stable) SkuType enum: Developer, Standard, Premium, Basic, Consumption, Isolated, BasicV2, StandardV2; adds PremiumV2."
evidence:
  description: 'Compiled ARM or live Microsoft.ApiManagement/service. Read sku.name, sku.capacity, zones and properties.additionalLocations,
    but evaluate them only against a resilience objective declared by the profile. If production declares only that an SLA
    is required, Developer is a violation. If the profile declares zone resilience, compare the tier and zones with the
    currently documented support and report an unknown region or StandardV2 as uncertain; do not assume that a syntactically
    declared zone is available in the selected region. If the profile declares regional resilience, require the documented
    Premium multi-region shape. With no declared objective, emit skipped rather than treating Premium, zones or a second
    region as universally required. Phase 8 scopes to instances
    that act as an AI gateway for a Foundry project (backend targets a Foundry or Azure OpenAI endpoint, or a Foundry AI gateway
    connection).'
  confidence: likely
recommendation: >-
  Select the least APIM tier and capacity that satisfy the workload's declared SLA, throughput,
  zone-resilience and multi-region objectives; do not default to Premium or two units. For production
  traffic that requires an SLA, do not use Developer. If zone resilience is declared, select the
  least documented zone-capable tier and capacity that satisfy the objective in a region where APIM
  zone support has been verified. Select Premium and add another region only when regional
  resilience is declared (see FND-REL-007). Record the cost-versus-resilience tradeoff and accept a
  lower tier or capacity when it satisfies the declared objective.
fix: |
  // Values are selected from the declared SLA, throughput, zone and region objectives.
  // Do not hard-code Premium/2 as a universal baseline. Verify current tier SLA,
  // regional feature availability and required capacity before setting these parameters.
  param apimTier string
  param apimCapacity int
  resource apim 'Microsoft.ApiManagement/service@2024-05-01' = {
    name: apimName
    location: location
    sku: {
      name: apimTier
      capacity: apimCapacity
    }
    properties: {
      publisherEmail: publisherEmail
      publisherName: publisherName
    }
  }
sources:

  lastVerified: '2026-10-04'
  verifiedVia: refs/azure-docs/articles/api-management/api-management-features.md (ms.date 06/05/2026)
  note: Developer tier has no SLA; availability zones and multi-region deployment feature rows by tier.
- url: https://learn.microsoft.com/azure/api-management/enable-availability-zone-support
  lastVerified: '2026-10-04'
  verifiedVia: refs/azure-docs/articles/api-management/enable-availability-zone-support.md (ms.date 09/16/2026)
  note: Availability zone support on Premium, Standard v2 and Premium v2.
- url: https://github.com/Azure/azure-rest-api-specs/blob/main/specification/apimanagement/resource-manager/Microsoft.ApiManagement/ApiManagement/stable/2024-05-01/apimdeployment.json
  lastVerified: '2026-10-04'
  verifiedVia: refs/rest-api-specs/specification/apimanagement/resource-manager/Microsoft.ApiManagement/ApiManagement/stable/2024-05-01/apimdeployment.json
  note: SkuType enum, zones, AdditionalLocation.
- url: https://github.com/Azure/Azure-Proactive-Resiliency-Library-v2/blob/main/azure-resources/ApiManagement/service/recommendations.yaml
  lastVerified: '2026-10-04'
  verifiedVia: refs/wara (git show HEAD:azure-resources/ApiManagement/service/recommendations.yaml)
  note: WARA baf3bfc0-32a2-4c0c-926d-c9bf0b49808e (Premium for zones), 740f2c1c-8857-4648-80eb-47d2c56d5a50 (enable zones),
    af4f88cb-35e8-4371-b29e-3a32b1d2f40a (multi-region), e35cf148-8eee-49d1-a1c9-956160f99e0b (stv2), all pgVerified true.
- url: https://azure.github.io/PSRule.Rules.Azure/en/rules/Azure.APIM.AvailabilityZone/
  lastVerified: '2026-10-04'
  verifiedVia: refs/psrule/docs/en/rules/Azure.APIM.AvailabilityZone.md
  note: Overlap source (PSRule for Azure rule documentation).
- url: https://azure.github.io/PSRule.Rules.Azure/en/rules/Azure.APIM.MultiRegion/
  lastVerified: '2026-10-04'
  verifiedVia: refs/psrule/docs/en/rules/Azure.APIM.MultiRegion.md
  note: Overlap source (PSRule for Azure rule documentation).
overlap:
  decision: adapt
  provisional: true
  coverage: partial
  rationale: PSRule Azure.APIM.AvailabilityZone and Azure.APIM.MultiRegion cover the zones and additionalLocations checks,
    and WARA has matching recommendations. None flags the Developer tier (no SLA) or ties the tier to Foundry gateway use.
    Foundry Doctor adds the tier-versus-SLA finding, scope to AI gateway instances in front of Foundry, and per-profile severity.
    If that scope is not delivered, downgrade to reuse for zones and multi-region.
  research:
    psrule:
      state: searched-match
      matches:
      - Azure.APIM.AvailabilityZone
      - Azure.APIM.MultiRegion
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/rel
tests:
  positive:
  - Developer tier violates declared production SLA objective
  - Standard tier violates declared zone-resilience objective
  negative:
  - least documented tier and capacity satisfying the declared SLA and throughput objectives produces no finding
  - documented zone-capable tier and sufficient capacity in a verified region satisfies the declared zone objective
  skipped:
  - 'APIM instance not used as a gateway for Foundry (Phase 8 scope): out of scope'
  - 'no control-plane access in live mode: skipped with the missing capability'
  - 'no resilience objective declared: skipped'
  uncertain:
  - 'StandardV2: sources conflict on zone support, reported uncertain'
  - 'declared zones but APIM zone availability in the selected region is not verified'
  - sku or zones supplied by unresolved expressions
testability: Unit tests on compiled ARM fixtures; Phase 8 correlation tests use fixtures with a backend targeting a Foundry
  endpoint.
notes: The tier and feature facts are verified; requiring a particular resilience objective is a product opinion, hence
  this rule's lifecycle status. Phase 4 covers tier facts and Phase 8 adds Foundry gateway scoping. The SLA percentage and
  regional availability of zones were not read and are not asserted. Advisor is unresearched; the adapt decision is provisional.

id: FND-COST-004
version: 4
group: COST
title: "Informational monthly fixed-capacity estimate"
description: >-
  Report an informational monthly range for the fixed-capacity resources in the compiled plan (AI Search units, API
  Management units, Cosmos DB provisioned RU/s and similar verified meters) using public retail prices from the local price
  cache, with the assumptions, currency, price date and the components that could not be priced. One info finding carries the
  plan estimate; components that could not be priced or modelled are listed as separate incomplete items. It never produces a
  pass or fail and never estimates token consumption.
status: product-opinion
phases: ["7"]
inputs: ["bicep-arm", "external-tool"]
basis: ["cost", "opinion"]
category: nice-to-have
pillar: cost
severity:
  dev: info
  test: info
  prod: info
compatibility:
  azd: '>=1.34.2'
  extensions: {}
  apiVersions:
    - { plane: management, provider: Microsoft.Search, resourceType: searchServices, version: "2025-05-01" }
    - { plane: management, provider: Microsoft.ApiManagement, resourceType: service, version: "2024-05-01" }
    - { plane: management, provider: Microsoft.DocumentDB, resourceType: databaseAccounts/throughputSettings, version: "2026-03-15" }
    - { plane: management, provider: Microsoft.DocumentDB, resourceType: databaseAccounts/sqlDatabases, version: "2025-04-15" }
    - { plane: management, provider: Microsoft.DocumentDB, resourceType: databaseAccounts/sqlDatabases/containers, version: "2025-04-15" }
  preview: true
  notes: >-
    azd range: the minimum is the lowest requiredAzdVersion among the Foundry extensions read (agents beta.18,
    projects beta.13 need >=1.34.2); the maximum is azd 1.36.0 (tag azure-dev-cli_1.36.0, acebba1e388b489a91ab8e2487a676359ab516a1, released 2026-10-14; the first clone read at 1.36.0-beta.1 is earlier evidence). The earlier >=1.27.1 lower
    bound came from a changelog and was not verified. Window widened 2026-10-16: azd to 1.36.0 (tag
    azure-dev-cli_1.36.0, acebba1, released 2026-10-14). The azd and extension changelogs and the schema and source
    diffs from the previously verified versions were read; none touches this rule's verified facts for the widened
    fields (see docs/tool-compatibility.md section 6).
evidence:
  description: >-
    From the compiled resource plan (resources whose condition is the literal false are ignored; a non-literal condition or a
    copy loop is listed as unsupported), derive fixed-capacity drivers - Search units as replicaCount x partitionCount for the
    sku.name (default compute and hosting mode only); API Management sku.capacity in the primary region; Cosmos DB manual
    provisioned throughput on throughputSettings and on SQL databases and containers (properties.options.throughput), priced in
    every region of the parent account's properties.locations. Map each driver to a retail meter through the supported-meter
    catalogue and multiply by the quantity and hours (730 by default, configurable). Prices come from the Azure Retail Prices
    API with api-version 2023-01-01-preview, priceType Consumption, the requested currency (verified on the answer), primary
    meter regions preferred and tiered rows excluded; more than one remaining price is ambiguous and not used. Report the low
    and high estimate (equal, because every estimated line is a fixed hourly meter), the price date, currency and cache use,
    and list every other resource - consumption-based or not modelled as excluded; fixed costs that cannot be priced (PTU
    deployments with their PTU count and type, Cosmos autoscale, multi-region write, free tier or zone redundancy, API
    Management additionalLocations, Search confidential compute or HighDensity, unknown or unresolved deployment SKUs,
    sovereign-cloud regions, unresolved values) as unsupported. Totals cover estimated lines only. Offline mode uses a cached
    price file and says so; no price is invented. Nothing is compared with actual spend. At check time the rule uses the
    same extraction as the cost command and, when an estimator is wired (the app wires internal/cost in offline mode over the
    local price cache; the rule itself does no I/O and never uses the network), adds one finding keyed estimate for the whole
    plan - the monthly low and high, currency, price retrieval date, cache use, staleness, the assumptions and the number of
    components not priced - anchored on the first Foundry project by name (else the first Foundry account, else the first live
    resource), because Search, API Management and Cosmos DB are shared by the plan and are not attributable to one project.
    A component the estimator could not price for a reason other than a missing price (no meter mapping, sovereign region)
    and that no extraction item already reports gets an incomplete:unpriced item. When nothing could be priced because no
    cached retail price exists, the rule skips with price-cache-missing-and-offline instead of reporting one item per
    component; no price is guessed. An estimator error is a skip with input-unavailable. Without a wired estimator only the
    incomplete items are produced, as in version 3.
  confidence: uncertain
recommendation: >-
  Treat the figure as a planning aid for comparing dev, test and prod fixed capacity, and confirm with the Azure pricing
  calculator and your own agreement before committing spend.
fix: |
  foundry-doctor cost --environment prod --compare dev

  - url: https://github.com/Azure/azure-rest-api-specs/blob/main/specification/search/resource-manager/Microsoft.Search/Search/stable/2025-05-01/search.json
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://github.com/Azure/azure-rest-api-specs/blob/main/specification/search/resource-manager/Microsoft.Search/Search/stable/2025-05-01/search.json
    note: >-
      replicaCount (1-12 standard, 1-3 basic) and partitionCount (1, 2, 3, 4, 6, 12) properties. Branch URL,
      not commit-pinned.
  - url: https://github.com/Azure/azure-rest-api-specs/blob/main/specification/apimanagement/resource-manager/Microsoft.ApiManagement/ApiManagement/stable/2024-05-01/apimdeployment.json
    lastVerified: "2026-10-04"
    verifiedVia: >-

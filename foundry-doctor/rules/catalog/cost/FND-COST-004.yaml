    note: ThroughputSettingsResource throughput or autoscaleSettings. Branch URL, not commit-pinned.
  - url: https://learn.microsoft.com/azure/foundry/concepts/manage-costs
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://learn.microsoft.com/azure/foundry/concepts/manage-costs; source file
      MicrosoftDocs/azure-ai-docs: articles/foundry/concepts/manage-costs.md; retrieved 2026-10-04
    note: Foundry estimates cover standard deployment costs only, not provisioned throughput, and do not reflect discounts or contracted pricing; invoices and meter records are the source of truth. Page ms.date 08/27/2026.
  - url: https://learn.microsoft.com/rest/api/cost-management/retail-prices/azure-retail-prices
    lastVerified: "2026-10-18"
    verifiedVia: >-
      https://learn.microsoft.com/en-us/rest/api/cost-management/retail-prices/azure-retail-prices (fetched 2026-10-18, page
      last updated 08/06/2024); recorded responses from https://prices.azure.com/api/retail/prices (search-engine snapshot of
      the public endpoint, 2026-10-18) in internal/cost/prices/testdata
    note: >-
      Unauthenticated endpoint https://prices.azure.com/api/retail/prices; api-version 2023-01-01-preview, filter values
      case sensitive from that version; currencyCode='EUR' (quoted) request form; non-USD prices are reference values; type
      Consumption, DevTestConsumption or Reservation (priceType filter); a Reservation row can have unitOfMeasure 1 Hour;
      isPrimaryMeterRegion marks billing meters; tierMinimumUnits on every row; at most 1,000 records per page and an
      absolute NextPageLink; Commercial cloud only.
  - url: https://azure.microsoft.com/pricing/details/cosmos-db/standard-provisioned/
    lastVerified: "2026-10-18"
    verifiedVia: >-

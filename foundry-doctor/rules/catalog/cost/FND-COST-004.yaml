id: FND-COST-004
version: 3
group: COST
title: "Informational monthly fixed-capacity estimate"
description: >-
  Report an informational, per-environment monthly range for the fixed-capacity resources in the compiled plan (AI Search
  units, API Management units, Cosmos DB provisioned RU/s and similar verified meters) using public retail prices, with the
  assumptions, region, currency, price date and the resources that are excluded. It never produces a pass or fail and never
  estimates token consumption.
status: product-opinion
phases: ["7"]
inputs: ["bicep-arm", "external-tool"]
basis: ["cost", "opinion"]
category: nice-to-have
pillar: cost
severity:
  dev: info
  test: info
  prod: info
compatibility:
  azd: ">=1.34.2 <=1.36.0"
  extensions: {}
  apiVersions:
    - { plane: management, provider: Microsoft.Search, resourceType: searchServices, version: "2025-05-01" }
    - { plane: management, provider: Microsoft.ApiManagement, resourceType: service, version: "2024-05-01" }
    - { plane: management, provider: Microsoft.DocumentDB, resourceType: databaseAccounts/throughputSettings, version: "2026-03-15" }
    - { plane: management, provider: Microsoft.DocumentDB, resourceType: databaseAccounts/sqlDatabases, version: "2025-04-15" }
    - { plane: management, provider: Microsoft.DocumentDB, resourceType: databaseAccounts/sqlDatabases/containers, version: "2025-04-15" }
  preview: true
  notes: >-
    azd range: the minimum is the lowest requiredAzdVersion among the Foundry extensions read (agents beta.18,
    projects beta.13 need >=1.34.2); the maximum is azd 1.36.0 (tag azure-dev-cli_1.36.0, acebba1e388b489a91ab8e2487a676359ab516a1, released 2026-10-14; the first clone read at 1.36.0-beta.1 is earlier evidence). The earlier >=1.27.1 lower
    bound came from a changelog and was not verified. Window widened 2026-10-16: azd to 1.36.0 (tag
    azure-dev-cli_1.36.0, acebba1, released 2026-10-14). The azd and extension changelogs and the schema and source
    diffs from the previously verified versions were read; none touches this rule's verified facts for the widened
    fields (see docs/tool-compatibility.md section 6).
evidence:
  description: >-
    From the compiled resource plan (resources whose condition is the literal false are ignored; a non-literal condition or a
    copy loop is listed as unsupported), derive fixed-capacity drivers - Search units as replicaCount x partitionCount for the
    sku.name (default compute and hosting mode only); API Management sku.capacity in the primary region; Cosmos DB manual
    provisioned throughput on throughputSettings and on SQL databases and containers (properties.options.throughput), priced in
    every region of the parent account's properties.locations. Map each driver to a retail meter through the supported-meter
    catalogue and multiply by the quantity and hours (730 by default, configurable). Prices come from the Azure Retail Prices
    API with api-version 2023-01-01-preview, priceType Consumption, the requested currency (verified on the answer), primary
    meter regions preferred and tiered rows excluded; more than one remaining price is ambiguous and not used. Report the low
    and high estimate (equal, because every estimated line is a fixed hourly meter), the price date, currency and cache use,
    and list every other resource - consumption-based or not modelled as excluded; fixed costs that cannot be priced (PTU
    deployments with their PTU count and type, Cosmos autoscale, multi-region write, free tier or zone redundancy, API
    Management additionalLocations, Search confidential compute or HighDensity, unknown or unresolved deployment SKUs,
    sovereign-cloud regions, unresolved values) as unsupported. Totals cover estimated lines only. Offline mode uses a cached
    price file and says so; no price is invented. Nothing is compared with actual spend. The check-time rule reports what makes
    the estimate incomplete, using the same extraction as the cost command.
  confidence: uncertain
recommendation: >-
  Treat the figure as a planning aid for comparing dev, test and prod fixed capacity, and confirm with the Azure pricing
  calculator and your own agreement before committing spend.
fix: |
  foundry-doctor cost --environment prod --compare dev
sources:
  - url: https://learn.microsoft.com/azure/search/search-sku-tier
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://learn.microsoft.com/azure/search/search-sku-tier; source file MicrosoftDocs/azure-ai-docs:
      articles/search/search-sku-tier.md; retrieved 2026-10-04
    note: Search units are replicas x partitions and are billed at a fixed hourly rate per unit and tier.
  - url: https://github.com/Azure/azure-rest-api-specs/blob/main/specification/search/resource-manager/Microsoft.Search/Search/stable/2025-05-01/search.json
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://github.com/Azure/azure-rest-api-specs/blob/main/specification/search/resource-manager/Microsoft.Search/Search/stable/2025-05-01/search.json
    note: >-
      replicaCount (1-12 standard, 1-3 basic) and partitionCount (1, 2, 3, 4, 6, 12) properties. Branch URL,
      not commit-pinned.
  - url: https://github.com/Azure/azure-rest-api-specs/blob/main/specification/apimanagement/resource-manager/Microsoft.ApiManagement/ApiManagement/stable/2024-05-01/apimdeployment.json
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://github.com/Azure/azure-rest-api-specs/blob/main/specification/apimanagement/resource-manager/Microsoft.ApiManagement/ApiManagement/stable/2024-05-01/apimdeployment.json
    note: >-
      sku.name enumeration and sku.capacity (number of deployed units; 0 for Consumption). Branch URL, not
      commit-pinned.
  - url: https://github.com/Azure/azure-rest-api-specs/blob/main/specification/cosmos-db/resource-manager/Microsoft.DocumentDB/DocumentDB/stable/2026-03-15/openapi.json
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://github.com/Azure/azure-rest-api-specs/blob/main/specification/cosmos-db/resource-manager/Microsoft.DocumentDB/DocumentDB/stable/2026-03-15/openapi.json
    note: ThroughputSettingsResource throughput or autoscaleSettings. Branch URL, not commit-pinned.
  - url: https://learn.microsoft.com/azure/foundry/concepts/manage-costs
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://learn.microsoft.com/azure/foundry/concepts/manage-costs; source file
      MicrosoftDocs/azure-ai-docs: articles/foundry/concepts/manage-costs.md; retrieved 2026-10-04
    note: Foundry estimates cover standard deployment costs only, not provisioned throughput, and do not reflect discounts or contracted pricing; invoices and meter records are the source of truth. Page ms.date 08/27/2026.
  - url: https://learn.microsoft.com/rest/api/cost-management/retail-prices/azure-retail-prices
    lastVerified: "2026-10-18"
    verifiedVia: >-
      https://learn.microsoft.com/en-us/rest/api/cost-management/retail-prices/azure-retail-prices (fetched 2026-10-18, page
      last updated 08/06/2024); recorded responses from https://prices.azure.com/api/retail/prices (search-engine snapshot of
      the public endpoint, 2026-10-18) in internal/cost/prices/testdata
    note: >-
      Unauthenticated endpoint https://prices.azure.com/api/retail/prices; api-version 2023-01-01-preview, filter values
      case sensitive from that version; currencyCode='EUR' (quoted) request form; non-USD prices are reference values; type
      Consumption, DevTestConsumption or Reservation (priceType filter); a Reservation row can have unitOfMeasure 1 Hour;
      isPrimaryMeterRegion marks billing meters; tierMinimumUnits on every row; at most 1,000 records per page and an
      absolute NextPageLink; Commercial cloud only.
  - url: https://azure.microsoft.com/pricing/details/cosmos-db/standard-provisioned/
    lastVerified: "2026-10-18"
    verifiedVia: >-
      https://azure.microsoft.com/en-us/pricing/details/cosmos-db/standard-provisioned/ and the same table on
      https://www.azure.cn/en-us/pricing/details/cosmos-db/ (search result text, 2026-10-18)
    note: >-
      Standard provisioned throughput is billed hourly per 100 RU/s across every account region (100 RU/s x N regions);
      multi-region write and availability-zone regions bill at different rates; autoscale bills 10-100% of the maximum per
      hour. The retail meter name 100 RU/s is not verified.
overlap:
  decision: native
  provisional: true
  coverage: none
  rationale: >-
    Advisor cost recommendations describe the deployed state after the fact and Azure Cost Management reports actual spend; neither
    produces a pre-deployment, per-environment estimate from the compiled plan. PSRule, Azure Policy, Checkov and the Bicep
    linter have no cost estimation. The PRD names Advisor cost recommendations as optional, separate deployed-state evidence, so
    no Advisor recommendation ID is mapped.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/cost
testability: >-
  Driver extraction is offline against fixture ARM JSON; pricing uses recorded Retail Prices API responses and a cache with a
  retrieval date, as the PRD testing strategy states.
tests:
  positive:
    - supported-search-or-apim-fixed-capacity-is-omitted-from-the-estimate-reports-an-incomplete-estimate-finding
    - cosmos-autoscale-or-parent-account-unresolved-reports-an-incomplete-estimate-finding
    - unknown-deployment-sku-or-provisioned-deployment-reports-an-incomplete-estimate-finding
    - unsupported-resource-is-not-listed-in-exclusions-reports-an-incomplete-estimate-finding
    - requested-dev-prod-comparison-omits-one-environment-reports-an-incomplete-comparison-finding
  negative:
    - estimate-includes-supported-fixed-capacity-and-explicitly-excludes-token-based-deployments
  skipped:
    - price-cache-missing-and-offline
    - meter-not-in-supported-catalogue
    - sku-or-capacity-unresolved-parameter
notes: >-
  Findings carry a Finding.Key per sub-check so fingerprints are stable.
  Informational only (PRD section 15). Marked product opinion because there is no platform rule to verify; the capacity drivers
  and property names are verified from the specifications and the Retail Prices API contract from Learn (2026-10-18). Verified
  meter names (recorded response 2026-10-18) - Search Basic Unit, Standard S1 Unit, Standard S3 Unit; API Management Developer
  Unit, Standard Unit, Basic v2 Unit. Unverified - the other Search and API Management meter names (naming pattern only), the
  Cosmos 100 RU/s meter name, whether provisioned throughput (PTU) meters can be priced from the public API, the Search default
  replica and partition counts when absent. Control-plane and Advisor inputs are deferred (ADR-025). Mapped IDs are intentionally
  empty.

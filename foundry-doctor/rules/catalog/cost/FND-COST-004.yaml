      multi-region write and availability-zone regions bill at different rates; autoscale bills 10-100% of the maximum per
      hour. The retail meter name 100 RU/s is not verified.
overlap:
  decision: native
  provisional: true
  coverage: none
  rationale: >-
    Advisor cost recommendations describe the deployed state after the fact and Azure Cost Management reports actual spend; neither
    produces a pre-deployment, per-environment estimate from the compiled plan. PSRule, Azure Policy, Checkov and the Bicep
    linter have no cost estimation. The PRD names Advisor cost recommendations as optional, separate deployed-state evidence, so
    no Advisor recommendation ID is mapped.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/cost
tests:
  positive:
    - supported-search-or-apim-fixed-capacity-is-omitted-from-the-estimate-reports-an-incomplete-estimate-finding
    - cosmos-autoscale-or-parent-account-unresolved-reports-an-incomplete-estimate-finding
    - unknown-deployment-sku-or-provisioned-deployment-reports-an-incomplete-estimate-finding
    - unsupported-resource-is-not-listed-in-exclusions-reports-an-incomplete-estimate-finding
    - requested-dev-prod-comparison-omits-one-environment-reports-an-incomplete-comparison-finding
    - 'TestCost004EstimateFinding: a priced plan reports exactly one estimate finding anchored on the first project by name'
    - 'TestCost004EstimateRangeAndStale: low-to-high range, stale-cache note and first-resource anchor'
    - 'TestCost004EstimateAnchorsOnAccountWithoutProject'
    - 'TestCost004UnpricedComponents: only components that could not be priced get incomplete:unpriced'
    - 'TestCost004NothingPricedForModellingGapKeepsIncompleteItem'
    - 'TestCost004CachedEstimatorOfflineFromPopulatedCache: real internal/cost estimator over a populated cache, network closed'
  negative:
    - estimate-includes-supported-fixed-capacity-and-explicitly-excludes-token-based-deployments
    - 'TestCost004NoEstimatorKeepsIncompleteOnly: no estimator wired, complete plan passes'
    - 'TestCost004UnpricedNotDuplicatedWithExtractionItem: no second item for a resource the extraction already reports'
    - 'TestCost004EstimateIsDeterministicAndKeyStable: same input gives the same result, a price change alters evidence but not the key'
  skipped:
    - price-cache-missing-and-offline
    - meter-not-in-supported-catalogue
    - sku-or-capacity-unresolved-parameter
    - 'TestCost004NothingPricedHasNoEstimateFinding: empty price source skips with price-cache-missing-and-offline'
    - 'TestCost004CachedEstimatorMissingCacheReportsUnpriced'
    - 'TestCost004EstimatorFailureSkips: an estimator error is a skip, never a pass'
    - 'TestCost004NoFixedCapacityDoesNotCallEstimator'
testability: >-
  Driver extraction is offline against fixture ARM JSON; pricing uses recorded Retail Prices API responses and a cache with a
  retrieval date, as the PRD testing strategy states. The rule tests inject a fake estimator and also run the real offline
  estimator over a cache populated from a local test server.
notes: >-
  Version 4 (behaviour change): the rule only listed what made the estimate incomplete; it now also reports the estimate
  itself, so a plan with fixed-capacity components gains an info finding (key estimate). Fingerprints include the rule version,
  so version 4 changes every fingerprint of this rule. Findings carry a Finding.Key per sub-check so fingerprints are stable
  across price changes. Layering: the estimate engine stays in internal/cost; the rule package defines a small Estimator
  function type and Providers (like the OPS rules), and internal/app/wire.go passes costrules.CachedEstimator, which wraps
  internal/cost in offline mode. internal/rules/cost depends on internal/cost, never on internal/app. The new skip head
  price-cache-missing-and-offline is not yet in internal/rules/skipclass.go by-design heads (the integrator must add it, or a
  strict run without a price cache reports a hidden check). Informational only (PRD section 15). Marked product opinion because
  there is no platform rule to verify; the capacity drivers and property names are verified from the specifications and the Retail
  Prices API contract from Learn (2026-10-18). Verified meter names (recorded response 2026-10-18) - Search Basic Unit, Standard
  S1 Unit, Standard S3 Unit; API Management Developer Unit, Standard Unit, Basic v2 Unit. Unverified - the other Search and API
  Management meter names (naming pattern only), the Cosmos 100 RU/s meter name, whether provisioned throughput (PTU) meters can be
  priced from the public API, the Search default replica and partition counts when absent. Control-plane and Advisor inputs are
  deferred (ADR-025). Mapped IDs are intentionally empty.

id: FND-COST-002
version: 4
group: COST
title: Dev avoids production-sized fixed SKUs
description: >-
  Environments classified as dev should not provision fixed-capacity SKUs that bill continuously regardless of use and are
  sized for production, such as provisioned-throughput (PTU) model deployments, AI Search standard2, standard3 or storage-optimised
  tiers or multiple replicas and partitions, API Management Premium or Isolated, or Cosmos DB throughput above a profile
  limit. What counts as production-sized is a Foundry Doctor opinion; the SKU names and billing model are documented.
status: product-opinion
phases:
- '1'
inputs:
- bicep-arm
basis:
- cost
- opinion
category: nice-to-have
pillar: cost
severity:
  dev: warning
  test: info
  prod: info
compatibility:
  azd: '>=1.34.2'
  extensions: {}
  apiVersions:
  - { plane: management, provider: Microsoft.CognitiveServices, resourceType: accounts/deployments, version: '2026-09-01' }
  - { plane: management, provider: Microsoft.Search, resourceType: searchServices, version: '2025-05-01' }
  - { plane: management, provider: Microsoft.ApiManagement, resourceType: service, version: '2024-05-01' }
  - { plane: management, provider: Microsoft.DocumentDB, resourceType: databaseAccounts/throughputSettings, version: '2026-03-15' }
  - { plane: management, provider: Microsoft.DocumentDB, resourceType: databaseAccounts/sqlDatabases, version: '2025-04-15' }
  - { plane: management, provider: Microsoft.DocumentDB, resourceType: databaseAccounts/sqlDatabases/containers, version: '2025-04-15' }
  preview: true
  notes: >-
    azd range: the minimum is the lowest requiredAzdVersion among the Foundry extensions read (agents beta.18,
    projects beta.13 need >=1.34.2); the maximum is azd 1.36.0 (tag azure-dev-cli_1.36.0, acebba1e388b489a91ab8e2487a676359ab516a1, released 2026-10-14; the first clone read at 1.36.0-beta.1 is earlier evidence). The earlier >=1.27.1 lower
    bound came from a changelog and was not verified. Window widened 2026-10-16: azd to 1.36.0 (tag
    azure-dev-cli_1.36.0, acebba1, released 2026-10-14). The azd and extension changelogs and the schema and source
    diffs from the previously verified versions were read; none touches this rule's verified facts for the widened
    fields (see docs/tool-compatibility.md section 6).
evidence:
  description: >-
    Evaluated only for environments the profile classifies as dev; test and prod environments are not evaluated. Offline,
    in the compiled template (sku.name after parameter-file and module-parameter substitution) - Foundry model deployments with
    sku.name GlobalProvisionedManaged, DataZoneProvisionedManaged or ProvisionedManaged, compared case-insensitively (reserved PTU
    capacity); a sku.name that is an unresolved expression makes the result uncertain; azure.yaml deployments are not read (ADR-025); Microsoft.Search/searchServices with sku.name standard2, standard3, storage_optimized_l1
    or storage_optimized_l2, or replicaCount or partitionCount greater than 1; Microsoft.ApiManagement/service with sku.name
    Premium or Isolated, or sku.capacity greater than 1; Microsoft.DocumentDB throughputSettings (properties.resource) and SQL databases and containers
    (properties.options.throughput and properties.options.autoscaleSettings.maxThroughput, CreateUpdateOptions in the
    2025-04-15 specification) with throughput or autoscale maximum above the profile limit (no default limit is shipped).
    Resources whose Bicep condition is the literal false are ignored; a non-literal condition or a copy loop makes the
    result uncertain. An exemption list in the profile silences intentional
    uses. A Cosmos DB account configured for the Foundry Agent Service standard setup needs at least 3000 RU/s in total
    (both provisioned and serverless modes are supported). The profile limit is applied exactly as configured; set it
    at or above 3000 for projects that use the standard agent setup.
    A dev environment is identified by the profile or the azd environment name mapping, never guessed.
  confidence: likely
recommendation: >-
  In dev use pay-per-token deployments (GlobalStandard or Standard), the Search free or basic tier with one replica and
  one partition, an API Management Developer or consumption-style tier, and the lowest Cosmos DB throughput that the Foundry
  Agent Service setup allows. Reserve production-sized capacity for test and production environments.
fix: |
  // Bicep - dev environment: a pay-per-token deployment type instead of a provisioned one.
  // Model name and version are placeholders; use a model available in your region.
  resource chat 'Microsoft.CognitiveServices/accounts/deployments@2026-09-01' = {
    parent: account
    name: 'chat'
    sku: { name: 'GlobalStandard', capacity: 10 }
    properties: {
      model: { format: 'OpenAI', name: '<model>', version: '<version>' }
    }
  }
sources:
- url: https://learn.microsoft.com/azure/foundry/foundry-models/concepts/deployment-types
  lastVerified: '2026-10-18'
  verifiedVia: >-
    https://learn.microsoft.com/azure/foundry/foundry-models/concepts/deployment-types (page last updated 08/12/2026),
    section "Deployment type comparison"; first read 2026-10-04 from MicrosoftDocs/azure-ai-docs
    articles/foundry/foundry-models/includes/concepts-deployment-types-content-6.md
  note: >-
    SKU codes and billing - GlobalStandard, DataZoneStandard, Standard (pay-per-token); GlobalProvisionedManaged,
    DataZoneProvisionedManaged, ProvisionedManaged (reserved PTU); GlobalBatch, DataZoneBatch (50% discount);
    DeveloperTier (pay-per-token, fine-tuned model evaluation). Minimum PTUs vary by model.
- url: >-
    https://github.com/Azure/azure-rest-api-specs/blob/main/specification/search/resource-manager/Microsoft.Search/Search/stable/2025-05-01/search.json
  lastVerified: '2026-10-04'
  verifiedVia: >-
    https://github.com/Azure/azure-rest-api-specs/blob/main/specification/search/resource-manager/Microsoft.Search/Search/stable/2025-05-01/search.json
  note: >-
    SkuName enumeration free, basic, standard, standard2, standard3, storage_optimized_l1,
    storage_optimized_l2; replicaCount and partitionCount ranges. The serverless value appears in the sku
    description and in preview 2026-03-01-preview and 2026-09-01-preview files. Branch URL, not commit-pinned.
- url: https://learn.microsoft.com/azure/search/search-sku-tier
  lastVerified: '2026-10-04'
  verifiedVia: >-
    https://learn.microsoft.com/azure/search/search-sku-tier; source file MicrosoftDocs/azure-ai-docs:
    articles/search/search-sku-tier.md; retrieved 2026-10-04
  note: >-
    Search units (replicas x partitions) are the billing unit for Dedicated services, billed at a fixed hourly rate per
    unit and tier.
- url: >-
    https://github.com/Azure/azure-rest-api-specs/blob/main/specification/apimanagement/resource-manager/Microsoft.ApiManagement/ApiManagement/stable/2024-05-01/apimdeployment.json
  lastVerified: '2026-10-04'
  verifiedVia: >-
    https://github.com/Azure/azure-rest-api-specs/blob/main/specification/apimanagement/resource-manager/Microsoft.ApiManagement/ApiManagement/stable/2024-05-01/apimdeployment.json
  note: >-
    ApiManagementServiceSkuProperties name enumeration Developer, Standard, Premium, Basic, Consumption,
    Isolated, BasicV2, StandardV2; capacity is the number of deployed units (0 for Consumption). Branch URL,
    not commit-pinned.
- url: >-
    https://github.com/Azure/azure-rest-api-specs/blob/main/specification/cosmos-db/resource-manager/Microsoft.DocumentDB/DocumentDB/stable/2026-03-15/openapi.json
  lastVerified: '2026-10-04'
  verifiedVia: >-
    https://github.com/Azure/azure-rest-api-specs/blob/main/specification/cosmos-db/resource-manager/Microsoft.DocumentDB/DocumentDB/stable/2026-03-15/openapi.json
  note: ThroughputSettingsResource has throughput or autoscaleSettings, not both. Branch URL, not commit-pinned.
- url: >-
    https://github.com/Azure/azure-rest-api-specs/blob/main/specification/cosmos-db/resource-manager/Microsoft.DocumentDB/DocumentDB/stable/2025-04-15/cosmos-db.json
  lastVerified: '2026-10-15'
  verifiedVia: >-

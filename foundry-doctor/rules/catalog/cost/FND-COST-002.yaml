  note: >-
    CreateUpdateOptions has integer throughput and autoscaleSettings.maxThroughput ("either throughput or autoscaleSettings,
    but not both") and is the options property of SQL database and container create-update properties. Fetched 2026-10-15.
- url: https://learn.microsoft.com/azure/foundry/agents/concepts/standard-agent-setup
  lastVerified: '2026-10-04'
  verifiedVia: >-
    https://learn.microsoft.com/azure/foundry/agents/concepts/standard-agent-setup; source file
    MicrosoftDocs/azure-ai-docs: articles/foundry/agents/includes/concepts-standard-agent-setup-content.md;
    retrieved 2026-10-04
  note: >-
    Standard setup needs a Cosmos DB for NoSQL account with at least 3000 RU/s total; provisioned throughput and serverless
    are both supported.
overlap:
  decision: native
  provisional: true
  coverage: none
  rationale: >-
    No PSRule, Azure Policy, Checkov or Bicep linter rule was found that flags oversized SKUs in non-production environments.
    PSRule Azure.Search.SKU points the other way (it warns against the Free tier for demanding workloads) and is a performance
    rule, so it is not mapped as equivalent. The value is the environment-aware correlation between the azd environment
    classification and the SKUs in the compiled Bicep template.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/cost
testability: >-
  Offline against fixture ARM JSON per environment (including a parameter-file-resolved PTU sku.name); each SKU family has one
  positive and one negative case.
tests:
  positive:
  - dev-environment-with-global-provisioned-managed-deployment
  - dev-search-standard3
  - dev-search-two-replicas
  - dev-apim-premium
  - dev-cosmos-throughput-above-profile-limit
  negative:
  - dev-global-standard-deployment
  - dev-search-basic-single-unit
  - prod-environment-with-provisioned-managed
  - dev-cosmos-at-configured-limit
  skipped:
  - environment-not-classified-as-dev
  - sku-value-is-unresolved-parameter
  - no-cosmos-limit-in-profile
notes: >-
  Findings carry a Finding.Key per sub-check so fingerprints are stable.
  Product opinion: no source defines production-sized. Unverified - minimum PTU quantities per model (documented as varying
  by model and not read); whether Standard, StandardV2 or BasicV2 APIM tiers are appropriate for dev (only Premium and Isolated
  are flagged); Cosmos DB account-level versus container-level throughput resources in Bicep (only the throughputSettings
  definition was read); Foundry hosted-agent container CPU and memory sizing is out of scope. SKU string comparison is case-insensitive (deployment, Search and API Management SKU names), because the
  specifications type sku.name as a free string. Cosmos options.throughput on SQL databases and containers was read in
  cosmos-db.json 2025-04-15 (CreateUpdateOptions); the other Cosmos APIs (MongoDB, Gremlin, Cassandra, Table) are not
  evaluated. The waf basis was removed after the Phase 0 Azure black belt review because no WAF pillar tag
  or WARA recommendation is cited here; the WAF mapping is added in Phase 4 when the guidance is verified.

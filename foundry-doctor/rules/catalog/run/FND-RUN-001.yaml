id: FND-RUN-001
version: 4
group: RUN
title: Effective project identity access
description: >-
  The Foundry project managed identity (system-assigned or user-assigned) must hold the roles the documented standard
  agent setup requires on the Azure AI Search, Azure Storage and Azure Cosmos DB resources bound to the project capability
  host. The rule resolves the bound resource IDs from the capability host connections, reads the project identity principal
  from the project ARM resource, and lists role assignments for that principal at or above each resource scope. Static
  phase (2) checks role assignments declared in compiled ARM JSON; live phase (3) checks the effective assignments.
  Only role assignment metadata is read; no data-plane content is read.
status: verified
phases: ["2", "3"]
inputs: [bicep-arm, control-plane]
basis: [platform, security]
category: must-have
pillar: security
severity:
  dev: error
  test: error
  prod: error
compatibility:
  azd: ""
  extensions:
    azure.ai.agents: ">=1.0.0-beta.18 <=1.0.0-beta.20"
  apiVersions:
    - { plane: management, provider: Microsoft.CognitiveServices, resourceType: accounts/projects, version: "2026-09-01" }
    - { plane: management, provider: Microsoft.CognitiveServices, resourceType: accounts/projects/capabilityHosts, version: "2026-09-01" }
    - { plane: management, provider: Microsoft.CognitiveServices, resourceType: accounts/capabilityHosts, version: "2026-09-01" }
    - { plane: management, provider: Microsoft.CognitiveServices, resourceType: accounts/projects/connections, operation: list, version: "2026-09-01" }
    - { plane: management, provider: Microsoft.CognitiveServices, resourceType: accounts/connections, operation: list, version: "2026-09-01" }
    - { plane: management, provider: Microsoft.Authorization, resourceType: roleAssignments, version: "2022-04-01" }
    - { plane: management, provider: Microsoft.DocumentDB, resourceType: databaseAccounts/sqlRoleAssignments, version: "2025-10-15" }
  preview: true
  notes: >-
    No dependency on azd behaviour. The overlapping check was read in azd extension azure.ai.agents 1.0.0-beta.18
    (internal/cmd/doctor/checks_storage_rbac.go); the core azd version was not pinned in the clone. azure.ai.agents
    1.0.0-beta.18: read for overlap only. Extension ranges are exactly the versions whose schemas or source were read;
    widen them in Phase 1 by reading older tags. Microsoft.CognitiveServices projects capabilityHosts connections
    2026-09-01: stable. Microsoft.Authorization/roleAssignments 2022-04-01: stable. Microsoft.DocumentDB
    sqlRoleAssignments 2025-10-15: stable. Window widened 2026-10-16: azure.ai.agents to 1.0.0-beta.20. The azd and
    extension changelogs and the schema and source diffs from the previously verified versions were read; none touches
    this rule's verified facts for the widened fields (see docs/tool-compatibility.md section 6).
evidence:
  description: >-
    Read-only probes. (1) GET project (2026-09-01) for the identity: identity.principalId for a system-assigned identity,
    and identity.userAssignedIdentities[*].principalId for each user-assigned identity (both paths VERIFIED in the 2026-09-01
    spec on 2026-10-17); the rule evaluates every principal the project carries and names which one it evaluated. (2) GET
    project capabilityHosts (2026-09-01) for storageConnections, threadStorageConnections and vectorStoreConnections, then
    GET project/account connections (2026-09-01) to resolve target resource IDs (never the list-with-secrets operation).
    (3) GET /{resourceId}/providers/Microsoft.Authorization/roleAssignments?api-version=2022-04-01 with $filter=principalId
    eq {id} at each bound resource scope (resource scope, allow-list operation runtime.roleassignments.list.resource).
    The filter returns assignments at, above or below the scope, so the rule keeps only assignments whose own scope is the
    resource or an ancestor of it (scope-aware); an assignment on a child scope (for example one container) is not an
    assignment on the resource. The roleDefinitionId of each kept assignment is compared by its GUID with the built-in role GUIDs
    in the rule (role-definition-aware; a role matched by display name alone is never accepted). The role definition is
    not fetched at runtime: the Azure built-in role names and GUIDs used (Search Service Contributor, Search Index Data
    Contributor, Storage Blob Data Contributor, Storage Blob Data Owner, Storage Account Contributor, Cosmos DB Operator,
    Owner, Contributor, Reader) were checked in MicrosoftDocs/azure-docs articles/role-based-access-control/built-in-roles.md
    on 2026-10-18. (4) For Cosmos DB, GET databaseAccounts/{account}/sqlRoleAssignments (2025-10-15; allow-list operation
    runtime.cosmos.sqlroleassignments). A sqlRoleAssignment carries roleDefinitionId, scope and principalId (VERIFIED in the
    2025-10-15 spec on 2026-10-17). The rule matches roleDefinitionId against the Cosmos DB Built-in Data Contributor
    SQL role GUID 00000000-0000-0000-0000-000000000002; that GUID is UNVERIFIED in this catalogue (sqlRoleDefinitions is not
    read, so a custom role is recognised only as "another role" and is Uncertain). The assignment is a grant when its scope
    is the Cosmos account or the database /dbs/enterprise_memory (the database named in the Foundry standard agent setup;
    not re-verified); a grant scoped to any other database, to a collection or to an unrecognised path is Uncertain.

    Expected roles (Foundry standard agent setup tables): Search Index Data Contributor and Search Service Contributor on
    Search; Storage Blob Data Contributor and Storage Blob Data Owner (the setup tables scope them to the project containers; the rule checks the storage account and its ancestors, and a container-scoped grant is Uncertain); Cosmos DB Built-in Data
    Contributor on the enterprise_memory database. Storage Account Contributor and Cosmos DB Operator at account level are
    expected for the system-assigned identity only, as the setup tables list them; they are not required of a
    user-assigned identity, and a missing one is never reported for a user-assigned principal.

    Outcomes. A missing expected role at a contained scope is a Fail, reported with confidence capped at medium
    ('likely'). A custom or unrecognised role covering the target, a conditional assignment of the expected role, a Blob
    data role assigned only at container scope (an assignment below the target), an Owner or Contributor assignment for a
    management-plane role (Search Service Contributor, Storage Account Contributor, Cosmos DB Operator: these roles may
    include the needed actions, which are not resolved), a root or management-group assignment that cannot be tied to the
    target, or a truncated listing is Uncertain, never Pass and never Fail. Owner, Contributor and Reader never satisfy a
    data role. Storage Blob Data Owner satisfies Storage Blob Data Contributor. Group-based assignments, deny assignments
    and ABAC conditions are not evaluated by this rule: the principalId filter returns assignments to the principal itself,
    so a role granted through a group is not seen and a deny assignment is not applied; the finding evidence says so. Key,
    SAS and service-principal connections are Skipped. A resource-backed connection (one that stands for a Search, Storage or Cosmos DB resource) whose
    ARM resource ID cannot be resolved from the connection (no ARM ID in metadata.ResourceId or properties.target) is Uncertain
    with the reason 'effective access was not checked'; it is never Pass and never omitted (loop 2, 2026-10-18). Required permission of the doctor:
    Microsoft.Authorization/roleAssignments/read at the bound resource scopes, and ARM read on the
    project and Cosmos account. Vantage point: control plane only, any network. Metadata read: IDs, role definition IDs,
    principal IDs. Never keys, documents, threads or vectors.
  confidence: likely
recommendation: >-
  Assign the project managed identity the roles the Foundry standard agent setup lists on each bound resource, at the
  narrowest scope that contains the resources. Assign Cosmos DB Built-in Data Contributor with a Cosmos SQL role
  assignment, not the Access control (IAM) blade.
fix: |-
  resource searchIndexData 'Microsoft.Authorization/roleAssignments@2022-04-01' = {
    name: guid(search.id, project.id, '8ebe5a00-799e-43f5-93ac-243d3dce84a7')
    scope: search
    properties: {
      principalId: project.identity.principalId
      principalType: 'ServicePrincipal'
      roleDefinitionId: subscriptionResourceId('Microsoft.Authorization/roleDefinitions', '8ebe5a00-799e-43f5-93ac-243d3dce84a7') // Search Index Data Contributor
    }
  }

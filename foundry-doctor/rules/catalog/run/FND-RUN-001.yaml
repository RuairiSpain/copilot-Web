overlap:
  decision: adapt
  provisional: true
  coverage: partial
  rationale: >-
    azd ai agent doctor (check remote.project-storage-rbac) already evaluates project managed identity permissions for
    Storage connections bound to the capability host, ARM role assignments with a principalId filter and NotDataActions.
    It does not cover Azure AI Search or Cosmos DB, does not run outside azd, and does not read compiled Bicep. The idea
    is adapted (not wrapped, because the extension is an interactive developer tool tied to azure.yaml and the azd environment) and
    extended to Search and Cosmos with one evidence model for compiled ARM and the live project. No PSRule, Policy, Defender
    or Advisor equivalent was found for project-identity effective access.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/run
tests:
  positive:
    - Search Service Contributor missing on the bound search service
    - Cosmos DB Built-in Data Contributor missing from sqlRoleAssignments
    - Storage Blob Data Owner missing on the storage account
    - Cosmos sqlRoleAssignment for another principal only, the project principal has none
    - user-assigned project identity lacks Search Index Data Contributor (the user-assigned principalId is the one evaluated)
  negative:
    - project identity holds all expected roles on Search, Storage containers and Cosmos database
    - role assigned at a parent scope is counted as inherited
    - user-assigned project identity holds the user-assigned roles; Storage Account Contributor and Cosmos DB Operator are not demanded of it
    - Cosmos sqlRoleAssignment of the built-in data contributor role at the account scope or the enterprise_memory database
  skipped:
    - caller cannot read role assignments (403)
    - connection uses account key, SAS or service principal
    - project has no capability host or no bound resources
  uncertain:
    - custom role (Azure RBAC role definition or Cosmos CustomRole) or conditional assignment whose data actions cannot be resolved
    - container-scoped Blob assignment (a child scope is not an assignment on the account)
    - role granted only through a group or blocked by a deny assignment cannot be seen (reported as likely, not certain)
    - role assignment on a child scope of the resource is not counted as a grant on the resource
    - Cosmos assignment of the data contributor role on another database or a collection, or of a different (custom) role
    - Owner or Contributor covers a management-plane role (Search Service Contributor, Storage Account Contributor, Cosmos DB Operator)
    - assignment listing truncated or unreadable
    - resource-backed connection with no resolvable ARM resource ID (reported as effective access was not checked; never a pass)
testability: Deterministic against recorded ARM JSON fixtures; live mode needs read access to role assignments.
notes: >-
  Loop 2 (2026-10-18): a resource-backed connection whose ARM ID cannot be resolved is Uncertain ('effective access was not
  checked'), closing a false pass (Foundry lead round 2 C1). Group-based assignments are not evaluated; the principalId filter
  does not return them, so group-granted roles are not seen (Azure black belt round 2 NB6: the Cosmos container-scope case stays
  Uncertain, by design).
  Loop 1 (2026-10-17; synced to the Go code 2026-10-18): scope-aware, GUID-based role matching (role definitions are not
  fetched); user-assigned principal; Cosmos matching by roleDefinitionId GUID and scope; group and deny assignments are not
  evaluated (confidence capped at medium). Verified 2026-10-18: the built-in role names and GUIDs in built-in-roles.md.
  Unverified: the Cosmos DB Built-in Data Contributor SQL role GUID (00000000-0000-0000-0000-000000000002) and the
  enterprise_memory database name as read from this catalogue; exact built-in role action lists. The expected-role set
  follows the Foundry docs and may differ for the capability settings flow, where Azure AI Search needs no caller role.

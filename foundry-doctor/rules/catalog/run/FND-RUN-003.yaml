id: FND-RUN-003
version: 3
group: RUN
title: Capability host and project connections healthy
description: >-
  The project and its capability host must be provisioned successfully, and the connections the capability host binds
  (AI services, storage, thread storage and vector store) must exist on the project or be shared to it and report no
  connection error. The rule also applies the cross-resource-group scope policy (ADR-021 e, ADR-022) to connection targets: a
  connection whose target resource ID (`metadata.ResourceId` when present, otherwise `properties.target` when that is itself an ARM resource ID) is outside the project's resource group and outside every
  `--approved-scope` is a finding. The rule reads ARM provisioning state and connection metadata only; connection
  credentials are never requested.
status: verified
phases: ["3"]
inputs: [control-plane]
basis: [platform, reliability]
category: must-have
pillar: reliability
severity:
  dev: error
  test: error
  prod: error
compatibility:
  azd: ""
  extensions:
    azure.ai.agents: ">=1.0.0-beta.18 <=1.0.0-beta.20"
  apiVersions:
    - { plane: management, provider: Microsoft.CognitiveServices, resourceType: accounts/projects, version: "2026-09-01" }
    - { plane: management, provider: Microsoft.CognitiveServices, resourceType: accounts/projects/capabilityHosts, version: "2026-09-01" }
    - { plane: management, provider: Microsoft.CognitiveServices, resourceType: accounts/capabilityHosts, version: "2026-09-01" }
    - { plane: management, provider: Microsoft.CognitiveServices, resourceType: accounts/projects/connections, operation: list, version: "2026-09-01" }
    - { plane: management, provider: Microsoft.CognitiveServices, resourceType: accounts/connections, operation: list, version: "2026-09-01" }
  preview: true
  notes: >-
    No azd dependency: ARM reads; no azd behaviour dependency azure.ai.agents 1.0.0-beta.18: read for overlap only.
    Extension ranges are exactly the versions whose schemas or source were read; widen them in Phase 1 by reading
    older tags. Microsoft.CognitiveServices accounts/projects projects/capabilityHosts accounts/capabilityHosts
    projects/connections 2026-09-01: stable. Window widened 2026-10-16: azure.ai.agents to 1.0.0-beta.20. The azd and
    extension changelogs and the schema and source diffs from the previously verified versions were read; none touches
    this rule's verified facts for the widened fields (see docs/tool-compatibility.md section 6).
evidence:
  description: >-
    Read-only ARM probes, api-version 2026-09-01. GET .../accounts/{a}/projects/{p}: properties.provisioningState must be
    Succeeded (enum Accepted, Creating, Deleting, Moving, Failed, Succeeded, Canceled, ResolvingDNS). GET
    .../projects/{p}/capabilityHosts and .../accounts/{a}/capabilityHosts: properties.provisioningState (Succeeded, Failed,
    Canceled, Creating, Updating, Deleting). Failed or Canceled is Fail; Creating, Updating, Deleting or Accepted is Uncertain
    (operation in progress), never Pass. GET .../projects/{p}/connections and .../accounts/{a}/connections (never the
    list-with-credentials operation): every name in capability host aiServicesConnections, storageConnections,
    threadStorageConnections and vectorStoreConnections must exist; a non-empty ConnectionPropertiesV2.error is Fail
    (described in the spec as the error message if the connection fails). Scope policy (ADR-022): the connection target resource ID is `metadata.ResourceId` when that
    key is present, otherwise `properties.target` when that value is itself an ARM resource ID. `properties.target` is a
    string property VERIFIED in the 2026-09-01 spec on 2026-10-17; `metadata` is typed as a free string map in the ARM spec,
    so the key name ResourceId is a documented-in-Learn convention (docs/development/phase-1-fact-check.md row 6: the Foundry
    docs describe `metadata.ResourceId` as the ARM ID, while `target` is a URL for the categories checked) and is
    UNVERIFIED as a schema fact. If the resolved ID is a literal ARM resource ID and it is not in the project's resource group
    and not under an `--approved-scope` (a `runtime` flag, repeatable; path-boundary match, the same rule as the Phase 2
    scope policy), the connection is a finding that names the connection and the target. A resolved value that is an
    unresolved template expression (starts with `[`, or contains `${`, `parameters(`, `reference(` or `resourceId(`) is Uncertain.
    A connection of a resource-backed category (cognitivesearch, cosmosdb, azurestorageaccount, azureblob, adlsgen2,
    azureopenai, aiservices) that yields no resource ID (an endpoint-URL `target` and no `metadata.ResourceId`) is
    Uncertain: the scope policy was not evaluated, never Pass. A connection of any other category with no resource ID is
    not evaluated. Required
    permission: ARM read on the account
    and project (Reader scope); exact resource provider action names were not verified in the clones. Vantage point: control
    plane, any network. Metadata read: names, provisioning states, connection category/authType/target. Never credentials,
    keys, or content.
  confidence: likely
recommendation: >-
  Inspect the failing capability host or project in the Foundry portal or with az rest, correct the underlying cause (for
  example a missing role or a deleted bound resource), and redeploy the capability host. Recreate any missing connection
  with the same name the capability host references.
fix: |-
  resource capHost 'Microsoft.CognitiveServices/accounts/projects/capabilityHosts@2026-09-01' = {
    parent: project
    name: 'default'
    properties: {
      capabilityHostKind: 'Agents'
      storageConnections: [ storageConnection.name ]
      threadStorageConnections: [ cosmosConnection.name ]
      vectorStoreConnections: [ searchConnection.name ]
    }
  }
sources:
  - url: https://github.com/Azure/azure-rest-api-specs/blob/main/specification/cognitiveservices/resource-manager/Microsoft.CognitiveServices/CognitiveServices/stable/2026-09-01/cognitiveservices.json
    lastVerified: "2026-10-17"
    verifiedVia: >-
      https://github.com/Azure/azure-rest-api-specs/blob/main/specification/cognitiveservices/resource-manager/Microsoft.CognitiveServices/CognitiveServices/stable/2026-09-01/cognitiveservices.json
    note: >-
      CapabilityHostProvisioningState, ProvisioningState, CapabilityHostProperties and
      ConnectionPropertiesV2.error read from the definitions; paths Projects_Get, ProjectCapabilityHosts_List,
      project connections. Branch URL, not commit-pinned.
  - url: https://learn.microsoft.com/azure/foundry/agents/concepts/capability-hosts
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://learn.microsoft.com/azure/foundry/agents/concepts/capability-hosts; source file
      MicrosoftDocs/azure-ai-docs: articles/foundry/agents/concepts/capability-hosts.md; retrieved 2026-10-04
    note: Capability host binding model (referenced by the azd extension README).
  - url: https://github.com/Azure/azure-dev/blob/main/cli/azd/extensions/azure.ai.agents/internal/cmd/doctor/checks_connections.go
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://github.com/Azure/azure-dev/blob/main/cli/azd/extensions/azure.ai.agents/internal/cmd/doctor/checks_connections.go
    note: >-
      Overlap source (remote.connections) and README Project storage diagnostics (capability host read at
      api-version 2025-06-01 in storage_rbac_query.go). Branch URL, not commit-pinned.
overlap:
  decision: native
  provisional: true
  coverage: partial
  rationale: >-
    azd ai agent doctor check remote.connections only confirms that connection names configured in azure.yaml exist on the
    project (name matching); its storage diagnostics read the capability host to resolve storage bindings. Neither reads
    capability host or project provisioningState nor connection error. Azure Policy and PSRule do not model capability
    hosts. Correlating the capability host bindings with connection existence and state is Foundry-specific.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/run
tests:
  positive:
    - capability host provisioningState Failed
    - bound storage connection name missing from project and account connections
    - connection reports a non-empty error
    - connection target is a literal ARM ID in another resource group and no --approved-scope matches
  negative:
    - project and capability host Succeeded, all bound connections exist without error
    - connection target is a literal ARM ID in another resource group that --approved-scope covers (path-boundary match)
    - connection target is a literal ARM ID in the project's resource group
  skipped:
    - caller lacks ARM read on the project
    - project has no capability host (standard agent setup not used)
  uncertain:
    - capability host Creating or Updating
    - connection shared to the project but account connections unreadable
    - resource-backed connection exposes no resource ID (endpoint-URL target and no metadata.ResourceId), so the scope policy was not evaluated
    - connection target resource ID is an unresolved template expression
testability: Deterministic against recorded ARM responses; live mode needs ARM read on the account and project.
notes: >-
  Loop 1 (2026-10-17; synced to the Go code 2026-10-18): scope policy for connection targets added (ADR-022); the resource ID is metadata.ResourceId when present, else an ARM-ID target. Verified in the 2026-09-01 spec on
  2026-10-17: ProjectCapabilityHosts_List, ProjectConnections_List, AccountCapabilityHosts_List, AccountConnections_List;
  CapabilityHostProperties aiServicesConnections, storageConnections, threadStorageConnections, vectorStoreConnections;
  ConnectionPropertiesV2 authType, category, error, metadata, peRequirement, peStatus, target. Unverified: whether
  ConnectionPropertiesV2.error is populated by the service for every unhealthy connection (the spec
  only says it holds the error message if the connection fails); peRequirement and peStatus (Required/NotRequired/NotApplicable
  and Inactive/Active/NotApplicable) are deliberately not used as pass/fail because no source says what an Inactive
  status means for health.

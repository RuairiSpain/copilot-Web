overlap:
  decision: native
  provisional: true
  coverage: partial
  rationale: >-
    Azure Policy 1b4d1c4e (Diagnostic logs in Azure AI services resources should be enabled), b4330a05 (Resource logs in
    Search services) and the DINE deployments 55d1f543 and 08ba64b8 check or create the diagnostic setting; they cannot
    observe whether rows arrive. No PSRule rule for Foundry diagnostic settings was found. The arrival check and its traffic
    correlation are new. The configuration half belongs to an OPS rule that should reuse the Policy mappings.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: searched-match
      matches:
      - 1b4d1c4e-934c-4703-944c-27c82c06bebb
      - b4330a05-a843-4bc8-bf9a-cacce50c67f4
      - 55d1f543-d1b0-4811-9663-d6d0dbc6326d
      - 08ba64b8-738f-4918-9686-730d2ed79c7d
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/run
tests:
  positive:
  - AzureDiagnostics destination, setting present for over two hours, traffic in window, zero rows from the PrimaryResult table
  negative:
  - diagnostic setting present, traffic in window, the query (addressed with the workspace GUID) returns rows for RequestResponse
  skipped:
  - no diagnostic setting to a workspace
  - caller cannot query the workspace
  - workspace network-isolated from this vantage point
  uncertain:
  - setting created less than two hours ago
  - setting age not reported (neither lastModifiedAt nor createdAt)
  - no traffic in the window
  - destination uses resource-specific tables (logAnalyticsDestinationType Dedicated); no query is run
  - workspace GUID (customerId) cannot be resolved from the workspace GET
testability: Deterministic against recorded Monitor and query responses; live mode needs Monitor and workspace read access.
notes: >-
  Loop 1 (2026-10-17, synced to the Go code 2026-10-18; logQuery bypass removed, ADR-021 g closed): workspace GUID resolution, destination type from the setting, PrimaryResult table, endswith KQL,
  resource-specific is Uncertain. Unverified: Log Analytics query REST spec file and required workspace role; the stable API version for diagnostic settings
  (only 2021-05-01-preview and 2017-05-01-preview were found); resource-specific table names for Foundry. Defender and Advisor
  IDs not available in any clone. Implementation constraints (security review): validate the account name against the ARM
  name charset [A-Za-z0-9._-]{1,64} and place it only in a fixed aggregate-only template; reject any query
  containing project, take, top, message or *; the query call goes through the transport allow-list (ADR-021 g exit criterion); add a test with a hostile name. See ADR-006 items 7 and 8.

id: FND-RUN-007
version: 3
group: RUN
title: Diagnostic logs are arriving
description: >-
  A Foundry account that has a diagnostic setting sending resource logs to Log Analytics should show recent log rows in
  the destination workspace when traffic exists. The rule confirms the setting exists, then runs one bounded, count-only
  query. Logs can take up to two hours to appear, so an empty result for a recently changed setting or an idle resource
  is Uncertain, not Fail.
status: verified
phases:
- '3'
inputs:
- control-plane
- data-plane
basis:
- operations
category: nice-to-have
pillar: operations
severity:
  dev: info
  test: warning
  prod: warning
compatibility:
  azd: ''
  extensions: {}
  apiVersions:
  - { plane: management, provider: Microsoft.Insights, resourceType: diagnosticSettings, version: '2021-05-01-preview' }
  - { plane: management, provider: Microsoft.Insights, resourceType: metrics, version: '2024-02-01' }
  - { plane: management, provider: Microsoft.OperationalInsights, resourceType: workspaces, version: '2025-02-01' }
  preview: true
  notes: >-
    No azd dependency: Azure Monitor reads; no azd behaviour dependency Microsoft.Insights/diagnosticSettings 2021-05-01-preview:
    the only version in the spec clone; no stable version found. Microsoft.Insights/metrics 2024-02-01: stable. Added the Log Analytics workspace GET (Microsoft.OperationalInsights/workspaces 2025-02-01: stable, Workspaces_Get and properties.customerId read in the spec 2026-10-18; a newer stable 2026-03-01 exists and was not read). The Log Analytics
    query API is versioned in its path (v1) and no api-version query parameter is sent; it is not a date API version and
    is documented in the evidence rather than in apiVersions (the validator accepts the literal v1 on the data plane only).
evidence:
  description: >-
    Probe 1: GET /{accountResourceId}/providers/Microsoft.Insights/diagnosticSettings?api-version=2021-05-01-preview; at
    least one setting with a workspaceId (the workspace ARM ID) and an enabled RequestResponse or Audit category (or the allLogs category group) must
    exist; the category group audit is not assumed to include these categories, otherwise the rule is Skipped as not configured (configuration is the concern of an OPS rule, not this one).
    The setting's logAnalyticsDestinationType gives the destination table family (VERIFIED in the 2021-05-01-preview spec
    on 2026-10-17: Dedicated, or null for the default AzureDiagnostics). Probe 2 (traffic): Microsoft.Insights/metrics
    for AzureOpenAIRequests over the same window (see FND-RUN-004 for the query keys); no traffic is Uncertain.
    Probe 3a (workspace identifier): GET the workspace ARM ID from the setting with api-version=2025-02-01 (allow-list
    operation runtime.workspace.get; Workspaces_Get, Microsoft.OperationalInsights/workspaces; the property
    properties.customerId is the workspace GUID, VERIFIED in the 2025-02-01 spec on 2026-10-18). The query endpoint is addressed with that GUID (customerId), not
    with the workspace ARM ID or the workspace name. Probe 3b: POST https://api.loganalytics.azure.com/v1/workspaces/{customerId}/query
    (read-only despite the verb; allow-list operation runtime.loganalytics.query through the shared transport with retry, 429
    handling, a response size cap and redirect refusal; the origin, the path, the body fields query and timespan and the
    workspaceId-is-a-GUID statement are VERIFIED 2026-10-18 in azure-monitor-docs logs/api/request-format.md; the token
    scope is https://api.loganalytics.io/.default, VERIFIED 2026-10-18 in logs/api/access-api.md, which uses the .io
    audience for tokens while the request goes to the .azure.com origin; the RBAC action for the query is UNVERIFIED) with a fixed aggregate Kusto query, only when destination type is the default AzureDiagnostics:
    AzureDiagnostics | where ResourceProvider == "MICROSOFT.COGNITIVESERVICES" | where ResourceId endswith "/ACCOUNTS/<ACCOUNT>"
    | where TimeGenerated > ago(<window>) | summarize count() by Category. The ResourceId comparison is an upper-case
    endswith on the account suffix (AzureDiagnostics stores ResourceId in upper case; that storage form is UNVERIFIED,
    so the comparison is case-insensitive in intent and a zero-row result is judged against the traffic evidence, not on
    its own). The response is read from the table named PrimaryResult in the tables array (the documented response example in
    logs/api/response-format.md names it PrimaryResult, VERIFIED 2026-10-18); any other table is ignored. The query projects only Category and a count; message,
    request, response and properties columns are never selected. Fail requires traffic in the window (any non-zero Total from the metric), the setting age known and at least two hours,
    and a total of zero rows from the AzureDiagnostics query (any row of any category counts as logs arriving). If the
    setting age is not reported (neither systemData.lastModifiedAt nor createdAt parses) the result is Uncertain: a recent
    change cannot be excluded. A setting younger than two hours is Uncertain. A destination with logAnalyticsDestinationType
    Dedicated (resource-specific tables) is Uncertain: the AzureDiagnostics count does not apply and the Foundry
    resource-specific table names are not known, so no query is run and no Fail is possible. The metric returning no time
    series, or a total of zero, is Uncertain (traffic unknown). Required permission: read of diagnostic settings and of the workspace resource
    (Microsoft.OperationalInsights/workspaces/read) and a Log Analytics reader permission on the workspace; the built-in
    role names (Monitoring Reader for metrics, Log Analytics Reader for the query) are UNVERIFIED. Vantage point: control
    plane and the Log Analytics query endpoint, any network unless the workspace is network-isolated, in which case
    Skipped. Metadata read: setting names, categories, row counts.
  confidence: likely
recommendation: >-
  Enable a diagnostic setting for the Foundry account that sends Audit and Request and Response logs to a Log Analytics
  workspace, wait up to two hours, and confirm rows with a count query. Check workspace access and ingestion errors if rows
  stay at zero while the account has traffic.
fix: |-
  resource diag 'Microsoft.Insights/diagnosticSettings@2021-05-01-preview' = {
    name: 'to-law'
    scope: account
    properties: {
      workspaceId: law.id
      logs: [
        { category: 'Audit', enabled: true }
        { category: 'RequestResponse', enabled: true }
      ]
    }
  }

overlap:
  decision: native
  provisional: true
  coverage: none
  rationale: >-
    Azure Policy c4bc6f10 (Configure Cognitive Services accounts to use private DNS zones) configures zone group association;
    it does not observe resolution from a vantage point. PSRule Azure.AI.PrivateEndpoints and Policy EnablePrivateEndpoints
    audits check that a private endpoint exists, not that the name resolves privately. Observing the answer from the declared
    vantage point, and refusing to Pass elsewhere, is the Foundry Doctor value. azd ai agent doctor has no DNS check. Evidence
    difference is total: PSRule Azure.AI.PrivateEndpoints checks that a private endpoint exists and the Azure Policy built-in
    is a DeployIfNotExists that configures DNS zones; neither tests resolution.
  research:
    psrule:
      state: searched-match
      matches:
      - Azure.AI.PrivateEndpoints
    azurePolicy:
      state: searched-match
      matches:
      - c4bc6f10-cb41-49eb-b000-d5ab82e2a091
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/run
tests:
  positive:
  - asserted in-VNet vantage point, the Search service is proven private-endpoint-backed, and its FQDN resolves to a clearly public IP
  - asserted in-VNet vantage point, the dependency is proven private-endpoint-backed, and its FQDN returns NXDOMAIN
  - asserted in-VNet vantage point, the Foundry account has an Approved private endpoint connection and its FQDN (from customSubDomainName) resolves to a public IP
  negative:
  - asserted in-VNet vantage point and every FQDN resolves to a private IP
  - public-IP answer for a dependency with no private endpoint is not a Fail (Uncertain)
  skipped:
  - vantage point is outside the VNet or not declared
  - resolver unavailable, timed out (per-probe --timeout) or SERVFAIL (distinct from NXDOMAIN)
  - no private-endpoint-backed dependency is in scope
  uncertain:
  - public-IP or NXDOMAIN answer for a dependency not proven private-endpoint-backed
  - dependency's connection does not report peStatus Active (private-endpoint backing not proven, so not probed)
  - the Foundry account's network exposure could not be read (hides the check; not the by-design 'nothing in scope')
  - the Foundry account has only Pending, Rejected or Disconnected private endpoint connections (no Approved proof)
  - the account has no customSubDomainName (FQDN cannot be built)
  - an answer that is neither private nor clearly public
  - split-horizon custom DNS returns different answers on repeated lookups
testability: Resolver is an injected interface so tests use fake answers; real validation needs a host inside the VNet.
notes: >-
  Loop 2 (2026-10-18): confidence lowered from certain to likely because the vantage is asserted; only Approved private
  endpoint connections are proof; a clearly public address is a Fail only when private-endpoint-backed, other non-private
  answers are Uncertain; an unreadable account network read is Uncertain or Skipped and never the by-design 'nothing in
  scope'; FQDNs use customSubDomainName; NXDOMAIN versus timeout mapping stated. Azure black belt round 2 NB1: the
  resolver wiring left the NXDOMAIN branch dead, fixed in the Go patch (pending re-review). NB2 and NB3 above. The private
  address definition remains UNVERIFIED.
  Loop 1 (2026-10-17; synced to the Go code 2026-10-18; the private DNS VNet-link probe was removed): Fail gated on private-endpoint evidence; NXDOMAIN distinct from timeout; vantage stated as user
  asserted. Unverified: what counts as a private address (RFC 1918 versus any VNet range) is not stated in the Foundry docs; the docs
  say the name must resolve to a private IP address. The full Policy GUID was read from the definition file; it should be
  re-checked when the mapping is finalised. Defender and Advisor IDs were not available in any clone.

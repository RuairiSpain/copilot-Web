id: FND-RUN-002
version: 2
group: RUN
title: Private DNS resolves from an appropriate vantage point
description: >-
  For each private-endpoint-backed dependency of a Foundry project (Foundry account, Azure AI Search, Azure Cosmos DB, Azure
  Storage blob), the service FQDN must resolve to a private IP address when resolved from inside the virtual network that
  hosts the agent and private endpoint subnets. Resolution from outside the VNet is not evidence either way, so the rule
  is Skipped there and is never Passed. The vantage point is asserted by the operator (`--vantage vnet`); the doctor cannot
  verify where it runs, and every result says so. A public answer for a dependency that is not proven to be backed by a
  private endpoint is not a failure: public endpoints are a valid configuration.
status: verified
phases:
- '3'
inputs:
- network
- control-plane
basis:
- platform
category: must-have
pillar: reliability
severity:
  dev: error
  test: error
  prod: error
compatibility:
  azd: ''
  extensions: {}
  apiVersions:
  - { plane: management, provider: Microsoft.Network, resourceType: privateDnsZones, version: '2018-09-01' }
  - { plane: management, provider: Microsoft.Network, resourceType: privateDnsZones/virtualNetworkLinks, version: '2018-09-01' }
  preview: false
  notes: >-
    No azd dependency: DNS lookup and ARM reads; no azd behaviour dependency Microsoft.Network/privateDnsZones and virtualNetworkLinks
    2018-09-01: stable.
evidence:
  description: >-
    Probe 1 (data-plane-free): resolve each FQDN (for example <account>.cognitiveservices.azure.com, <account>.openai.azure.com,
    <account>.services.ai.azure.com, <search>.search.windows.net, <cosmos>.documents.azure.com, <storage>.blob.core.windows.net)
    with the operating-system resolver of the host that runs the doctor and compare the answers to private address space.
    The vantage point is user asserted: the operator declares `--vantage vnet`; the doctor does not and cannot verify it,
    and each finding states 'vantage point asserted by the operator, not verified'. Any other vantage point yields Skipped
    with reason "private DNS resolves only from inside the VNet".
    Pass requires the asserted in-VNet vantage point AND every answer is a private IP.
    Fail requires the asserted in-VNet vantage point AND the dependency proven private-endpoint-backed by control-plane
    evidence that the finding names (a private endpoint connection on the dependency; the evidence reference is part of
    the finding) AND either a public-IP answer or an NXDOMAIN answer. A public-IP or NXDOMAIN answer for a dependency that is
    not proven private-endpoint-backed is Uncertain (it may be a public endpoint by design), never Fail.
    NXDOMAIN (the resolver answered that the name does not exist) is a different outcome from a timeout, SERVFAIL or no
    resolver: those are Skipped as 'resolver unavailable' with the error class named, never Fail and never Pass.
    Probe 2 (control plane, any vantage point, read only): GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Network/privateDnsZones/{zone}/virtualNetworkLinks?api-version=2018-09-01
    to report zones with no link or virtualNetworkLinkState other than Completed as supporting context (never a Pass and
    never the sole basis of a Fail). Its wiring into the runtime command is tracked in the Phase 3 hand-off; this
    entry describes the evidence model, not an assumption that the probe runs. Required permission: ARM read on the
    private DNS zones (probe 2 only) and on the dependency's private endpoint connections (proof for Fail); probe 1 needs
    none. Metadata read: DNS answers and zone link names. No request is sent to the data plane, so no content is touched.
  confidence: certain
recommendation: >-
  Link each required privatelink zone to the VNet that hosts the agent client and private endpoint subnets, configure conditional
  forwarders to 168.63.129.16 where custom DNS is used, and re-run the doctor from a machine inside the VNet.
fix: |-
  resource searchDnsLink 'Microsoft.Network/privateDnsZones/virtualNetworkLinks@2018-09-01' = {
    parent: searchPrivateDnsZone // privatelink.search.windows.net
    name: 'link-to-agent-vnet'
    location: 'global'
    properties: {
      virtualNetwork: { id: agentVnet.id }
      registrationEnabled: false
    }
  }
sources:
- url: https://learn.microsoft.com/azure/foundry/agents/how-to/virtual-networks
  lastVerified: '2026-10-04'
  verifiedVia: >-
    https://learn.microsoft.com/azure/foundry/agents/how-to/virtual-networks; source file
    MicrosoftDocs/azure-ai-docs: articles/foundry/agents/includes/how-to-virtual-networks-content.md;
    retrieved 2026-10-04
  note: >-
    DNS zone summary table, validation step ("From a machine connected to the VNet, run nslookup"), troubleshooting (private
    IP expected, 168.63.129.16 forwarders).
- url: >-
    https://github.com/Azure/azure-rest-api-specs/blob/main/specification/privatedns/resource-manager/Microsoft.Network/PrivateDns/stable/2018-09-01/privatedns.json
  lastVerified: '2026-10-04'
  verifiedVia: >-
    https://github.com/Azure/azure-rest-api-specs/blob/main/specification/privatedns/resource-manager/Microsoft.Network/PrivateDns/stable/2018-09-01/privatedns.json
  note: >-
    virtualNetworkLinks path and virtualNetworkLinkState read-only property (documented values InProgress,
    Completed in the enum). Branch URL, not commit-pinned.
- url: https://learn.microsoft.com/azure/foundry/agents/concepts/agents-networking-deep-dive
  lastVerified: '2026-10-04'
  verifiedVia: >-
    https://learn.microsoft.com/azure/foundry/agents/concepts/agents-networking-deep-dive; source file
    MicrosoftDocs/azure-ai-docs: articles/foundry/agents/concepts/agents-networking-deep-dive.md; retrieved
    2026-10-04
  note: Private DNS zones keep name resolution inside the VNet for storage, database and Key Vault private endpoints.
overlap:
  decision: native
  provisional: true
  coverage: none
  rationale: >-
    Azure Policy c4bc6f10 (Configure Cognitive Services accounts to use private DNS zones) configures zone group association;
    it does not observe resolution from a vantage point. PSRule Azure.AI.PrivateEndpoints and Policy EnablePrivateEndpoints
    audits check that a private endpoint exists, not that the name resolves privately. Observing the answer from the declared
    vantage point, and refusing to Pass elsewhere, is the Foundry Doctor value. azd ai agent doctor has no DNS check. Evidence
    difference is total: PSRule Azure.AI.PrivateEndpoints checks that a private endpoint exists and the Azure Policy built-in
    is a DeployIfNotExists that configures DNS zones; neither tests resolution.
  research:
    psrule:
      state: searched-match
      matches:
      - Azure.AI.PrivateEndpoints
    azurePolicy:
      state: searched-match
      matches:
      - c4bc6f10-cb41-49eb-b000-d5ab82e2a091
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/run
tests:
  positive:
  - asserted in-VNet vantage point, the Search service is proven private-endpoint-backed, and its FQDN resolves to a public IP
  - asserted in-VNet vantage point, the dependency is proven private-endpoint-backed, and its FQDN returns NXDOMAIN
  negative:
  - asserted in-VNet vantage point and every FQDN resolves to a private IP
  - public-IP answer for a dependency with no private endpoint is not a Fail (Uncertain)
  skipped:
  - vantage point is outside the VNet or not declared
  - no private endpoint is configured for the dependency
  - resolver unavailable, timed out or SERVFAIL (distinct from NXDOMAIN)
  uncertain:
  - public-IP or NXDOMAIN answer for a dependency not proven private-endpoint-backed
  - zone has no VNet link (context only, never the sole basis of a Fail)
  - split-horizon custom DNS returns different answers on repeated lookups
testability: Resolver is an injected interface so tests use fake answers; real validation needs a host inside the VNet.
notes: >-
  Loop 1 (2026-10-17): Fail gated on private-endpoint evidence; NXDOMAIN distinct from timeout; vantage stated as user
  asserted. Unverified: what counts as a private address (RFC 1918 versus any VNet range) is not stated in the Foundry docs; the docs
  say the name must resolve to a private IP address. The full Policy GUID was read from the definition file; it should be
  re-checked when the mapping is finalised. Defender and Advisor IDs were not available in any clone.

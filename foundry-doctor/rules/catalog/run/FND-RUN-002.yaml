id: FND-RUN-002
version: 3
group: RUN
title: Private DNS resolves from an appropriate vantage point
description: >-
  For each private-endpoint-backed dependency of a Foundry project (Foundry account, Azure AI Search, Azure Cosmos DB, Azure
  Storage blob), the service FQDN must resolve to a private IP address when resolved from inside the virtual network that
  hosts the agent and private endpoint subnets. Resolution from outside the VNet is not evidence either way, so the rule
  is Skipped there and is never Passed. The vantage point is asserted by the operator (`--vantage vnet`); the doctor cannot
  verify where it runs, and every result says so. A public answer for a dependency that is not proven to be backed by a
  private endpoint is not a failure: public endpoints are a valid configuration.
status: verified
phases:
- '3'
inputs:
- network
- control-plane
basis:
- platform
category: must-have
pillar: reliability
severity:
  dev: error
  test: error
  prod: error
compatibility:
  azd: ''
  extensions: {}
  apiVersions:
  - { plane: management, provider: Microsoft.CognitiveServices, resourceType: accounts, version: '2026-09-01' }
  - { plane: management, provider: Microsoft.CognitiveServices, resourceType: accounts/projects/connections, operation: list, version: '2026-09-01' }
  - { plane: management, provider: Microsoft.CognitiveServices, resourceType: accounts/connections, operation: list, version: '2026-09-01' }
  preview: false
  notes: >-
    No azd dependency: DNS lookup and ARM reads; no azd behaviour dependency. Microsoft.CognitiveServices/accounts
    (Accounts_Get) and connections 2026-09-01: stable. The Phase 3 runtime does not read Microsoft.Network private DNS
    zones or virtual network links.
evidence:
  description: >-
    Probe 1 (data-plane-free): resolve each FQDN (for example <account>.cognitiveservices.azure.com, <account>.openai.azure.com,
    <account>.services.ai.azure.com, <search>.search.windows.net, <cosmos>.documents.azure.com, <storage>.blob.core.windows.net)
    with the operating-system resolver of the host that runs the doctor and compare the answers to private address space.
    The vantage point is user asserted: the operator declares `--vantage vnet`; the doctor does not and cannot verify it,
    and each finding states 'vantage point asserted by the operator, not verified'. Any other vantage point yields Skipped
    with reason "private DNS resolves only from inside the VNet".
    Pass requires the asserted in-VNet vantage point AND every answer is a private IP.
    Fail requires the asserted in-VNet vantage point AND the dependency proven private-endpoint-backed by control-plane
    evidence that the finding names (account publicNetworkAccess Disabled or an existing private endpoint connection on
    the Foundry account, or connection peStatus Active for the other dependencies; see below) AND either a public-IP answer or an NXDOMAIN answer. A public-IP or NXDOMAIN answer for a dependency that is
    not proven private-endpoint-backed is Uncertain (it may be a public endpoint by design), never Fail.
    NXDOMAIN (the resolver answered that the name does not exist) is a different outcome from a timeout, SERVFAIL or no
    resolver: those are Skipped as 'resolver unavailable' with the error class named, never Fail and never Pass.
    Proof of private-endpoint backing (control plane, read only): for the Foundry account, GET the account (Accounts_Get,
    api-version 2026-09-01, allow-list operation runtime.account.get): publicNetworkAccess Disabled, or at least one entry
    in properties.privateEndpointConnections, is the proof. For the Search, Cosmos DB and Storage resources bound to the
    capability host, the proof is the connection's peStatus (ManagedPEStatus) equal to Active on the project or account
    connection that points at the resource; the target's own private endpoint connections are not read. A dependency
    without such proof is not probed and is Uncertain ("private-endpoint backing is not proven"). A failure to read the account is
    Uncertain, not a Fail. The proof is named in each finding. The runtime does not read private DNS zones or virtual
    network links: whether a zone is linked to the VNet is not evidence of this rule. Resolution runs per dependency under
    the per-probe --timeout through the injected resolver; a resolver timeout or error is Skipped (resolver
    unavailable), never Fail and never Pass. Required permission: ARM read on the Foundry account and on the project and
    account connections. Probe 1 needs none. Metadata read: DNS answers, publicNetworkAccess, connection peStatus. No
    request is sent to the data plane, so no content is touched.
  confidence: certain
recommendation: >-
  Link each required privatelink zone to the VNet that hosts the agent client and private endpoint subnets, configure conditional
  forwarders to 168.63.129.16 where custom DNS is used, and re-run the doctor from a machine inside the VNet.
fix: |-
  resource searchDnsLink 'Microsoft.Network/privateDnsZones/virtualNetworkLinks@2018-09-01' = {
    parent: searchPrivateDnsZone // privatelink.search.windows.net
    name: 'link-to-agent-vnet'
    location: 'global'
    properties: {
      virtualNetwork: { id: agentVnet.id }
      registrationEnabled: false
    }
  }

id: FND-RUN-006
version: 2
group: RUN
title: Search index/documents/vector/indexer health
description: >-
  For each Azure AI Search index that a Foundry project connection, agent tool or knowledge source references, the index
  must exist, expose the expected schema (including vector fields with dimensions and a vector search profile), contain
  at least one document, and any indexer that feeds it must not be in an error state or have a failed lastResult. Only
  data-plane metadata is read: index definition, index statistics and indexer status. Documents are never queried or returned.
status: verified
phases:
- '3'
inputs:
- data-plane
- control-plane
basis:
- reliability
category: must-have
pillar: reliability
severity:
  dev: warning
  test: error
  prod: error
compatibility:
  azd: ''
  extensions: {}
  apiVersions:
  - { plane: data, service: AzureAISearch, endpointFamily: indexes, operation: get, version: '2026-04-01' }
  - { plane: data, service: AzureAISearch, endpointFamily: indexes, operation: getStatistics, version: '2026-04-01' }
  - { plane: data, service: AzureAISearch, endpointFamily: indexers, operation: getStatus, version: '2026-04-01' }
  preview: false
  notes: >-
    No azd dependency: Search data-plane reads; no azd behaviour dependency Azure AI Search data plane 2026-04-01: stable.
evidence:
  description: >-
    Read-only GETs against https://{search}.search.windows.net with api-version=2026-04-01. (1) GET /indexes('{index}'):
    404 is Fail (index missing); the field list is compared with the expected field names and types; a vector field is a
    SearchField with dimensions (2 to 4096) and vectorSearchProfile. (2) GET /indexes('{index}')/search.stats returns documentCount,
    storageSize and vectorIndexSize; documentCount of 0 is Fail for an index the agent is meant to retrieve from, but the
    spec states statistics are collected periodically and may not be current, so a zero count on a recently changed index
    is Uncertain. (3) GET /indexers('{indexer}')/search.status: status unknown, error or running; a failed lastResult is
    Fail even when the current status is running, transientFailure is Warn-class evidence, and the finding keeps only
    structured status fields (errorCode and itemsFailed), never errorMessage free text. Required permission (Search RBAC): Search Service Contributor for object definitions and indexer status
    (the docs state it manages indexes, indexers and other objects and that Search Index Data Reader cannot read object
    definitions); the role needed for search.stats alone is not stated per operation. Without RBAC the doctor is Skipped;
    admin keys are never retrieved. Vantage point: when the search service has public network access disabled or only private
    endpoints, the checks run only from inside the VNet and are Skipped elsewhere. Metadata read: index and field names,
    counts, indexer status. No document content, no search queries, no vectors.
  confidence: likely
recommendation: >-
  Create or repair the index with the expected schema, run the indexer and review its execution errors, and confirm the
  agent's search connection and index name match. Grant the doctor identity Search Service Contributor only if you want
  schema and indexer checks.
fix: |-
  // Expected vector field shape in the index definition (REST, api-version 2026-04-01)
  {
    "name": "contentVector",
    "type": "Collection(Edm.Single)",
    "dimensions": 1536,
    "vectorSearchProfile": "default-profile"
  }
sources:
- url: >-
    https://github.com/Azure/azure-rest-api-specs/blob/main/specification/search/data-plane/Search/stable/2026-04-01/search.json
  lastVerified: '2026-10-04'
  verifiedVia: refs/rest-api-specs/specification/search/data-plane/Search/stable/2026-04-01/search.json
  note: >-
    Paths /indexes('{indexName}'), /indexes('{indexName}')/search.stats, /indexers('{indexerName}')/search.status; GetIndexStatisticsResult,
    SearchIndexerStatus, IndexerExecutionResult, IndexerStatus (unknown, error, running), IndexerExecutionStatus (transientFailure,
    success, inProgress, reset), SearchField (dimensions, vectorSearchProfile).
- url: https://learn.microsoft.com/azure/search/search-security-rbac
  lastVerified: '2026-10-04'
  verifiedVia: refs/azure-ai-docs/articles/search/search-security-rbac.md
  note: >-
    Role capability table (Search Service Contributor manages indexes and indexers; Search Index Data Reader queries only;
    Reader cannot manage objects).
- url: https://learn.microsoft.com/azure/foundry/agents/how-to/tools/ai-search
  lastVerified: '2026-10-04'
  verifiedVia: refs/azure-ai-docs/articles/foundry/agents/how-to/tools/ai-search.md
  note: >-
    Project managed identity needs Search Index Data Contributor and Search Service Contributor for the Azure AI Search
    tool.
overlap:
  decision: native
  provisional: true
  coverage: none
  rationale: >-
    PSRule Azure.Search.* rules (IndexSLA, QuerySLA, SKU, ManagedIdentity, Naming) and Azure Policy Search definitions check
    service configuration, not index existence, schema, document count or indexer status. Checkov and the Bicep linter are
    static. azd ai agent doctor has no Search check. Correlating the index an agent connection points to with its live state
    is the Foundry-specific value.
  research:
    psrule:
      state: searched-match
      matches:
      - Azure.Search.IndexSLA
      - Azure.Search.QuerySLA
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/run
tests:
  positive:
  - index returns 404
  - vector field missing dimensions or vectorSearchProfile
  - documentCount is zero long after the last indexer success
  - indexer status error
  - indexer lastResult failed while status remains running
  negative:
  - index exists with expected fields, documentCount above zero, indexer status running with lastResult success
  skipped:
  - search service is private and the vantage point is outside the VNet
  - caller has no Search RBAC role
  - project has no Search connection
  uncertain:
  - statistics stale after a recent change
  - indexer lastResult inProgress
testability: Deterministic against recorded Search REST responses; live mode needs Search RBAC and network reach.
notes: >-
  Unverified: which Search role covers search.stats and docs/$count individually (the RBAC table groups them under object
  management and querying); that documentCount 0 always means an unhealthy agent index (it is a product judgement for indexes
  the agent depends on). The expected-schema source (which fields an agent index must have) is user-supplied configuration,
  not a platform fact. Security review remediation: indexer errorMessage is not ingested at all because it can contain
  document keys or content snippets; only structured status, counts, and errorCode are retained. See ADR-006 item 8.

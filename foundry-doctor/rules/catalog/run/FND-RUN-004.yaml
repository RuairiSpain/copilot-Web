overlap:
  decision: native
  provisional: true
  coverage: none
  rationale: >-
    No PSRule rule, Azure Policy definition or Checkov check inspects deployment runtime state or 429 metrics; they are
    static template or configuration checks. Defender for Cloud and Advisor recommendation IDs could not be verified from
    the clones. azd ai agent doctor removed its model-deployments check as producing false failures (CHANGELOG entry
    for PR 8394), so there is no Microsoft equivalent to reuse. The doctor's value is correlating the deployments the
    project actually uses with their runtime signal.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/run
tests:
  positive:
    - deployment provisioningState Failed
    - a series with StatusCode 429 above the threshold, attributed to one deployment by its ModelDeploymentName value
    - 429 rate just above the default 5 percent with at least 100 requests is a finding with window, counts and thresholds in the evidence
    - policy lowers maxRate429 or minRequests so a smaller rate or sample is judged
    - provisioned utilization at 100 percent together with a sustained 429 rate
    - deployment deploymentState Paused
  negative:
    - all deployments Succeeded and every returned StatusCode value is a three-digit code with none equal to 429 (no throttling occurred)
    - one transient 429 among 499 requests passes
    - 429 rate exactly at the threshold passes
    - policy raises maxRate429 so the same rate passes
    - deploymentState Running or absent passes
  skipped:
    - caller cannot read metrics
    - deployment is not used by the project (out of scope)
  uncertain:
    - 429 responses on fewer requests than runtime.throttling.minRequests (sample too small)
    - provisioned utilization peak of 100 percent without a sustained 429 rate
    - invalid runtime.throttling policy value falls back to the default with a note
    - deploymentState other than Running or Paused
    - deployment Creating or Updating
    - no time series returned (no traffic versus metric not emitted; distinct from a count of zero)
    - StatusCode values that are not three-digit codes and no series identified as 429
    - metric response carries an errorCode, or the series count reached the top=50 cap (truncation note)
    - a series cannot be attributed to a deployment (no safe ModelDeploymentName value), attached to the account
testability: Deterministic against recorded ARM and Metrics responses; live mode needs ARM and Monitor read access.
notes: >-
  Version 5 (2026-10-19): sustained-rate semantics. Before, any single 429 in a one-hour window and any utilization peak of
  100 percent failed a production run (hard-coded thresholds). Now: rate and minimum-request policy keys, configurable
  window, stable finding keys (throttling-429, utilization, provisioning-state, deployment-state) so fingerprints do not
  move with the counts, a Paused deployment finding, and a lone utilization peak is Uncertain. The three
  runtime.throttling.* keys are read through sdk.Policy; they are only settable from the policy file once internal/config
  lists them in PolicyKeys (defined in the configuration schema as policy.runtime.throttling.*; the documented defaults apply when absent). UNVERIFIED: the default
  values (product opinion), the window bounds, the relation of rateLimits to capacity (not evaluated), a metric name for
  per-deployment total requests other than AzureOpenAIRequests (none is used).
  Loop 2 (2026-10-18): the Total aggregation for AzureOpenAIRequests, Maximum/Average/Minimum for utilisation, the
  dimensions ModelDeploymentName and StatusCode and the PT1M grain are now VERIFIED (azure-monitor-docs, commit 583ced4,
  ms.date 09/28/2026, file microsoft-cognitiveservices-accounts-metrics.md, read 2026-10-18). The StatusCode value domain
  remains UNVERIFIED, so the 429 signal is usually Uncertain.
  Loop 1 (2026-10-18, synced to the Go code): AzureOpenAIRequests Total split by StatusCode and ModelDeploymentName (top=50,
  PT1M, explicit start/end timespan, no metricnamespace), utilisation Maximum. Unverified: the StatusCode value domain; metric retention and the exact metric
  namespace string; the built-in role needed for metric reads. The default window and threshold are product opinion.

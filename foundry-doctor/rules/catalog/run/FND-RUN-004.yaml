id: FND-RUN-004
version: 4
group: RUN
title: Model deployment state and throttling signal
description: >-
  Every model deployment that a project, agent or gateway route depends on must be in a succeeded provisioning state, and
  recent Azure Monitor metrics must not show HTTP 429 responses for it. The 429 threshold is a product opinion; the
  meaning of the deployment state and of the 429 status code is documented.
status: verified
phases: ["3"]
inputs: [control-plane]
basis: [reliability, opinion]
category: must-have
pillar: reliability
severity:
  dev: warning
  test: warning
  prod: error
compatibility:
  azd: ""
  extensions: {}
  apiVersions:
    - { plane: management, provider: Microsoft.CognitiveServices, resourceType: accounts/deployments, version: "2026-09-01" }
    - { plane: management, provider: Microsoft.Insights, resourceType: metrics, version: "2024-02-01" }
  preview: false
  notes: "No azd dependency: ARM and Azure Monitor reads; no azd behaviour dependency Microsoft.CognitiveServices accounts/deployments 2026-09-01: stable. Microsoft.Insights/metrics 2024-02-01: stable."
evidence:
  description: >-
    Probe 1: GET /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.CognitiveServices/accounts/{a}/deployments?api-version=2026-09-01
    (Deployments list; one Get per deployment is equivalent). properties.provisioningState Succeeded is healthy; Failed,
    Canceled or Disabled is Fail; Accepted, Creating, Deleting or Moving is Uncertain. Probe 2: GET
    /{accountResourceId}/providers/Microsoft.Insights/metrics?api-version=2024-02-01 (allow-list operation runtime.metrics;
    query keys timespan, interval, metricnames, aggregation, top, $filter, metricnamespace and resulttype are accepted, and
    the rule sends timespan, interval, metricnames, aggregation, $filter and top). metricnames=AzureOpenAIRequests,
    aggregation=Total, interval=PT1M (Total aggregation, the dimensions ModelDeploymentName and StatusCode and the PT1M grain
    of AzureOpenAIRequests, and the Maximum, Average and Minimum aggregations and the ModelDeploymentName dimension of
    AzureOpenAIProvisionedManagedUtilizationV2, are VERIFIED in the azure-monitor-docs supported-metrics file
    microsoft-cognitiveservices-accounts-metrics.md, read 2026-10-18), an explicit
    timespan of the form {startISO}/{endISO} (one hour ending now; product opinion; the doctor computes both ends, it
    does not use a relative duration), $filter=StatusCode eq '*' and ModelDeploymentName eq '*' so that the service
    splits the series by both dimensions, and top=50 (the spec says top defaults to 10 when $filter is set, so a split
    by deployment needs more). metricnamespace is not sent (UNVERIFIED whether a namespace is needed for these metrics).
    Attribution is by the returned ModelDeploymentName dimension value only (it must be a safe resource name; otherwise
    the finding is attached to the account and says the series could not be attributed). StatusCode handling: a series
    whose StatusCode value is exactly 429 with a total above 0 (threshold 0; product opinion) is a finding for its
    deployment. The StatusCode VALUE domain stays UNVERIFIED: the docs describe the dimension by categories (successful,
    clienterrors, server errors) and do not enumerate values, so in practice the 429 signal is usually Uncertain (loop 2).
    If every returned StatusCode value is a three-digit HTTP code (100 to 599) and none is 429, no throttling
    occurred in the window (Pass for this signal). If any value is not a three-digit code and no series is identified as
    429, the result is Uncertain and names the observed values (at most 10): the Learn metric reference describes
    categories and does not enumerate the StatusCode values, so the value domain is UNVERIFIED. If the response has no
    time series at all, the result is Uncertain: no series is not a count of zero (no requests in the window, or the
    metric was not emitted). If the response reports an errorCode, or the series count reached the top=50 cap, the result
    is Uncertain with a truncation note (some deployments may be missing). For provisioned-managed deployments also read
    AzureOpenAIProvisionedManagedUtilizationV2 (aggregation Maximum, split by ModelDeploymentName, same window, interval
    and cap): a maximum of 100 percent or above in the window means calls were throttled and is a finding for that
    deployment. Required permission:
    ARM read on the account for probe 1 and permission to read Azure Monitor metrics on the account for probe 2
    (Microsoft.Insights/metrics/read; the built-in role carrying it was not verified). Vantage point: control plane, any
    network. Metadata read: deployment names, model names and versions, counts. No prompts or completions.
  confidence: likely
recommendation: >-
  For a failed or disabled deployment, review the deployment error in the Foundry portal and recreate it. For 429
  signals, raise the deployment capacity or quota, spread load across deployments or regions, or add client back-off and retry.
fix: |-
  resource gpt 'Microsoft.CognitiveServices/accounts/deployments@2026-09-01' = {
    parent: account
    name: 'gpt-4o'
    sku: { name: 'GlobalStandard', capacity: 100 }
    properties: {
      model: { format: 'OpenAI', name: 'gpt-4o', version: '2024-11-20' }
    }
  }
sources:
  - url: https://learn.microsoft.com/azure/azure-monitor/reference/supported-metrics/microsoft-cognitiveservices-accounts-metrics
    lastVerified: "2026-10-18"
    verifiedVia: >-
      MicrosoftDocs/azure-monitor-docs articles/azure-monitor/reference/supported-metrics/microsoft-cognitiveservices-accounts-metrics.md
      (local clone at commit 583ced4, ms.date 09/28/2026), read 2026-10-18
    note: >-
      AzureOpenAIRequests: Total (Sum), dimensions include ModelDeploymentName and StatusCode, PT1M; the description names
      StatusCode categories (successful, clienterrors, server errors), not values.
      AzureOpenAIProvisionedManagedUtilizationV2: Minimum, Maximum, Average; dimension ModelDeploymentName; PT1M.
  - url: https://github.com/Azure/azure-rest-api-specs/blob/main/specification/cognitiveservices/resource-manager/Microsoft.CognitiveServices/CognitiveServices/stable/2026-09-01/cognitiveservices.json
    lastVerified: "2026-10-17"
    verifiedVia: >-
      https://github.com/Azure/azure-rest-api-specs/blob/main/specification/cognitiveservices/resource-manager/Microsoft.CognitiveServices/CognitiveServices/stable/2026-09-01/cognitiveservices.json
    note: >-
      DeploymentProvisioningState enum, DeploymentProperties (provisioningState, rateLimits,
      dynamicThrottlingEnabled, currentCapacity); Deployments_Get path. Branch URL, not commit-pinned.
  - url: https://github.com/Azure/azure-rest-api-specs/blob/main/specification/monitor/resource-manager/Microsoft.Insights/Insights/stable/2024-02-01/metrics.json
    lastVerified: "2026-10-17"
    verifiedVia: >-
      https://github.com/Azure/azure-rest-api-specs/blob/main/specification/monitor/resource-manager/Microsoft.Insights/Insights/stable/2024-02-01/metrics.json
    note: >-
      Metrics_List path /{resourceUri}/providers/Microsoft.Insights/metrics with metricnamespace, timespan,
      interval, metricnames, aggregation, top, orderby, $filter, resultType, metricnamespace, AutoAdjustTimegrain,
      ValidateDimensions, rollupby parameters (read 2026-10-17). Branch URL, not commit-pinned.
  - url: https://learn.microsoft.com/azure/foundry/openai/monitor-openai-reference
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://learn.microsoft.com/azure/foundry/openai/monitor-openai-reference; source file
      MicrosoftDocs/azure-ai-docs: articles/foundry/openai/includes/monitor-openai-reference-content.md;
      retrieved 2026-10-04
    note: AzureOpenAIRequests (request volume and errors), AzureOpenAIProvisionedManagedUtilizationV2, and the dimensions StatusCode and ModelDeploymentName for the namespace.
  - url: https://learn.microsoft.com/azure/foundry/openai/how-to/latency
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://learn.microsoft.com/azure/foundry/openai/how-to/latency; source file
      MicrosoftDocs/azure-ai-docs: articles/foundry/openai/includes/how-to-latency-content.md; retrieved
      2026-10-04
    note: Check AzureOpenAIRequests for 429 throttling on pay-as-you-go deployments.
  - url: https://learn.microsoft.com/azure/foundry/foundry-models/how-to/monitor-models
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://learn.microsoft.com/azure/foundry/foundry-models/how-to/monitor-models; source file
      MicrosoftDocs/azure-ai-docs: articles/foundry/foundry-models/includes/how-to-monitor-models-1.md;
      retrieved 2026-10-04
    note: Provisioned utilization at or above 100 percent returns 429.
overlap:
  decision: native
  provisional: true
  coverage: none
  rationale: >-
    No PSRule rule, Azure Policy definition or Checkov check inspects deployment runtime state or 429 metrics; they are
    static template or configuration checks. Defender for Cloud and Advisor recommendation IDs could not be verified from
    the clones. azd ai agent doctor removed its model-deployments check as producing false failures (CHANGELOG entry
    for PR 8394), so there is no Microsoft equivalent to reuse. The doctor's value is correlating the deployments the
    project actually uses with their runtime signal.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/run
tests:
  positive:
    - deployment provisioningState Failed
    - a series with StatusCode 429 above the threshold, attributed to one deployment by its ModelDeploymentName value
    - provisioned utilization at 100 percent
  negative:
    - all deployments Succeeded and every returned StatusCode value is a three-digit code with none equal to 429 (no throttling occurred)
  skipped:
    - caller cannot read metrics
    - deployment is not used by the project (out of scope)
  uncertain:
    - deployment Creating or Updating
    - no time series returned (no traffic versus metric not emitted; distinct from a count of zero)
    - StatusCode values that are not three-digit codes and no series identified as 429
    - metric response carries an errorCode, or the series count reached the top=50 cap (truncation note)
    - a series cannot be attributed to a deployment (no safe ModelDeploymentName value), attached to the account
testability: Deterministic against recorded ARM and Metrics responses; live mode needs ARM and Monitor read access.
notes: >-
  Loop 2 (2026-10-18): the Total aggregation for AzureOpenAIRequests, Maximum/Average/Minimum for utilisation, the
  dimensions ModelDeploymentName and StatusCode and the PT1M grain are now VERIFIED (azure-monitor-docs, commit 583ced4,
  ms.date 09/28/2026, file microsoft-cognitiveservices-accounts-metrics.md, read 2026-10-18). The StatusCode value domain
  remains UNVERIFIED, so the 429 signal is usually Uncertain.
  Loop 1 (2026-10-18, synced to the Go code): AzureOpenAIRequests Total split by StatusCode and ModelDeploymentName (top=50,
  PT1M, explicit start/end timespan, no metricnamespace), utilisation Maximum. Unverified: the StatusCode value domain; metric retention and the exact metric
  namespace string; the built-in role needed for metric reads. The default window and threshold are product opinion.

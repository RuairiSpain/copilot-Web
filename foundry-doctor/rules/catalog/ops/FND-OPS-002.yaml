id: FND-OPS-002
version: 2
group: OPS
title: "Application Insights connected"
description: >-
  Each Foundry project in the compiled template should have a connection of category AppInsights, at project scope or at
  its parent account, so server-side tracing and hosted-agent telemetry have an Application Insights destination.
  Foundry documents that server-side tracing is enabled after an Application Insights resource is connected, and that
  hosted agents receive the APPLICATIONINSIGHTS_CONNECTION_STRING setting only when project monitoring is configured.
  Foundry does not document an Application Insights connection as mandatory for every production project, so the rule is a
  product opinion at warning severity, not a platform error. Version 2 evaluates the compiled template; the earlier
  hard-coded skip for a missing observability requirement is removed because no policy key for it exists in the
  configuration schema (ADR-007, ADR-026 decision 4).
status: product-opinion
phases: ["4"]
inputs: ["bicep-arm", "control-plane"]
basis: ["operations", "waf", "opinion"]
category: nice-to-have
pillar: operations
severity:
  dev: info
  test: warning
  prod: warning
compatibility:
  azd: ""
  extensions: {}
  apiVersions:
    - { plane: management, provider: Microsoft.CognitiveServices, resourceType: accounts/projects/connections, operation: list, version: "2026-09-01" }
  preview: false
  notes: "Control-plane inventory only. Resource=Microsoft.CognitiveServices/accounts/projects/connections; plane=control; API=2026-09-01."
evidence:
  description: >-
    Compiled ARM, no network. For every live Microsoft.CognitiveServices/accounts/projects resource, look for a
    Microsoft.CognitiveServices/accounts/projects/connections resource named under that project, or a
    Microsoft.CognitiveServices/accounts/connections resource named under its parent account, whose properties.category is
    AppInsights (ConnectionCategory enumeration and ConnectionPropertiesV2.category, cognitiveservices.json 2026-09-01).
    Finding no-appinsights-connection: a project with none at either scope. Finding multiple-appinsights-connections: more
    than one at one scope (only one connection per category is allowed). Uncertain, never a finding: a connection or project
    name that is an unresolved ARM expression, a category that is an expression, or a conditional or looped connection
    resource (it may be the AppInsights connection). Skipped not-applicable: no live project in the template. When at least
    one project is connected, each live Microsoft.Insights/components resource is also checked for a properties.WorkspaceResourceId
    (the workspace-based link also read by FND-OPS-006; the property name is read case-insensitively): absent is finding
    component-not-workspace-based, an expression value is uncertain. The connection's target and metadata, credentials,
    IngestionMode and the APPLICATIONINSIGHTS_CONNECTION_STRING setting on Container Apps, Functions or hosted agents are not
    read: which component a connection points to, and whether a compute setting is linked to the project, have no verified
    authoring shape (UNVERIFIED), so they never produce a pass or a finding. A control-plane inventory of the deployed
    connections remains the live-mode source and is not implemented by this rule.
  confidence: certain
recommendation: >-
  If server-side tracing or hosted-agent telemetry is a declared requirement, connect an Application
  Insights resource to the Foundry project (a connection with category AppInsights) and link the
  component to a Log Analytics workspace. Keep exactly one AppInsights connection per scope. Choose
  sampling, retention and daily-cap settings deliberately: telemetry ingestion and retention incur
  cost, so a project that does not require this observability path should not be forced to enable it.
fix: |
  # Safe remediation (no unverified ARM wiring):
  # In the Foundry portal, open the project, Monitoring, and connect the intended
  # workspace-based Application Insights resource. Re-run the live inventory and
  # verify exactly one project connection whose category is AppInsights.
sources:

  - url: https://github.com/Azure/azure-rest-api-specs/blob/main/specification/cognitiveservices/resource-manager/Microsoft.CognitiveServices/CognitiveServices/stable/2026-09-01/cognitiveservices.json
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://github.com/Azure/azure-rest-api-specs/blob/main/specification/cognitiveservices/resource-manager/Microsoft.CognitiveServices/CognitiveServices/stable/2026-09-01/cognitiveservices.json
    note: >-
      ConnectionCategory enumeration contains AppInsights; connections exist under accounts and
      accounts/projects. Branch URL, not commit-pinned.
overlap:
  decision: native
  provisional: true
  coverage: none
  rationale: >-
    No PSRule rule, Azure Policy definition or Bicep linter rule checks the Foundry project to Application Insights
    connection. Related canonical rules cover the Application Insights resource itself and are mapped, not
    duplicated: PSRule Azure.AppInsights.Workspace (workspace-based component) and Azure Policy
    d550e854-df1a-4de9-bf44-cd894b39a95e (component must be linked to a Log Analytics workspace). The Foundry-specific
    value is the correlation between the project, its agents and the connection.
  research:
    psrule:
      state: searched-match
      matches:
      - 'Azure.AppInsights.Workspace'
    azurePolicy:
      state: searched-match
      matches:
      - 'd550e854-df1a-4de9-bf44-cd894b39a95e'
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/ops
tests:
  positive:
    - missing connection is a finding
    - unrelated connection categories do not satisfy
    - connection of another account does not cover
    - connection of another project does not cover
    - two connections at the same scope
    - connected classic component is a finding
    - component alone does not hide the missing connection
    - two projects, one connected
    - literal false connection does not count
    - TestOPS002EvidenceHasNoConnectionTarget (evidence never carries the connection target)
  negative:
    - project scoped AppInsights connection passes
    - category compared case-insensitively
    - account scoped AppInsights connection covers its project
    - connected workspace based component passes
  skipped:
    - no ARM model
    - no project in template
  uncertain:
    - expression category is uncertain
    - expression connection name is uncertain
    - conditional connection is uncertain
    - expression workspace id is uncertain not a finding
testability: >-
  Deterministic against compiled ARM fixtures (internal/rules/ops/ops_appinsights_test.go); no Azure access.
notes: >-
  Version 2 (behaviour change): the rule was a hard-coded skip and could never pass or fail; it now evaluates the compiled
  template, so the finding set and fingerprints change. The skip head no-explicit-observability-or-server-tracing-requirement
  is no longer emitted by this rule (it stays in internal/rules/skipclass.go and the assessment mapping; the WAF assessment
  then derives the control from evidence instead of a QUESTION). This is a product opinion conditioned on a workload that
  wants server-side tracing; teams that do not want Application Insights cost should suppress the finding with a reason and
  an expiry. The Well-Architected guidance text itself was not read (the source repository is not public). Foundry documents the
  consequence of a missing connection (no server-side traces) but not that it is an invalid configuration or a production
  error, so no platform basis is claimed. Application Insights and Log Analytics ingestion and retention create a cost tradeoff.
  UNVERIFIED and not implemented as signals - the component a connection targets, connection metadata, IngestionMode and
  compute-level APPLICATIONINSIGHTS_CONNECTION_STRING settings. Trace data retention follows the connected component and
  workspace (see FND-OPS-006). Defender and Advisor are unresearched; the native overlap decision is provisional until their
  catalogues are searched.

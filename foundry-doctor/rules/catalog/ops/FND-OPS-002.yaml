      source file MicrosoftDocs/azure-ai-docs:
      articles/foundry/observability/how-to/trace-ingestion-entra-authentication.md; retrieved 2026-10-04
    note: Troubleshooting row - only one connection per category (AppInsights) is allowed.
  - url: https://learn.microsoft.com/azure/azure-monitor/logs/data-retention-configure
    lastVerified: "2026-10-04"
    verifiedVia: >-
      https://github.com/MicrosoftDocs/azure-monitor-docs/blob/main/articles/azure-monitor/logs/data-retention-configure.md
    note: >-

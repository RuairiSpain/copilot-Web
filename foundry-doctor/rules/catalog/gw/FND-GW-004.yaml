id: FND-GW-004
version: 1
group: GW
title: "Route paths unique"
description: >-
  The API URL suffix (ARM properties.path) must be unique across the APIs of an API Management service, because
  the gateway distinguishes and routes APIs by that suffix. Two distinct APIs (not revisions of the same API)
  that share a path are a conflict.
status: verified
phases: ["8"]
inputs: ["bicep-arm", "control-plane"]
basis: ["platform"]
category: must-have
pillar: reliability
severity:
  dev: error
  test: error
  prod: error
compatibility:
  azd: ""
  extensions: {}
  apiVersions:
    - { plane: management, provider: Microsoft.ApiManagement, resourceType: service/apis, version: "2025-09-01-preview" }
    - { plane: management, provider: Microsoft.ApiManagement, resourceType: service/apis, version: "2024-05-01" }
  preview: true
  notes: "Microsoft.ApiManagement/service/apis 2025-09-01-preview / 2024-05-01: properties.path read in spec."
evidence:
  description: >-
    Group the APIs of one service (compiled ARM or control-plane list) by properties.path, normalised by
    trimming a leading and trailing slash and comparing case-insensitively. Revisions of one API share the
    path and are collapsed by the base API name (the part before ;rev=). Versions of one API share an
    apiVersionSetId (Microsoft.ApiManagement/service/apiVersionSets, versioningScheme Segment, Query or Header);
    header- and query-versioned versions are served from the same URL path by design, so every API that names
    the same apiVersionSetId is collapsed into one group whatever the scheme. Fail when two different APIs, or
    APIs in different version sets, share a normalised path, naming both resources. An empty path is allowed
    for at most one group.
  confidence: likely
recommendation: >-
  Give every API a distinct URL suffix (properties.path), for example one prefix per model family or team,
  and keep revisions under the same API instead of duplicating it.
fix: |
  resource chat 'Microsoft.ApiManagement/service/apis@2024-05-01' = {
    parent: apim
    name: 'foundry-chat'
    properties: { displayName: 'Foundry chat', path: 'foundry/chat', protocols: ['https'] }
  }
  resource embeddings 'Microsoft.ApiManagement/service/apis@2024-05-01' = {
    parent: apim
    name: 'foundry-embeddings'
    properties: { displayName: 'Foundry embeddings', path: 'foundry/embeddings', protocols: ['https'] }
  }
sources:
  - url: https://learn.microsoft.com/azure/api-management/import-and-publish
    lastVerified: "2026-10-04"
    verifiedVia: refs/azure-docs/articles/api-management/import-and-publish.md
    note: API Management distinguishes and routes APIs by their suffix, so the suffix must be unique for every API.
  - url: https://learn.microsoft.com/azure/api-management/graphql-api
    lastVerified: "2026-10-04"
    verifiedVia: refs/azure-docs/articles/api-management/graphql-api.md
    note: API URL suffix has to be unique in the API Management instance.
  - url: https://github.com/Azure/azure-rest-api-specs/tree/main/specification/apimanagement/resource-manager/Microsoft.ApiManagement/ApiManagement
    lastVerified: "2026-10-04"
    verifiedVia: refs/rest-api-specs/specification/apimanagement/resource-manager/Microsoft.ApiManagement/ApiManagement/preview/2025-09-01-preview/openapi.json (ApiContractProperties.path "Relative URL uniquely identifying this API and all of its resource paths within the API Management service instance", maxLength 400)
overlap:
  decision: native
  provisional: true
  coverage: none
  rationale: No PSRule, Policy, Defender, Advisor or Checkov control checks API path uniqueness; it is a cross-resource uniqueness check.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/gw
testability: Fully offline from compiled ARM; pure grouping function.
tests:
  positive:
    - two-apis-same-path
    - two-apis-in-different-version-sets-same-path
    - paths-differ-only-by-case-or-slash
  negative:
    - distinct-paths
    - revisions-of-same-api-share-path
    - header-versioned-version-set-shares-path
    - query-versioned-version-set-shares-path
    - segment-versioned-version-set-shares-path
    - single-empty-path
  skipped:
    - path-from-unresolved-parameter
    - apis-in-another-deployment-not-visible
notes: >-
  Corrected after the Phase 0 Foundry lead review: version sets with the Header or Query scheme serve every
  version from the same URL path (api-management-versions.md lines 37-53), so they must not be reported. It is
  not verified whether versions in a Segment-scheme version set repeat the same properties.path in ARM (the
  gateway appends the version segment) or carry different paths; the rule exempts the whole version set, which
  avoids a false positive either way and misses a duplicated version identifier within one set (not checked).
  ARM names: apiVersionSetId on the API, versioningScheme Segment|Query|Header on the version set
  (2025-09-01-preview spec). Unverified: how API Management resolves overlapping prefixes (for example foundry and foundry/chat) and
  whether the same path may be reused across different hostnames is not stated in the sources read, so only exact
  duplicates are failed. Path case sensitivity and slash normalisation are conservative choices, and are the
  reason confidence is likely. Operation-level duplicates (method plus urlTemplate) were not found in a source
  and are not checked.

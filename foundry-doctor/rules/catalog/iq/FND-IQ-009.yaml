implementation:
  owner: native
  package: internal/rules/iq
testability: >-
  Offline from knowledge source JSON plus the declared requirement. Whether source documents actually carry ACLs cannot
  be read metadata-only, so that is out of scope and the rule never passes by inference.
tests:
  positive:
  - requirement-declared-blob-ks-without-permission-options
  - permission-options-with-asset-store
  - permission-options-on-2026-04-01
  negative:
  - blob-ks-with-userIds-groupIds
  - remote-sharepoint-source-not-assessed
  skipped:
  - no-access-requirement-declared
  - source-acl-content-not-readable
  - header-forwarding-configured-outside-repo
notes: >-
  "When required" has no platform definition, so the trigger is an explicit project declaration (PRD ambiguity to resolve
  with an ADR: where the declaration lives, for example an azure.yaml extension setting or a doctor config key). Learn text
  writes the label option as sensitivityLabel while the data-plane spec enum is sensitivityLabels; the spec is used and
  the mismatch is listed under Unverified. Relabelled product-opinion after the Phase 0 Foundry lead review: "when required"
  has no platform definition and no project setting declares the requirement, so the check can only run when the profile
  states it. The Work IQ-specific header name stays out of pass evidence here because Microsoft Learn documents
  x-ms-query-source-authorization for these indexed and remote-SharePoint retrieval paths. A decision on where that
  declaration lives (profile key) is needed before Phase 8.
  Round-1 fix (2026-10-18): ingestion options are read from azureBlobParameters, indexedSharePointParameters and indexedOneLakeParameters .ingestionParameters; an absent parameters object is uncertain. Only 2026-04-01 fails the version leg (documented unsupported); 2026-05-01-preview and unknown versions are uncertain. The header leg is never decided from the repository: Learn sets x-ms-query-source-authorization on the agent MCP tool headers with a {{placeholder}}, a shape Foundry Doctor does not read, so the rule reports header-forwarding-configured-outside-repo as uncertain and never passes. The azure.yaml headers/requestHeaders/forwardHeaders keys used before were unverified and are no longer read.
  Post-merge gate loop 1 (2026-10-19): version 4. A knowledge source read at api-version 2026-04-01 is uncertain, not a failure: the read cannot be shown to return ingestionPermissionOptions even when they were set through a preview version, so the earlier api-version finding (and its contradiction with the missing-options finding) is removed. Pin 2026-08-01-preview to assess permission options.

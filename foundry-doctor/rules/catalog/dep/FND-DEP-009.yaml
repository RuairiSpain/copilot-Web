    groups' (e765b5de-1225-4ba3-bd56-1ac6695af988) in General/ResourceGroupAllowedLocations_Deny.json. Branch
    URL, not commit-pinned.
overlap:
  decision: adapt
  provisional: true
  coverage: partial
  rationale: >-
    Azure Policy is the authority, and its own restriction-check API is the evidence source, so Foundry Doctor wraps that
    call and normalises the result into a finding with Foundry resource correlation. PSRule for Azure does not evaluate
    live assignments; Azure.Resource.AllowedRegions checks a location against a configured list, not the policies actually
    assigned. The wrap is partial: effects that act after creation and unresolved expressions are not decided by the call,
    hence likely confidence. Reclassified from wrap to adapt after the Phase 0 Azure black belt review: the PolicyInsights
    call is an Azure API reached through the native Azure client (ADR-006), not an external tool on PATH, so ADR-001 item
    2 (adapters) does not apply.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: searched-match
      matches:
      - e56962a6-4747-49cd-b67b-bf8b01975c4c
      - e765b5de-1225-4ba3-bd56-1ac6695af988
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/azure/policy
testability: >-
  Offline with recorded CheckRestrictionsResult JSON (deny, audit, field restriction, empty) and a policy assignments list
  fixture. A live check against a sandbox subscription with an assigned Deny policy is an opt-in integration test.
tests:
  positive:
  - deny-policy-evaluation-non-compliant-for-planned-resource
  - field-restriction-conflicts-with-planned-value
  - allowed-locations-policy-assigned-and-location-not-allowed
  negative:
  - no-policy-evaluations-or-restrictions
  - tags-sku-kind-identity-zones-sent-through-sanitizer
  - audit-effect-excluded-by-default
  skipped:
  - no-azure-credential-available
  - check-policy-restrictions-not-permitted
  - bicep-cli-missing-cannot-build-resource-content
  uncertain:
  - resource-content-contains-unresolved-expressions
  - deny-on-partial-content-because-a-field-was-dropped
  - resource-count-above-cap-not-all-checked
  - effect-is-deployifnotexists-or-modify
  - fallback-assignment-list-only
notes: >-
  The brief asks for a policy denial check that does not need a content read: the call sends the planned template resource,
  which is Foundry Doctor's own input, not customer data. It is a POST, but a pure evaluation; the sources read show no
  state change. Whether the evaluation honours exemptions and initiative parameters is not stated in the spec text read.
  The implementation owner is the azure-policy adapter because decision is wrap (the brief maps wrap to a tool owner). Prod
  severity lowered to warning: the check is confidence likely and category nice-to-have, and an unverified preflight must
  not fail a production gate. Version 3: a deny on partial content is an uncertain note (a false fail on a dropped field was the round 2 finding), and the number of resources checked is capped. The cap (50) is an implementation constant, not a platform limit.

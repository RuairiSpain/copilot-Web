id: FND-DEP-009
version: 3
group: DEP
title: Likely policy denials identified
description: >-
  Before deployment, ask Azure Policy what restrictions it would place on the planned resources at the target scope, and
  list the policies whose evaluation is non-compliant or that restrict a field the template sets. The result is advisory:
  Azure Policy evaluates the resource content it is given, so unresolved template expressions and effects that act after
  creation cannot be settled in advance.
status: verified
phases:
- '2'
inputs:
- bicep-arm
- azd-env
- control-plane
basis:
- operations
category: nice-to-have
pillar: operations
severity:
  dev: warning
  test: warning
  prod: warning
compatibility:
  azd: '>=1.34.2'
  extensions: {}
  apiVersions:
  - { plane: management, provider: Microsoft.Authorization, resourceType: policyAssignments, version: '2026-07-01' }
  preview: true
  notes: >-
    azd range: the minimum is the lowest requiredAzdVersion among the Foundry extensions read (agents beta.18,
    projects beta.13 need >=1.34.2); the maximum is azd 1.36.0 (tag azure-dev-cli_1.36.0, acebba1e388b489a91ab8e2487a676359ab516a1, released 2026-10-14; the first clone read at 1.36.0-beta.1 is earlier evidence). The earlier >=1.27.1 lower
    bound came from a changelog and was not verified. The Microsoft.PolicyInsights checkPolicyRestrictions endpoint
    uses API version 2024-10-01, but it is a provider action rather than a resource type. It is omitted from
    structured API compatibility because the Phase 0 contract cannot classify it honestly without inventing a
    resourceType. Window widened 2026-10-16: azd to 1.36.0 (tag azure-dev-cli_1.36.0, acebba1, released 2026-10-14).
    The azd and extension changelogs and the schema and source diffs from the previously verified versions were read;
    none touches this rule's verified facts for the widened fields (see docs/tool-compatibility.md section 6).
evidence:
  description: >-
    Preferred: POST /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.PolicyInsights/checkPolicyRestrictions
    (PolicyRestrictions_CheckAtResourceGroupScope; subscription and management-group variants exist; use the resource group
    form when the group exists), api-version 2024-10-01. It is a stateless evaluation request, not a deployment. Body CheckRestrictionsRequest
    {resourceDetails {resourceContent, apiVersion, scope}, pendingFields[], includeAuditEffect (default false)}; resourceContent
    is the planned resource from the Bicep snapshot (partial content is allowed). Response CheckRestrictionsResult {fieldRestrictions[]
    {field, restrictions[] {result, defaultValue, values, policy, policyEffect, reason}}, contentEvaluationResult.policyEvaluations[]
    {policyInfo, evaluationResult, evaluationDetails, effectDetails}}. Reported: every policyEvaluations entry (evaluationResult
    is typically NonCompliant) with its policyEffect, and every field restriction whose values conflict with the planned
    value. A Deny effect against the planned content is a likely denial, an audit effect is informational (requested only
    with includeAuditEffect), modify and append effects are informational. Cheaper fallback when the call is unavailable:
    GET /subscriptions/{subscriptionId}/providers/Microsoft.Authorization/policyAssignments (PolicyAssignments_List, Reader)
    to list assignments and surface known-risk definitions by ID (allowed locations and allowed locations for resource groups),
    reported as uncertain because assignment scope, exemptions and parameters are not evaluated. Limits: resource content
    with unresolved expressions cannot be evaluated; DeployIfNotExists, Modify and AuditIfNotExists effects, policies that
    depend on other resources, and deny-with-exemptions are not settled by this call (the spec describes ifNotExistsDetails
    only for evaluated resources). Role family: Microsoft.PolicyInsights/checkPolicyRestrictions/read and Microsoft.Authorization/policyAssignments/read
    are listed in the Azure RBAC permission tables and are covered by Reader (*/read). Reader suffices. The answer is likely,
    never certain: a clean result is uncertain (not a pass) and a Deny hit is likely. Implementation (version 2, ADR-006 item 8): resourceContent is built from non-secret template content only. A property whose value is or contains an unresolved ARM expression, a secret-looking property and a credential-shaped value are omitted before the request and reported by name. Anything omitted makes a clean answer uncertain and is noted. A resource whose API version is not a literal is not checked (noted). The rule therefore never produces a pass: a clean answer is uncertain by design. When no resource could be checked, only the number of policy assignments at the group is reported, as a note. Version 3 (Phase 2 gate round 2, Azure black belt N1): the request content (name, tags, sku, kind, identity, zones and the literal properties) passes through the sanitizer. If the sanitizer dropped any field of a resource, a deny answer for that resource is not a finding, because Azure Policy evaluated partial content and the denied field may be one that was dropped; it becomes an uncertain note that names the resource and the dropped fields. A deny on fully sent content is still a likely finding. The number of resources checked per run is capped at 50 checkPolicyRestrictions calls (a Foundry Doctor limit, not a platform limit); resources beyond the cap are not checked and the run reports an uncertain note with the count.
  confidence: likely
recommendation: >-
  Change the planned value to one the policy allows, request a policy exemption, or ask the policy owner for a compliant
  pattern. Do not disable the policy to make a deployment pass.
fix: |
  # example: a policy restricts locations; pick an allowed one
  azd env set AZURE_LOCATION <allowed-region>

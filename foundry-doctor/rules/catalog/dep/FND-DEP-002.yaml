id: FND-DEP-002
version: 2
group: DEP
title: Required providers registered
description: >-
  The target subscription must be registered for the resource providers a Foundry deployment relies on that ARM will not
  register by itself. ARM registers providers that the template defines, but a provider that only supplies supporting resources
  (for example the providers behind a network-secured Agent Service setup) has to be registered manually.
status: verified
phases:
- '2'
inputs:
- bicep-arm
- azure.yaml
- control-plane
basis:
- platform
category: must-have
pillar: operations
severity:
  dev: error
  test: error
  prod: error
compatibility:
  azd: '>=1.34.2 <=1.36.0'
  extensions: {}
  apiVersions:
  - { plane: management, provider: Microsoft.Resources, resourceType: providers, version: '2025-04-01' }
  preview: true
  notes: >-
    azd range: the minimum is the lowest requiredAzdVersion among the Foundry extensions read (agents beta.18,
    projects beta.13 need >=1.34.2); the maximum is azd 1.36.0 (tag azure-dev-cli_1.36.0, acebba1e388b489a91ab8e2487a676359ab516a1, released 2026-10-14; the first clone read at 1.36.0-beta.1 is earlier evidence). The earlier >=1.27.1 lower
    bound came from a changelog and was not verified. Window widened 2026-10-16: azd to 1.36.0 (tag
    azure-dev-cli_1.36.0, acebba1, released 2026-10-14). The azd and extension changelogs and the schema and source
    diffs from the previously verified versions were read; none touches this rule's verified facts for the widened
    fields (see docs/tool-compatibility.md section 6).
evidence:
  description: >-
    Read-only ARM call, GET /subscriptions/{subscriptionId}/providers/{resourceProviderNamespace} api-version 2025-04-01
    (Providers_Get), or GET /subscriptions/{subscriptionId}/providers (Providers_List) once for all namespaces. The response
    field is Provider.registrationState (a string; the spec does not enumerate its values, the Learn article shows Registered
    and Registering). Required set: (a) namespaces of supporting providers that the template references without defining them (documented: resources defined in the template are registered automatically, supporting resources are not); the compiled resource list cannot supply this set, because an existing resource is compiled into an expression that the model does not expose, so (a) is empty in the implementation and its completeness is UNVERIFIED; (b) only when the project is network-secured (the project declares network injection
    for the agent subnet), the Foundry network-secured agent list from the Learn prerequisites: Microsoft.KeyVault, Microsoft.CognitiveServices,
    Microsoft.Storage, Microsoft.MachineLearningServices, Microsoft.Search, Microsoft.Network, Microsoft.App, Microsoft.ContainerService,
    and Microsoft.Bing only when the Bing grounding tool is configured. A finding is raised when a required namespace's registrationState is neither Registered nor Registering. A provider in the Registering state is not blocked by the catalogue guidance, but it is not proven registered either, so it is reported as uncertain, never as a pass. A required namespace that the response does not return is also uncertain. Namespaces defined in the template and unregistered are never a finding here (ARM registers them); whether the deployer may register them is reported by FND-DEP-003. Without a network-injected Foundry account the required set is empty and the rule reports nothing. Role family: Microsoft.Resources/subscriptions/providers/read is included
    in Reader (*/read). Reader suffices. Registering is a POST needing the /register/action permission (Contributor or Owner)
    and is never called by Foundry Doctor. The answer is definitive for Unregistered or NotRegistered and uncertain for Registering or a missing state.
  confidence: certain
recommendation: >-
  Register the missing providers once per subscription with a principal that has the <provider>/register/action permission
  (Contributor or Owner), and wait until the state is Registered, or at least Registering for the regions in use.
fix: |
  az provider register --namespace Microsoft.App
  az provider register --namespace Microsoft.ContainerService
  az provider show --namespace Microsoft.App --query registrationState
sources:
- url: >-
    https://github.com/Azure/azure-rest-api-specs/blob/main/specification/resources/resource-manager/Microsoft.Resources/resources/stable/2025-04-01/resources.json
  lastVerified: '2026-10-04'
  verifiedVia: >-
    https://github.com/Azure/azure-rest-api-specs/blob/main/specification/resources/resource-manager/Microsoft.Resources/resources/stable/2025-04-01/resources.json
  note: >-
    Providers_Get, Providers_List and Providers_Register paths; Provider.registrationState (string, read-only)
    and resourceTypes[].locations. Branch URL, not commit-pinned.
- url: https://learn.microsoft.com/azure/azure-resource-manager/management/resource-providers-and-types
  lastVerified: '2026-10-04'
  verifiedVia: >-
    https://github.com/MicrosoftDocs/azure-docs/blob/main/articles/azure-resource-manager/management/resource-providers-and-types.md
    (ms.date 02/27/2026)
  note: >-
    Template-defined providers are registered automatically; supporting-resource providers are registered
    manually; /register/action is in Contributor and Owner; do not block on the Registering state. Branch URL,
    not commit-pinned.
- url: https://learn.microsoft.com/azure/foundry/agents/how-to/virtual-networks
  lastVerified: '2026-10-04'
  verifiedVia: >-
    https://learn.microsoft.com/azure/foundry/agents/how-to/virtual-networks (included by
    agents/how-to/virtual-networks.md, ms.date 06/15/2026); source file MicrosoftDocs/azure-ai-docs:
    articles/foundry/agents/includes/how-to-virtual-networks-content.md; retrieved 2026-10-04
  note: >-
    Providers that must be registered for the network-secured agent setup, and the Microsoft.Bing addition. The error text
    for missing Microsoft.App and Microsoft.ContainerService registration is quoted in the troubleshooting section.
- url: https://learn.microsoft.com/azure/role-based-access-control/permissions/management-and-governance
  lastVerified: '2026-10-04'
  verifiedVia: >-
    https://raw.githubusercontent.com/MicrosoftDocs/azure-docs/main/articles/role-based-access-control/permissions/management-and-governance.md
  note: Microsoft.Resources/subscriptions/providers/read and Microsoft.Resources/providers/read action names.
overlap:
  decision: native
  provisional: true
  coverage: none
  rationale: >-
    No PSRule, Azure Policy, Bicep linter or Checkov rule checks subscription-level provider registration. The Foundry value
    is correlating the compiled template, the azure.yaml services and the network-secured agent prerequisites with the subscription
    state. azd's server-side preflight (provision.preflight, ValidatePreflight) may also surface this, but the azd design
    document read does not list what it checks.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/dep
testability: >-
  Offline with recorded provider list responses and a compiled-template fixture. The required-namespace derivation is pure
  and unit tested.
tests:
  positive:
  - network-secured-agent-microsoft-containerservice-missing
  negative:
  - all-required-providers-registered
  - provider-registering-state-not-a-finding
  - template-defined-provider-unregistered-not-reported-here
  - project-not-network-secured-microsoft-app-not-required
  uncertain:
  - provider-registering-state-not-proven-registered
  - required-provider-state-not-returned
  skipped:
  - no-azure-credential-available
  - bicep-cli-missing-cannot-derive-template-providers
notes: >-
  The registrationState value set is not enumerated in the spec; only Registered and Registering appear in the Learn article,
  so any other value is treated as "not usable" without naming it. Registration is per subscription and per region progress;
  this rule does not check regional registration progress. Version 2 (Phase 2 gate round 1): the supporting-provider positive case (a) has no test because part (a) is empty in the implementation; template-defined namespaces are no longer a finding, Registering is uncertain, and part (a) is empty in the implementation. The Microsoft.Bing namespace is not implemented because no Bing tool property path has a verified catalogue entry, so the Bing positive test is not exercised.

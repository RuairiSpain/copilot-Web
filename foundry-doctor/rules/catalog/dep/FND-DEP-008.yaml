id: FND-DEP-008
version: 4
group: DEP
title: What-if has no unexpected delete
description: >-
  An ARM what-if of the compiled deployment against the target scope must not predict a Delete of an existing resource that
  the change did not intend to remove. Whether a change recreates a resource is not exposed by the what-if result (the changeType
  enum has no Replace value), so it is not asserted. what-if is the only evidence source that sees live state; it is opt-in
  because it is a POST that needs the same permissions as the deployment (see notes on read-only).
status: verified
phases:
- '2'
inputs:
- bicep-arm
- azd-env
- control-plane
basis:
- operations
category: must-have
pillar: reliability
severity:
  dev: warning
  test: error
  prod: error
compatibility:
  azd: '>=1.34.2 <=1.36.0'
  extensions: {}
  apiVersions:
  - { plane: management, provider: Microsoft.Resources, resourceType: deployments, operation: whatIf, version: '2026-06-01' }
  preview: true
  notes: >-
    azd range: the minimum is the lowest requiredAzdVersion among the Foundry extensions read (agents beta.18,
    projects beta.13 need >=1.34.2); the maximum is azd 1.36.0 (tag azure-dev-cli_1.36.0, acebba1e388b489a91ab8e2487a676359ab516a1, released 2026-10-14; the first clone read at 1.36.0-beta.1 is earlier evidence). The earlier >=1.27.1 lower
    bound came from a changelog and was not verified. Window widened 2026-10-16: azd to 1.36.0 (tag
    azure-dev-cli_1.36.0, acebba1, released 2026-10-14). The azd and extension changelogs and the schema and source
    diffs from the previously verified versions were read; none touches this rule's verified facts for the widened
    fields (see docs/tool-compatibility.md section 6).
evidence:
  description: >-
    One long-running POST per deployment scope, api-version 2026-06-01 (the whatIf operation of the Microsoft.Resources
    deployments spec): resource group POST /subscriptions/{subscriptionId}/resourcegroups/{resourceGroupName}/providers/Microsoft.Resources/deployments/{deploymentName}/whatIf
    (Deployments_WhatIf), subscription scope POST /subscriptions/{subscriptionId}/providers/Microsoft.Resources/deployments/{deploymentName}/whatIf,
    plus management-group and tenant variants. Responses are 200 or 202 (asynchronous, poll the operation). The body is
    DeploymentWhatIf {location, properties} with properties.whatIfSettings.resultFormat (ResourceIdOnly or FullResourcePayloads). Foundry Doctor sends ResourceIdOnly (ADR-021): FullResourcePayloads would return before and after payloads of resources, which can contain secrets and content that the doctor must never emit or retain, and the rule needs only the resource id and change type. Learn states that ResourceIdOnly returns only the resource ids; a resource that exists is then reported with change type Deploy, so property-level Modify detail is not available (it was never asserted). The result is WhatIfOperationResult
    {status, properties.changes[], error}; each WhatIfChange has resourceId, resourceType, changeType, before, after, delta
    and unsupportedReason. changeType enum: Create, Delete, Ignore, Deploy, NoChange, Modify, Unsupported (there is no Replace
    value; see notes). Violations: (a) changeType Delete on any resource, which occurs for resources absent from the template
    only in complete deployment mode (azd deploys incrementally, so this fires rarely), when the change was not declared
    as intended (an explicit allow-list of resource ids or types in the project baseline); (b) changeType Modify is NOT
    a violation: an incremental redeploy of an existing account, project, search service or similar reports Modify for any
    property change, and what-if also reports Modify for read-only or no-effect properties. Modify on a stateful Foundry
    resource type (accounts, projects, search services, storage accounts, Cosmos DB accounts, key vaults, connections) is
    reported as an informational line only. A property delta that marks a change as recreate is not available from the spec
    and is therefore not asserted. Uncertain, never passed: changeType Ignore (expansion limits of 500 nested templates,
    800 resource groups or 5 minutes were reached, so the rest of the plan is unknown), changeType Unsupported, Deploy results,
    and any resource whose delta involves the reference function (what-if reports a change every time because it cannot
    resolve it). Role family: Microsoft.Resources/deployments/whatIf/action, documented to have the same permission requirements
    as the deployment (write access on the resources being deployed and Microsoft.Resources/deployments/*). Reader does
    NOT suffice. The answer is definitive for a returned Delete and uncertain for Ignore, Unsupported, Deploy and reference()
    deltas. Implementation (version 2): the deployment mode is Incremental (azd deploys incrementally), in which what-if essentially never reports Delete and cannot report a recreation caused by an immutable-property change, so a clean result is uncertain, never a pass, and the note says so. Deploy results are counted and noted, as are Ignore, Unsupported, potentialChanges and diagnostic codes. Any change type other than Ignore and NoChange whose resource id lies outside the target resource group and outside an approved scope (--approved-scope) is a finding, with one narrow exception (version 4, narrowed from version 3): in a subscription-scope template without --approved-scope, a Create of a subscription-level resource (a resource ID under the target subscription with no resourceGroups segment, for example a role assignment) or of a resource group itself is an uncertain note, not a finding, because the template is expected to create those. A Create, Modify or Deploy of a resource inside a different resource group is a finding unless that group is within --approved-scope. A Delete is a finding, and any change outside the target subscription is a finding. A subscription-scope what-if needs the what-if action at the subscription scope; without it the rule is skipped and names the capability. A Delete is a finding unless its id is on the allow-list of approved deletes. what-if is skipped, with a distinct reason, when it was not requested, when the capability is missing, for management-group and tenant scope, for an unknown scope, when the target group does not exist, and when a required template parameter has no non-secret value in the parameter file or a template default (what-if is then not run, because a guessed value would describe a different deployment). Object and array parameter values are unsupported and are treated the same way (what-if skipped, parameter named). Residual risk, product opinion: parameters are judged secret by name and type, so a secret held under an innocuous parameter name is sent to the ARM what-if endpoint over TLS (never logged).
  confidence: likely
recommendation: >-
  Review each predicted Delete. If it is intended, record it in the baseline with a reason and expiry; if not, switch the
  deployment to incremental mode, add the missing resource to the template, or remove the conflicting change. Re-run what-if
  after fixing.
fix: |
  # preview at resource group scope; nothing is deployed
  az deployment group what-if --resource-group <rg> --template-file main.bicep --parameters main.bicepparam

id: FND-IDN-002
version: 1
group: IDN
title: "Project identity has required data roles"
description: >-
  In the standard agent setup the Foundry project managed identity needs data-plane role
  assignments on the resources named in the account capability settings, otherwise running agents
  fail with 403. The documented set is: Search Index Data Contributor and Search Service Contributor
  on Azure AI Search; Storage Blob Data Contributor on the blob store container and Storage Blob
  Data Owner on the agent container, plus Storage Account Contributor at account level; Cosmos DB
  Operator at the Cosmos DB account and the Cosmos DB Built-in Data Contributor SQL role at the
  database level. Hosted agents add Foundry User on the account (created automatically when the
  project creator can assign it), a Container Registry Repository Reader or AcrPull assignment on the
  registry, and, for evaluations, Log Analytics Data Reader on the workspace. Phase 1 checks the
  role assignments declared in the template. Phase 2 reads the live assignments. The rule applies
  only to the stores and features the project actually uses.
status: verified
phases: ["1", "2"]
inputs: ["bicep-arm", "control-plane"]
basis: ["platform"]
category: must-have
pillar: security
severity:
  dev: error
  test: error
  prod: error
compatibility:
  azd: ""
  extensions: {}
  apiVersions:
    - "Microsoft.Authorization/roleAssignments 2022-04-01"
    - "Microsoft.DocumentDB/databaseAccounts/sqlRoleAssignments 2025-10-15"
    - "Microsoft.CognitiveServices/accounts 2026-07-15-preview"
  preview: true
  notes: "Not version dependent; reads compiled ARM JSON and ARM role assignments (azd 1.36.0-beta.1 clone checked) Microsoft.Authorization/roleAssignments 2022-04-01: roleDefinitionId, principalId, principalType, scope. Microsoft.DocumentDB/databaseAccounts/sqlRoleAssignments 2025-10-15: roleDefinitionId, scope, principalId. Microsoft.CognitiveServices/accounts 2026-07-15-preview: properties.capabilitySettings.documentStore, vectorStore, blobStore; CapabilitySettings definition read in cognitiveservices.json."
evidence:
  description: >-
    Resolve the project principal: identity.principalId of the project (system-assigned) or the principalId of each
    identity in identity.userAssignedIdentities. Resolve the stores from the account capability settings
    (documentStore, vectorStore, blobStore) or the project connections. For each store, require an assignment for that
    principal whose roleDefinitionId ends with the GUID of a documented role and whose scope is the store, its parent
    or the container named in the docs. Role GUIDs (Azure built-in roles reference, ms.date 07/01/2026): Search Index
    Data Contributor 8ebe5a00-799e-43f5-93ac-243d3dce84a7; Search Service Contributor
    7ca78c08-252a-4471-8644-bb5ff32d4ba0; Storage Blob Data Contributor ba92f5b4-2d11-453d-a403-e96b0029c9fe; Storage
    Blob Data Owner b7e6dc6d-f1e8-4753-8033-0f276bb0955b; Storage Account Contributor
    17d1049b-9a84-46fb-8f53-869881c3d3ab; Cosmos DB Operator 230815da-be43-4aae-9cb4-875f7bd000aa; Foundry User
    53ca6127-db72-4b80-b1b0-d745d6d5456d; Container Registry Repository Reader b93aa761-3e63-49ed-ac28-beffa264f7ac;
    AcrPull 7f951dda-4ed3-4680-a7ca-43fe172d538d; Log Analytics Data Reader 3b03c2da-16b3-4a49-8834-0f8130efdd3b. The
    Cosmos DB Built-in Data Contributor role is a Cosmos SQL role, so look for a
    Microsoft.DocumentDB/databaseAccounts/sqlRoleAssignments resource for the principal on the database, not an Azure
    RBAC assignment; match a roleDefinitionId that ends in /sqlRoleDefinitions/00000000-0000-0000-0000-000000000002
    (the id used by Microsoft's Foundry samples, see notes) and report that match with likely confidence. Fail when a
    required data role is missing for a store the project uses (Storage Account Contributor is reported as info only).
    Emit uncertain in Phase 1 when the scope depends on the project workspace ID (the container names contain it) or
    the principal is a module output that cannot be resolved; Phase 2 resolves them from live data. Do not fail on a
    role granted through a group when group membership cannot be read; report skipped with the missing permission.
  confidence: likely
recommendation: >-
  Assign the project managed identity the documented data roles on each store before agents run:
  Search Index Data Contributor and Search Service Contributor on Search, Storage Blob Data
  Contributor and Storage Blob Data Owner on the storage containers, Cosmos DB Operator on the
  account plus the Cosmos DB Built-in Data Contributor SQL role on the database. Assign them at the
  narrowest scope that works. These roles are separate from the roles the deploying identity needs.
fix: |
  resource searchIndexData 'Microsoft.Authorization/roleAssignments@2022-04-01' = {
    scope: search
    name: guid(search.id, project.id, '8ebe5a00-799e-43f5-93ac-243d3dce84a7')
    properties: {
      roleDefinitionId: subscriptionResourceId('Microsoft.Authorization/roleDefinitions', '8ebe5a00-799e-43f5-93ac-243d3dce84a7') // Search Index Data Contributor
      principalId: project.identity.principalId
      principalType: 'ServicePrincipal'
    }
  }

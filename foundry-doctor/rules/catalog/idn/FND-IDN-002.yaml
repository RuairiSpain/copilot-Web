overlap:
  decision: native
  coverage: none
  rationale: >-
    No PSRule rule, built-in policy, Checkov check or Bicep linter rule models the Foundry standard
    agent setup role matrix. Policies and PSRule test whether a resource has a managed identity or
    local auth is off, not whether a specific principal holds a specific role on a specific store.
    The value is the correlation of project identity, capability-settings stores and role
    assignments, before deployment. FND-RUN-001 covers effective access at runtime; this rule is the
    template and assignment-inventory view.
  psrule: []
  azurePolicy: []
  defender: []
  advisor: []
  bicepLinter: []
  checkov: []
implementation:
  owner: native
  package: internal/rules/idn
testability: >-
  Offline with compiled ARM fixtures (project, capability settings, role assignments, Cosmos SQL role
  assignments). Phase 2 uses recorded role-assignment list responses. The container-scope cases need a
  fixture with the workspace ID resolved.
tests:
  positive:
    - search-missing-service-contributor
    - blobstore-without-blob-data-owner-on-agent-container
    - cosmos-operator-without-sql-data-contributor
    - hosted-agent-acr-without-pull-role
  negative:
    - all-documented-roles-assigned
    - store-not-referenced-by-capability-settings
    - roles-granted-at-account-scope-containing-store
  skipped:
    - principal-is-module-output
    - group-membership-unreadable
    - live-role-assignments-not-readable
  uncertain:
    - container-scope-uses-workspace-id-expression
notes: >-
  Phase 1 fact check (2026-10-05): all Azure RBAC GUIDs in the evidence were re-matched to role names in the built-in
  roles reference (ms.date 09/10/2026). The Cosmos DB Built-in Data Contributor SQL role id
  00000000-0000-0000-0000-000000000002 is corroborated by Microsoft samples only (Cosmos DB RBAC article not
  readable); accept a sqlRoleDefinitions entry whose roleName is "Cosmos DB Built-in Data Contributor" as an
  equivalent match. The Foundry Agent Consumer GUID eed3b665-ab3a-47b6-8f48-c9382fb1dad6 is documented in the Foundry
  RBAC article, not in the built-in roles reference. Documentation inconsistency: the standard agent setup article
  names the containers workspaceId-azureml-blobstore and workspaceId-azureml-agent while the administrator guide names
  azureml-blobstore and agents-blobstore; the rule accepts a role at storage account scope for either until the
  container naming is confirmed. The same article lists Storage Account Contributor at account level for the
  system-assigned identity while the capability settings article lists only data roles; the rule reports a missing
  Storage Account Contributor as an info note, not a failure, until a reviewer confirms it is required. The capability
  settings property names were read in the 2026-07-15-preview spec (preview API; recheck before implementation).

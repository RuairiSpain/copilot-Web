overlap:
  decision: native
  provisional: true
  coverage: none
  rationale: >-
    No PSRule rule, built-in policy, Checkov check or Bicep linter rule found in the searched
    catalogues models the Foundry standard
    agent setup role matrix. Policies and PSRule test whether a resource has a managed identity or
    local auth is off, not whether a specific principal holds a specific role on a specific store.
    The value is the correlation of project identity, capability-settings stores and role
    assignments, before deployment. FND-RUN-001 covers effective access at runtime; this rule is the
    template and assignment-inventory view.
  research:
    psrule:
      state: unresearched
    azurePolicy:
      state: unresearched
    defender:
      state: unresearched
    advisor:
      state: unresearched
    bicepLinter:
      state: unresearched
    checkov:
      state: unresearched
implementation:
  owner: native
  package: internal/rules/idn
testability: >-
  Offline fixtures include principals, role assignments, role definitions, parent scopes, deny
  assignments, conditions, groups and Cosmos SQL assignments. Phase 2 uses recorded effective-access
  inventory. A template-only result is uncertain unless it proves the complete applicable set.
tests:
  positive:
  - search linked with no role assignment for it
  - search with Index Data Contributor only
  - storage linked without blob roles
  - cosmos linked without Cosmos DB Operator
  - role granted to another project does not count
  - role on a different store does not count
  - literal principal GUID cannot be a system-assigned identity
  negative:
  - system-assigned identity holds both search roles
  - user-assigned identity holds both search roles
  - storage roles present (account contributor missing is only a note)
  - roles at resource group scope cover the store
  - account-level connection applies to the project
  - store linked only to another project is not evaluated for this one
  - key vault linked has no verified role requirement
  - unlinked store is not applicable
  skipped:
  - no role assignment resource in the template
  - project without identity is left to FND-IDN-001
  - no Foundry project or account
  - store deployed under a condition
  - live-role-assignments-not-readable
  uncertain:
  - principalId is a parameter
  - role assigned on a container of the storage account
  - matching assignment is conditional
  - role definition is an unresolved variable
  - role scope is an expression that cannot be classified
  - cosmos operator present but SQL data role is unverified
  - connection target is a parameter so the store link is uncertain
  - project identity type is an expression
notes: >-
  Unverified: the Cosmos DB Built-in Data Contributor SQL role definition GUID (the Azure RBAC
  built-in roles reference does not list Cosmos data-plane roles and no local Cosmos doc was
  available); match it by resolving the sqlRoleDefinitions name, or add it once read from the Cosmos
  DB RBAC article. Therefore Cosmos effective access remains uncertain until the SQL role definition
  is resolved. Unverified: the Foundry Agent Consumer role GUID eed3b665-ab3a-47b6-8f48-c9382fb1dad6
  appears only in the Foundry RBAC article, not in the built-in roles reference. Documentation
  inconsistency: the standard agent setup article names the containers
  workspaceId-azureml-blobstore and workspaceId-azureml-agent while the administrator guide names
  azureml-blobstore and agents-blobstore; the rule accepts a role at storage account scope for either
  until the container naming is confirmed. The same article lists Storage Account Contributor at
  account level for the system-assigned identity while the capability settings article lists only
  data roles; the rule reports a missing Storage Account Contributor as an info note, not a failure,
  until a reviewer confirms it is required. The capability settings property names were read in the
  2026-07-15-preview spec (preview API; recheck before implementation). Defender and Advisor are
  unresearched for this rule; empty arrays do not mean searched-no-match. The native decision remains
  provisional until those catalogues are searched.
  Version 2 (2026-10-19): the static (compiled ARM) leg is implemented in internal/rules/idn/idn002.go and registered with the IDN
  rules; before this the check was not registered and reported not-implemented. The live leg (effective permissions, custom
  roles, deny assignments, group membership, SQL role definitions) stays with preflight and runtime. Unverified and therefore
  not checked statically: the Cosmos DB Built-in Data Contributor SQL role GUID, the Foundry Agent Consumer role, any Key
  Vault role for the project identity, and the hosted-agent roles. Equivalent custom roles and role supersets (for example
  Owner-type roles) are not recognised and a role other than the listed GUID is not accepted.